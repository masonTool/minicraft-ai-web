      .brewing-col { display: flex; flex-direction: column; align-items: flex-start; }
      /* 目标列自己留出底部空间给退还按钮；按钮绝对定位，不挤压进度/左侧 */
      .brewing-target-col {
        position: relative; align-items: center;
        padding-bottom: 24px;
      }
      /* 目标框（含"目标"标题）单独一层：藏它时不会把退还按钮一起藏掉 */
      .brewing-target-wrap { display: flex; flex-direction: column; align-items: center; }
      .brewing-target-col .furnace-return {
        position: absolute; top: auto; right: 0; bottom: 0;
      }
      .brewing-middle {
        display: flex; flex-direction: column; align-items: center;
        gap: 4px; width: 72px;
      }
      /* 与熔炉同一条蓝色箭头（基础规则见 `.furnace-cook`），只是宽度跟着这一列 */
      .brewing-middle .furnace-cook { width: 72px; }
      .brewing-fuel-text { font-size: 11px; color: #2b5a2b; white-space: nowrap; text-align: center; }
      .brewing-fuel-text.bad { color: #7a2020; }

      .inv-grid { display: grid; grid-template-columns: repeat(9, 42px); gap: 3px; justify-content: center; }
      /* 创造栏自己滚：翻页条因此始终留在视野里（宽屏上原来要滚到面板底部才能翻页） */
      .inv-grid.inv-creative {
        grid-template-columns: repeat(12, 34px); gap: 2px;
        max-height: 46vh; overflow-y: auto; padding-right: 2px;
      }

      /* ---------------- 创造物品栏：分类、搜索与分页 ---------------- */
      .inv-creative-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 4px 0 6px; }
      .inv-tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
      /* 分页条：PC 与手机共用；只有一页时整条隐藏（`hidden` 由界面加） */
      .inv-pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 2px; }
      /* ⚠️ 装备列是"左栏竖排"，不能再居中（居中会让它在自己那一列里左右飘） */
      .inv-chest { justify-content: center; }
      .inv-pager.hidden { display: none; }
      .inv-page-button {
        font: inherit; font-size: 13px; padding: 8px 14px; min-height: 40px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .inv-page-button:disabled { color: #7a7a7a; background: #9a9a9a; cursor: default; }
      .inv-page-button:not(:disabled):active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .inv-page-label { font-size: 12px; color: #3a3a3a; min-width: 108px; text-align: center; }
      .inv-tab {
        font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer;
        /* 图标 + 文字横排（批次 98）：图标是注册表里的真实物品，尺寸交给 `.inv-tab-icon` */
        display: inline-flex; align-items: center; gap: 4px;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .inv-tab-icon { width: 18px; height: 18px; image-rendering: pixelated; flex: 0 0 auto; }
      .inv-tab.active { background: #dcdec4; border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .inv-tab:active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .inv-search {
        flex: 1; min-width: 130px; font: inherit; font-size: 12px; padding: 3px 6px;
        background: #efefef; color: #222;
        border: 2px solid; border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
        outline: none;
      }
      .inv-count-label { color: #6a6a6a; font-size: 11px; }
      /* 创造销毁格（批次 139）已在批次 185 按用户要求删除：
         它占一整行，而且与"点界面外丢弃"重复。 */
      /* 空状态提示在网格里要跨满整行，否则会被 34px 的列宽挤成一列字 */
      .inv-empty { grid-column: 1 / -1; color: #5a5a5a; font-size: 12px; padding: 10px 2px; }
      .inv-slot {
        position: relative; width: 42px; height: 42px;
        display: grid; place-items: center;
        background: var(--slot-bg);
        border: 2px solid;
        border-color: var(--slot-edge-dark) var(--slot-edge-light) var(--slot-edge-light) var(--slot-edge-dark);
        border-radius: var(--slot-radius);
        transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      }
      /* 悬停亮一档、按下凹一点：此前槽位完全没有交互反馈（点了才知道点到了没）。
         ⚠️ 批次 209：`:hover` 只在**真鼠标**上生效。手机上点过之后 `:hover` 会一直黏在
         那一格上，把红底整个盖成灰白——用户说的"点一下红底变白底"就是这个，不是选中态。 */
      @media (hover: hover) and (pointer: fine) {
        .inv-slot:hover { background: var(--slot-bg-hover); }
      }
      .inv-slot:active { transform: scale(.96); }
      /* 红底格无论 hover/按下都保持红底（只做缩放反馈） */
      .inv-slot.locked:hover,
      .inv-slot.locked.pressing { background: #9b3b35; box-shadow: none; }
      /* 批次 159：选中 = **沉下去**（槽位本来就是"洞"，选中就是再按深一点：
         左上压一道内阴影 + 底色深一档）+ 一圈白框（手机上才看得清）。
         ⚠️ 必须压住 `:hover`：鼠标停在选中那一格上时，悬停那条会把深色顶掉。
         ⚠️ 空槽永远不会有这个类：`held` 只在真的拿着一叠东西时才存在。
         `.pressing` 是**按下那一刻**就给的同一副样子：触摸端一次轻点要到
         `pointerup` 才结算（要跟长按区分），等结算再变就是"点了要等一下才选中"。 */
      .inv-slot.pressing,
      .inv-slot.selected,
      .inv-slot.selected:hover {
        position: relative;
        z-index: 2;
        /* 底变白 + 加粗的深色框 = **相框**：
           格子本身的 2px 边框（`.inv-slot` 已经是 border-box）→ 再用 box-shadow
           往外叠"2px 白 + 2px 深色"，视觉边框一下变成 6px，中间那件东西像被装进相框。
           ⚠️ 用 box-shadow 而不是加 `border-width`：后者会改盒模型尺寸，
              格子会顶到隔壁（布局跟着动），而 box-shadow 不参与布局。 */
        background: var(--slot-bg-selected);
        border-color: #2b2b2b;
        box-shadow:
          0 0 0 2px #ffffff,
          0 0 0 4px #2b2b2b;
      }

      /* ---------------- 耐久条（批次 28） ----------------
         受损的工具/盔甲在格子底部显示一条 3px 的条，颜色随剩余耐久 绿→黄→红。
         快捷栏与背包共用同一套类名（都走 `ui/SlotVisuals.updateDurabilityBar`）。 */
      .dur-bar {
        position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px;
        background: rgba(0, 0, 0, .65); border-radius: 2px; overflow: hidden;
        pointer-events: none;
      }
      .dur-bar.hidden { display: none; }
      .dur-bar b {
        display: block; height: 100%; width: 100%;
        background: var(--dur-high);
        transition: width var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
      }
      .dur-bar.dur-mid b { background: var(--dur-mid); }
      .dur-bar.dur-low b { background: var(--dur-low); }

      /* ---------------- 点物品时的小说明（批次 159） ----------------
         手机上只有**长按 600ms** 才有提示框，轻点一下什么都没有——而轻点才是触摸端的
         主手势。这块小浮层就是补这条：点一下就把"是什么 + 一句说明"摆到快捷栏上方，
         几秒后自己消失。
         ⚠️ 位置由 `placePickToast()` 按快捷栏的位置算（JS 写 left/top），
            这里只负责"像一块小牌子"；`position: fixed` 所以不受面板网格影响。 */
      #inv-pick-toast {
        /* 批次 211：可点（点一下立刻收起）；隐藏时 display:none 不会拦手势 */
        position: fixed; left: 0; top: 0; z-index: 12; pointer-events: auto;
        transform: translateX(-50%);
        max-width: min(80vw, 320px);
        padding: 5px 9px;
        /* 与提示框同一套配色（近黑紫底 + 紫边 + 白字带阴影），免得又多一种观感 */
        background: #100010f2;
        border: 2px solid #2d0a63;
        border-radius: 0;
        color: #e6e6e6; font-size: 12px; line-height: 1.45;
        text-shadow: 1px 1px 0 #000;
        box-shadow: 0 0 0 2px var(--mc-outline);
        /* 批次 181：2 秒后淡出（原来只有淡入、到点直接消失） */
        transition: opacity .2s ease;
      }
      #inv-pick-toast.hidden { display: none; }
      #inv-pick-toast.leaving { opacity: 0; }

      /* ---------------- 游戏内一行提示（批次 181） ----------------
         视角/模式切换这类"一句话反馈"：快捷栏上方、2 秒后淡出。
         与 `#inv-pick-toast` 同一套配色与位置，但属于 HUD，不随背包显隐。 */
      #hud-toast {
        position: fixed;
        left: 50%;
        bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 9;
        /* 批次 211：点一下立刻收起 */
        pointer-events: auto;
        padding: 5px 10px;
        background: #100010f2;
        border: 2px solid #2d0a63;
        border-radius: 0;
        color: #e6e6e6;
        font-size: 12px;
        line-height: 1.45;
        white-space: nowrap;
        text-shadow: 1px 1px 0 #000;
        box-shadow: 0 0 0 2px var(--mc-outline);
        opacity: 0;
        transition: opacity .2s ease;
      }
      #hud-toast.visible { opacity: 1; }
      #hud-toast.hidden { display: none; }
      #inv-pick-toast .tooltip-title { font-size: 13px; font-weight: 700; }
      #inv-pick-toast .tooltip-desc { color: #d8d8d8; }
      /* 只淡入透明度：位置是 JS 给的，动几何会让人觉得"界面又在跳" */
      @keyframes pick-toast-in { from { opacity: 0; } to { opacity: 1; } }
      #inv-pick-toast:not(.hidden) { animation: pick-toast-in var(--dur-fast) ease-out; }

      /* ---------------- 稀有度配色 ----------------
         色值在 `:root` 里（与 `itemVisuals.ts` 的档位一一对应），这里只做映射。 */
      .rarity-common { color: var(--rarity-common); }
      .rarity-uncommon { color: var(--rarity-uncommon); }
      .rarity-rare { color: var(--rarity-rare); }
      .rarity-epic { color: var(--rarity-epic); }

      /* ---------------- 按钮统一 ----------------
         原来每个按钮各写一遍斜面与按下态，于是"有些按钮按下去有反馈、有些不"。
         这里收成一组：斜面 + 按下时斜面翻转并下移 1px（像真的按进去）。 */
      :is(.inv-page-button, .inv-tab, .inv-recipes-btn, .recipe-close, .enchant-option) {
        font: inherit; cursor: pointer; color: var(--btn-text);
        background: var(--btn-bg);
        border: 2px solid;
        border-color: var(--panel-edge-light) var(--panel-edge-dark) var(--panel-edge-dark) var(--panel-edge-light);
        border-radius: var(--btn-radius);
        transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      }
      :is(.inv-page-button, .inv-tab, .inv-recipes-btn, .recipe-close, .enchant-option):not(:disabled):active {
        background: var(--btn-bg-down);
        border-color: var(--panel-edge-dark) var(--panel-edge-light) var(--panel-edge-light) var(--panel-edge-dark);
        transform: translateY(1px);
      }
      :is(.inv-page-button, .inv-tab, .inv-recipes-btn, .recipe-close, .enchant-option):disabled {
        color: #7d7d7d; background: #9c9c9c; cursor: default;
      }
      /* 批次 162：背包面板里这几颗按钮是**浅底**（常态 #a8a8a8、选中 #dcdec4），
         而统一按钮那套给的 `--btn-text` 是浅色（#e0e0e0）——选中时底一变浅，
         字就彻底看不见了（用户："配方按钮的图标颜色应该是黑色"）。
         ⚠️ 必须写在这条统一规则**之后**：两边特异性相同，靠先后定胜负。 */
      .inv-recipes-btn,
      .inv-page-button,
      .inv-tab,
      .inv-pocket-recipe-tab,
      .recipe-close {
        color: #2b2b2b;
      }
      .inv-grid.inv-creative .inv-slot { width: 34px; height: 34px; }
      .inv-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
      .inv-grid.inv-creative .inv-slot canvas { width: 28px; height: 28px; }
      .inv-count {
        position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }

      /* ---------------- 长按选数量的指示条（批次 137） ----------------
         基岩版触摸操作：长按一格出现一条指示条，**绿色部分 = 选中数量 / 这一格总数**，
         左右划改数量。这两条（条的占比、数字）都是"界面侧"的反馈，
         规则本身在 `core/container/TouchSplit.ts` 里。 */
      .inv-split-bar {
        position: absolute; left: 2px; right: 2px; bottom: 1px; height: 5px;
        background: rgba(0, 0, 0, .7);
        pointer-events: none;
      }
      .inv-split-bar.hidden { display: none; }
      .inv-split-bar b {
        display: block; height: 100%; width: 50%;
        background: var(--dur-high);
      }
      .inv-split-count {
        position: absolute; top: 0; left: 1px; padding: 0 3px;
        font-size: 11px; line-height: 13px; color: #fff;
        background: rgba(0, 0, 0, .6);
        pointer-events: none;
      }
      .inv-split-count.hidden { display: none; }
      /* 正在选数量的那一格描一圈亮边：手指常常盖住了格子本身，
         没有这一圈就分不清"是我在选"还是"它自己亮了一下" */
      .inv-slot.splitting { outline: 2px solid #ffef9e; outline-offset: -1px; }

      #inv-held {
        position: fixed; z-index: 11; pointer-events: none;
        transform: translate(-50%, -50%); display: none;
      }
      #inv-held.on { display: block; }
      #inv-held canvas { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
      #inv-held span {
        position: absolute; right: -2px; bottom: -2px; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }

      /* ---------------- 禁掉 HTML 自带的长按效果（批次 159） ----------------
         长按在游戏里**是我们的手势**（取一半 / 看详情 / 选数量），
         但手机上长按一个 `<canvas>` 会弹"保存图片 / 下载图片"，
         长按文字会选中并弹选择菜单——那一套必须关掉。
         ⚠️ 只关游戏这一侧：聊天框、搜索框、告示牌里的输入框要能正常选中/粘贴
            （见下面 `#chat input` 那条例外）。 */
      canvas,
      img {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      body,
      #app, #hud, #touch-ui, #inventory-screen, #recipe-book, #advancements,
      #settings-screen, #world-screen, #chat, #sign-editor, #item-tooltip, #inv-pick-toast {
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* 输入框例外：不给它"不能选"这条，否则手机上没法长按粘贴 */
      input, textarea {
        -webkit-touch-callout: default;
        -webkit-user-select: text;
        user-select: text;
      }

      /* ---------------- 触摸操作层（手机 / 平板）----------------
         放在 #hud 里面，但 #hud 是 pointer-events: none，
         所以这里只给真正要接收手势的元素打开 pointer-events。 */
      #touch-ui {
        position: fixed; inset: 0; pointer-events: none;
        /* 刘海屏/圆角屏：把 UI 收进安全区 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #touch-ui.hidden { display: none; }
      /* ================================================================
         界面打开时"收起"操作层（批次 231）——**不拆这一层**。
         ================================================================
         以前是给 `#touch-ui` 加 `.hidden`（display:none），关面板时再变回来。
         真机表现：从暂停页回来后的**第一次滑动**转不动，导出的日志里
         `look.down` 的 clientX/Y 全是 0。原因不在 JS，而在"同一帧把一层拆掉、
         又把另一层建回来"——浏览器要重算触摸坐标映射，第一下正好落在重算之前。
         （背包一直没事，因为它是"滑出动画结束才 hidden"，摘面板要 250~400ms。）

         现在只收**看得见的那层壳**：摇杆 / 按钮 / 顶部暂停条 / 提示改
         `visibility: hidden`（保留布局，不重排、也不拆层）；视角面本身留着，
         但 `pointer-events: none`，免得面板外的点击漏到游戏里。
         转视角另有 `TouchControls#setEnabled(!uiOpen)` 挡着，双保险。 */
      #touch-ui.ui-off > :is(#touch-ring, #touch-stick, #touch-buttons, #touch-pause, #touch-hint) {
        visibility: hidden;
      }
      #touch-ui.ui-off #touch-look { pointer-events: none; }

      /* 视角面铺满全屏：承接拖动转视角，以及轻点/长按 */
      #touch-look {
        position: absolute; inset: 0;
        pointer-events: auto; touch-action: none;
      }

      /* ---------------- 手指落点白圈 ----------------
         触摸端"点哪打哪"的视觉锚点：按下即出现在手指下，拖动时跟手。
         尺寸跟着 `--touch-scale`（与摇杆/按钮同一个设置项），位置用 JS 的
         `transform` 写，**不能**用 `left/top`——每帧改 left/top 会触发布局。
         `position: fixed` 是必须的：#touch-ui 有安全区 padding，absolute 会整体偏移。
         ⚠️ 尺寸沿革：46 →(×3) 138 →(×2/3) **92**（批次 241，用户："把手指触摸的改成当前的 2/3"）。
            居中用的负 margin 始终取直径的一半（现在是 46）。 */
      #touch-ring {
        position: fixed; left: 0; top: 0;
        width: calc(92px * var(--touch-scale, 1));
        height: calc(92px * var(--touch-scale, 1));
        margin-left: calc(-46px * var(--touch-scale, 1));
        margin-top: calc(-46px * var(--touch-scale, 1));
        border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, .95);
        /* 外圈再压一道暗边（批次 530）：纯白场景里只靠白圈会和背景融在一起 */
        box-shadow:
          0 0 0 2px rgba(0, 0, 0, .55),
          0 0 10px rgba(0, 0, 0, .45),
          inset 0 0 10px rgba(255, 255, 255, .22);
        pointer-events: none;
        opacity: 0;
        transition: opacity .10s linear;
        will-change: transform, opacity;
      }
      #touch-ring.visible { opacity: 1; }

      /* 触摸端左右两组控件的共用锚点（批次 535）：
         - `--touch-side-inset` 同时给摇杆左沿与按钮簇右沿，保证左右对称；
         - `--touch-stick-bottom` / `--touch-buttons-bottom` 让两者**圆心同高**
           （摇杆 132 / 跳跃 76，所以按钮簇的 bottom 比摇杆高 28）；
         - 跳跃键固定在这个 76px 的容器里，起飞时升降键用绝对定位挂到上下，
           不会把跳跃键挤走。 */
      #touch-ui {
        --touch-side-inset: 40px;
        --touch-stick-size: calc(132px * var(--touch-scale, 1));
        --touch-jump-size: calc(76px * var(--touch-scale, 1));
        /* 批次 536（用户）：摇杆与跳跃键的**圆心**到各自屏幕边缘的距离必须一致。
           两者的直径不同，所以按钮簇的右边距要在摇杆左边距上补上半径差。 */
        --touch-buttons-inset: calc(
          var(--touch-side-inset) + (var(--touch-stick-size) - var(--touch-jump-size)) / 2
        );
        --touch-stick-bottom: calc(96px + env(safe-area-inset-bottom, 0px));
        --touch-buttons-bottom: calc(124px + env(safe-area-inset-bottom, 0px));
        --touch-cluster-gap: calc(10px * var(--touch-scale, 1));
      }
      #touch-stick {
        position: absolute;
        left: var(--touch-side-inset);
        bottom: var(--touch-stick-bottom);
        /* 尺寸乘 `--touch-scale`（批次 97）：设置里的"触摸按钮大小"直接改这个变量，
           摇杆与按钮一起缩放（分别调会更乱：两者的比例本来就是配好的） */
        width: var(--touch-stick-size);
        height: var(--touch-stick-size);
        border-radius: 50%;
        /* 批次 530：深色玻璃底 + 浅色描边 + 外圈暗边。
           纯白（雪地/云层/亮天空）上靠暗底与外圈分开，深色洞穴里靠浅描边分开。 */
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 62%),
          rgba(12, 16, 20, .52);
        border: 2px solid rgba(255, 255, 255, .62);
        box-shadow:
          0 2px 8px rgba(0, 0, 0, .40),
          0 0 0 1px rgba(0, 0, 0, .50),
          inset 0 0 20px rgba(0, 0, 0, .38);
        pointer-events: auto; touch-action: none;
        display: grid; place-items: center;
        transition: background .15s, border-color .15s, box-shadow .15s;
      }
      #touch-stick.active {
        background:
          radial-gradient(circle at 50% 42%, rgba(255, 255, 255, .14), rgba(255, 255, 255, 0) 62%),
          rgba(18, 24, 30, .68);
        border-color: rgba(255, 255, 255, .85);
        box-shadow:
          0 2px 10px rgba(0, 0, 0, .48),
          0 0 0 1px rgba(0, 0, 0, .55),
          inset 0 0 22px rgba(0, 0, 0, .42);
      }
      /* 左手模式（批次 271）：摇杆与操作键整体镜像。死区跟着 `getBoundingClientRect`
         走，所以这里只换边、不写死任何坐标 */
      #touch-ui.left-handed #touch-stick { left: auto; right: var(--touch-side-inset); }
      #touch-ui.left-handed #touch-buttons { right: auto; left: var(--touch-buttons-inset); }
      #touch-stick .knob {
        width: calc(56px * var(--touch-scale, 1));
        height: calc(56px * var(--touch-scale, 1));
        border-radius: 50%;
        /* 摇杆芯：浅灰实体 + 深色描边。原来半透明白在雪地上等于没有 */
        background: linear-gradient(180deg, #f7f9fb, #c7ccd2);
        border: 2px solid rgba(0, 0, 0, .55);
        box-shadow:
          0 2px 5px rgba(0, 0, 0, .50),
          inset 0 1px 0 #ffffff,
          inset 0 -2px 0 rgba(0, 0, 0, .20);
        will-change: transform;
      }

      /* 右下那一簇（批次 144，对齐基岩手机 / Education）：
         **生存只有一颗跳跃**；创造双击起飞后，上下再出现上升 / 下降。
         竖排：上 → 跳 → 下。背包与聊天在快捷栏两侧（见 `.touch-side-btn`）。 */
      #touch-buttons {
        position: absolute;
        right: var(--touch-buttons-inset);
        bottom: var(--touch-buttons-bottom);
        width: var(--touch-jump-size);
        height: var(--touch-jump-size);
        pointer-events: none;
      }
      #touch-buttons .fly-only.hidden { display: none; }
      /* 跳跃键固定占满容器；升降键绝对定位到它的上/下，显隐都不影响跳跃键位置 */
      .touch-button.jump { position: absolute; inset: 0; }
      .touch-button.fly-up,
      .touch-button.fly-down {
        position: absolute; left: 50%;
        transform: translateX(-50%);
      }
      .touch-button.fly-up { bottom: calc(100% + var(--touch-cluster-gap)); }
      .touch-button.fly-down { top: calc(100% + var(--touch-cluster-gap)); }
      .touch-button {
        width: calc(62px * var(--touch-scale, 1));
        height: calc(62px * var(--touch-scale, 1));
        border-radius: 50%; padding: 0;
        display: grid; place-items: center;
        font: inherit; font-size: 17px; color: #f5f7fa;
        /* 批次 530：深色玻璃 + 浅描边 + 外圈暗边。
           纯白场景里深底负责"看得见"，深色场景里浅描边负责"看得见"。
           顶部再叠一点高光，按钮不至于像一块死黑色块。 */
        background:
          radial-gradient(circle at 50% 28%, rgba(255, 255, 255, .22), rgba(255, 255, 255, 0) 62%),
          linear-gradient(180deg, rgba(44, 52, 60, .82), rgba(12, 16, 20, .82));
        border: 2px solid rgba(255, 255, 255, .72);
        box-shadow:
          0 2px 6px rgba(0, 0, 0, .50),
          0 0 0 1px rgba(0, 0, 0, .55),
          inset 0 1px 0 rgba(255, 255, 255, .25),
          inset 0 -2px 0 rgba(0, 0, 0, .35);
        text-shadow: 0 1px 2px rgba(0, 0, 0, .90), 0 0 4px rgba(0, 0, 0, .50);
        pointer-events: auto; touch-action: none;
        user-select: none; -webkit-user-select: none;
        transition: background .15s, border-color .15s, box-shadow .15s, transform .08s;
      }
      /* 图标是内联 SVG：跟着按钮缩放，颜色用 currentColor 与按钮文字同色 */
      .touch-button svg {
        width: 58%; height: 58%; display: block; fill: currentColor;
        filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .85));
      }
      .touch-button:active { transform: scale(.94); }
      .touch-button.jump {
        width: var(--touch-jump-size);
        height: var(--touch-jump-size);
        font-size: 19px;
        /* 跳跃是主操作：绿色玻璃，与升降/暂停区分开 */
        background:
          radial-gradient(circle at 50% 28%, rgba(255, 255, 255, .24), rgba(255, 255, 255, 0) 62%),
          linear-gradient(180deg, rgba(62, 104, 56, .88), rgba(18, 40, 16, .88));
        border-color: rgba(198, 240, 185, .80);
      }
      .touch-button.jump svg { width: 52%; height: 52%; }
      .touch-button.on {
        background:
          radial-gradient(circle at 50% 28%, rgba(255, 255, 255, .26), rgba(255, 255, 255, 0) 62%),
          linear-gradient(180deg, rgba(86, 158, 66, .92), rgba(30, 74, 22, .92));
        border-color: rgba(205, 250, 185, .95);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, .55),
          0 0 10px rgba(120, 220, 110, .45),
          inset 0 1px 0 rgba(255, 255, 255, .30);
      }

      /* 飞行时上升/下降是独立两颗键（不再用伪元素画在跳跃/潜行上） */
      .touch-button { position: relative; }
      .touch-button.fly-up::after,
      .touch-button.fly-down::after {
        position: absolute; left: 50%; transform: translateX(-50%);
        font-size: 11px; line-height: 1; color: rgba(255, 255, 255, .92);
        text-shadow: 0 0 3px rgba(0, 0, 0, .8); pointer-events: none;
      }
      .touch-button.fly-up::after { content: '▲'; top: 4px; }
      .touch-button.fly-down::after { content: '▼'; bottom: 3px; }
      /* 双击摇杆潜行时的提示（批次 275）：一圈更亮的绿边 + 摇杆芯变绿，
         再在正上方挂一枚"潜行"小牌——拇指压着摇杆时，只有上方的小牌看得见 */
      #touch-stick.sneaking {
        border-color: rgba(190, 255, 190, .95);
        background:
          radial-gradient(circle at 50% 42%, rgba(190, 255, 190, .18), rgba(190, 255, 190, 0) 62%),
          rgba(30, 66, 28, .62);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, .55),
          0 0 0 4px rgba(140, 220, 140, .70),
          inset 0 0 16px rgba(140, 220, 140, .35);
      }
      #touch-stick.sneaking .knob {
        background: linear-gradient(180deg, #e2ffdc, #9fe094);
        border-color: rgba(26, 64, 20, .85);
      }
      #touch-stick .sneak-badge {
        position: absolute; left: 50%; top: -22px; transform: translateX(-50%);
        padding: 2px 8px; border-radius: 9px;
        background: rgba(52, 132, 64, .9); color: #eaffea;
        font-size: 11px; white-space: nowrap;
        text-shadow: 0 1px 0 rgba(0, 0, 0, .55);
        box-shadow: 0 1px 4px rgba(0, 0, 0, .3);
        opacity: 0; transition: opacity .15s; pointer-events: none;
      }
      #touch-stick.sneaking .sneak-badge { opacity: 1; }

      /* 动态摇杆（批次 96）：平时隐形待命，按下才出现在手指下面。
         ⚠️ 只改透明度、不改 display：`beginDynamicStick` 要靠 getBoundingClientRect
         拿到半径与中心（display: none 下这个矩形全是 0，摇杆会"按下去就死"）。 */
      #touch-stick.dynamic { opacity: 0; }
      #touch-stick.dynamic.active { opacity: 1; }
      /* 动态摇杆 + 潜行（批次 275）：平时整层 opacity:0 会把"潜行"小牌一起藏掉。
         这里把整层放出来，但**底座与摇杆芯单独隐去**，只留小牌——不按也能看见潜行状态 */
      #touch-stick.dynamic.sneaking { opacity: 1; }
      #touch-stick.dynamic.sneaking:not(.active) {
        background: transparent; border-color: transparent; box-shadow: none;
      }
      #touch-stick.dynamic.sneaking:not(.active) .knob { opacity: 0; }

      #touch-hint {
        position: absolute; left: 50%; bottom: 214px; transform: translateX(-50%);
        padding: 7px 14px; border-radius: 16px;
        background: rgba(0, 0, 0, .5); color: #fff; font-size: 12px;
        white-space: nowrap; transition: opacity .6s;
      }
      #touch-hint.fade { opacity: 0; }

      /* ---------------- 顶部暂停键（批次 104） ----------------
         基岩版手机在屏幕**上方正中**放一颗暂停键，点开就是暂停/设置菜单。
         本项目此前没有这一颗：PC 靠 Esc，而手机既没有 Esc、操作层里也没入口——
         手机上打不开设置（音量/视距/灵敏度都改不了），想换世界只能退出页面。
         ⚠️ 尺寸同样乘 `--touch-scale`（与右下那一簇共用"触摸按钮大小"这个设置项）。 */
      #touch-pause {
        position: absolute; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        display: flex; align-items: center; gap: 8px;
        pointer-events: none;
      }
      /* 批次 528（用户）：顶部三键缩到原来的 **1/2**（44px → 22px），
         顺序 = 聊天 / 暂停 / 视角（左侧聊天、中间暂停、右侧望远镜）。
         视觉只有 22px，手指按不准，所以用伪元素把**热区**外扩 3px（28px）；
         gap 取 8px，三颗的热区不互相压住（否则中间那颗会被左右抢走）。 */
      #touch-pause .touch-button {
        position: relative;
        width: calc(22px * var(--touch-scale, 1));
        height: calc(22px * var(--touch-scale, 1));
        border-radius: 0;
        pointer-events: auto;
        /* 背景/描边沿用 `.touch-button` 的深色玻璃；这里只改尺寸与形状 */
      }
      #touch-pause .touch-button::before {
        content: ''; position: absolute; inset: -3px;
      }

      /* ---------------- 快捷栏两侧的背包 / 聊天（批次 107） ----------------
         基岩版手机把"背包"放在**快捷栏右边**、"聊天"放在左边，而不是混进右手
         那一簇操作键里。这里挂进 `#hotbar` 内部并用绝对定位：
         ① 快捷栏自己就是定位父元素，"贴着它两端"不用算任何像素；
         ② 它们**不参与那一行 9 个格子的宽度计算**（竖屏手机上 9 × 44px ≈ 408px
            已经把 430px 的屏宽占满，再往行里塞按钮必然溢出）。
         默认摆在快捷栏**两端上方**；屏幕够宽时按基岩版摆到左右两侧。 */
      #hotbar .touch-side-btn {
        position: absolute; bottom: calc(100% + 4px);
        width: calc(44px * var(--touch-scale, 1));
        height: calc(44px * var(--touch-scale, 1));
        /* 背景/描边沿用 `.touch-button` 的深色玻璃 */
      }
      /* 界面打开时一起收起（批次 231）：`visibility` 不改布局，
         不要写成 `display:none`——那会让整条快捷栏重排一次 */
      #hotbar .touch-side-btn.ui-off { visibility: hidden; }
      /* 批次 181：聊天已搬到顶部，快捷栏右侧只留背包 */
      #touch-hotbar-inventory { right: 0; }
      @media (min-width: 760px) {
        #hotbar .touch-side-btn { bottom: 0; }
        #touch-hotbar-inventory { right: auto; left: calc(100% + 8px); }
      }

      /* 顶部那一行现在被暂停键占着：血条与调试信息往下让一格，免得叠在一起 */
      body.touch-mode #boss-bar { top: calc(64px + env(safe-area-inset-top, 0px)); }
      /* 调试信息在手机上收窄（它是开发用的面板，不该挤到屏幕中间的暂停键） */
      body.touch-mode #debug { max-width: 34vw; }

      /* 手机端不显示快捷栏上的 1~9 序号：那是"按键盘数字键切槽"的提示，
         手机上没有这些键，留着只是噪音（基岩版手机也不显示）。 */
      body.touch-mode #hotbar .slot .index { display: none; }

      /* 面板里那几个"小字按钮"在手机上要放大到能点得到（44px 是平台下限）：
         背包标题栏的"配方书/成就"原来只有 12px 字 + 3px 内边距，手机上很难点 */
      body.touch-mode .inv-recipes-btn { min-height: 44px; padding: 8px 14px; font-size: 14px; }
      /* 携带版页签是方形图标，不要再用「文字底栏」那套 min-height/padding 撑破 */
      body.touch-mode .inv-pocket-tab {
        width: 40px; height: 40px; min-height: 40px; min-width: 40px; padding: 0;
      }
      body.touch-mode .inv-pocket-recipe-tab { width: 36px; height: 36px; min-height: 36px; }
      body.touch-mode .recipe-close,
      body.touch-mode .inv-close,
      body.touch-mode .adv-close { min-width: 48px; min-height: 44px; font-size: 17px; padding: 8px 12px; }
      /* 配方书的方块按钮（页签 / 筛选，批次 135）：手机上热区放到 40px——
         页签是"翻配方"的主入口，32px 的方块手指点不准 */
      body.touch-mode .recipe-tab,
      body.touch-mode .recipe-filter { width: 40px; height: 40px; min-height: 40px; }
      body.touch-mode .recipe-tab-icon,
      body.touch-mode .recipe-filter-icon { width: 22px; height: 22px; }
      body.touch-mode .recipe-tab-icon svg { width: 20px; height: 20px; }
      /* 配方格子同 SLOT_TOUCH：手机上 34px 太小，抬到 40px（8 列 × 40 ≈ 340px，
         横屏手机放得下）。只改那个变量，列宽跟着一起变（改 `.recipe-cell` 的宽高
         会让格子比列还宽，互相压住）。 */
      body.touch-mode .recipe-grid { --recipe-cell: 40px; }

      /* ---------------- 手机面板收进视口（背包曾用 fit-content + 92vh，内容一高就要
         整层外滚，竖屏/矮横屏都难受）。与设置/配方书共用 --panel-w/--panel-h，
         溢出只在面板**内部**滚。 */
      body.touch-mode .inv-panel {
        width: min(96vw, var(--panel-w));
        max-width: min(96vw, var(--panel-w));
        height: min(86dvh, var(--panel-h));
        max-height: min(86dvh, var(--panel-h));
        min-width: 0;
        overflow: hidden; /* 外框不滚；内容在 .inv-body 里滚 */
        box-sizing: border-box;
      }
      /* 携带版背包按槽位内容定尺寸；通用设置面板的 760×620 固定框不能套在这里。 */
      body.touch-mode .inv-panel.pocket-ui:not(.creative-ui) {
        width: var(--inv-pocket-w);
        max-width: var(--inv-pocket-w);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
      }
      body.touch-mode .inv-panel.creative-ui.pocket-ui {
        width: var(--inv-pocket-w);
        max-width: var(--inv-pocket-w);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
      }
      body.touch-mode .inv-panel:not(.pocket-ui) {
        overflow-x: hidden;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-y;
      }
      body.touch-mode #inventory-screen,
      body.touch-mode #recipe-book,
      body.touch-mode #advancements {
        overflow: hidden;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        box-sizing: border-box;
      }
      /* 说明文字在矮屏上占一整行还不参与操作——竖屏可留，横屏矮屏直接藏 */
      body.touch-mode .inv-header-hint { font-size: 11px; line-height: 1.35; max-width: 100%; }
      body.touch-mode .inv-panel.creative-ui .inv-creative {
        max-height: min(40vh, 300px);
      }
      /* 携带版创造网格高度由 .pocket-ui 规则管，别被触摸矮屏上限压成一行 */
      body.touch-mode .inv-panel.creative-ui.pocket-ui .inv-creative {
        min-height: min(38vh, 200px);
        max-height: min(42vh, 220px);
      }
      body.touch-mode .inv-creative-section {
        min-height: 0;
      }
      @media (orientation: landscape) and (max-height: 500px) {
        /* 横屏携带版底部快捷栏占 76px：面板顶对齐后，318px 高的固定窗刚好停在
           快捷栏上沿；继续垂直居中会让快捷栏压住个人仓库最后一行。 */
        body.touch-mode #inventory-screen .inv-shell {
          align-self: start;
        }
        body.touch-mode .inv-header-hint,
        body.touch-mode .recipe-hint { display: none; }
        body.touch-mode .inv-panel.creative-ui:not(.pocket-ui) .inv-creative {
          max-height: min(26vh, 140px);
        }
        body.touch-mode .inv-panel.creative-ui.pocket-ui .inv-creative {
          min-height: min(34vh, 160px);
          max-height: min(38vh, 180px);
        }
        body.touch-mode .inv-panel { padding: 8px 10px; }
        body.touch-mode .recipe-panel { padding: 8px 10px; }
      }

      /* 主菜单（世界列表 / 新建世界）同理：这几个按钮原是按鼠标尺寸做的（高约 30px），
         手机上点"进入/删除"经常点到隔壁。手机上统一抬到 44px。 */
      body.touch-mode .world-card-actions button,
      body.touch-mode .world-mini,
      body.touch-mode .world-secondary { min-height: 44px; padding: 8px 14px; }
      body.touch-mode .world-primary { min-height: 52px; }
      body.touch-mode .world-input { padding: 10px 10px; font-size: 14px; }
      /* 批次 528（用户）：返回键保持紧凑，不再是一条 44px 高的整行 */
      body.touch-mode .world-back { min-height: 34px; padding: 4px 10px; }
      /* 二级页面的"‹ 返回"固定在左上、标题跟着它，拇指区一眼就能找到出口 */
      body.touch-mode .world-nav { margin-bottom: 8px; }

      /* ---------------- 小屏适配 ----------------
         目标：竖屏/横屏手机都能操作，且界面不溢出、热区够大。 */
      @media (max-width: 900px), (max-height: 560px) {
        #debug { font-size: 10px; line-height: 1.45; padding: 4px 6px; max-width: 46vw; }
        /* 槽位从 36 提到 44（批次 95）：触摸端要"点得准"，44px 是平台最小手势尺寸，
           而 36px 的格子在实际操作里经常点到隔壁。9 × 44 + 间隙 ≈ 410px，430px 宽的
           竖屏手机放得下。批次 222 起尺寸统一走 `#hud` 上的变量（血条要跟着对齐） */
        #hud { --hotbar-slot: 44px; --hotbar-gap: 1px; --hotbar-pad: 2px; }
        #hotbar { bottom: 12px; }
        #hotbar .slot canvas { width: 36px; height: 36px; }
        #hotbar .slot .index { font-size: 9px; }
        #hotbar .slot .count { font-size: 11px; }
        /* 小屏：快捷栏更低，经验条与状态 HUD 跟着一起上移 */
        #xp-bar { bottom: 58px; width: 156px; }
        #xp-level { font-size: 11px; }
        #vitals { bottom: 74px; }
        .vital-row svg.vital-icon { width: 14px; height: 14px; }

        /* 背包/容器面板在小屏上几乎全屏，并把槽位放大到好点按的尺寸 */
        .inv-panel {
          max-width: 96vw; max-height: 92vh; padding: 10px;
          border-width: 2px;
        }
        /* 成就面板同理（批次 87）：手机上几乎全屏，行高留够点按尺寸 */
        .adv-panel { max-width: 96vw; max-height: 92vh; padding: 10px; border-width: 2px; }
        .adv-row { min-height: 48px; }
        #adv-toasts { max-width: 88vw; }
        /* 容器界面（箱子/熔炉/漏斗）在手机上：**正方形格 + 封顶 44px**。
           原来只写了 `width:auto; aspect-ratio:1`，但 `.inv-slot` 的 `height:42px`
           还在，于是格子被拉成 69×42 的横条（用户："箱子格子非常高非常长"）。
           `minmax(0, 44px)` 再配合 `justify-content:center`（基础规则已有），
           宽屏上也不会摊成一整排大格子。 */
        .inv-grid { grid-template-columns: repeat(9, minmax(0, 44px)); gap: 2px; }
        .inv-grid .inv-slot { width: auto; height: auto; aspect-ratio: 1; }
        /* 装备仍是"竖排一列"（窄屏下占满这一列宽） */
        .inv-grid.inv-armor { grid-template-columns: minmax(0, 1fr); }
        /* 漏斗：窄屏也保持一排 5 格（继承上面那条 9 列规则会把它拉成两行） */
        .inv-grid.inv-hopper { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        /* 投掷器/发射器：窄屏保持 3 列（否则会被上面那条 9 列规则拉成一行） */
        .inv-grid.inv-nine { grid-template-columns: repeat(3, 46px); justify-content: start; }
        .inv-grid.inv-creative { grid-template-columns: repeat(8, minmax(0, 1fr)); }
        .inv-grid.inv-creative .inv-slot { width: auto; }
        .inv-craft-grid.size-2 { grid-template-columns: repeat(2, 42px); width: max-content; }
        .inv-craft-grid.size-3 { grid-template-columns: repeat(3, 38px); width: max-content; }
        .inv-craft .inv-slot { width: 42px; }
        /* 面板内允许纵向拖动滚动，其余手势交给操作层 */
        .inv-panel { touch-action: pan-y; }
        .inv-slot { -webkit-tap-highlight-color: transparent; }

        /* 分类标签：10 个换行会占掉三行屏幕，窄屏改成**单行横向滚动** */
        .inv-tabs {
          /* ⚠️ 横向滚动时必须靠左：`justify-content: center` 会让溢出的内容
             两边同时被裁掉，左侧那几个分类**永远滚不到**（实测就是"全部/建筑"消失） */
          justify-content: flex-start;
          flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          max-width: 100%; padding-bottom: 2px;
        }
        .inv-tab {
          /* 窄屏只按图标算宽度（批次 98）：五个基岩版顶层分类无需占用长文字宽度。
             文字仍然留在 DOM 里（读屏与搜索能读到），只是不显示 */
          font-size: 13px; padding: 7px 10px; min-height: 38px;
          white-space: nowrap; flex: 0 0 auto;
        }
        .inv-tab-label { display: none; }
        /* 物品网格自己滚：翻页条因此始终留在视野里（不用滚到底才能翻页） */
        .inv-grid.inv-creative { max-height: 46vh; overflow-y: auto; }
        /* 翻页键要够大：手机上 44px 是可用下限 */
        .inv-page-button { min-height: 44px; padding: 10px 16px; font-size: 14px; }
        .inv-page-label { font-size: 12px; min-width: 96px; }
        .chat-send { min-height: 42px; padding: 10px 18px; font-size: 14px; }

        /* 新建世界表单（批次 184）：**不再把标签和输入框拆成两行**——
           那样每个字段占两行，横屏手机上整张表单要滚才能看全。
           窄屏只把标签列收窄、字号压一档，保持"标签 + 输入框"同一行。 */
        .world-row { grid-template-columns: 56px minmax(0, 1fr) 40px; gap: 5px; }
        .world-row > span { font-size: 11px; }
        /* 横屏手机（~390 高）把新建表单再压一档：三行字段 + 说明 + 创建键一次放下 */
        .world-panel[data-view='create'] { padding: 10px 12px; }
        .world-panel[data-view='create'] .world-nav { margin-bottom: 8px; }
        .world-panel[data-view='create'] .world-primary { min-height: 44px; padding: 7px; }
        body.touch-mode .world-panel[data-view='create'] .world-input { padding: 7px 8px; font-size: 13px; }
        .world-panel[data-view='create'] .world-hint { margin-top: 6px; font-size: 11px; }
      }

      /* 窄屏（< 760px，背包键只能挂在快捷栏**右端上方**）：血条/饥饿整行再抬一个
         按钮的高度，否则饥饿那 10 个图标会和背包键叠在一起。
         ≥ 760px 时背包键摆在快捷栏右侧（见 `#touch-hotbar-inventory`），不需要这条。
         ⚠️ 竖屏本身被"请横屏"整屏浮层挡着，这里实际只影响 667~759px 的横屏机。 */
      @media (max-width: 759px) {
        #vitals { bottom: calc(120px + env(safe-area-inset-bottom, 0px)); }
      }

      /* 竖屏手机：摇杆与按钮簇都往上收一点，给屏幕中间留出视野 */
      @media (orientation: portrait) and (max-width: 900px) {
        /* ⚠️ 这里的尺寸**必须**乘 `--touch-scale`：竖屏手机是最常见的场景，
           而这几条规则会盖掉上面那些（同优先级、后出现）——不乘的话
           "触摸按钮大小"这个设置项在手机上等于没接线（批次 98 顺手修） */
        #touch-ui {
          --touch-side-inset: 34px;
          --touch-stick-size: calc(124px * var(--touch-scale, 1));
          --touch-stick-bottom: calc(104px + env(safe-area-inset-bottom, 0px));
          --touch-buttons-bottom: calc(131px + env(safe-area-inset-bottom, 0px));
          --touch-jump-size: calc(70px * var(--touch-scale, 1));
        }
        #touch-stick .knob {
          width: calc(52px * var(--touch-scale, 1));
          height: calc(52px * var(--touch-scale, 1));
        }
        .touch-button {
          width: calc(58px * var(--touch-scale, 1));
          height: calc(58px * var(--touch-scale, 1));
        }
        #touch-hint {
          bottom: calc(322px + env(safe-area-inset-bottom, 0px));
          max-width: 88vw; white-space: normal; text-align: center;
        }
      }

      /* 横屏手机：摇杆与按钮再往下、缩小一点，避免遮挡视野中心。
         ⚠️ 横屏屏幕宽（≥ 760px 命中上面那条），所以背包/聊天是摆在快捷栏**左右两侧**的，
         不再需要为它们留出"上方"的空间——这一簇仍然只有"潜行 + 跳跃"两颗 */
      @media (max-height: 480px) {
        #touch-ui {
          --touch-side-inset: 30px;
          --touch-stick-size: calc(108px * var(--touch-scale, 1));
          --touch-stick-bottom: calc(70px + env(safe-area-inset-bottom, 0px));
          --touch-buttons-bottom: calc(92px + env(safe-area-inset-bottom, 0px));
          --touch-jump-size: calc(64px * var(--touch-scale, 1));
        }
        #touch-stick .knob {
          width: calc(46px * var(--touch-scale, 1));
          height: calc(46px * var(--touch-scale, 1));
        }
        .touch-button {
          width: calc(54px * var(--touch-scale, 1));
          height: calc(54px * var(--touch-scale, 1));
          font-size: 15px;
        }
        #touch-hint { bottom: calc(178px + env(safe-area-inset-bottom, 0px)); }
      }

      /* ---------------- 指南针/时钟读数（触摸端安全位，批次 274） ----------------
         用户："读数会跑到右下角、跟跳跃键叠在一起。"
         触摸端的右下角被**跳跃键簇**占着（创造飞行时还要再叠上升/下降两颗），
         表盘放正上方或右下角都躲不开；这里统一挪到**跳跃键簇左侧**：
           right = 按钮簇的右边距 + 最宽那颗（跳跃键）× 触摸缩放 + 12px 间隙；
           bottom 抬到 110px 以上，避开快捷栏右侧的背包键（约占 65~109px）。
         只在 `body.touch-mode` 下覆盖，桌面端仍用原来的右下角。 */
      body.touch-mode .tool-hud {
        right: calc(20px + 76px * var(--touch-scale, 1) + 12px);
        bottom: calc(110px + env(safe-area-inset-bottom, 0px));
      }
      /* 横屏手机：按钮簇更靠下、跳跃键 64px（见上面 max-height: 480px 那条） */
      @media (max-height: 480px) {
        body.touch-mode .tool-hud {
          right: calc(20px + 64px * var(--touch-scale, 1) + 12px);
          bottom: calc(120px + env(safe-area-inset-bottom, 0px));
        }
      }
      /* 竖屏：按钮簇右边距 14px、跳跃键 70px、底部 132px */
      @media (orientation: portrait) and (max-width: 900px) {
        body.touch-mode .tool-hud {
          right: calc(14px + 70px * var(--touch-scale, 1) + 12px);
          bottom: calc(144px + env(safe-area-inset-bottom, 0px));
        }
      }

      /* ---------------- 面板入场（批次 28 → 142 改底部滑入） ----------------
         基岩版 Wiki：「从屏幕底部淡入并上移」。关闭走 panel-out。 */
      @keyframes panel-in {
        from { opacity: 0; transform: translateY(28%); }
        to { opacity: 1; transform: none; }
      }
      @keyframes panel-out {
        from { opacity: 1; transform: none; }
        to { opacity: 0; transform: translateY(28%); }
      }
      .inv-panel, .recipe-panel, .settings-panel, .world-panel, .adv-panel {
        animation: panel-in var(--dur-med) var(--ease);
      }
      .inv-panel.panel-out, .recipe-panel.panel-out {
        animation: panel-out var(--dur-med) var(--ease) forwards;
      }
      /* 创造整屏：只留创造网格 + 快捷栏（批次 142） */
      .inv-panel.creative-ui .inv-body { width: 100%; }
      .inv-panel.creative-ui .inv-creative {
        max-height: min(58vh, 420px);
      }
      /* 低血量脉冲：血少了要让 HUD 自己"跳"一下，而不是等玩家发现数字变小了 */
      @keyframes low-health-pulse {
        0%, 100% { transform: translateX(-50%) scale(1); filter: none; }
        50% { transform: translateX(-50%) scale(1.06); filter: drop-shadow(0 0 6px rgba(224, 80, 60, .8)); }
      }
      #vitals.low-health { animation: low-health-pulse 1s ease-in-out infinite; }

      /* ---------------- 成就 / 进度（M7，批次 87） ----------------
         面板与配方书同一套灰色金属；列表是**竖着的树**（缩进），
         未解锁的行整行压暗 + 标题显示 `???`（说明留着——那是"怎么做"，不是秘密）。 */
      #advancements {
        /* z-index 55：**要在暂停菜单（设置，50）之上**——暂停菜单里点"成就"
           就是这个顺序；其余的按文件开头那条层级约定排 */
        position: fixed; inset: 0; z-index: 55; display: flex;
        align-items: center; justify-content: center;
        background: rgba(0, 0, 0, .45);
      }
      #advancements.hidden { display: none; }
      .adv-panel {
        /* 批次 528（用户）：尺寸与背包一致，并**只让列表滚**。
           从背包里打开时 JS 会直接复制背包面板的 rect（见 AdvancementScreen#alignTo），
           这里的默认值只负责"从暂停菜单打开"那条路。 */
        width: min(94vw, 660px); max-width: min(94vw, 660px);
        height: min(92dvh, 620px); max-height: min(92dvh, 620px);
        display: flex; flex-direction: column; overflow: hidden;
        background: var(--panel-bg);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius);
        padding: 12px 14px; color: var(--panel-text); font-size: 13px;
        box-shadow: var(--panel-shadow);
      }
      body.touch-mode .adv-panel {
        width: min(calc(100vw - 88px), 800px);
        max-width: min(calc(100vw - 88px), 800px);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
        padding: 8px 10px;
      }
      #advancements.aligned .adv-panel { margin: 0; }
      .adv-header {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding-bottom: 8px; border-bottom: 2px solid #9a9a9a; margin-bottom: 8px;
        flex: 0 0 auto;
      }
      .adv-header b { font-size: 15px; }
      .adv-summary { color: #4a4a4a; font-size: 11px; }
      .adv-close {
        margin-left: auto; font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
        background: #a8a8a8; color: #222; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 触摸端与背包的关闭键同尺寸（携带版背包是 24×20 的紧凑 ✕） */
      body.touch-mode .adv-panel .adv-close {
        min-width: 24px; min-height: 20px; padding: 0 6px; font-size: 12px; line-height: 1.1;
      }
      /* 分类页签：手机上会横向挤到 6 个，所以允许换行（不滚动，滚动条在手机上是另一种麻烦） */
      .adv-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; flex: 0 0 auto; }
      .adv-tab {
        font: inherit; font-size: 11px; padding: 5px 9px; cursor: pointer;
        background: #a8a8a8; color: #222; border: 2px solid;
        border-color: #d8d8d8 #6a6a6a #6a6a6a #d8d8d8; border-radius: 3px;
      }
      .adv-tab.active { background: #7fa06f; border-color: #dfe9d8 #47603c #47603c #dfe9d8; }
      /* 只有列表滚：与背包同高之后，标题/页签不能被滚走 */
      .adv-list {
        display: flex; flex-direction: column; gap: 5px;
        flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
        overscroll-behavior: contain;
      }
      /* 横屏矮屏：标题与页签再压一档，给列表让出高度 */
      body.touch-mode .adv-header { gap: 6px; padding-bottom: 4px; margin-bottom: 4px; }
      body.touch-mode .adv-header b { font-size: 13px; }
      body.touch-mode .adv-summary { font-size: 10px; }
      body.touch-mode .adv-tabs { gap: 4px; margin-bottom: 4px; }
      body.touch-mode .adv-tab { font-size: 10px; padding: 3px 6px; }
      body.touch-mode .adv-row { min-height: 40px; padding: 4px 6px; }
      .adv-empty { padding: 18px; text-align: center; color: #5a5a5a; }
      .adv-row {
        display: flex; align-items: center; gap: 9px;
        padding: 6px 8px; background: #b4b4b4;
        border: 2px solid; border-color: #d8d8d8 #7a7a7a #7a7a7a #d8d8d8;
        border-radius: var(--radius-sm); min-height: 44px;
      }
      .adv-row[data-state='earned'] { background: #b9c9b0; }
      .adv-row[data-state='locked'] { background: #9a9a9a; }
      .adv-icon { width: 30px; height: 30px; flex: 0 0 30px; image-rendering: pixelated; }
      .adv-row[data-state='locked'] .adv-icon { filter: grayscale(1) brightness(.62); }
      .adv-main { flex: 1; min-width: 0; }
      .adv-title { font-size: 13px; }
      .adv-desc { font-size: 11px; color: #4a4a4a; }
      .adv-row[data-state='locked'] .adv-title,
      .adv-row[data-state='locked'] .adv-desc { color: #3d3d3d; }
      .adv-badge {
        flex: 0 0 auto; font-size: 10px; padding: 3px 7px; border-radius: 3px;
        background: #6f6f6f; color: #f2f2f2;
      }
      .adv-row[data-state='earned'] .adv-badge { background: #3a7d33; }
      .adv-row[data-state='available'] .adv-badge { background: #7a6a33; }

      /* 达成提示（原版那张小卡片）：右上角，最新的在最上面 */
      #adv-toasts {
        position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px;
        z-index: 24; display: flex; flex-direction: column; gap: 6px;
        pointer-events: none; max-width: min(78vw, 320px);
      }
      .adv-toast {
        display: flex; align-items: center; gap: 8px;
        padding: 7px 10px; border-radius: 4px;
        background: linear-gradient(#2b2b30, #1b1b20);
        border: 2px solid #57a04a; color: #f0f0f0;
        box-shadow: 0 6px 18px rgba(0, 0, 0, .55);
        opacity: 1; transition: opacity var(--dur-med) var(--ease);
      }
      .adv-toast.challenge { border-color: #a545d0; }
      .adv-toast.hiding { opacity: 0; }
      .adv-toast-icon { width: 26px; height: 26px; image-rendering: pixelated; }
      .adv-toast-text { min-width: 0; }
      .adv-toast-label { font-size: 10px; color: #a8e39b; }
      .adv-toast.challenge .adv-toast-label { color: #dcb0f0; }
      .adv-toast-name { font-size: 12px; }

      /* ================================================================
         界面按钮统一（批次 108 起，批次 109 换成原版那套画法）
         ================================================================
         `* { border-radius: 0 !important }` 是个陷阱（准星、触摸端那几颗圆形按钮、
         血条图标本来就是圆的），所以这里用一条**明确的选择器清单**，一次给所有
         "界面按钮"套上原版的画法：

             面     #8b8b8b                             ← --btn-bg
             外框   2px 纯黑                             ← --mc-outline
             斜面   inset 2px 2px 0 #fff / inset -2px -2px 0 #555
             文字   #e0e0e0 + 1px 深阴影
             悬停   面变亮 + **文字变黄**（原版是文字变黄，不是整块变色）
             按下   斜面**反转**（凹进去）+ 文字变黄

         这套值是原版反推的：面板 #c6c6c6 / 斜面 #fff + #555 / 描边 #000 /
         文字 #e0e0e0 / 阴影 #3f3f3f / 悬停 #ffffa0。 */
      :is(.world-primary, .world-secondary, .world-mini, .world-back,
          .world-card-actions button, .world-confirm-actions button,
          .world-modal-actions button, .world-modal-close,
          .pause-action, .settings-back,
          .settings-tab, .settings-cycle, .settings-dropdown-button,
          .appearance-preset, .appearance-focus-button,
          .adv-close, .recipe-close, .recipe-page-button,
          .inv-page-button, .inv-close, .unsupported-button, .install-hint button) {
        background: var(--btn-bg);
        color: var(--btn-text);
        border: 2px solid var(--mc-outline);
        border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      :is(.world-primary, .world-secondary, .world-mini, .world-back,
          .world-card-actions button, .world-confirm-actions button,
          .world-modal-actions button, .world-modal-close,
          .pause-action, .settings-back,
          .settings-tab, .settings-cycle, .settings-dropdown-button,
          .appearance-preset, .appearance-focus-button,
          .adv-close, .recipe-close, .recipe-page-button,
          .inv-page-button, .inv-close, .unsupported-button, .install-hint button):not(:disabled):hover {
        background: var(--mc-face-hover);
        color: var(--mc-text-hover);
      }
      :is(.world-primary, .world-secondary, .world-mini, .world-back,
          .world-card-actions button, .world-confirm-actions button,
          .world-modal-actions button, .world-modal-close,
          .pause-action, .settings-back,
          .settings-tab, .settings-cycle, .settings-dropdown-button,
          .appearance-preset, .appearance-focus-button,
          .adv-close, .recipe-close, .recipe-page-button,
          .inv-page-button, .inv-close, .unsupported-button, .install-hint button):not(:disabled):active {
        /* 斜面反转 = 凹进去（原版靠这个表达"按下了"，不靠位移） */
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
        color: var(--mc-text-hover);
      }
      /* 批次 296：当前选中的角色预设 / 当前视角（绿底反白，与设置页签一致）。
         放在统一按钮规则**之后**，才能压过 hover/active 的黄色文字。 */
      .appearance-preset.active,
      .appearance-focus-button.active {
        background: #6cc349;
        color: #10230a;
        border-color: #284c1c;
        text-shadow: 1px 1px 0 rgba(255, 255, 255, .35);
      }
      /* 危险操作 = 红字（原版没有红色按钮），悬停/按下也不要变成黄色 */
      .pause-action.danger, .world-card-actions button.danger { color: var(--mc-text-danger); }
      .pause-action.danger:not(:disabled):hover,
      .pause-action.danger:not(:disabled):active,
      .world-card-actions button.danger:not(:disabled):hover,
      .world-card-actions button.danger:not(:disabled):active { color: #ff8080; }
      /* 输入类控件（主菜单的新建表单）：凹进去的一圈硬边 */
      .world-input, .chat-input {
        border: 2px solid; border-color: var(--pixel-bevel-on-dark-in);
        border-radius: 0;
      }
      /* 其余写着具体圆角的方框（提示条 / 标签 / 底衬 / 聊天记录） */
      :is(#debug, #overlay kbd, .inv-header kbd, .inv-label::before, .inv-panel kbd,
          #item-tooltip, .adv-badge, .adv-toast, #chat .chat-line, .chat-send,
          #xp-bar, #xp-fill, #xp-level, #boss-bar, #break-progress, #eat-progress,
          #selected-item-name, #touch-hint, .unsupported-panel,
          #chat, .chat-log, .sign-editor-hint) {
        border-radius: 0;
      }
      #item-tooltip { box-shadow: 0 6px 0 rgba(0, 0, 0, .4), 0 0 0 2px rgba(0, 0, 0, .55); }
      .adv-toast { box-shadow: 0 4px 0 rgba(0, 0, 0, .4); }

      /* ---------------- 界面不许横向滑动（批次 108） ----------------
         ⚠️ 这是一个**真出现过**的问题：用户反馈"界面能左右晃"。
         根因是 `overflow-y: auto` 会把另一轴的 `visible` **计算成 auto**
         （CSS 规范里那条"一个轴非 visible、另一个轴 visible 就变 auto"），
         于是只要有一条内容比容器宽 1px，整屏就能被左右拖动。
         这几层都是"整屏遮罩 + 竖着滚"，横着一律锁死；
         `overscroll-behavior: contain` 再挡住"滚到头把页面一起拖走"的连锁效果。 */
      :is(#world-screen, #settings-screen, #inventory-screen, #advancements,
          #recipe-book, #chat, #sign-editor, .adv-panel, .inv-panel, .recipe-panel,
          .settings-panel, .world-panel, .world-list, .settings-body) {
        overflow-x: hidden;
        overscroll-behavior: contain;
      }
      /* 双栏壳的宽度在这里收口：不管左栏是"我的物品 / 创造物品 / 配方书"，
         面板都是同一个宽度——切栏目时没有东西会动。 */
      .inv-panel.pocket-ui.pocket-dual,
      body.touch-mode .inv-panel.pocket-ui.pocket-dual {
        width: min(calc(100vw - 88px), 800px);
        max-width: min(calc(100vw - 88px), 800px);
      }
      body.touch-mode .inv-panel.creative-ui.pocket-ui.pocket-dual .inv-creative {
        grid-template-columns: repeat(7, 40px);
        min-height: 0;
        max-height: 174px;
      }
      /* ⚠️ 刻意**不**包含 `.inv-tabs`：那一行分类标签是"单行横向滚动"的
         （窄屏上一个都换行不下），锁掉就不会滚了（见 `ui-test` 里那条断言）。 */

      /* ---------------- 减少动效（无障碍） ----------------
         系统里开了"减少动态效果"就把动画与过渡全部关掉：
         前庭功能敏感的人不该被面板缩放、脉冲这类动画晃到。
         ⚠️ 不用 `animation: none` 逐个写，直接把时长令牌压成 0
         （所有地方都引用它们，一处生效）。 */
      @media (prefers-reduced-motion: reduce) {
        :root {
          --dur-fast: 0s;
          --dur-med: 0s;
        }
        * {
          animation-duration: 0s !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0s !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <!-- 首屏启动遮罩：**静态**写在 HTML 里（模块脚本还没跑的时候就要盖住准星那个"加号"）。
         `boot()` 走到主菜单（或判定设备不支持）时，由 `ui/LoadingOverlay.ts` 的
         `hideBootLoading()` 整块 remove。 -->
    <div id="boot-loading" role="status" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-text">加载中…</div>
      <div class="boot-bar" aria-hidden="true"></div>
      <div class="boot-sub">正在准备材质与存档</div>
    </div>

    <!-- 受伤红闪（批次 234）：垫在 HUD 下面，只由 `ui/DamageFlash` 写 opacity -->
    <div id="damage-flash" aria-hidden="true"></div>

    <div id="hud">
      <!-- 右上：性能信息 + 状态效果（批次 206：性能从左上搬来，聊天/玩家信息占左上） -->
      <div id="hud-right">
        <div id="debug"></div>
        <div id="effects-hud"></div>
      </div>
      <div id="crosshair"></div>
      <div id="break-progress"><i></i></div>
      <div id="eat-progress"><i></i></div>
      <div id="boss-bar"><b>末影龙</b><i><s id="boss-fill"></s></i></div>
      <div id="vitals"></div>
      <div id="hotbar"></div>
    </div>

    <!-- ⚠️ 这里原来有一层 `#overlay`（"Bedrock 1.18 Web / 点击进入游戏"那块遮罩）。
         批次 111 按用户要求整块删掉了："进入游戏不要有那个点击进入游戏的流程"。
         原版也没有这一层——点完"游戏"进去就是世界，指针锁由"点一下画面"完成
         （`renderer.domElement` 的 click 早就接好了）。
         原来遮罩上那份**按键/手势说明**没有丢：它移到了暂停菜单底部
         （见 `ui/SettingsScreen.ts` 的 `.pause-help`），按 Esc 就能查。 -->

    <div id="death" class="hidden"><div><b>你死了！</b><span class="death-cause"></span>正在重生…</div></div>

    <!-- 睡觉遮罩（B13）：躺在床上的那十几秒。文字里写清"怎么提前起来"，
         手机上没有 Esc 之类的键，跳跃键是唯一可靠的入口 -->
    <div id="sleep" class="hidden"><div><b>Zzz…</b>天快亮了<br />跳跃键可以提前起床</div></div>

    <!-- ⚠️ 这里原来是一个写死的加载节点（`#loading`，文案"正在生成世界…"，批次 167 删掉）。
         它从 `boot()` 第一行就在屏幕上，而那段文案说的是**当时还没发生的事**
         （那时只是在做 GL 预检、画图集、读存档库）——用户的原话：
         "首次加载这个页面的时候，它会显示一个地图生成中的东西……地图生成是在创建游戏
         的时候才生成的"。现在它由 `ui/LoadingOverlay.ts` **按需创建**：
         只有点进一个世界、真的要生成地形时才挂出来，撤掉时整块 remove。
         CSS（`#loading` 与 `loading-sweep`）留在上面那一段，`test:theme` 有断言盯着。
         ℹ️ 首屏告别"只有一个准星"的那层遮罩是另一个东西（`#boot-loading`，静态、
            文案"加载中…"），见上面 `#boot-loading` 那段注记与 body 开头的节点。 -->

    <!-- 设备不支持时的整屏提示（A10）：判定在 core/render/webglSupport.ts，
         这里只给样式；内容由 ui/UnsupportedScreen.ts 填（见那边的注记：
         不用 alert——手机上会被拦，而且显示不了条目化建议） -->
    <style>
      /* ⚠️ 默认 `display: none`（批次 102 修的 A10 回归）：
         这一层是 `position: fixed; inset: 0; z-index: 90` 的**不透明**整屏底，
         **挂上就盖住一切**。原来这里写的是 `display: grid`，于是一个**内容为空的**层
         也会把主菜单（`#overlay` 的 z-index 只有 5）整片盖黑 —— 主页打不开任何东西。
         现在只有 JS 加了 `.visible` 才铺满（见 `ui/UnsupportedScreen.ts`）。 */
      .unsupported-screen {
        position: fixed; inset: 0; z-index: 90;
        display: none; place-items: center;
        background: radial-gradient(circle at 50% 35%, #14181f, #07080a 70%);
      }
      .unsupported-screen.visible { display: grid; }
      /* 竖屏手机：点这一条就是进全屏 + 锁横屏的那一次手势。默认不显示。
         ⚠️ 批次 181 从**整屏黑幕**改成**底部横条**：黑幕会把主菜单一起盖住，
         用户体感是"退出了另一个游戏"。现在菜单始终可见可点，只提示"横屏更好"。 */
      /* 竖屏浮层（批次 185，用户："竖屏状态不应该显示任何游戏界面，用覆盖在上面的浮层"）。
         ⚠️ 与批次 167/181 的"底部横条"不同：那一版菜单仍露在外面，玩家能在竖屏里
         点"创建世界"，进游戏后才横过来，体验是"竖屏也能玩、但很挤"。
         现在整层**不透明**、盖住菜单与游戏（z-index 90，高于提示框之外的一切），
         点它才请求全屏 + 锁横屏；横屏后由 `syncRotateHint` 收起。 */
      .rotate-hint {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 90;
        margin: 0;
        padding: 20px;
        background: radial-gradient(circle at 50% 42%, #171b21, #060708 78%);
        color: var(--mc-text-light);
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        font: 14px/1.6 'Courier New', monospace;
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        /* 批次 212：整屏可点（不要有任何子元素把事件吃掉） */
        pointer-events: auto;
        touch-action: manipulation;
      }
      .rotate-hint > * { pointer-events: none; }
      .rotate-hint.visible { display: flex; }
      /* 批次 213：掉出全屏时"先暂停、再把横屏提示盖在最上面"。
         暂停菜单（z-index 50）已经在下面打开了，这一层（90）盖住它；
         玩家点一下 → 全屏 + 横屏 → 这一层随横屏消失，正好看到"游戏已暂停"。
         ⚠️ 不要再按 pause-open 把这一层隐藏掉：
         那样会把提示藏掉，只剩暂停菜单，玩家会以为"返回没让我横屏"。 */
      .rotate-hint b { font-size: 20px; font-weight: 400; letter-spacing: 2px; }
      .rotate-hint span { font-size: 12px; color: #a8a8a8; }
      /* 竖屏里的手机轮廓：只做视觉引导，不参与点击 */
      .rotate-hint .rotate-phone {
        width: 40px; height: 68px;
        border: 3px solid #d8d8d8; border-radius: 6px;
        display: grid; place-items: center;
        animation: rotate-phone-turn 2.4s ease-in-out infinite;
      }
      .rotate-hint .rotate-phone::after {
        content: ''; width: 12px; height: 3px; background: #d8d8d8; border-radius: 2px;
      }
      @keyframes rotate-phone-turn {
        0%, 30% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      .unsupported-panel {
        display: flex; flex-direction: column; gap: 12px;
        padding: 18px 20px; max-width: min(520px, 90vw);
        color: var(--mc-text-light); background: var(--mc-menu-bg);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        border-radius: 0; box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .unsupported-title { font-size: 17px; font-weight: 600; }
      .unsupported-reason { font-size: 14px; line-height: 1.6; color: #c8ccd4; }
      .unsupported-advice { margin: 0; padding-left: 20px; }
      .unsupported-advice li { font-size: 13px; line-height: 1.7; color: #b6bcc6; }
      .unsupported-button {
        align-self: flex-start; padding: 9px 16px; font: inherit; font-size: 14px;
        color: #fff; background: #3a7d33; border: 2px solid #2b5c26;
        border-radius: 6px; cursor: pointer; min-height: 38px;
      }
      .unsupported-button:active { background: #2f6a2a; }
      .unsupported-code { font-size: 12px; color: #7d848f; }
    </style>

    <script type="module" src="/src/main.ts"></script>
    <script type="module">
      // Service Worker 只在构建产物里注册：开发时注册会把 vite 的开发资源缓存住，
      // 改代码看不到效果（这是 PWA 开发里最常见的坑）
      if (import.meta.env.PROD && 'serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch((error) => {
            console.warn('[pwa] Service Worker 注册失败（离线功能不可用）', error);
          });
        });
      }
    </script>
  </body>
</html>
