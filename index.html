<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no：禁止双指缩放，否则游戏画面会被误缩放
         viewport-fit=cover：让页面铺满刘海屏，配合 env(safe-area-inset-*) 排布触摸控件
         interactive-widget=resizes-visual（批次 184）：键盘弹出时**只缩视觉视口**，
         不去缩布局视口——原来写的是 resizes-content，点一下聊天框整块 3D 画面被压矮，
         用户的原话是"点击后不要挤压界面内容"。键盘占掉的高度由 `ui/Keyboard.ts`
         写成 `--kb-inset`，聊天框/告示牌自己抬起来，界面别的部分一动不动。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-visual"
    />
    <!-- 手机上以全屏应用的方式运行（加到主屏后隐藏浏览器地址栏） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- 微信 / QQ（X5）与 UC：打开页面就横屏全屏，不必等第一次点击 -->
    <meta name="x5-orientation" content="landscape" />
    <meta name="x5-fullscreen" content="true" />
    <meta name="x5-page-mode" content="app" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="full-screen" content="yes" />
    <meta name="browsermode" content="application" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Minicraft</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- PWA：可安装到主屏、离线可用（K8） -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <style>
      /* ================================================================
         设计令牌（批次 28 界面美化）
         ================================================================
         为什么要有这一层：这些值原来手写在二十多个地方（同一个面板底色写成
         `#c6c6c6`、`#c8c8c8`、`#bfbfbf` 三种），改一次要翻整个文件，
         而且必然出现"这个面板比那个亮一点"这种说不清哪不对的差别。
         现在**色值只在这里出现一次**，组件只引用 `var(--…)`。

         ⚠️ 两条约定：
          - 稀有度四色与 `core/registry/itemVisuals.ts` 是同一套语义（那边算档位、
            这边给颜色），改色只改这里；
          - 时长统一走 `--dur-*`，`prefers-reduced-motion` 里把它们压成 0
            （前庭功能敏感的人不该被动画晃到）。
         */
      :root {
        /* ================================================================
           原版调色板（批次 109）
           ================================================================
           用户反馈"像素风这个配色和颜色好像也不太对"。对照原版反推出来的那套值，
           问题很清楚：批次 108 做的是**现代深色 UI + 绿色按钮**，而原版（Java 与
           基岩是同一套）里**一个绿色按钮都没有**——绿色只出现在"按下反馈"和
           合成槽位上。原版的每个控件都是这四个颜色拼出来的：

             面板面        #c6c6c6   经典 GUI 灰（物品栏/对话框就是它）
             斜面高光      #ffffff   左上那一条
             斜面阴影      #555555   右下那一条
             外描边        #000000   1px 纯黑，每个控件都有
             槽位/按钮面   #8b8b8b
             文字（浅底）  #3f3f3f   （深底）#e0e0e0
             文字阴影      #3f3f3f   原版规则：文字色 × 25%
             悬停文字      #ffffa0   ⚠️ 原版是**文字变黄**，不是整块变色
             禁用文字      #a0a0a0

           ⚠️ 下面这些 `--panel-*` / `--btn-*` 是批次 28 起就在用的**旧名字**，
           为了不动上百处引用，这里只把值换成原版色（名字与语义一一对应）。
           ================================================================ */
        --mc-panel: #c6c6c6;
        --mc-face: #8b8b8b;
        --mc-face-hover: #a0a0a0;
        --mc-face-down: #6c6c6c;
        --mc-edge-light: #ffffff;
        --mc-edge-dark: #555555;
        --mc-outline: #000000;
        --mc-text: #3f3f3f;
        --mc-text-light: #e0e0e0;
        --mc-text-hover: #ffffa0;
        --mc-text-disabled: #a0a0a0;
        --mc-text-shadow: #3f3f3f;
        /* 深色界面（主菜单 / 暂停菜单 / 设置）的底：原版是"世界 + 半透明黑"。
           这里给一个近似的深灰，真正的背景噪点写在 `#world-screen` / `#settings-screen` 上 */
        --mc-menu-bg: #232323;
        --mc-menu-overlay: rgba(0, 0, 0, .58);

        /* ---- 控件与弹层的统一规格（2026-10-27） ----
           用户："设置里所有的按钮、文字、输入框都应该符合一个统一的规则，
           不应该有的大有的小、有的高有的低；弹框的位置、背景、关闭按钮也要统一。"
           所以尺寸只在这里出现一次，下面有一整段"控件统一规格"把它们套到各处。
           新增控件挂上那几个选择器即可，不要各写一套 padding。 */
        --ctl-h: 32px;            /* 输入框 / 下拉 / 次级按钮的统一高度 */
        --ctl-h-lg: 40px;         /* 主按钮高一档（一处只出现一颗） */
        --ctl-font: 13px;         /* 控件字号；标签统一 12px */
        --ctl-pad-x: 9px;         /* 控件左右内边距 */
        --modal-w: 460px;         /* 对话框面板宽度（上限，窄屏按 92vw 收） */
        --modal-pad: 12px 14px;   /* 对话框/浮窗的内边距 */
        --modal-bg: #2b2b2b;
        --modal-close: 28px;      /* 关闭按钮：正方形，钉在右上角 */

        /* ---- 暂停/设置面板的**固定尺寸**（批次 110） ----
           用户要求"不管手机还是 PC，设置界面都是固定宽高、统一大小的"。
           尺寸只在这两个变量里出现一次，暂停菜单页与设置页**共用**——
           之前两页各写一套宽度，切页时面板会跳大小。
           ⚠️ 仍用 `min(vw, 上限)` 而不是写死像素：手机上要收进视口，
              "固定"指的是不随内容/页签变化（四周留出的一圈就是游戏区域）。 */
        /* ⚠️ 上限不能太小：用户要的是"覆盖在游戏界面上、只留**一点点**外部游戏区域"。
           640px 在 1440 宽的 PC 上会留下 70% 的游戏区域，那不是"一点点"。
           760 × 620 在三个典型视口下的边距：
             PC 1440×900   → 340 / 140px（约 24% / 16%）
             手机横屏 844×390 → 42 / 23px（5% / 6%）
             手机竖屏 430×932 → 13 / 156px（受 vw/dvh 限制，面板仍收得进屏幕）
           ⚠️ 高度用 `dvh` 而不是 `vh`（批次 167）：手机浏览器地址栏收起/展开时，
              `vh` 永远是"最大的那个视口"，面板底边会被地址栏咬掉一截
              （主菜单也吃这一对尺寸了，所以这件事从"设置面板"升级成"整个菜单"）。
           ⚠️ 主菜单（首页/世界列表/新建世界）也从批次 167 起吃这一对——
              用户："首页两个按钮点下去应该是弹出一个固定大小的框，不是一大一小。" */
        --panel-w: min(94vw, 760px);
        --panel-h: min(88dvh, 620px);
        /* 暂停菜单页的宽度（批次 231，用户："游戏暂停页面也太宽了"）。
           菜单页只有**一列按钮**（`.pause-actions` 本身收到 300px），用设置页那
           760px 等于左右各留 200px 空地；横屏手机上 760 更是几乎铺满整屏
           （844 宽只剩 42px 游戏画面）。
           设置页仍吃 `--panel-w`：它要"左选项卡 + 右两列内容"，收窄会挤成一条。
           两页只差宽度、高度一致，切页时不会上下跳。 */
        --pause-w: min(90vw, 460px);
        /* 设置内容区控件的统一尺寸（批次 528）：所有下拉/循环/动作按钮同宽同高，
           不再出现"有的 112px、有的整行"的参差。 */
        --settings-ctrl-w: 96px;
        --settings-ctrl-h: 30px;
        /* 携带版背包自己的固定基准：所有单窗共用；双窗只横向再加一块同高区域。
           视口放不下时只做同倍率约束，不再按页签分别改宽高。 */
        --inv-pocket-w: min(calc(100vw - 88px), 568px);
        /* 318px 是手机横屏那一档（高 360~430）；桌面屏高得多，给到 42vh 不至于
           把同一副壳压成一条。手机上 42vh 仍小于 318，取值不变。 */
        --inv-pocket-h: min(calc(100dvh - 72px), max(318px, 42vh));

        /* ---- 面板 ---- */
        --panel-bg: var(--mc-panel);
        --panel-bg-dark: var(--mc-menu-bg);
        --panel-rivet: #8a8a8a;
        --panel-edge-light: var(--mc-edge-light);
        --panel-edge-dark: var(--mc-edge-dark);
        --panel-text: var(--mc-text);
        --panel-text-muted: #5a5a5a;
        /* 原版面板**没有投影**，只有那 1px 黑描边 + 两色斜面；
           这里保留一圈 2px 硬描边（面板浮在世界画面上，需要一条分界线） */
        --panel-shadow: 0 0 0 2px var(--mc-outline);
        --panel-radius: 0;

        /* ---- 像素斜角（批次 108） ----
           原版 GUI 里**没有一个圆角、也没有柔和投影**：面板与按钮都是直角，
           四周是一圈"左上亮、右下暗"的硬边，按下去时斜角翻过来（像被按进去）。
           这两个变量就是那圈斜角的四边颜色，用法：`border-color: var(--pixel-bevel)`。
           ⚠️ 直角是靠把下面那几个 `--*-radius` 全设成 0 实现的，**不要**在这里写
           `border-radius: 0 !important`——触摸端那几颗圆形按钮、准星、血条图标
           本来就是圆的，一刀切会把它们也压成方块。 */
        --pixel-bevel: var(--panel-edge-light) var(--panel-edge-dark) var(--panel-edge-dark) var(--panel-edge-light);
        /* 深色**面板**（主菜单 / 暂停菜单的框）用灰阶斜角：亮边 #4a4a4a、暗边近黑。
           ⚠️ 深色底上的**按钮**不用这套——原版在深色菜单上放的仍然是标准灰按钮，
           所以下面 `--btn-*` 那一套是全场景通用的。 */
        --pixel-bevel-dark: #4a4a4a #0d0d0d #0d0d0d #4a4a4a;
        /* 危险操作（删除世界）用的是**红字**而不是红底：原版没有红色按钮 */
        --mc-text-danger: #ff5555;

        /* ---- 槽位 ---- */
        --slot-bg: var(--mc-face);
        --slot-bg-hover: var(--mc-face-hover);
        /* 批次 159：选中＝**底变白**（像给物品垫了一张白卡纸），
           再配一圈加粗的深色框（见 `.inv-slot.selected`）——"相框"那套。 */
        --slot-bg-selected: #ffffff;
        --slot-edge-light: #ffffff;
        --slot-edge-dark: #373737;
        --slot-radius: 0;

        /* ---- 按钮 ----
           ⚠️ 原版**没有"主色按钮"**：主菜单的"游戏"和"设置"长得一模一样，
           危险操作靠红字区分。批次 108 那套"绿色渐变主按钮"是现代 UI 的语言，
           不是原版的（绿色在原版里只用于按下反馈与合成槽位）。 */
        --btn-bg: var(--mc-face);
        --btn-bg-down: var(--mc-face-down);
        --btn-primary: var(--mc-face);
        --btn-primary-down: var(--mc-face-hover);
        --btn-danger: var(--mc-face);
        --btn-danger-down: var(--mc-face-hover);
        --btn-text: var(--mc-text-light);
        --btn-radius: 0;
        /* 界面上唯一保留的绿色：聊天发送键（那本来就是本项目自己加的按钮） */
        --btn-send: #3a7d33;
        --btn-send-down: #2f6629;

        /* ---- 输入框 ----
           原版的文本框是**黑底白字 + 灰边框**（不是浅色输入框），填种子时也是这个 */
        --field-bg: #000000;
        --field-bg-dark: #000000;
        --field-text: var(--mc-text-light);
        --field-text-dark: var(--mc-text-light);

        /* ---- HUD（深色半透明，压在 3D 画面上） ---- */
        --hud-bg: linear-gradient(rgba(16, 17, 21, .62), rgba(8, 9, 12, .74));
        --hud-border: rgba(255, 255, 255, .16);
        --hud-shadow: 0 4px 16px rgba(0, 0, 0, .45);
        --hud-inner: inset 0 1px 0 rgba(255, 255, 255, .12);

        /* ---- 耐久条三档（与 `itemVisuals.durabilityLevel` 对应） ---- */
        --dur-high: #4ce04c;
        --dur-mid: #e8d24c;
        --dur-low: #e0503c;

        /* ---- 稀有度四色（与 `itemVisuals.RARITY_ORDER` 对应） ---- */
        --rarity-common: #ffffff;
        --rarity-uncommon: #ffff55;
        --rarity-rare: #55ffff;
        --rarity-epic: #ff55ff;

        /* ---- 强调色 ---- */
        --accent: #7dc46b;
        --accent-dim: #8fb98a;
        --warn: #e8d24c;
        --danger: #ff8a7a;

        /* ---- 圆角与时长 ----
           ⚠️ 三个圆角全为 0（批次 108）：这是"像素风"最省事也最有效的一刀——
           所有走令牌的面板/卡片/按钮/槽位瞬间变成直角，不必逐个去改字面量。 */
        --radius-sm: 0;
        --radius-md: 0;
        --radius-lg: 0;
        --dur-fast: .12s;
        --dur-med: .22s;
        --ease: cubic-bezier(.2, .7, .3, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #000;
        /* 手机上必须关掉浏览器自带的滚动/下拉刷新/双击缩放，否则拖动视角会连带滚页面 */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        /* 等宽字体打底（像素感、数字对齐），中文回退到系统黑体——
           否则中文会落到某个衬线/异体字上，与英文的观感完全割裂 */
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace;
        -webkit-font-smoothing: antialiased;
      }

      /* 键盘操作必须能看出焦点在哪（此前完全没有：Tab 一圈不知道停在哪） */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* 面板内滚动条：默认的白色粗条在灰色面板上非常突兀 */
      .inv-panel, .recipe-panel, .settings-panel, .world-panel, .adv-panel, #inv-creative {
        scrollbar-width: thin;
        scrollbar-color: #7a7a7a transparent;
      }
      .inv-panel::-webkit-scrollbar, .recipe-panel::-webkit-scrollbar,
      .settings-panel::-webkit-scrollbar, .world-panel::-webkit-scrollbar,
      .adv-panel::-webkit-scrollbar {
        width: 8px;
      }
      .inv-panel::-webkit-scrollbar-thumb, .recipe-panel::-webkit-scrollbar-thumb,
      .settings-panel::-webkit-scrollbar-thumb, .world-panel::-webkit-scrollbar-thumb,
      .adv-panel::-webkit-scrollbar-thumb {
        background: #7a7a7a; border-radius: 4px;
      }
      /* 层级约定（从小到大）：遮罩(5) < 死亡(6) < 背包(10) < 配方书(20) < 主菜单(40) < 设置(50)。
         ⚠️ #app 刻意**不给** z-index：所有面板都要挂在 <body> 上（而不是 #app 里面），
         否则 z-index 只在 #app 这个层叠上下文内部比较，面板会被 DOM 更靠后的遮罩盖住。 */
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      /* 受伤红闪（批次 234）：中心透明、边缘发红（原版掉血那一下就是这个形状）。
         只由 `ui/DamageFlash` 写 opacity；强度为 0 时元素不产生可见绘制。
         放在 HUD 之前，层叠上自然压在画布之上、HUD 之下。 */
      #damage-flash {
        position: fixed; inset: 0; pointer-events: none;
        opacity: 0;
        /* 三层：中心的一点点红（让"掉了血"在户外也看得见）+ 边缘重红（原版那圈）
           + 整屏淡红底。批次 236 之前只有最外面那层 .62，明亮场景下几乎看不到。 */
        background:
          radial-gradient(circle at 50% 50%, rgba(214, 12, 12, .38) 0%, rgba(214, 12, 12, 0) 58%),
          radial-gradient(circle at 50% 50%, rgba(255, 40, 40, 0) 18%, rgba(201, 5, 5, .92) 100%),
          rgba(150, 0, 0, .18);
        will-change: opacity;
      }

      #hud {
        position: fixed; inset: 0; pointer-events: none;
        color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
        /* 快捷栏的几何（批次 222）：生命/饥饿要**贴在它两端**，所以两边必须共用
           同一组数字。改槽位大小时只改这三个变量，别在 `#hotbar` 与 `#vitals` 各写一份 */
        --hotbar-slot: 42px;
        --hotbar-gap: 3px;
        --hotbar-pad: 4px;
        /* 9 格 + 8 条间隙 + 两侧内边距 + 两侧 1px 边框 */
        --hotbar-w: calc(9 * var(--hotbar-slot) + 8 * var(--hotbar-gap) + 2 * var(--hotbar-pad) + 2px);
      }
      /* 右上角一列：性能（#debug）在上、状态效果在下（批次 206）。
         用户要求"性能信息放到右上角"，而左上角留给聊天与玩家信息。 */
      #hud-right {
        position: absolute; top: 8px; right: 8px;
        display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
        max-width: 44vw;
      }
      #debug {
        font-size: 12px; line-height: 1.55; white-space: pre;
        background: rgba(0, 0, 0, .35); padding: 6px 9px; border-radius: 3px;
        text-align: left;
      }
      /* 准星（只留给桌面键鼠）：触摸端**整个不显示**——目标改由手指落点决定，
         手指不按就没有任何目标（批次 239 复查，用户："去掉原来的默认的十字光标"）。 */
      #crosshair {
        position: absolute; left: 50%; top: 50%;
        width: 20px; height: 20px; transform: translate(-50%, -50%);
        opacity: .85; mix-blend-mode: difference;
      }
      body.touch-mode #crosshair { display: none; }
      /* 批次 271：设置 → 瞄准方式 = 屏幕中心时，触摸端把准星装回来
         （默认仍是手指落点那套，准星保持隐藏） */
      body.touch-mode.aim-center #crosshair { display: block; }
      /* 屏幕中心瞄准时，白圈（手指落点锚点）没有意义：目标在正中，不在手指上 */
      body.touch-mode.aim-center #touch-ring { display: none; }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: #fff;
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }
      /* 攻击冷却条（G8，批次 506）：准星下面一小段，冷却满了就隐藏。
         触摸端也显示——按住攻击时它是唯一能看出"还要等多久"的东西。 */
      #attack-cooldown {
        position: absolute; left: 50%; top: calc(50% + 16px);
        width: 44px; height: 3px; margin-left: -22px;
        background: rgba(0, 0, 0, .45); border-radius: 2px;
        overflow: hidden; pointer-events: none; z-index: 7;
      }
      /* 准星锁定队友时的生命 / 饥饿（用户 2026-10-26）：一红一黄两条细条。
         只有"我在生存模式 + 准星指着一个远端玩家 + 他报过血量"时出现。 */
      #target-vitals {
        position: absolute; left: 50%; top: calc(50% + 26px);
        width: 96px; margin-left: -48px;
        display: flex; flex-direction: column; gap: 2px;
        pointer-events: none; z-index: 7; text-align: center;
      }
      #target-vitals.hidden { display: none; }
      #target-vitals-name {
        font-size: 11px; line-height: 13px; color: #fff;
        text-shadow: 0 1px 2px rgba(0, 0, 0, .85);
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      #target-vitals i {
        display: block; height: 3px; border-radius: 2px; overflow: hidden;
        background: rgba(12, 14, 16, .72);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .35);
      }
      #target-vitals s { display: block; height: 100%; width: 100%; text-decoration: none; }
      #target-vitals-hp { background: #d94b4b; }
      #target-vitals-food { background: #d8a33a; }
      #attack-cooldown.hidden { display: none; }
      #attack-cooldown > i {
        display: block; height: 100%; width: 0;
        background: #e6e6e6; border-radius: 2px;
      }
      /* 准星下方的目标名称（批次 181）：口袋里/手机上"这是什么"只能靠它 */
      #target-info {
        position: fixed; left: 50%; top: calc(50% + 24px);
        transform: translateX(-50%);
        z-index: 7; pointer-events: none;
        /* 触摸按住时改由 JS 写 left/top 跟到白圈上方（加 `.pinned` 换锚点） */
        transition: opacity .12s linear;
        padding: 2px 7px;
        background: rgba(0, 0, 0, .42);
        color: #f0f0f0;
        font-size: 12px; line-height: 1.5;
        white-space: nowrap;
        text-shadow: 1px 1px 0 #000;
      }
      #target-info.hidden { display: none; }
      /* 触摸瞄准：标签挂在白圈正上方（半径 46 × 触摸缩放 + 5px 间隙），而不是屏幕中央 */
      #target-info.pinned {
        transform: translate(-50%, calc(-100% - 51px * var(--touch-scale, 1)));
      }

      /* ---------------- 主菜单（批次 109：对齐原版"标题页"的样子） ----------------
         原版基岩版的标题页**没有面板框**：标题 + 一列按钮直接浮在暗色石纹背景上。
         批次 106~108 那版是"一张深色玻璃卡片里装着几颗绿色按钮"，那是现代 UI 的
         语言。这里换成原版的做法：
           · 底 = 暗色 + 8px 像素棋盘格（近似原版那张"石纹"贴图——不为一张背景图
             加几十 KB 资源，PWA 是离线优先的）
           · 标题居中、白字带 2px 深色阴影
           · 按钮 = 标准灰按钮（#8b8b8b 面 + 黑白斜面 + 黑描边 + 白字）
         ⚠️ 去掉面板框顺带解决了"界面太高"：少一层 padding、描边与投影。 */
      #world-screen {
        position: fixed; inset: 0; z-index: 40;
        overflow-x: hidden; overflow-y: auto;
        display: grid; place-items: center; padding: 16px 12px;
        /* 基岩版标题页是全屏世界氛围，不是一块平灰棋盘。这里不用外部图片：
           多层硬边渐变画出远山/草地/天空，离线 PWA 也能稳定显示。 */
        background-color: #637f92;
        background-image:
          linear-gradient(180deg, rgba(12, 23, 32, .12), rgba(6, 12, 8, .70)),
          linear-gradient(153deg, transparent 0 47%, #3d5635 48% 58%, transparent 59%),
          linear-gradient(207deg, transparent 0 52%, #2e4831 53% 66%, transparent 67%),
          linear-gradient(180deg, #769ab0 0 52%, #526c50 53% 69%, #243326 70% 100%);
        background-size: cover;
        color: var(--mc-text-light);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      #world-screen::before {
        content: ''; position: fixed; inset: 0; pointer-events: none;
        background:
          repeating-linear-gradient(90deg, transparent 0 31px, rgba(0,0,0,.05) 32px),
          repeating-linear-gradient(0deg, transparent 0 31px, rgba(0,0,0,.04) 32px);
        mix-blend-mode: multiply;
      }
      #world-screen.hidden { display: none; }
      /* 主菜单的那**一个盒子**（批次 167）。
         ⚠️ 用户反馈："首页两个按钮点击之后应该是弹出来一个固定大小的框，
         而不是当前的一个大一个小。"——根因就是这里给每个视图各写了一套宽度
         （首页 400 / 世界列表 720 / 新建世界 620），而"设置"又是另一对
         `--panel-w/--panel-h`（760×620）。三个尺寸、三副观感。
         现在尺寸**只有一处**：直接吃 `--panel-w/--panel-h`（与设置/配方书/成就同一对），
         于是"点游戏"与"点设置"看到的是同一个盒子，切视图时盒子一动不动。
         ⚠️ 首页刻意**不加框**（用户明确要保留基岩版标题页那种"标题 + 一列按钮"
         的观感）；二级页（世界列表 / 新建世界）与设置用同一副深色框——
         切换时变的只是"框有没有"，尺寸不变。 */
      .world-panel {
        position: relative; z-index: 1;
        width: var(--panel-w); max-width: var(--panel-w);
        height: var(--panel-h); max-height: var(--panel-h);
        padding: 0; font-size: 13px;
        display: flex; flex-direction: column;
        overflow: hidden;
      }
      .world-panel[data-view='worlds'],
      .world-panel[data-view='create'] {
        padding: 14px 16px;
        background: rgba(22, 22, 22, .82);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
      }
      /* 新建世界表单比列表长一点：框的高度不变，超出就在框内滚 */
      .world-panel[data-view='create'] { overflow-y: auto; }
      .world-title {
        position: relative;
        display: flex; flex-direction: column; align-items: center;
        text-align: center; color: #fff;
        /* 收缩到内容宽（批次 167）：标题块不拉满 760px 面板宽，品牌名居中更好看 */
        width: fit-content; align-self: center;
      }
      .world-logo {
        /* 字号同时受宽与高约束（批次 20261024-1455）：横屏矮屏上 8vw 会让 42px 的下限
           也放不下，必须让高参与进来 */
        font-size: clamp(28px, min(8vw, 9vh), 72px); line-height: .85;
        letter-spacing: -2px; color: #e7e7e7;
        -webkit-text-stroke: 2px #161616;
        text-shadow:
          0 3px 0 #8a8a8a,
          0 6px 0 #343434,
          4px 8px 0 rgba(0,0,0,.55);
      }
      .world-edition {
        margin-top: 10px; padding: 3px 10px;
        font-size: 12px; letter-spacing: 2px;
        color: #f5f5f5; background: #446b32;
        border: 2px solid #1d3215;
        text-shadow: 1px 1px 0 #111;
      }
      /* 批次 20261024-1152（用户）：标题右上角那颗 "WebGL2!" splash 去掉，
         对应的样式与无限缩放动画一并删除（不再有节点用它）。 */
      /* ---------------- 主菜单的三个层级（批次 106） ----------------
         同一份 DOM 切成"主页 / 世界列表 / 新建世界"三节，一次只放行一节。
         原来把存档列表 + 四行新建表单 + 设置按钮全摞在一屏里，面板很高、
         手机上得滚；分层之后每一屏都只有三两行，且"返回"永远在同一处。 */
      .world-view { display: none; }
      /* 视图要**撑满那个固定盒子**（批次 167）：盒子高度是固定值，
         所以每一节自己负责"里面怎么排"，而不是让盒子随内容长高。 */
      .world-view.active { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0; }
      /* 首页没有框，内容在盒子正中（否则固定高度下会顶在上面、下面空一大片） */
      /* 首页在矮屏上会"标题被挤出屏幕"（批次 20261024-1455，用户自测）：
         内容比面板高时，`justify-content: center` 会把上下两端一起裁掉——标题首当其冲。
         两条一起改：① 用 `safe center`（装不下就退回从顶部排，不裁开头）；
         ② 兜底允许内部滚动，任何视口都至少能把标题滚回来。 */
      .world-view[data-view='home'].active {
        justify-content: safe center;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* 二级页面顶部：‹ 返回 + 标题 */
      .world-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex: 0 0 auto; }
      .world-nav-title { font-size: 17px; letter-spacing: 1px; color: #fff; }
      .world-back {
        /* 批次 528（用户）：返回键不要占一整行——宽度贴合文字，高度压到 34px */
        font: inherit; font-size: 12px; cursor: pointer; flex: 0 0 auto;
        width: fit-content; min-width: 0; min-height: 30px;
        padding: 4px 9px; background: var(--btn-bg); color: var(--btn-text);
        transition: transform var(--dur-fast) var(--ease);
      }
      /* 主页那几列入口：竖着一列（按钮宽度由 `.world-primary/.world-secondary`
         统一给 320px 居中，见下面那一条） */
      /* 间距跟着视口高度走（批次 20261024-1455）：360 高的横屏手机上 20px + 10px 太奢侈 */
      .world-menu {
        display: flex; flex-direction: column;
        gap: clamp(6px, 1.4vh, 10px);
        margin-top: clamp(6px, 2.5vh, 20px);
        flex: 0 0 auto;
      }
      .world-hint { color: #e0e0e0; font-size: 12px; margin: 10px 0 0; text-align: center; }
      .world-footer {
        margin-top: clamp(6px, 2vh, 20px); text-align: center; font-size: 10px;
        color: rgba(255,255,255,.65);
      }
      /* 当前构建版本（批次 182）：构建时间 + 提交标题。
         等宽字 + 允许换行（提交标题可能很长），并允许选中复制给 AI 排查。 */
      .world-build {
        margin-top: 2px;
        font: 10px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: rgba(255,255,255,.45);
        overflow-wrap: anywhere;
        -webkit-user-select: text;
        user-select: text;
      }
      /* ---------------- 「添加到主屏幕」引导（批次 167） ----------------
         用户要的是"加载时就自动全屏横屏"，而浏览器只允许**用户手势**里请求全屏；
         标签页里唯一零点击的路径是"装成 App"（manifest 已经是 fullscreen + landscape）。
         所以没装的时候在主菜单底下提示一次，点「添加」走浏览器自己的安装框。
         层级 46：压在主菜单（40）之上、设置（50）之下——它不该盖住设置面板。
         ⚠️ 只在 `beforeinstallprompt` 到达时才会挂上来（`ui/InstallHint.ts`），
            iOS Safari 与桌面根本不会出现这一条。 */
      .install-hint {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        z-index: 46; display: flex; align-items: center; gap: 8px;
        max-width: min(94vw, 520px); padding: 8px 10px;
        font-size: 12px; color: var(--mc-text-light);
        background: rgba(22, 22, 22, .92);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .install-hint span { flex: 1 1 auto; min-width: 0; }
      .install-hint button { flex: 0 0 auto; font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer; }
      .world-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
      /* 列表在窄屏/世界多的时候自己滚，别把面板撑破 */
      .world-list { max-height: min(46vh, 300px); overflow-x: hidden; overflow-y: auto; }
      /* 固定盒子之后列表改成"吃掉剩下的高度"（原来是 46vh 封顶，PC 上会在框底留一片空） */
      .world-panel[data-view='worlds'] .world-list { flex: 1 1 auto; min-height: 0; max-height: none; }
      /* 二级页面里"存档"那一行小标题（上面是「＋ 新建世界」主入口）。
         批次 529：去掉原来那条厚重的黑底绿边，改成"文字 + 数量胶囊 + 细线"，
         列表因此显得更轻、更规整。 */
      .world-group-label {
        display: flex; justify-content: space-between; align-items: center;
        margin: 8px 0 2px; padding: 2px 2px 6px; font-size: 12px;
        color: #d8d8d8; letter-spacing: .5px;
        border-bottom: 1px solid rgba(255, 255, 255, .16);
      }
      .world-count {
        color: #e6e6e6; font-size: 10px; line-height: 1.5;
        padding: 0 7px; background: rgba(255, 255, 255, .14);
        border: 1px solid rgba(255, 255, 255, .18);
      }
      .world-empty {
        padding: 18px 12px; text-align: center; color: #b0b0b0; font-size: 12px;
        border: 2px dashed rgba(255, 255, 255, .18);
        background: rgba(0, 0, 0, .18);
      }
      /* 存档卡片：原版是"深色底 + 黑描边 + 一圈内斜面"（凹进去的一块） */
      .world-card {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, .42);
        border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .45), inset -2px -2px 0 rgba(255, 255, 255, .10);
        transition: background var(--dur-fast) var(--ease);
      }
      .world-card:hover { background: rgba(255, 255, 255, .10); }
      .world-card-thumb {
        position: relative; width: 72px; height: 44px; flex: 0 0 auto;
        overflow: hidden; border: 2px solid #111;
        background:
          linear-gradient(180deg, #7297ad 0 52%, #527842 53% 66%, #704d30 67%);
        box-shadow: inset 0 0 0 1px rgba(255,255,255,.20);
      }
      .world-card-thumb::after {
        content: ''; position: absolute; left: 16px; right: 4px; bottom: 0; height: 18px;
        background: #527842; box-shadow: -16px 8px 0 #704d30;
      }
      .world-card-thumb[data-world-type='flat'] {
        background: linear-gradient(180deg, #7297ad 0 62%, #527842 63% 72%, #704d30 73%);
      }
      .world-card-thumb[data-world-type='amplified']::after {
        left: 26px; height: 32px; transform: skew(-30deg);
      }
      .world-card-info { flex: 1; min-width: 0; }
      .world-card-name {
        font-size: 15px; font-weight: 600; color: #fff; line-height: 1.35;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      /* 模式 / 难度 / 类型：三个小标签，扫一眼就知道这是什么世界 */
      .world-card-chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
      .world-chip {
        font-size: 10px; line-height: 1.5; padding: 0 6px;
        color: #d0d0d0; background: rgba(255, 255, 255, .08);
        border: 1px solid rgba(255, 255, 255, .22);
      }
      .world-chip[data-kind='mode'][data-value='creative'] { color: #b8f09a; border-color: #4f8b37; }
      .world-chip[data-kind='mode'][data-value='spectator'] { color: #b9c9ff; border-color: #4a5f9a; }
      .world-chip[data-kind='difficulty'][data-value='peaceful'] { color: #a9d8ff; border-color: #3f6f8a; }
      .world-chip[data-kind='difficulty'][data-value='hard'] { color: #ffb0a6; border-color: #8a3f38; }
      .world-card-stats {
        color: #969696; font-size: 10px; margin-top: 3px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .world-card-actions { display: flex; gap: 4px; flex-shrink: 0; flex-wrap: nowrap; }
      .world-card-actions button, .world-primary, .world-mini, .world-secondary {
        font: inherit; cursor: pointer; padding: 6px 10px;
        transition: transform var(--dur-fast) var(--ease);
      }
      .world-card-actions button { font-size: 12px; padding: 5px 9px; white-space: nowrap; }
      /* 「进入」是这张卡的主操作：绿色面，和三颗灰按钮区分开 */
      .world-card-actions .world-enter {
        color: #fff; background: #3f6f2d;
        border-color: #1f3a16 #8fd06b #8fd06b #1f3a16;
      }
      /*
       * 「开房」（L9）是这张卡的**第二动作**：蓝色面，比「进入」弱一档，
       * 但比编辑/导出/删除明显——它是"用这个世界开一局多人"，不是管理操作。
       */
      .world-card-actions .world-host {
        color: #fff; background: #2f5a7d;
        border-color: #16324a #7fb6dd #7fb6dd #16324a;
      }
      .world-card-actions .world-host:hover { background: #3a6d95; color: #fff; }
      .world-card-actions .world-enter:hover { background: #4a8236; color: #fff; }
      .world-card-actions .world-enter:active {
        background: #355d26;
        border-color: #8fd06b #1f3a16 #1f3a16 #8fd06b;
      }
      /* 「⋯」：编辑 / 导出 / 删除收进这里（L9 方案 A：卡片上只留进入与开房） */
      .world-card-actions .world-more {
        color: #d6d6d6; background: #3a3a3a; border-color: #1a1a1a #6a6a6a #6a6a6a #1a1a1a;
        padding: 5px 8px; line-height: 1;
      }
      .world-card-actions .world-more:hover { background: #4a4a4a; }
      .world-card-extra {
        display: flex; gap: 4px; flex-wrap: wrap;
        margin-top: 6px; padding-left: 2px;
      }
      .world-card-extra.hidden { display: none; }
      .world-card-extra button { font-size: 12px; padding: 5px 9px; white-space: nowrap; }
      /* 世界列表顶部：新建世界 + 加入房间 并排（横屏一行放得下） */
      .world-list-top { display: flex; gap: 6px; align-items: stretch; }
      /* 用户 2026-10-26：两颗入口**等宽**。
         以前「新建世界」是 `flex: 1 1 auto` 铺满、加入房间 `flex: 0 0 auto` 只有文字宽，
         两颗一宽一窄看着像不同层级；而它们其实是同一层（都是"开始一局"）。 */
      .world-list-top > .world-primary,
      .world-list-top > .world-secondary {
        flex: 1 1 0; min-width: 0;
        width: auto; max-width: none;
        align-self: stretch; justify-self: stretch;
        text-align: center; white-space: nowrap;
      }
      /*
       * 用户 2026-10-26：这一排按钮在 PC 上**太高**（52px 只是"手指点得到"，不是"该这么大"）。
       * 压到 36px / 导入存档压到 26px，把高度让给下面的存档列表。
       *
       * ⚠️ 判据用 `(pointer: fine)` 而不是 `body:not(.touch-mode)`：`touch-mode` 是
       * **建触摸操作层时**才挂的（进世界之后），主菜单阶段手机身上也没有这个类——
       * 拿它当判据等于把手机上的 52px 也一起压掉（低于 44px 的最小点按尺寸）。
       */
      @media (pointer: fine) {
        .world-list-top > .world-primary,
        .world-list-top > .world-secondary {
          min-height: 36px; padding: 6px 12px; font-size: 13px;
        }
        .world-import { padding: 3px 9px; font-size: 11px; }
      }
      /* 「加入房间」模式的面板：藏掉只有局内才成立的按钮（开房 / 断开） */
      #multiplayer-screen[data-mode='join'] #mp-host,
      #multiplayer-screen[data-mode='join'] #mp-disconnect { display: none; }
      /* 危险操作 = **红字**（原版没有红色按钮），底还是那颗灰按钮 */
      .world-card-actions button.danger,
      .pause-action.danger { color: var(--mc-text-danger); }
      /* 新建世界表单：**两列并排**（批次 167）。
         用户："创建新世界的时候，每一个栏目的编辑框都太长了，可以适当地去并排。"
         `auto-fit` + 240px 下限：宽盒子（PC / 横屏手机）两列、极窄屏才一列。
         名称｜种子 一排、类型｜难度 一排、模式单独一排，**说明最后、按钮跨满两列**。
         ⚠️ 批次 184：用户手机上的旧规则会在窄屏把"标签"和"输入框"拆成上下两行
         （让 `.world-input` 跨满整行的写法），整个表单因此高出一屏。
         现在**任何宽度都保持"标签 + 输入框同一行"**，靠缩字号/内边距来适配窄屏。 */
      .world-new { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 7px 12px; align-content: start; }
      .world-new > .world-primary { grid-column: 1 / -1; }
      /*
       * 世界表单的行（2026-10-27 第二版）
       *
       * 以前固定的三列 `64 / 1fr / 44`：第三列只有「种子」那行的重新掷色子用得上，
       * 其余行空着一格 → 输入框右边缘比地址行短 44px，整片表单看起来参差。
       * 现在按"这一行有没有尾巴"分三档，列数由类名决定，右边缘一律对齐：
       *   .world-row           两列（标签 + 控件）
       *   .world-row-inline    三列（标签 + 控件 + 一个尾巴，如重新掷色子）
       *   .world-row-address   五列（标签 + 地址 + `:` + 端口 + 选择）
       */
      .world-row {
        display: grid; grid-template-columns: 64px minmax(0, 1fr);
        align-items: center; gap: 6px; min-width: 0;
      }
      .world-row.world-row-inline { grid-template-columns: 64px minmax(0, 1fr) auto; }
      .world-row.world-row-address {
        grid-template-columns: 64px minmax(0, 1fr) auto 62px auto;
      }
      .world-row > span:first-child { text-align: right; }
      .world-row input { min-width: 0; width: 100%; }
      .world-row input.mp-port-input { text-align: center; font-variant-numeric: tabular-nums; }
      .world-row .world-pick { width: 100%; padding: 0 6px; }
      .world-row .mp-colon { color: #cfcfcf; }
      /* 「选择服务器」的引子（用户 2026-10-26）：挂在地址行右侧那一列（44px）。
         用 ▾ 而不是文字——六种语言的"选择"长度差得多，44px 里只有图标不会溢出。 */
      .world-pick { padding: 5px 0; width: 100%; text-align: center; font-size: 12px; line-height: 1; }
      /* 标签右对齐、单行：一列里四项标签的左端不在同一条线上，右端对齐才看得成"一栏" */
      .world-row > span {
        color: #d6d6d6; font-size: 12px; text-align: right;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* 输入框 = 原版文本框：黑底白字 + 灰边框（聚焦时边框转白）
         `color-scheme: dark`（批次 181）：原生 <select> 的下拉列表由系统绘制，
         不声明它就会在白底上弹出一整块白框，与主题完全脱节。 */
      .world-input {
        width: 100%; padding: 7px 9px; font: inherit; font-size: 12px;
        background: var(--field-bg); color: var(--field-text);
        border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .7), inset -2px -2px 0 rgba(255, 255, 255, .14);
        outline: none;
        color-scheme: dark;
      }
      .world-input option { background: #1c1c1c; color: #e0e0e0; }
      /* 世界类型说明（批次 181）：跨满表单两列，警告态转暖红 */
      .world-type-hint {
        grid-column: 1 / -1;
        font-size: 11px; line-height: 1.45; color: #a8a8a8;
        min-height: 16px;
      }
      .world-type-hint.bad { color: #ff9b8a; }
      .world-input:focus { border-color: var(--mc-edge-light); }
      .world-mini { font-size: 12px; }
      /* 主菜单的主按钮：**同宽、居中**（批次 167）。
         盒子统一到 760 宽之后，按钮不能再拉满（那会成一条长条，也不像原版标题页那一列）；
         而首页 / 世界列表 / 新建世界用的是同一列按钮，所以宽度只能有一处——
         `align-self`（flex 列）与 `justify-self`（表单栅格）各管一个方向，两个都写。 */
      .world-primary, .world-secondary {
        width: min(100%, 320px); max-width: 320px;
        align-self: center; justify-self: center;
        /* 高度统一（批次 20261024-1152，用户："首页那几个按钮高度不一致"）。
           以前主按钮与次按钮各写各的 min-height（52 / 44），同一列里一高一矮。
           字号可以不同（主按钮更醒目），但**盒子的高度必须一样**。 */
        min-height: 52px; box-sizing: border-box;
      }
      .world-primary { padding: 9px; font-size: 14px; letter-spacing: 1px; }
      /* 批次 528（用户）：世界列表页的「新建世界」比首页主按钮矮一点，
         把高度让给下面的存档列表；批次 529 起铺满整行，与下面的卡片对齐。 */
      /* 用户 2026-10-26：宽度/高度交给 `.world-list-top > …` 那条共用规则（要和「加入房间」等宽），
         这里只保留"铺满"的语义。 */
      #world-new-button {
        width: auto; max-width: none;
        align-self: stretch; justify-self: stretch;
        text-align: center;
      }
      /* ⚠️ 不再写 `margin-top`：主页那几颗入口的间距交给 `.world-menu` 的 `gap`，
         写了 margin 会在"列表页底部那颗新建键"上多出一截空隙 */
      .world-secondary { padding: 9px; font: inherit; font-size: 13px; }

      /* ---------------- 世界删除确认（批次 528） ----------------
         用户："删除确认弹窗不要用 alert，请用游戏内的弹窗确认。"
         这一层挂在 #world-screen 里（z-index 40 之上），只有两个出口：
         取消 / 删除；点遮罩不关，避免手滑点到外面以为删掉了。 */
      .world-confirm {
        position: fixed; inset: 0; z-index: 45;
        display: flex; align-items: center; justify-content: center;
        padding: 12px; background: rgba(0, 0, 0, .55);
      }
      .world-confirm-panel {
        width: min(90vw, 380px);
        padding: 12px 14px;
        background: rgba(22, 22, 22, .96); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        font-size: 13px; text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .world-confirm-title { font-size: 15px; color: #fff; }
      .world-confirm-message { margin: 8px 0 12px; color: #d8d8d8; line-height: 1.5; }
      .world-confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }
      .world-confirm-actions button {
        font: inherit; font-size: 13px; min-height: 36px; padding: 6px 14px; cursor: pointer;
      }
      .world-confirm-actions button.danger { color: var(--mc-text-danger); }

      /* ---------------- 编辑世界（批次 529） ----------------
         与删除确认同一套遮罩/面板；里面三行：名称 / 游戏模式 / 难度。
         模式与难度在保存时同步进玩家存档，下次进入才生效（提示写在表单里）。 */
      .world-modal {
        position: fixed; inset: 0; z-index: 46;
        display: flex; align-items: center; justify-content: center;
        padding: 12px;
        background:
          radial-gradient(ellipse 62% 46% at 50% 46%, rgba(118, 156, 112, .20), transparent 72%),
          radial-gradient(ellipse 130% 96% at 50% -12%, rgba(0, 0, 0, .55), transparent 64%),
          var(--mc-menu-bg);
      }
      .world-modal-panel {
        width: min(92vw, var(--modal-w)); max-height: min(90dvh, 560px);
        overflow-y: auto; overscroll-behavior: contain;
        padding: 12px 14px;
        background: rgba(22, 22, 22, .97); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        font-size: 13px; text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      /* 标题居中、✕ 钉在右上角（与「加入房间」同一版式，设计图两张图都是这样） */
      .world-modal-header {
        position: relative; display: flex; align-items: center; justify-content: center;
        min-height: 28px; padding-bottom: 8px; margin-bottom: 8px;
        border-bottom: 2px solid rgba(255, 255, 255, .16);
      }
      .world-modal-header b { font-size: 16px; color: #fff; letter-spacing: 1px; }
      .world-modal-close {
        position: absolute; right: 0; top: 0;
        font: inherit; font-size: 13px; line-height: 1;
        min-width: 26px; min-height: 26px; padding: 0 6px; cursor: pointer;
      }
      .world-edit-form { display: flex; flex-direction: column; gap: 6px; }
      .world-edit-hint { font-size: 10px; line-height: 1.45; color: #a8a8a8; margin-top: 2px; }
      /* 开房对话框的校验提示（用户 2026-10-25：房名必填、地址必填）复用同一行，只换颜色 */
      .world-edit-hint.error { color: #ff8a7a; }
      .world-edit-error { font-size: 11px; color: #ff9b8a; }
      .world-edit-error.hidden { display: none; }
      .world-modal-actions {
        display: flex; justify-content: flex-end; gap: 8px;
        margin-top: 12px; padding-top: 10px;
        border-top: 1px solid rgba(255, 255, 255, .14);
      }
      .world-modal-actions button {
        font: inherit; font-size: 13px; min-height: 36px; padding: 6px 14px; cursor: pointer;
      }
      .world-modal-actions .world-edit-save { background: #3f6f2d; color: #fff; }
      .world-modal-actions .world-edit-save:hover { background: #4a8236; color: #fff; }
      /* 「确定并进入」通栏（设计图里它就是一整条大按钮） */
      .world-modal-wide { flex: 1 1 100%; font-size: 14px; min-height: 40px; }
      /* 极窄（竖屏手机）：三颗操作键换到卡片下面一行，名字与标签不再被挤成一条 */
      @media (max-width: 560px) {
        .world-card { flex-wrap: wrap; }
        .world-card-actions { width: 100%; justify-content: flex-end; }
      }

      /* ---------------- 配方书 ---------------- */
      #recipe-book {
        position: fixed; inset: 0; z-index: 20; padding: 18px 12px;
        display: grid; place-items: center; background: rgba(0, 0, 0, .6);
      }
      #recipe-book.hidden { display: none; }
      /* ================================================================
         配方书**嵌在背包的左栏里**（批次 157）
         ================================================================
         以前配方书是"第二个窗口"：宽屏并排（各占半屏）、窄屏整屏盖上来。
         两种都是**把背包挤走**——用户原话："点左边的按钮，界面总是在跳"。
         现在它占的就是背包双栏壳里左栏那一格，栏目对齐、面板尺寸一动不动，
         换的只是左栏里的内容（我的物品 ↔ 配方列表）。
         ⚠️ 整屏那一层（`#recipe-book`）只在"背包没开、单独开配方书"时才显示；
           嵌进左栏时它是 hidden 的，只有 `.recipe-panel` 被搬过去。
         ================================================================ */
      .recipe-panel {
        /* 批次 111：与设置/暂停面板**共用同一套固定尺寸**（用户上一轮要的"统一大小"）
           ——原来配方书是 min(96vw,780px) × 90vh，成就又是另一套，三块面板三个尺寸。 */
        width: var(--panel-w); max-width: var(--panel-w);
        height: var(--panel-h); max-height: var(--panel-h); overflow-y: auto;
        background: var(--panel-bg);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius);
        padding: 12px 14px; color: var(--panel-text); font-size: 13px;
        box-shadow: var(--panel-shadow);
      }
      .recipe-header {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding-bottom: 8px; border-bottom: 2px solid #9a9a9a; margin-bottom: 8px;
      }
      .recipe-header b { font-size: 15px; }
      .recipe-hint { color: #4a4a4a; font-size: 11px; }
      .recipe-search {
        flex: 1; min-width: 160px; padding: 5px 8px; font: inherit; font-size: 12px;
        background: #eee; color: #222; border: 1px solid #777; border-radius: 3px;
      }
      .recipe-close {
        /* 搜索框挪到下面那一行之后，标题栏只剩"标题 + 条数 + 关闭"，
           靠这条把关闭键顶到右端（原来是把搜索框 flex:1 挤过去的） */
        margin-left: auto; font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
        background: #a8a8a8; color: #222; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* ---------------- 搜索框 + 右侧那颗方形筛选按钮（批次 135，对齐截图） ----------------
         基岩版经典 UI 的配方书顶上就是"搜索框 + 右边一颗方形按钮"，那颗按钮是
         「仅显示可合成」的开关（图标是工作台）。原来这颗按钮挂在页签行的右端，
         与截图对不上。 */
      .recipe-controls { display: flex; align-items: center; gap: 6px; margin: 0 0 8px; }
      .recipe-filter {
        flex: 0 0 auto; width: 32px; height: 32px; padding: 0; cursor: pointer;
        display: grid; place-items: center; background: #a8a8a8; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .recipe-filter-icon { width: 18px; height: 18px; image-rendering: pixelated; }

      /* ---------------- 标签栏（批次 133，对齐基岩版；批次 135 改方形） ----------------
         Wiki「物品栏 → 配方书」：基岩版把配方按标签栏展示（建筑 / 装备 / 物品 / 自然 /
         全部），而且"合成配方书的标签栏与创造分类相同"。
         ⚠️ 页签是**只有图标的方块**（截图里那一排）：名字与条数挂在 `title` /
         `aria-label` 上——鼠标悬停看得到、读屏念得出，画面上不占宽度（五个页签都写
         文字，手机上得横向滚才能换栏）。 */
      .recipe-tabs { display: flex; align-items: center; gap: 4px; margin: 0 0 8px; }
      .recipe-tab {
        width: 32px; height: 32px; padding: 0; cursor: pointer;
        display: grid; place-items: center; background: #a8a8a8; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 图标用真实物品（`drawItemIcon` 画的 canvas）；"全部"那一栏是放大镜 SVG */
      .recipe-tab-icon { width: 18px; height: 18px; image-rendering: pixelated; }
      .recipe-tab-icon svg { display: block; width: 16px; height: 16px; }
      /* 文字只留给读屏与悬停（见上面那段），页面上不显示 */
      .recipe-tab-label { display: none; }
      /* 当前页签 / 已打开的筛选：反白 + 斜角翻过来（"按下去"的那一块） */
      .recipe-tab.active, .recipe-filter.on {
        background: #6f6f6f; color: #f2f2f2;
        border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
      }

      /* ---------------- 产物图标网格（批次 135：基岩版就是这一屏方格子） ----------------
         一格一件产物，右下角是数量；材料够的亮着、不够的压暗；点一格 = 材料摆进
         合成格。原来这里是"一条配方一张卡片"（摆法 + 材料 + 按钮），一屏放不下
         几条，与基岩版也对不上。 */
      .recipe-grid {
        /* 格子边长只写一处：触摸端把它抬到 40px（下面那条），列宽会跟着变 */
        --recipe-cell: 34px;
        display: grid; grid-template-columns: repeat(12, var(--recipe-cell)); gap: 3px;
        justify-content: center; align-content: start;
        padding: 6px 4px; background: #c6c6c6; border: 2px solid;
        border-color: #8a8a8a #ffffff #ffffff #8a8a8a;
        border-radius: var(--radius-sm);
      }
      .recipe-cell {
        position: relative; width: var(--recipe-cell, 34px); height: var(--recipe-cell, 34px);
        display: grid; place-items: center;
        background: var(--slot-bg); border: 2px solid;
        border-color: var(--slot-edge-dark) var(--slot-edge-light) var(--slot-edge-light) var(--slot-edge-dark);
        border-radius: var(--slot-radius);
      }
      .recipe-cell canvas { width: 28px; height: 28px; image-rendering: pixelated; }
      /* 生存配方表：背包缺材料的配方用红底，不再只是“灰一点”而看不出原因。 */
      .recipe-cell.locked {
        background: #9b3b35;
        border-color: #cf7770 #54201c #54201c #cf7770;
      }
      .recipe-cell.locked canvas { opacity: .62; filter: grayscale(.35); }
      /* 3×3 要工作台：左上角标一下，免得点不动却不知道为什么 */
      .recipe-cell.needs-table::after {
        content: '3×3'; position: absolute; left: 1px; top: 0;
        font-size: 9px; line-height: 1; color: #ffe9a8; text-shadow: 1px 1px 0 #000;
      }
      /* 能点的一格（批次 132 的主交互）：给"能按下去"的反馈 */
      .recipe-cell.fillable { cursor: pointer; }
      .recipe-cell.fillable:hover { background: var(--slot-bg-hover); box-shadow: inset 0 0 0 2px #ffffffa8; }
      .recipe-cell.fillable:active { transform: translateY(1px); }
      .recipe-cell-count {
        position: absolute; right: 1px; bottom: -1px; font-size: 11px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
      /* 底部说明行：手机上没有鼠标悬停，名字与材料只能靠这一行说出来 */
      .recipe-detail {
        min-height: 17px; margin: 6px 2px 0; font-size: 11px; color: #3f3f3f;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .recipe-empty { grid-column: 1 / -1; padding: 16px 4px; text-align: center; color: #5a5a5a; }
      /* 列数与 `ItemPager.pageSizeFor()` 的页大小一一对应（宽屏 12 列 × 5 行、
         窄屏 8 列 × 4 行）：不一致的话最后一行会出现"半行空位"看着像 bug。
         ⚠️ 判据只能写"宽度 ≤ 900"，与上面那个函数同一个数——写成
         `(max-height: 560px)` 会把"矮而宽的窗口"也算成窄屏，两边就对不上了。 */
      @media (max-width: 900px) {
        .recipe-grid { grid-template-columns: repeat(8, var(--recipe-cell)); }
      }
      .recipe-chip {
        display: inline-flex; align-items: center; gap: 3px;
        padding: 2px 5px; background: #d2d2d2; border-radius: 3px; color: #333; font-size: 11px;
      }
      .recipe-chip.missing { background: #e0b0b0; color: #6b1a1a; }
      .recipe-chip canvas { image-rendering: pixelated; }
      .recipe-chip i { font-style: normal; }
      .recipe-smelting { margin-top: 10px; padding-top: 8px; border-top: 2px solid #9a9a9a; }
      .recipe-smelt-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
      .inv-recipes-btn {
        font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 背包的关闭键（批次 111）——**它原来根本不存在**：手机上唯一的出路是
         "点空白"或 Android 返回手势（很多玩家不知道后者），而用户点名要求
         "不要点击空白关闭，就用关闭按钮"。形状与配方书/成就的关闭键统一。 */
      .inv-close {
        margin-left: auto;
        font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }

      /* 开始遮罩 `#overlay`（"点击进入游戏"）已在批次 111 整块删除：原版没有这一层，
         进去就是世界。原来它上面那份**按键/手势说明**搬到了暂停菜单底部，
         样式改叫 `.pause-help`（`kbd` 的样式保留给那份说明用）。 */
      .settings-panel kbd {
        display: inline-block; padding: 1px 6px;
        background: #ffffff22; border: 1px solid #ffffff44; font-size: 12px;
      }
      .pause-help {
        flex: 0 0 auto; margin: 10px 0 0; padding-top: 8px;
        border-top: 2px solid rgba(255, 255, 255, .14);
        font-size: 11px; line-height: 1.8; color: #a8a8a8; text-align: center;
      }
      /* 触屏提示默认隐藏，桌面键盘提示默认显示；`body.touch-mode` 由主程序按设备加上 */
      .touch-only { display: none; }
      body.touch-mode .touch-only { display: block; }
      body.touch-mode .desktop-only { display: none; }
      #death {
        position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
        /* 红色渐晕：中间还能看清世界，四周压暗（纯色遮罩会把画面糊成一片红） */
        background: radial-gradient(circle at 50% 45%, rgba(140, 0, 0, .28), rgba(80, 0, 0, .72) 75%);
        color: #fff; font-size: 16px;
        text-align: center; line-height: 2; pointer-events: none;
      }
      #death.hidden { display: none; }
      #death b {
        font-size: 30px; display: block; letter-spacing: 6px;
        text-shadow: 0 2px 18px rgba(0, 0, 0, .9);
        animation: death-title var(--dur-med) var(--ease);
      }
      @keyframes death-title {
        from { opacity: 0; transform: scale(1.15); }
        to { opacity: 1; transform: none; }
      }
      /* 死因那一行（批次 207）：标题下面单独一行，别和"正在重生"挤在一起 */
      #death .death-cause {
        display: block; font-size: 14px; line-height: 1.6;
        color: #ffb8b8; letter-spacing: 1px;
      }
      /* 尾句「正在重生…」（批次 619 / Q15）：原来是 `<b>` 后面的裸文本、跟死因同行；
         拆成 span 之后要自己占一行，否则会紧贴死因末尾 */
      #death .death-respawn {
        display: block; margin-top: 6px; font-size: 14px;
        letter-spacing: 1px; opacity: .85;
      }
      /* 睡觉遮罩（B13）：整屏渐暗 + 一排"Zzz"，与死亡遮罩同一个层叠层（z-index 6）。
         不接 pointer-events 的拦截：起床靠跳跃键，不需要点它（点了也不会穿透到世界）。
         ⚠️ 这两个动画不需要自己写 prefers-reduced-motion 分支：文件末尾那条全局规则
         会把所有元素的 animation-duration 压成 0（`#sleep b` 这个循环也一样） */
      #sleep {
        position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 50%, rgba(6, 8, 20, .86), rgba(0, 0, 0, .97) 72%);
        color: #e8e8f4; font-size: 15px;
        text-align: center; line-height: 2.2;
        animation: sleep-fade var(--dur-med) var(--ease);
      }
      #sleep.hidden { display: none; }
      /* 两句话分别由 `.sleep-dawn` / `.sleep-hint` 承载（批次 619 / Q15），
         行内排列即可 —— 原来它们是 `<b>` 后面的裸文本 */
      #sleep .sleep-dawn, #sleep .sleep-hint { display: inline; }
      #sleep b {
        font-size: 30px; display: block; letter-spacing: 10px; margin-bottom: 8px;
        text-shadow: 0 2px 20px rgba(120, 140, 255, .55);
        animation: sleep-zzz 2.4s var(--ease) infinite;
      }
      @keyframes sleep-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sleep-zzz {
        0%, 100% { opacity: .55; transform: translateY(2px); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
      /* 告示牌编辑框（B12，批次 80）：四行输入 + 完成/取消。
         层叠层取 12：要盖住背包（10）与聊天（8），但仍在提示框（60）之下。
         挂 `<body>` 上（与所有面板一致），否则会被 `#overlay` / `#death` 盖住 */
      .sign-editor {
        position: fixed; inset: 0; z-index: 12;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .42);
        /* 批次 184：键盘只缩视觉视口，编辑器要自己让开键盘占的高度 */
        padding-bottom: var(--kb-inset, 0px);
      }
      .sign-editor.hidden { display: none; }
      .sign-editor-panel {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px 16px;
        max-height: calc(100dvh - var(--kb-inset, 0px) - 16px);
        overflow-y: auto;
        min-width: min(360px, 92vw); max-width: 92vw;
        background: var(--panel-bg); color: var(--panel-text);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
      }
      .sign-editor-title { font-size: 14px; font-weight: 600; text-align: center; }
      .sign-editor-rows { display: flex; flex-direction: column; gap: 6px; }
      .sign-editor-row {
        box-sizing: border-box; width: 100%;
        padding: 7px 9px; font: inherit; font-size: 14px;
        color: var(--field-text); background: var(--field-bg);
        border: 2px solid var(--panel-edge-dark); border-radius: var(--slot-radius);
        /* 手机上这四行是唯一的输入面，高度给足（低于 16px 会被 Safari 自动放大页面） */
        min-height: 34px;
      }
      .sign-editor-row:focus { outline: none; background: #ffffff; border-color: #3a7d33; }
      .sign-editor-hint { font-size: 12px; line-height: 1.5; color: var(--panel-text-muted); text-align: center; }
      .sign-editor-buttons { display: flex; gap: 8px; }
      .sign-editor-button {
        flex: 1; padding: 9px 10px; font: inherit; font-size: 14px; cursor: pointer;
        color: var(--btn-text); background: var(--btn-bg);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        min-height: 38px;
      }
      .sign-editor-button:active {
        background: var(--mc-face-hover);
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
      }

      /* 地图阅读界面（批次 196，H16）：一块 canvas + 关闭键。
         与告示牌/书同一套层叠层（12），手机横屏下画布按视口高度收 */
      .map-screen {
        position: fixed; inset: 0; z-index: 12;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .42);
        padding-bottom: var(--kb-inset, 0px);
      }
      .map-screen.hidden { display: none; }
      .map-panel {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 12px 14px;
        max-height: calc(100dvh - var(--kb-inset, 0px) - 16px);
        background: var(--panel-bg); color: var(--panel-text);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
      }
      .map-title { font-size: 14px; font-weight: 600; text-align: center; }
      .map-canvas {
        display: block;
        width: min(64vh, 78vw); height: auto;
        border-radius: var(--slot-radius);
        image-rendering: auto;
      }
      .map-footer {
        font-size: 11px; line-height: 1.4; text-align: center;
        color: var(--panel-text-muted);
      }
      .map-button {
        width: 100%; padding: 9px 10px; font: inherit; font-size: 14px; cursor: pointer;
        color: var(--btn-text); background: var(--btn-bg);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        min-height: 38px;
      }
      .map-button:active {
        background: var(--mc-face-hover);
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
      }
      @media (max-height: 430px) {
        .map-canvas { width: min(58vh, 52vw); }
        .map-panel { gap: 5px; padding: 8px 10px; }
      }

      /* 指南针 / 时钟读数（批次 195，B19）：主手拿着它们时右下角出现一个小表盘。
         不接指针事件（`pointer-events: none`）——它是读数，不是按钮 */
      .tool-hud {
        position: fixed; right: 16px; bottom: 78px; z-index: 6;
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        pointer-events: none; user-select: none;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .5));
      }
      .tool-hud.hidden { display: none; }
      .tool-hud-dial {
        position: relative; box-sizing: border-box;
        width: 52px; height: 52px; border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f2eee2, #cfc7b2 70%, #a89f8c);
        border: 3px solid #6b5a36;
      }
      .tool-hud-tick {
        position: absolute; font-size: 9px; line-height: 1;
        color: #57492c; font-weight: 700;
      }
      .tick-n { top: 2px; left: 50%; transform: translateX(-50%); }
      .tick-s { bottom: 2px; left: 50%; transform: translateX(-50%); }
      .tick-e { right: 3px; top: 50%; transform: translateY(-50%); }
      .tick-w { left: 3px; top: 50%; transform: translateY(-50%); }
      .tool-hud-needle {
        position: absolute; inset: 0;
        /* 指针转起来要跟手，但不能每帧跳：给一点点过渡 */
        transition: transform 80ms linear;
      }
      /* 指针从圆心往"上"画；容器整体旋转 = 绕圆心转 */
      .tool-hud-needle::before {
        content: '';
        position: absolute; left: 50%; bottom: 50%;
        width: 4px; height: 22px; margin-left: -2px;
        background: linear-gradient(#e03b3b 0 50%, #f6f4ec 50% 100%);
        clip-path: polygon(50% 0, 100% 100%, 0 100%);
        transform-origin: 50% 100%;
      }
      /* 时钟：藏掉方位字母，换成"上金下银"两个圆点；指针改成细白针 */
      .tool-hud[data-kind='clock'] .tool-hud-tick { display: none; }
      .tool-hud[data-kind='clock'] .tool-hud-dial {
        background: radial-gradient(circle at 35% 30%, #dfe8f5, #9fb0c8 70%, #6f7f96);
        border-color: #3c4a5e;
      }
      .tool-hud[data-kind='clock'] .tool-hud-needle::before {
        width: 3px; height: 19px; margin-left: -1.5px;
        background: #fffdf2; clip-path: none; border-radius: 2px;
      }
      .tool-hud[data-kind='clock'] .tool-hud-dial::before,
      .tool-hud[data-kind='clock'] .tool-hud-dial::after {
        content: ''; position: absolute; left: 50%;
        width: 6px; height: 6px; margin-left: -3px; border-radius: 50%;
      }
      .tool-hud[data-kind='clock'] .tool-hud-dial::before { top: 3px; background: #f2c14b; }
      .tool-hud[data-kind='clock'] .tool-hud-dial::after { bottom: 3px; background: #e8eef8; }
      .tool-hud-label {
        font-size: 10px; color: #f2efe4; white-space: nowrap;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .75);
      }
      /* 手机横屏（高度很小）：整体缩一号、往上收一点，别压住快捷栏 */
      @media (max-height: 430px) {
        .tool-hud { right: 10px; bottom: 62px; }
        .tool-hud-dial { width: 44px; height: 44px; }
        .tool-hud-needle::before { height: 18px; }
      }

      /* 侧边栏记分板（M23，批次 456）：右上角一小块排行，最多 15 行。
         放在右上而不是左上：左上已经被生命/饥饿占了（VitalsHud）。
         不接指针事件，避免挡住右上角可能出现的按钮 */
      .scoreboard-hud {
        position: fixed; top: 10px; right: 10px; z-index: 12;
        min-width: 108px; max-width: 200px;
        padding: 5px 8px;
        background: rgba(0, 0, 0, .45);
        border-radius: 6px;
        color: #f2efe4;
        font-size: 12px; line-height: 1.45;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .75);
        pointer-events: none;
      }
      .scoreboard-hud.hidden { display: none; }
      .scoreboard-title {
        margin-bottom: 2px;
        font-weight: 700; text-align: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .scoreboard-row { display: flex; justify-content: space-between; gap: 10px; }
      .scoreboard-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .scoreboard-value { color: #ffd75e; font-variant-numeric: tabular-nums; }
      /* 手机横屏：再缩一号（高度只有 360~430，15 行也放得下） */
      @media (max-height: 430px) {
        .scoreboard-hud { top: 6px; right: 6px; font-size: 11px; padding: 4px 6px; }
      }

      /* ---------------- 新手引导卡（引导2，批次 20261022-1954） ----------------
         挂在 `#hud-right` 那一列里（与调试信息/状态效果自动上下排开），
         所以这里只写"长什么样"，不写 fixed 坐标。
         ⚠️ `min(38vw, 320px)` 与 `src/ui/tutorialLayout.ts` 的 0.38 / 320 是同一口径：
            640×360 横屏下暂停三键右边界 361px，卡片左边界 389px，两边不重叠。
            改一处必须改另一处。 */
      /* ⚠️ 必须抬一层（与 `#hotbar` 同一条处方）：触摸端的视角面 `#touch-look`
         铺满全屏、`pointer-events: auto`，而它在 DOM 里排在 `#hud-right` 之后——
         不抬层的话手指点下去命中的是视角面（表现：卡片看得见，但收起键与
         「不再提示」都点不动，反倒把身后的方块挖了）。`position: relative`
         让 z-index 不依赖"flex 子项也适用"这一条浏览器细节。 */
      .tutorial-root { pointer-events: auto; position: relative; z-index: 1; }
      .tutorial-root.hidden { display: none; }
      /* 面板打开时让位：背包/配方书的遮罩是半透明的，底下透出卡片会很乱 */
      .tutorial-root.suppressed { display: none; }
      .tutorial-card, .tutorial-badge {
        background: rgba(20, 20, 20, .9);
        border: 2px solid #4a4a4a; border-radius: 4px;
        color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
        box-shadow: 0 2px 10px rgba(0, 0, 0, .45);
        font-size: 12px; line-height: 1.45;
      }
      .tutorial-card {
        display: flex; align-items: flex-start; gap: 8px;
        /* 第三道 `calc(50vw - 57px)` = 让开屏幕正中的暂停三键：
           41px 半宽 + 8px 右边缘 + 8px 间隙。与 tutorialLayout.ts 的 available 同一口径 */
        max-width: min(38vw, 320px, calc(50vw - 57px)); max-height: 132px;
        padding: 7px 8px;
        overflow: hidden;
      }
      .tutorial-card.hidden, .tutorial-badge.hidden { display: none; }
      .tutorial-icon { width: 26px; height: 26px; flex: none; image-rendering: pixelated; }
      .tutorial-body { min-width: 0; flex: 1 1 auto; }
      .tutorial-label { font-size: 10px; letter-spacing: .4px; color: #a8c8ff; }
      .tutorial-title { font-size: 13px; font-weight: 700; margin-top: 1px; }
      .tutorial-desc { font-size: 11px; color: #dcdcdc; margin-top: 1px; }
      .tutorial-dismiss {
        margin-top: 4px; padding: 2px 6px;
        font: inherit; font-size: 10px; color: #b9b9b9;
        background: transparent; border: 1px solid #555; border-radius: 2px;
      }
      .tutorial-dismiss:active { background: rgba(255, 255, 255, .12); }
      .tutorial-collapse {
        flex: none; width: 22px; height: 22px; padding: 0;
        font: inherit; font-size: 15px; line-height: 1;
        color: #ddd; background: transparent; border: 0;
      }
      .tutorial-badge {
        display: inline-flex; align-items: center; gap: 4px;
        padding: 3px 6px; font-size: 11px;
      }
      .tutorial-badge-icon { width: 20px; height: 20px; image-rendering: pixelated; }
      .tutorial-badge-label { font-variant-numeric: tabular-nums; color: #ffd75e; }
      /* 触摸端：收起键与「不再提示」都要按得到（44px 是平台下限，这里取 32/30，
         因为卡片本身很窄，再大就把说明挤没了） */
      body.touch-mode .tutorial-collapse { width: 32px; height: 32px; font-size: 18px; }
      body.touch-mode .tutorial-dismiss { min-height: 30px; padding: 4px 8px; font-size: 11px; }
      /* 矮横屏（844×390 这类）：说明最多两行，卡片整体再紧凑一点 */
      @media (max-height: 420px) {
        .tutorial-card { padding: 5px 7px; gap: 6px; }
        .tutorial-desc {
          display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
          overflow: hidden; font-size: 10px;
        }
        .tutorial-title { font-size: 12px; }
      }

      /* ---------------- 单机小游戏层（小游戏1，批次 20261022-1954） ----------------
         全屏一层，z-index 30：盖住 HUD / 背包 / 配方书（10~20），低于主菜单（40）。
         小游戏自己的 DOM 挂在 `.minigame-stage` 里，退出时整层清空。 */
      #minigame-layer {
        position: fixed; inset: 0; z-index: 45;
        background: #0b1016;
      }
      #minigame-layer.hidden { display: none; }
      .minigame-stage { position: absolute; inset: 0; touch-action: none; }
      /* 主菜单进入小游戏时，canvas 由主菜单创建并插进 stage（App 内那套用的是主 canvas） */
      .minigame-stage canvas {
        position: absolute; inset: 0; width: 100%; height: 100%;
        display: block;
      }
      .minigame-topbar {
        position: absolute;
        top: calc(8px + env(safe-area-inset-top, 0px));
        left: calc(8px + env(safe-area-inset-left, 0px));
        right: calc(8px + env(safe-area-inset-right, 0px));
        display: flex; align-items: center; gap: 8px;
        /* 高于结算面板（3）：否则 over 显示时连"退出"都点不到 */
        z-index: 4; pointer-events: none;
      }
      .minigame-exit {
        min-height: 40px; padding: 6px 14px;
        font: inherit; font-size: 13px;
        color: #fff; background: rgba(40, 40, 40, .9);
        border: 2px solid #5a5a5a; border-radius: 4px;
        pointer-events: auto;
      }
      .minigame-title { color: #d8e2ec; font-size: 13px; text-shadow: 1px 1px 0 rgba(0, 0, 0, .6); }
      .minigame-toast {
        position: absolute; top: calc(56px + env(safe-area-inset-top, 0px));
        left: 50%; transform: translateX(-50%);
        padding: 6px 12px; border-radius: 4px;
        background: rgba(20, 20, 20, .88); color: #fff;
        font-size: 13px; pointer-events: none;
      }
      .minigame-toast.hidden { display: none; }
      .minigame-fade {
        position: absolute; inset: 0; background: #000;
        opacity: 0; pointer-events: none;
        transition: opacity .35s ease;
      }
      .minigame-fade.show { opacity: 1; }
      .minigame-hint {
        position: absolute;
        bottom: calc(12px + env(safe-area-inset-bottom, 0px));
        left: 50%; transform: translateX(-50%);
        color: #9fb3c8; font-size: 12px; pointer-events: none;
      }

      /*
       * 跳一跳 HUD（批次 20261024-0415 按原版重做）：**只有一个分数**——左上角、深色细体，
       * 没有"最高分"行、没有底部提示。原版游戏里就这些。
       *
       * 字号按视口**高度**给（7.2vh）而不是宽度：用户是横屏手机（约 844×390），
       * 照原版"屏宽 10%"换算会变成 84px，比半个屏幕还高。
       */
      .jump-hud {
        position: absolute;
        /*
         * ⚠️ 必须让开宿主顶栏（`.minigame-topbar`：top 8px + 36px 高的退出按钮，z-index 4）。
         * 曾经写成 `top: 6%`，在横屏 390 高下只有 23px —— 分数正好被"退出"按钮盖住，
         * 而离线和 E2E 都验不到"看不看得见"，只有截图能发现。
         */
        top: calc(56px + env(safe-area-inset-top, 0px));
        left: calc(6% + env(safe-area-inset-left, 0px));
        pointer-events: none;
        z-index: 2;
      }
      .jump-score {
        color: #41454F;
        font-family: -apple-system, "Helvetica Neue", "PingFang SC", Arial, sans-serif;
        font-size: clamp(22px, 7.2vh, 44px);
        font-weight: 300;
        line-height: 1;
        letter-spacing: .02em;
        font-variant-numeric: tabular-nums;
      }
      /*
       * 连击标记（批次 20261024-1331）：贴在分数下方，连中两次以后才出现，
       * 断连击（落到非中心 / 掉下去）当帧就消失。金色是"连击"的信号色，
       * 与波纹最外圈那颗金环同一套语言。
       */
      .jump-combo {
        margin-top: 2px;
        color: #C9922B;
        font-family: -apple-system, "Helvetica Neue", "PingFang SC", Arial, sans-serif;
        font-size: clamp(12px, 3.4vh, 20px);
        font-weight: 500;
        line-height: 1.1;
        letter-spacing: .06em;
        opacity: 0;
        transition: opacity .18s ease;
      }
      .jump-combo.on { opacity: 1; }
      /*
       * 完美命中 / 特殊方块的 `+N` 飘字（批次 20261024-0415）：白色半透明、细体，
       * 从方块上方浮起并淡出。位置由 `scene.ts` 用相机投影算成百分比写进 left/top，
       * 所以这里只需要管"长什么样、怎么动"。
       */
      .jump-float {
        position: absolute;
        transform: translate(-50%, -50%);
        color: rgba(255, 255, 255, .78);
        font-size: clamp(15px, 3.6vmin, 26px);
        font-weight: 300;
        letter-spacing: .04em;
        pointer-events: none;
        z-index: 2;
        animation: jump-float-rise .9s cubic-bezier(.2, .7, .3, 1) forwards;
      }
      @keyframes jump-float-rise {
        0% { opacity: 0; transform: translate(-50%, -35%) scale(.9); }
        25% { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -165%) scale(1.05); }
      }
      /*
       * 结算：原版没有可参照的结算页（参考图 09 是排行榜），所以沿用首页的语言——
       * 白色胶囊按钮 + 深色字、很轻的投影。遮罩做得很淡（原版失败后画面仍然是亮的）。
       */
      .jump-over {
        position: absolute; inset: 0; z-index: 3;
        display: grid; place-items: center;
        padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px)
                 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        background: rgba(28, 30, 40, .22);
        -webkit-backdrop-filter: blur(2px);
        backdrop-filter: blur(2px);
      }
      .jump-over.hidden { display: none; }
      .jump-over-panel {
        display: flex; flex-direction: column; align-items: center;
        min-width: min(58vw, 240px);
        max-width: min(88vw, 420px);
        padding: 14px 22px 16px;
        background: rgba(255, 255, 255, .94);
        border-radius: 16px;
        box-shadow: 0 10px 34px rgba(30, 32, 44, .18);
        color: #2E3242;
        text-align: center;
      }
      .jump-over-title {
        font-size: clamp(11px, 3.2vmin, 14px);
        font-weight: 400; color: #7C8290; letter-spacing: .08em;
      }
      .jump-over-score {
        margin-top: 2px;
        font-size: clamp(32px, 14vmin, 60px);
        font-weight: 300; line-height: 1.05;
        color: #2E3242; font-variant-numeric: tabular-nums;
      }
      .jump-over-best { margin-top: 2px; font-size: clamp(11px, 3.2vmin, 13px); color: #8A8F9C; }
      .jump-over-actions {
        display: flex; gap: 10px; justify-content: center;
        margin-top: 12px; width: 100%;
      }
      .jump-over-actions button {
        flex: 1 1 0; min-height: 40px; padding: 8px 16px;
        font: inherit; font-size: clamp(13px, 3.6vmin, 15px);
        color: #2E3242; background: #FFFFFF;
        border: 0; border-radius: 999px;
        box-shadow: 0 3px 10px rgba(30, 32, 44, .12);
      }
      .jump-over-actions button[data-action="exit"] {
        color: #6C7180; background: rgba(255, 255, 255, .62); box-shadow: none;
      }
      .jump-over-actions button:active { transform: translateY(1px); }

      /* ---------------- 小游戏选择页（小游戏3，批次 20261022-1954） ----------------
         与主菜单同一套深色框；z-index 45（高于主菜单 40、低于设置 50）。
         横屏矮屏靠 max-height + overflow 自滚，不多做一栏。 */
      #minigame-menu {
        position: fixed; inset: 0; z-index: 45;
        display: grid; place-items: center;
        padding: 12px;
        background: rgba(0, 0, 0, .42);
        overflow-y: auto;
      }
      #minigame-menu.hidden { display: none; }
      .minigame-menu-panel {
        width: min(92vw, 560px);
        max-height: calc(100vh - 24px);
        overflow-y: auto;
        padding: 10px 12px;
        background: rgba(22, 22, 22, .96);
        border: 3px solid #4a4a4a; border-radius: 4px;
        color: #fff;
        font-size: 13px;
      }
      .minigame-menu-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
      .minigame-back {
        min-height: 36px; padding: 4px 10px;
        font: inherit; font-size: 13px; color: #fff;
        background: #3a3a3a; border: 2px solid #5a5a5a; border-radius: 3px;
      }
      .minigame-menu-title { font-size: 15px; font-weight: 700; }
      .minigame-games { display: flex; flex-direction: column; gap: 8px; }
      .minigame-game {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px; text-align: left;
        font: inherit; color: inherit;
        background: #2b2b2b; border: 2px solid #4a4a4a; border-radius: 4px;
      }
      .minigame-game canvas { width: 40px; height: 40px; flex: none; image-rendering: pixelated; }
      .minigame-game-text { min-width: 0; }
      .minigame-game-name { font-size: 14px; font-weight: 700; }
      .minigame-game-desc { font-size: 11px; color: #b9c4cf; margin-top: 1px; }
      .minigame-game-count { font-size: 11px; color: #ffd75e; margin-top: 1px; }


      /* 命令方块输入框（批次 477）：一行命令 + 完成/取消。
         与告示牌编辑器同一套布局口径（居中、遮罩、真按钮），只是只有一行 */
      .command-block-editor {
        position: fixed; inset: 0; z-index: 40;
        display: flex; align-items: center; justify-content: center;
        background: rgba(0, 0, 0, .45);
      }
      .command-block-editor.hidden { display: none; }
      .command-block-panel {
        display: flex; flex-direction: column; gap: 10px;
        min-width: 320px; max-width: 540px;
        padding: 14px 16px;
        background: #2b2b33; border-radius: 8px;
        color: #eee; box-shadow: 0 8px 28px rgba(0, 0, 0, .5);
      }
      .command-block-title { font-size: 13px; opacity: .8; }
      .command-block-input {
        font-family: ui-monospace, Menlo, Consolas, monospace;
        font-size: 14px; padding: 8px 10px;
        border-radius: 4px; border: 1px solid #555;
        background: #1c1c22; color: #fff;
      }
      .command-block-buttons { display: flex; justify-content: flex-end; gap: 8px; }
      .command-block-button {
        padding: 6px 14px; border-radius: 4px;
        border: 1px solid #666; background: #3a3a44;
        color: #eee; cursor: pointer; font-size: 13px;
      }
      .command-block-button.primary { background: #4c8d3a; border-color: #5ea646; }

      /* 书与笔 / 成书（批次 190，H16）：一页文本 + 翻页 + 完成/署名。
         与告示牌编辑器同一套写法与层叠层（12，盖住背包、在提示框之下）。
         手机横屏是主场景：面板高度封顶、文本区自己滚，按钮固定在底部 */
      .book-screen {
        position: fixed; inset: 0; z-index: 12;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .42);
        padding-bottom: var(--kb-inset, 0px);
      }
      .book-screen.hidden { display: none; }
      .book-panel {
        display: flex; flex-direction: column; gap: 8px;
        padding: 12px 14px;
        width: min(420px, 92vw);
        max-height: calc(100dvh - var(--kb-inset, 0px) - 16px);
        background: var(--panel-bg); color: var(--panel-text);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
      }
      .book-title { font-size: 14px; font-weight: 600; text-align: center; }
      .book-page-input {
        box-sizing: border-box; width: 100%; height: 46dvh; min-height: 96px;
        padding: 8px 10px; font: inherit; font-size: 14px; line-height: 1.45;
        color: var(--field-text); background: #f6f1dc;
        border: 2px solid var(--panel-edge-dark); border-radius: var(--slot-radius);
        resize: none;
      }
      .book-page-input:focus { outline: none; border-color: #3a7d33; }
      .book-page-read {
        box-sizing: border-box; width: 100%; height: 46dvh; min-height: 96px;
        padding: 10px 12px; font-size: 14px; line-height: 1.5;
        color: #2a2318; background: #f6f1dc;
        border: 2px solid var(--panel-edge-dark); border-radius: var(--slot-radius);
        white-space: pre-wrap; word-break: break-word; overflow-y: auto;
      }
      .book-page-read.hidden, .book-page-input.hidden { display: none; }
      .book-pager {
        display: flex; align-items: center; justify-content: space-between; gap: 8px;
        font-size: 13px; color: var(--panel-text-muted);
      }
      .book-pager .book-button { flex: 0 0 44px; min-height: 34px; padding: 4px 0; }
      .book-page-label { flex: 1; text-align: center; }
      .book-sign-row { display: flex; gap: 8px; }
      .book-sign-row.hidden { display: none; }
      .book-title-input {
        flex: 1; box-sizing: border-box; min-height: 34px; padding: 6px 9px;
        font: inherit; font-size: 14px; color: var(--field-text); background: var(--field-bg);
        border: 2px solid var(--panel-edge-dark); border-radius: var(--slot-radius);
      }
      .book-buttons { display: flex; gap: 8px; }
      .book-button {
        flex: 1; padding: 9px 10px; font: inherit; font-size: 14px; cursor: pointer;
        color: var(--btn-text); background: var(--btn-bg);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        min-height: 38px;
      }
      .book-button:disabled { opacity: .45; }
      .book-button:active:not(:disabled) {
        background: var(--mc-face-hover);
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
      }
      .book-button.hidden { display: none; }

      /* 信标界面（K5，批次 117）：主效果一行 + 次级效果一行，**点一下就生效**。
         与告示牌编辑器同一套写法（DOM 在 TS 里建、样式在这儿、Esc 收起） */
      .beacon-screen {
        position: fixed; inset: 0; z-index: 12;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .42);
      }
      .beacon-screen.hidden { display: none; }
      .beacon-screen-panel {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px 16px;
        min-width: min(420px, 92vw); max-width: 92vw;
        background: var(--panel-bg); color: var(--panel-text);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
      }
      .beacon-screen-title { font-size: 14px; font-weight: 600; text-align: center; }
      .beacon-screen-summary { font-size: 12px; text-align: center; color: var(--panel-text-muted); }
      /* 没有金字塔时把那行字染暖一点：玩家第一眼要看到的是"它现在不工作" */
      .beacon-screen-summary-off { color: #d08a6a; }
      .beacon-screen-caption { font-size: 12px; color: var(--panel-text-muted); margin-bottom: 4px; }
      .beacon-screen-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .beacon-screen-button {
        padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer;
        color: var(--btn-text); background: var(--btn-bg);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        min-height: 36px;
      }
      .beacon-screen-button:active {
        background: var(--mc-face-hover);
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
      }
      /* 够不到的能力置灰（原版也是灰的）：点不动比"点了没反应"清楚 */
      .beacon-screen-button:disabled { opacity: .45; cursor: default; }
      .beacon-screen-button-on { background: #3a7d33; color: #fff; }
      .beacon-screen-hint { font-size: 12px; line-height: 1.5; color: var(--panel-text-muted); }
      .beacon-screen-done { margin-top: 2px; }

      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 35%, #14181f, #07080a 70%);
        color: #c8c8c8; font-size: 14px;
        text-align: center;
      }
      /* 不确定进度条：世界生成没有可靠的总进度，只好用"一直在走"的条纹
         （比一个假的百分比诚实） */
      #loading::after {
        content: ''; position: absolute; left: 50%; bottom: 34%;
        width: min(220px, 56vw); height: 4px; transform: translateX(-50%);
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        background-size: 60% 100%; background-repeat: no-repeat;
        border-radius: 2px;
        animation: loading-sweep 1.4s var(--ease) infinite;
      }
      @keyframes loading-sweep {
        from { background-position: -60% 0; }
        to { background-position: 160% 0; }
      }

      /* ---------------- 首屏启动遮罩（用户："加载的中间是个加号，改成转圈圈"） ----------------
         那个"加号"不是加载图标，是 `#hud` 里的准星（`#crosshair` 的两条白线）：它跟着 HTML
         一起解析、CSS 一生效就落在屏幕正中，而模块脚本还在下载/执行——于是首屏那几百
         毫秒看起来像"一张只有加号的空页面"。

         这一层**必须静态写在 HTML 里**（由 JS 创建的话，正是要被盖住的那段时间没东西盖），
         转圈纯 CSS、不依赖脚本。走到主菜单或判定设备不支持时由 JS 整块 remove。

         ⚠️ 与 `#loading` 是两个东西：
           · `#boot-loading` = 应用启动（脚本 / 图集 / 存档清单），文案"加载中…"
           · `#loading`      = 真的在生成一个世界，文案"正在生成世界…"（批次 167 起按需创建）
         z-index 60：压住主菜单(40) / 设置(50) / 回前台层(55)，但**低于**竖屏提示与
         不支持提示(90)——手机上竖屏打开时应该先看见"请横屏"。 */
      #boot-loading {
        position: fixed; inset: 0; z-index: 60;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 12px;
        background: radial-gradient(circle at 50% 35%, #14181f, #07080a 70%);
        color: #c8c8c8; font-size: 14px; text-align: center;
        cursor: progress;
      }
      /* 转圈：一圈暗环 + 一段高亮弧（整圈同色的话转起来看不出在动） */
      .boot-spinner {
        width: 34px; height: 34px; box-sizing: border-box;
        border: 3px solid rgba(255, 255, 255, .16);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: boot-spin .9s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      .boot-text { letter-spacing: 1px; }
      /* 不确定进度条（与 `#loading` 那条同一套动画）：启动没有可靠的总进度，
         用"一直在走"的一条比一个假的百分比诚实 */
      .boot-bar {
        width: min(180px, 46vw); height: 3px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        background-size: 60% 100%; background-repeat: no-repeat;
        animation: loading-sweep 1.4s var(--ease) infinite;
      }
      .boot-sub { font-size: 11px; color: #7d848f; }
      /* 启动失败：停住转圈、换成一句能看懂的话（别让它假装还在加载） */
      #boot-loading.failed .boot-spinner {
        animation: none;
        border-color: rgba(255, 255, 255, .16);
        border-top-color: var(--danger);
      }
      #boot-loading.failed .boot-bar { display: none; }
      #boot-loading.failed .boot-text { color: var(--danger); }

      #hotbar {
        position: absolute; left: 50%; transform: translateX(-50%);
        /* 底部安全区：刘海屏/全面屏的"home 横条"会盖住贴边的 UI */
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex; gap: var(--hotbar-gap); padding: var(--hotbar-pad);
        /* 批次 228：**只改外观**，交互保持旧的"点一格换手持槽"。
           外观与背包底部那排对齐：灰框 + 像素斜面 + 无圆角。 */
        background: var(--panel-bg);
        border: 3px solid;
        border-color: var(--pixel-bevel);
        border-radius: 0;
        box-shadow: var(--panel-shadow);
      }
      #hotbar .slot {
        position: relative; width: var(--hotbar-slot); height: var(--hotbar-slot);
        display: grid; place-items: center;
        /* 批次 228：槽位也换成背包那套灰底 + 像素斜面（只改外观） */
        background: var(--slot-bg);
        border: 2px solid;
        border-color: var(--pixel-bevel);
        border-radius: 0;
        transition: background var(--dur-fast) var(--ease), transform var(--dur-med) var(--ease),
                    box-shadow var(--dur-med) var(--ease);
      }
      #hotbar .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
      /* 选中格：抬起来 + 一圈柔光（原版是"边框变白 + 轻微放大"，这里让它在深色底上更醒目） */
      #hotbar .slot.active {
        border-color: #fff;
        background: rgba(255, 255, 255, .26);
        transform: translateY(-2px) scale(1.08);
        box-shadow: 0 0 12px rgba(255, 255, 255, .45), 0 2px 6px rgba(0, 0, 0, .5);
      }
      #hotbar .slot .index {
        position: absolute; top: 0; left: 3px; font-size: 10px; color: #fff;
        text-shadow: 1px 1px 0 #000; opacity: .7;
      }
      #hotbar .slot.active .index { opacity: 1; }

      /* ⚠️ 触摸端必须让快捷栏**能点**（批次 95）。
         `#hud` 是 pointer-events: none，而触摸操作层的"视角面"（#touch-look，铺满全屏）
         在 DOM 里排在快捷栏之后——两者叠在一起时手势会落到视角面上：
         表现是"点快捷栏没反应，反而在身后挖了一块方块"，而 `bindHotbarTouch()`
         那句绑定从来没被触发过（离线断言也查不到，因为它只读 DOM 不看命中）。
