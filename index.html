<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale + user-scalable=no：禁止双指缩放，否则游戏画面会被误缩放
         viewport-fit=cover：让页面铺满刘海屏，配合 env(safe-area-inset-*) 排布触摸控件 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- 手机上以全屏应用的方式运行（加到主屏后隐藏浏览器地址栏） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0b0b0b" />
    <title>Bedrock 1.18 Web</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <!-- PWA：可安装到主屏、离线可用（K8） -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <style>
      /* ================================================================
         设计令牌（批次 28 界面美化）
         ================================================================
         为什么要有这一层：这些值原来手写在二十多个地方（同一个面板底色写成
         `#c6c6c6`、`#c8c8c8`、`#bfbfbf` 三种），改一次要翻整个文件，
         而且必然出现"这个面板比那个亮一点"这种说不清哪不对的差别。
         现在**色值只在这里出现一次**，组件只引用 `var(--…)`。

         ⚠️ 两条约定：
          - 稀有度四色与 `core/registry/itemVisuals.ts` 是同一套语义（那边算档位、
            这边给颜色），改色只改这里；
          - 时长统一走 `--dur-*`，`prefers-reduced-motion` 里把它们压成 0
            （前庭功能敏感的人不该被动画晃到）。
         */
      :root {
        /* ================================================================
           原版调色板（批次 109）
           ================================================================
           用户反馈"像素风这个配色和颜色好像也不太对"。对照原版反推出来的那套值，
           问题很清楚：批次 108 做的是**现代深色 UI + 绿色按钮**，而原版（Java 与
           基岩是同一套）里**一个绿色按钮都没有**——绿色只出现在"按下反馈"和
           合成槽位上。原版的每个控件都是这四个颜色拼出来的：

             面板面        #c6c6c6   经典 GUI 灰（物品栏/对话框就是它）
             斜面高光      #ffffff   左上那一条
             斜面阴影      #555555   右下那一条
             外描边        #000000   1px 纯黑，每个控件都有
             槽位/按钮面   #8b8b8b
             文字（浅底）  #3f3f3f   （深底）#e0e0e0
             文字阴影      #3f3f3f   原版规则：文字色 × 25%
             悬停文字      #ffffa0   ⚠️ 原版是**文字变黄**，不是整块变色
             禁用文字      #a0a0a0

           ⚠️ 下面这些 `--panel-*` / `--btn-*` 是批次 28 起就在用的**旧名字**，
           为了不动上百处引用，这里只把值换成原版色（名字与语义一一对应）。
           ================================================================ */
        --mc-panel: #c6c6c6;
        --mc-face: #8b8b8b;
        --mc-face-hover: #a0a0a0;
        --mc-face-down: #6c6c6c;
        --mc-edge-light: #ffffff;
        --mc-edge-dark: #555555;
        --mc-outline: #000000;
        --mc-text: #3f3f3f;
        --mc-text-light: #e0e0e0;
        --mc-text-hover: #ffffa0;
        --mc-text-disabled: #a0a0a0;
        --mc-text-shadow: #3f3f3f;
        /* 深色界面（主菜单 / 暂停菜单 / 设置）的底：原版是"世界 + 半透明黑"。
           这里给一个近似的深灰，真正的背景噪点写在 `#world-screen` / `#settings-screen` 上 */
        --mc-menu-bg: #232323;
        --mc-menu-overlay: rgba(0, 0, 0, .58);

        /* ---- 暂停/设置面板的**固定尺寸**（批次 110） ----
           用户要求"不管手机还是 PC，设置界面都是固定宽高、统一大小的"。
           尺寸只在这两个变量里出现一次，暂停菜单页与设置页**共用**——
           之前两页各写一套宽度，切页时面板会跳大小。
           ⚠️ 仍用 `min(vw, 上限)` 而不是写死像素：手机上要收进视口，
              "固定"指的是不随内容/页签变化（四周留出的一圈就是游戏区域）。 */
        /* ⚠️ 上限不能太小：用户要的是"覆盖在游戏界面上、只留**一点点**外部游戏区域"。
           640px 在 1440 宽的 PC 上会留下 70% 的游戏区域，那不是"一点点"。
           760 × 620 在三个典型视口下的边距：
             PC 1440×900   → 340 / 140px（约 24% / 16%）
             手机横屏 844×390 → 42 / 23px（5% / 6%）
             手机竖屏 430×932 → 13 / 156px（受 vw/vh 限制，面板仍收得进屏幕） */
        --panel-w: min(94vw, 760px);
        --panel-h: min(88vh, 620px);

        /* ---- 面板 ---- */
        --panel-bg: var(--mc-panel);
        --panel-bg-dark: var(--mc-menu-bg);
        --panel-rivet: #8a8a8a;
        --panel-edge-light: var(--mc-edge-light);
        --panel-edge-dark: var(--mc-edge-dark);
        --panel-text: var(--mc-text);
        --panel-text-muted: #5a5a5a;
        /* 原版面板**没有投影**，只有那 1px 黑描边 + 两色斜面；
           这里保留一圈 2px 硬描边（面板浮在世界画面上，需要一条分界线） */
        --panel-shadow: 0 0 0 2px var(--mc-outline);
        --panel-radius: 0;

        /* ---- 像素斜角（批次 108） ----
           原版 GUI 里**没有一个圆角、也没有柔和投影**：面板与按钮都是直角，
           四周是一圈"左上亮、右下暗"的硬边，按下去时斜角翻过来（像被按进去）。
           这两个变量就是那圈斜角的四边颜色，用法：`border-color: var(--pixel-bevel)`。
           ⚠️ 直角是靠把下面那几个 `--*-radius` 全设成 0 实现的，**不要**在这里写
           `border-radius: 0 !important`——触摸端那几颗圆形按钮、准星、血条图标
           本来就是圆的，一刀切会把它们也压成方块。 */
        --pixel-bevel: var(--panel-edge-light) var(--panel-edge-dark) var(--panel-edge-dark) var(--panel-edge-light);
        /* 深色**面板**（主菜单 / 暂停菜单的框）用灰阶斜角：亮边 #4a4a4a、暗边近黑。
           ⚠️ 深色底上的**按钮**不用这套——原版在深色菜单上放的仍然是标准灰按钮，
           所以下面 `--btn-*` 那一套是全场景通用的。 */
        --pixel-bevel-dark: #4a4a4a #0d0d0d #0d0d0d #4a4a4a;
        /* 危险操作（删除世界）用的是**红字**而不是红底：原版没有红色按钮 */
        --mc-text-danger: #ff5555;

        /* ---- 槽位 ---- */
        --slot-bg: var(--mc-face);
        --slot-bg-hover: var(--mc-face-hover);
        --slot-edge-light: #ffffff;
        --slot-edge-dark: #373737;
        --slot-radius: 0;

        /* ---- 按钮 ----
           ⚠️ 原版**没有"主色按钮"**：主菜单的"游戏"和"设置"长得一模一样，
           危险操作靠红字区分。批次 108 那套"绿色渐变主按钮"是现代 UI 的语言，
           不是原版的（绿色在原版里只用于按下反馈与合成槽位）。 */
        --btn-bg: var(--mc-face);
        --btn-bg-down: var(--mc-face-down);
        --btn-primary: var(--mc-face);
        --btn-primary-down: var(--mc-face-hover);
        --btn-danger: var(--mc-face);
        --btn-danger-down: var(--mc-face-hover);
        --btn-text: var(--mc-text-light);
        --btn-radius: 0;
        /* 界面上唯一保留的绿色：聊天发送键（那本来就是本项目自己加的按钮） */
        --btn-send: #3a7d33;
        --btn-send-down: #2f6629;

        /* ---- 输入框 ----
           原版的文本框是**黑底白字 + 灰边框**（不是浅色输入框），填种子时也是这个 */
        --field-bg: #000000;
        --field-bg-dark: #000000;
        --field-text: var(--mc-text-light);
        --field-text-dark: var(--mc-text-light);

        /* ---- HUD（深色半透明，压在 3D 画面上） ---- */
        --hud-bg: linear-gradient(rgba(16, 17, 21, .62), rgba(8, 9, 12, .74));
        --hud-border: rgba(255, 255, 255, .16);
        --hud-shadow: 0 4px 16px rgba(0, 0, 0, .45);
        --hud-inner: inset 0 1px 0 rgba(255, 255, 255, .12);

        /* ---- 耐久条三档（与 `itemVisuals.durabilityLevel` 对应） ---- */
        --dur-high: #4ce04c;
        --dur-mid: #e8d24c;
        --dur-low: #e0503c;

        /* ---- 稀有度四色（与 `itemVisuals.RARITY_ORDER` 对应） ---- */
        --rarity-common: #ffffff;
        --rarity-uncommon: #ffff55;
        --rarity-rare: #55ffff;
        --rarity-epic: #ff55ff;

        /* ---- 强调色 ---- */
        --accent: #7dc46b;
        --accent-dim: #8fb98a;
        --warn: #e8d24c;
        --danger: #ff8a7a;

        /* ---- 圆角与时长 ----
           ⚠️ 三个圆角全为 0（批次 108）：这是"像素风"最省事也最有效的一刀——
           所有走令牌的面板/卡片/按钮/槽位瞬间变成直角，不必逐个去改字面量。 */
        --radius-sm: 0;
        --radius-md: 0;
        --radius-lg: 0;
        --dur-fast: .12s;
        --dur-med: .22s;
        --ease: cubic-bezier(.2, .7, .3, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; overflow: hidden; background: #000;
        /* 手机上必须关掉浏览器自带的滚动/下拉刷新/双击缩放，否则拖动视角会连带滚页面 */
        touch-action: none; overscroll-behavior: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none;
      }
      body {
        /* 等宽字体打底（像素感、数字对齐），中文回退到系统黑体——
           否则中文会落到某个衬线/异体字上，与英文的观感完全割裂 */
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'PingFang SC', 'Microsoft YaHei', monospace;
        -webkit-font-smoothing: antialiased;
      }

      /* 键盘操作必须能看出焦点在哪（此前完全没有：Tab 一圈不知道停在哪） */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      /* 面板内滚动条：默认的白色粗条在灰色面板上非常突兀 */
      .inv-panel, .recipe-panel, .settings-panel, .world-panel, .adv-panel, #inv-creative {
        scrollbar-width: thin;
        scrollbar-color: #7a7a7a transparent;
      }
      .inv-panel::-webkit-scrollbar, .recipe-panel::-webkit-scrollbar,
      .settings-panel::-webkit-scrollbar, .world-panel::-webkit-scrollbar,
      .adv-panel::-webkit-scrollbar {
        width: 8px;
      }
      .inv-panel::-webkit-scrollbar-thumb, .recipe-panel::-webkit-scrollbar-thumb,
      .settings-panel::-webkit-scrollbar-thumb, .world-panel::-webkit-scrollbar-thumb,
      .adv-panel::-webkit-scrollbar-thumb {
        background: #7a7a7a; border-radius: 4px;
      }
      /* 层级约定（从小到大）：遮罩(5) < 死亡(6) < 背包(10) < 配方书(20) < 主菜单(40) < 设置(50)。
         ⚠️ #app 刻意**不给** z-index：所有面板都要挂在 <body> 上（而不是 #app 里面），
         否则 z-index 只在 #app 这个层叠上下文内部比较，面板会被 DOM 更靠后的遮罩盖住。 */
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed; inset: 0; pointer-events: none;
        color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
      }
      #debug {
        position: absolute; top: 8px; left: 8px;
        font-size: 12px; line-height: 1.55; white-space: pre;
        background: rgba(0, 0, 0, .35); padding: 6px 9px; border-radius: 3px;
      }
      #crosshair {
        position: absolute; left: 50%; top: 50%;
        width: 20px; height: 20px; transform: translate(-50%, -50%);
        opacity: .85; mix-blend-mode: difference;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: #fff;
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }

      /* ---------------- 主菜单（批次 109：对齐原版"标题页"的样子） ----------------
         原版基岩版的标题页**没有面板框**：标题 + 一列按钮直接浮在暗色石纹背景上。
         批次 106~108 那版是"一张深色玻璃卡片里装着几颗绿色按钮"，那是现代 UI 的
         语言。这里换成原版的做法：
           · 底 = 暗色 + 8px 像素棋盘格（近似原版那张"石纹"贴图——不为一张背景图
             加几十 KB 资源，PWA 是离线优先的）
           · 标题居中、白字带 2px 深色阴影
           · 按钮 = 标准灰按钮（#8b8b8b 面 + 黑白斜面 + 黑描边 + 白字）
         ⚠️ 去掉面板框顺带解决了"界面太高"：少一层 padding、描边与投影。 */
      #world-screen {
        position: fixed; inset: 0; z-index: 40;
        overflow-x: hidden; overflow-y: auto;
        display: grid; place-items: center; padding: 16px 12px;
        background-color: var(--mc-menu-bg);
        background-image: repeating-conic-gradient(#2b2b2b 0% 25%, #262626 0% 50%);
        background-size: 8px 8px;
        color: var(--mc-text-light);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      #world-screen.hidden { display: none; }
      /* 标题页那一片：**没有边框、没有底色**，只有内边距。
         ⚠️ 宽度是个"按钮尺寸"问题（批次 111，用户："首页的按钮要对齐，符合正常的
         按钮大小"）：原来首页按钮被单独收窄到 280px（横屏 240px），而二级页面的按钮
         是满宽（面板 520px）——同一套菜单里两页按钮宽度不同，看着就是"没对齐"。
         现在面板收窄到 360px（接近原版标题页那一列的宽度），**首页与二级页的所有
         按钮都满宽**，左边缘也和存档卡片对齐。 */
      .world-panel { width: min(92vw, 360px); padding: 0; font-size: 13px; }
      .world-title {
        display: block; text-align: center;
        font-size: 24px; letter-spacing: 2px; color: #fff;
        text-shadow: 2px 2px 0 var(--mc-text-shadow);
      }
      /* ---------------- 主菜单的三个层级（批次 106） ----------------
         同一份 DOM 切成"主页 / 世界列表 / 新建世界"三节，一次只放行一节。
         原来把存档列表 + 四行新建表单 + 设置按钮全摞在一屏里，面板很高、
         手机上得滚；分层之后每一屏都只有三两行，且"返回"永远在同一处。 */
      .world-view { display: none; }
      .world-view.active { display: flex; flex-direction: column; }
      /* 二级页面顶部：‹ 返回 + 标题 */
      .world-nav { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
      .world-nav-title { font-size: 17px; letter-spacing: 1px; color: #fff; }
      .world-back {
        font: inherit; font-size: 12px; cursor: pointer; flex: 0 0 auto;
        padding: 6px 10px; background: var(--btn-bg); color: var(--btn-text);
        transition: transform var(--dur-fast) var(--ease);
      }
      /* 主页那几列入口：竖着一列、**满宽**（批次 111：不再单独收窄，
         否则和二级页面的按钮对不齐——面板本身已经只有 360px 了） */
      .world-menu { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
      .world-hint { color: #a8a8a8; font-size: 12px; margin: 6px 0 0; text-align: center; }
      .world-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
      /* 列表在窄屏/世界多的时候自己滚，别把面板撑破 */
      .world-list { max-height: min(46vh, 300px); overflow-x: hidden; overflow-y: auto; }
      /* 二级页面里"存档"那一行小标题（上面是「＋ 新建世界」主入口） */
      .world-group-label {
        margin: 12px 0 6px; padding-top: 8px; font-size: 12px;
        color: #a8a8a8; letter-spacing: 1px;
        border-top: 2px solid rgba(255, 255, 255, .14);
      }
      .world-empty {
        padding: 12px; text-align: center; color: #a8a8a8;
        border: 2px dashed rgba(255, 255, 255, .22);
      }
      /* 存档卡片：原版是"深色底 + 黑描边 + 一圈内斜面"（凹进去的一块） */
      .world-card {
        display: flex; align-items: center; gap: 10px;
        padding: 8px 10px;
        background: rgba(0, 0, 0, .42);
        border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .45), inset -2px -2px 0 rgba(255, 255, 255, .10);
        transition: background var(--dur-fast) var(--ease);
      }
      .world-card:hover { background: rgba(255, 255, 255, .10); }
      .world-card-info { flex: 1; min-width: 0; }
      .world-card-name { font-size: 14px; color: #fff; }
      .world-card-meta {
        color: #a8a8a8; font-size: 11px; margin-top: 2px;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .world-card-actions { display: flex; gap: 6px; flex-shrink: 0; }
      .world-card-actions button, .world-primary, .world-mini, .world-secondary {
        font: inherit; cursor: pointer; padding: 6px 10px;
        transition: transform var(--dur-fast) var(--ease);
      }
      /* 危险操作 = **红字**（原版没有红色按钮），底还是那颗灰按钮 */
      .world-card-actions button.danger,
      .pause-action.danger { color: var(--mc-text-danger); }
      .world-new { display: flex; flex-direction: column; gap: 8px; }
      .world-row { display: grid; grid-template-columns: 68px 1fr 52px; align-items: center; gap: 8px; }
      /* 输入框 = 原版文本框：黑底白字 + 灰边框（聚焦时边框转白） */
      .world-input {
        width: 100%; padding: 7px 9px; font: inherit; font-size: 12px;
        background: var(--field-bg); color: var(--field-text);
        border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .7), inset -2px -2px 0 rgba(255, 255, 255, .14);
        outline: none;
      }
      .world-input:focus { border-color: var(--mc-edge-light); }
      .world-mini { font-size: 12px; }
      .world-primary { padding: 9px; font-size: 14px; letter-spacing: 1px; }
      /* ⚠️ 不再写 `margin-top`：主页那几颗入口的间距交给 `.world-menu` 的 `gap`，
         写了 margin 会在"列表页底部那颗新建键"上多出一截空隙 */
      .world-secondary { width: 100%; padding: 9px; font: inherit; font-size: 13px; }

      /* ---------------- 配方书 ---------------- */
      #recipe-book {
        position: fixed; inset: 0; z-index: 20; padding: 18px 12px;
        display: grid; place-items: center; background: rgba(0, 0, 0, .6);
      }
      #recipe-book.hidden { display: none; }
      /* ================================================================
         经典 UI：配方书与背包**并排**（批次 134）
         ================================================================
         用户给的截图是基岩版**经典 UI**：左边配方书、右边玩家物品栏，两块并排，
         谁也不盖谁。我们原来是"配方书整屏盖在背包上"——那是基岩版的**携带版 UI**
         （手机上就是它，Wiki 里两种都写了）。
         所以按基岩版自己的规则切换：**屏幕放得下就并排，放不下退回整屏**。
         判据全在媒体查询里（1280px ≈ 600 的配方书 + 约 460 的背包 + 两侧留边），
         窄屏下 `body.split-ui` 这个类等于没写。
         ⚠️ 两块面板各是一层 `inset: 0` 的整屏遮罩，所以"并排"必须把它们**真的分成
           左右两半**（各自覆盖一半），否则上面那层遮罩会把下面那半边的点击全吃掉。
         ================================================================ */
      @media (min-width: 1280px) {
        body.split-ui #recipe-book {
          right: auto; width: 52%;
          /* 两块遮罩挨在一起，压暗的深浅要一致，否则中间会显出一道缝 */
          background: rgba(0, 0, 0, .55);
        }
        body.split-ui #inventory-screen { left: auto; width: 48%; }
        /* 并排时它是"侧栏"而不是对话框：收窄到 600，高度沿用同一套令牌 */
        body.split-ui .recipe-panel {
          width: min(100%, 600px); max-width: 600px;
          height: var(--panel-h); max-height: var(--panel-h);
        }
      }
      .recipe-panel {
        /* 批次 111：与设置/暂停面板**共用同一套固定尺寸**（用户上一轮要的"统一大小"）
           ——原来配方书是 min(96vw,780px) × 90vh，成就又是另一套，三块面板三个尺寸。 */
        width: var(--panel-w); max-width: var(--panel-w);
        height: var(--panel-h); max-height: var(--panel-h); overflow-y: auto;
        background: var(--panel-bg);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius);
        padding: 12px 14px; color: var(--panel-text); font-size: 13px;
        box-shadow: var(--panel-shadow);
      }
      .recipe-header {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        padding-bottom: 8px; border-bottom: 2px solid #9a9a9a; margin-bottom: 8px;
      }
      .recipe-header b { font-size: 15px; }
      .recipe-hint { color: #4a4a4a; font-size: 11px; }
      .recipe-search {
        flex: 1; min-width: 160px; padding: 5px 8px; font: inherit; font-size: 12px;
        background: #eee; color: #222; border: 1px solid #777; border-radius: 3px;
      }
      .recipe-close {
        font: inherit; font-size: 12px; padding: 5px 10px; cursor: pointer;
        background: #a8a8a8; color: #222; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* ---------------- 配方书的标签栏（批次 133，对齐基岩版） ----------------
         Wiki「物品栏 → 配方书」：基岩版把配方按标签栏展示（建筑 / 装备 / 物品 / 自然 /
         全部），而且"合成配方书的标签栏与创造分类相同"。这一行同时放
         "仅显示可合成"那个筛选项（贴着右端）。样式与面板上其它按钮一致。 */
      .recipe-tabs {
        display: flex; align-items: center; gap: 4px; flex-wrap: wrap;
        margin: 0 0 8px;
      }
      .recipe-tab, .recipe-filter {
        font: inherit; font-size: 12px; padding: 4px 9px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 页签 = 图标 + 文字（批次 134，对齐截图里那一排）；
         图标用真实物品（`drawItemIcon` 画的 canvas）或放大镜 SVG */
      .recipe-tab { display: inline-flex; align-items: center; gap: 5px; }
      .recipe-tab-icon { width: 16px; height: 16px; flex: 0 0 16px; image-rendering: pixelated; }
      .recipe-tab-icon svg { display: block; }
      .recipe-tab-label { white-space: nowrap; }
      /* 当前页签 / 已打开的筛选：反白 + 斜角翻过来（"按下去"的那一块） */
      .recipe-tab.active, .recipe-filter.on {
        background: #6f6f6f; color: #f2f2f2;
        border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
      }
      .recipe-filter { margin-left: auto; }
      .recipe-list { display: flex; flex-direction: column; gap: 6px; }
      .recipe-empty { padding: 20px; text-align: center; color: #5a5a5a; }
      .recipe-card {
        display: flex; align-items: center; gap: 10px;
        padding: 7px 9px; background: #b4b4b4;
        border: 2px solid; border-color: #d8d8d8 #7a7a7a #7a7a7a #d8d8d8;
        border-radius: var(--radius-sm);
      }
      .recipe-card.craftable { background: #b9c9b0; }
      /* 可点的卡片（批次 132）：点它 = **把材料摆进合成格**（原版主交互）。
         给一点"能按下去"的反馈：光标 + 按下时斜角翻过来（与全站按钮同一套语言）。 */
      .recipe-card.fillable { cursor: pointer; }
      .recipe-card.fillable:hover { background: #c7d6bd; }
      .recipe-card.fillable:active {
        border-color: #7a7a7a #d8d8d8 #d8d8d8 #7a7a7a;
        transform: translateY(1px);
      }
      .recipe-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

      /* ---------------- 摆放位置（批次 29） ----------------
         形状配方画成 `grid × grid` 的格子（**空格也画**：哪一格要空着也是配方的一部分）；
         无序配方画成一排槽位并写明"摆哪一格都行"。 */
      .recipe-layout {
        display: grid; gap: 2px;
        grid-template-columns: repeat(var(--layout-cols, 3), 26px);
      }
      .recipe-layout[data-grid='2'] { --layout-cols: 2; }
      .recipe-layout[data-grid='3'] { --layout-cols: 3; }
      /* 无序配方不占网格：排成一排，视觉上明确"这不是摆放顺序" */
      .recipe-layout.shapeless {
        display: flex; flex-wrap: wrap; gap: 3px;
        padding: 3px; border-radius: var(--radius-sm);
        background: repeating-linear-gradient(45deg, #00000010, #00000010 6px, transparent 6px, transparent 12px);
      }
      .recipe-slot {
        width: 26px; height: 26px; display: grid; place-items: center;
        background: var(--slot-bg);
        border: 1px solid; border-color: var(--slot-edge-dark) #cfcfcf #cfcfcf var(--slot-edge-dark);
        border-radius: 2px;
      }
      .recipe-slot.empty { background: #9d9d9d; border-color: #8a8a8a; }
      .recipe-slot.missing { box-shadow: inset 0 0 0 2px #d06a6a; }
      .recipe-arrow { color: #4a4a4a; font-size: 16px; line-height: 1; }
      /* "在哪摆"：2×2 背包就能做、3×3 要工作台——把这条信息单独摆一行，别混在材料里 */
      .recipe-station {
        flex: 1 1 100%; color: #3f3f3f; font-size: 11px;
      }
      .recipe-result { display: flex; align-items: center; gap: 5px; font-size: 13px; color: #1c1c1c; }
      .recipe-result canvas { image-rendering: pixelated; }
      .recipe-ingredients { display: flex; flex-wrap: wrap; gap: 4px; }
      .recipe-chip {
        display: inline-flex; align-items: center; gap: 3px;
        padding: 2px 5px; background: #d2d2d2; border-radius: 3px; color: #333; font-size: 11px;
      }
      .recipe-chip.missing { background: #e0b0b0; color: #6b1a1a; }
      .recipe-chip canvas { image-rendering: pixelated; }
      .recipe-chip i { font-style: normal; }
      .recipe-craft {
        flex-shrink: 0; font: inherit; font-size: 12px; padding: 6px 10px; cursor: pointer;
        background: #6f9a63; color: #fff; border: 2px solid; border-color: #a8d69c #3c5c33 #3c5c33 #a8d69c;
      }
      .recipe-craft:disabled { background: #9a9a9a; border-color: #c0c0c0 #6a6a6a #6a6a6a #c0c0c0; cursor: not-allowed; }
      .recipe-smelting { margin-top: 10px; padding-top: 8px; border-top: 2px solid #9a9a9a; }
      .recipe-smelt-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
      .inv-recipes-btn {
        font: inherit; font-size: 12px; padding: 3px 8px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 背包的关闭键（批次 111）——**它原来根本不存在**：手机上唯一的出路是
         "点空白"或 Android 返回手势（很多玩家不知道后者），而用户点名要求
         "不要点击空白关闭，就用关闭按钮"。形状与配方书/成就的关闭键统一。 */
      .inv-close {
        margin-left: auto;
        font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b; border: 2px solid;
        border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }

      /* 开始遮罩 `#overlay`（"点击进入游戏"）已在批次 111 整块删除：原版没有这一层，
         进去就是世界。原来它上面那份**按键/手势说明**搬到了暂停菜单底部，
         样式改叫 `.pause-help`（`kbd` 的样式保留给那份说明用）。 */
      .settings-panel kbd {
        display: inline-block; padding: 1px 6px;
        background: #ffffff22; border: 1px solid #ffffff44; font-size: 12px;
      }
      .pause-help {
        flex: 0 0 auto; margin: 10px 0 0; padding-top: 8px;
        border-top: 2px solid rgba(255, 255, 255, .14);
        font-size: 11px; line-height: 1.8; color: #a8a8a8; text-align: center;
      }
      /* 触屏提示默认隐藏，桌面键盘提示默认显示；`body.touch-mode` 由主程序按设备加上 */
      .touch-only { display: none; }
      body.touch-mode .touch-only { display: block; }
      body.touch-mode .desktop-only { display: none; }
      #death {
        position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
        /* 红色渐晕：中间还能看清世界，四周压暗（纯色遮罩会把画面糊成一片红） */
        background: radial-gradient(circle at 50% 45%, rgba(140, 0, 0, .28), rgba(80, 0, 0, .72) 75%);
        color: #fff; font-size: 16px;
        text-align: center; line-height: 2; pointer-events: none;
      }
      #death.hidden { display: none; }
      #death b {
        font-size: 30px; display: block; letter-spacing: 6px;
        text-shadow: 0 2px 18px rgba(0, 0, 0, .9);
        animation: death-title var(--dur-med) var(--ease);
      }
      @keyframes death-title {
        from { opacity: 0; transform: scale(1.15); }
        to { opacity: 1; transform: none; }
      }
      /* 睡觉遮罩（B13）：整屏渐暗 + 一排"Zzz"，与死亡遮罩同一个层叠层（z-index 6）。
         不接 pointer-events 的拦截：起床靠跳跃键，不需要点它（点了也不会穿透到世界）。
         ⚠️ 这两个动画不需要自己写 prefers-reduced-motion 分支：文件末尾那条全局规则
         会把所有元素的 animation-duration 压成 0（`#sleep b` 这个循环也一样） */
      #sleep {
        position: fixed; inset: 0; z-index: 6; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 50%, rgba(6, 8, 20, .86), rgba(0, 0, 0, .97) 72%);
        color: #e8e8f4; font-size: 15px;
        text-align: center; line-height: 2.2;
        animation: sleep-fade var(--dur-med) var(--ease);
      }
      #sleep.hidden { display: none; }
      #sleep b {
        font-size: 30px; display: block; letter-spacing: 10px; margin-bottom: 8px;
        text-shadow: 0 2px 20px rgba(120, 140, 255, .55);
        animation: sleep-zzz 2.4s var(--ease) infinite;
      }
      @keyframes sleep-fade { from { opacity: 0; } to { opacity: 1; } }
      @keyframes sleep-zzz {
        0%, 100% { opacity: .55; transform: translateY(2px); }
        50% { opacity: 1; transform: translateY(-2px); }
      }
      /* 告示牌编辑框（B12，批次 80）：四行输入 + 完成/取消。
         层叠层取 12：要盖住背包（10）与聊天（8），但仍在提示框（60）之下。
         挂 `<body>` 上（与所有面板一致），否则会被 `#overlay` / `#death` 盖住 */
      .sign-editor {
        position: fixed; inset: 0; z-index: 12;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .55);
      }
      .sign-editor.hidden { display: none; }
      .sign-editor-panel {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px 16px;
        min-width: min(360px, 92vw); max-width: 92vw;
        background: var(--panel-bg); color: var(--panel-text);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
      }
      .sign-editor-title { font-size: 14px; font-weight: 600; text-align: center; }
      .sign-editor-rows { display: flex; flex-direction: column; gap: 6px; }
      .sign-editor-row {
        box-sizing: border-box; width: 100%;
        padding: 7px 9px; font: inherit; font-size: 14px;
        color: var(--field-text); background: var(--field-bg);
        border: 2px solid var(--panel-edge-dark); border-radius: var(--slot-radius);
        /* 手机上这四行是唯一的输入面，高度给足（低于 16px 会被 Safari 自动放大页面） */
        min-height: 34px;
      }
      .sign-editor-row:focus { outline: none; background: #ffffff; border-color: #3a7d33; }
      .sign-editor-hint { font-size: 12px; line-height: 1.5; color: var(--panel-text-muted); text-align: center; }
      .sign-editor-buttons { display: flex; gap: 8px; }
      .sign-editor-button {
        flex: 1; padding: 9px 10px; font: inherit; font-size: 14px; cursor: pointer;
        color: var(--btn-text); background: var(--btn-bg);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        min-height: 38px;
      }
      .sign-editor-button:active {
        background: var(--mc-face-hover);
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
      }

      /* 信标界面（K5，批次 117）：主效果一行 + 次级效果一行，**点一下就生效**。
         与告示牌编辑器同一套写法（DOM 在 TS 里建、样式在这儿、Esc 收起） */
      .beacon-screen {
        position: fixed; inset: 0; z-index: 12;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .55);
      }
      .beacon-screen.hidden { display: none; }
      .beacon-screen-panel {
        display: flex; flex-direction: column; gap: 10px;
        padding: 14px 16px;
        min-width: min(420px, 92vw); max-width: 92vw;
        background: var(--panel-bg); color: var(--panel-text);
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius); box-shadow: var(--panel-shadow);
      }
      .beacon-screen-title { font-size: 14px; font-weight: 600; text-align: center; }
      .beacon-screen-summary { font-size: 12px; text-align: center; color: var(--panel-text-muted); }
      /* 没有金字塔时把那行字染暖一点：玩家第一眼要看到的是"它现在不工作" */
      .beacon-screen-summary-off { color: #d08a6a; }
      .beacon-screen-caption { font-size: 12px; color: var(--panel-text-muted); margin-bottom: 4px; }
      .beacon-screen-buttons { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .beacon-screen-button {
        padding: 8px 10px; font: inherit; font-size: 13px; cursor: pointer;
        color: var(--btn-text); background: var(--btn-bg);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        min-height: 36px;
      }
      .beacon-screen-button:active {
        background: var(--mc-face-hover);
        box-shadow: inset 2px 2px 0 var(--mc-edge-dark), inset -2px -2px 0 var(--mc-edge-light);
      }
      /* 够不到的能力置灰（原版也是灰的）：点不动比"点了没反应"清楚 */
      .beacon-screen-button:disabled { opacity: .45; cursor: default; }
      .beacon-screen-button-on { background: #3a7d33; color: #fff; }
      .beacon-screen-hint { font-size: 12px; line-height: 1.5; color: var(--panel-text-muted); }
      .beacon-screen-done { margin-top: 2px; }

      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 35%, #14181f, #07080a 70%);
        color: #c8c8c8; font-size: 14px;
        text-align: center;
      }
      /* 不确定进度条：世界生成没有可靠的总进度，只好用"一直在走"的条纹
         （比一个假的百分比诚实） */
      #loading::after {
        content: ''; position: absolute; left: 50%; bottom: 34%;
        width: min(220px, 56vw); height: 4px; transform: translateX(-50%);
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        background-size: 60% 100%; background-repeat: no-repeat;
        border-radius: 2px;
        animation: loading-sweep 1.4s var(--ease) infinite;
      }
      @keyframes loading-sweep {
        from { background-position: -60% 0; }
        to { background-position: 160% 0; }
      }

      #hotbar {
        position: absolute; left: 50%; transform: translateX(-50%);
        /* 底部安全区：刘海屏/全面屏的"home 横条"会盖住贴边的 UI */
        bottom: calc(14px + env(safe-area-inset-bottom, 0px));
        display: flex; gap: 3px; padding: 4px;
        background: var(--hud-bg);
        border: 1px solid var(--hud-border);
        border-radius: var(--radius-md);
        box-shadow: var(--hud-shadow), var(--hud-inner);
      }
      #hotbar .slot {
        position: relative; width: 42px; height: 42px;
        display: grid; place-items: center;
        background: rgba(255, 255, 255, .10);
        border: 2px solid rgba(0, 0, 0, .38);
        border-radius: var(--slot-radius);
        transition: background var(--dur-fast) var(--ease), transform var(--dur-med) var(--ease),
                    box-shadow var(--dur-med) var(--ease);
      }
      #hotbar .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
      /* 选中格：抬起来 + 一圈柔光（原版是"边框变白 + 轻微放大"，这里让它在深色底上更醒目） */
      #hotbar .slot.active {
        border-color: #fff;
        background: rgba(255, 255, 255, .26);
        transform: translateY(-2px) scale(1.08);
        box-shadow: 0 0 12px rgba(255, 255, 255, .45), 0 2px 6px rgba(0, 0, 0, .5);
      }
      #hotbar .slot .index {
        position: absolute; top: 0; left: 3px; font-size: 10px; color: #fff;
        text-shadow: 1px 1px 0 #000; opacity: .7;
      }
      #hotbar .slot.active .index { opacity: 1; }

      /* ⚠️ 触摸端必须让快捷栏**能点**（批次 95）。
         `#hud` 是 pointer-events: none，而触摸操作层的"视角面"（#touch-look，铺满全屏）
         在 DOM 里排在快捷栏之后——两者叠在一起时手势会落到视角面上：
         表现是"点快捷栏没反应，反而在身后挖了一块方块"，而 `bindHotbarTouch()`
         那句绑定从来没被触发过（离线断言也查不到，因为它只读 DOM 不看命中）。
         打开命中 + 抬高层级之后，点格子才真的会切槽。
         ⚠️ 这一条**不限定触摸设备**：桌面端同样是 pointer-events: none，所以"悬停快捷栏看物品
         提示"与"点快捷栏切槽"在 PC 上也一直是死的（指针锁定期间鼠标事件不会落到 HUD 上，
         解锁时又基本被暂停菜单盖住，所以打开它不会误伤操作）。 */
      #hotbar { pointer-events: auto; z-index: 1; }
      body.touch-mode #hotbar .slot { touch-action: manipulation; }
      /* 手指按下去要有反馈：选中靠 `.active`，按下的瞬间也要变一下 */
      body.touch-mode #hotbar .slot:active { background: rgba(255, 255, 255, .34); }

      /* 选中物品的名字浮标（批次 95，对齐基岩版）：换槽时在快捷栏上方浮一条，
         2 秒后淡出。手机上一眼能看到"手上是什么"，不用去翻背包 */
      #selected-item-name {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        padding: 4px 12px; border-radius: 14px;
        background: rgba(0, 0, 0, .58); color: #fff; font-size: 13px;
        white-space: nowrap; pointer-events: none;
        opacity: 0; transition: opacity .35s;
      }
      #selected-item-name.show { opacity: 1; }

      /* ---------------- 经验条（快捷栏正上方，等级数字压在条中间） ---------------- */
      #xp-bar {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: calc(68px + env(safe-area-inset-bottom, 0px));
        width: 182px; height: 6px;
        background: #14150f;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .9), 0 0 0 1px rgba(0, 0, 0, .6);
        border-radius: 3px;
        overflow: visible;
      }
      #xp-bar.hidden { display: none; }
      #xp-bar #xp-fill {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#c2ff7a, #63c335);
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(120, 220, 60, .55);
        transition: width var(--dur-med) var(--ease);
      }
      /* 等级数字压在一小块深色牌子上：压在进度条上时原来的绿字会看不清 */
      #xp-level {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 0 5px; border-radius: 4px;
        font-size: 13px; font-weight: 700; line-height: 1.35; color: #80ff20;
        background: rgba(0, 0, 0, .55);
        /* 原版是黑描边，压在绿色进度条上也读得清 */
        text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
        pointer-events: none;
      }

      /* ---------------- 生命 / 饥饿 / 氧气 ---------------- */
      #vitals {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: calc(86px + env(safe-area-inset-bottom, 0px));
        display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      #vitals .vital-defs { position: absolute; width: 0; height: 0; }
      .vital-row { display: flex; gap: 1px; }
      .vital-row svg.vital-icon { width: 18px; height: 18px; display: block; }
      #vital-air { visibility: hidden; }
      #vital-air.on { visibility: visible; }
      /* 护甲条只在身上有甲时出现（与原版一致：脱了就整条收起，不占屏） */
      #vital-armor { visibility: hidden; }
      #vital-armor.on { visibility: visible; }

      /* ---------------- 暂停 / 设置 ---------------- */
      #settings-screen {
        /* z-index 要高于主菜单（40）：设置面板既能从游戏里打开，也能从主菜单打开 */
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .55);
      }
      #settings-screen.hidden { display: none; }
      /* ================================================================
         暂停 / 设置面板：**固定尺寸 + 统一标题栏**（批次 110）
         ================================================================
         用户反馈："不管手机还是 PC，设置的界面应该是固定宽高的；不能这个界面一个
         宽高、跳另一个界面又是一个宽高，应该是统一大小的；它都覆盖在游戏界面上，
         然后有一点点外部的游戏区域；右上角统一加关闭按钮，或者左上角统一加返回按钮
         （暂停那个界面有继续游戏，可能就不需要关闭按钮了）。"

         之前的问题正是这两句：
           · 批次 107~109 给"暂停菜单页"和"设置页"**各写了一套宽度**
             （菜单页 `min(72vw,400px)`、设置页 `min(96vw,820px)`）——切页时面板会**跳大小**；
           · 高度写的是 `auto`：内容多少就多高，换一个分组也跟着变。

         现在：尺寸只出现在 `:root` 的 `--panel-w` / `--panel-h` 这一对变量里，
         **两页共用**，高度是固定值（内容多就在内部滚动，面板本身不动）。
         四周那圈"外部的游戏区域"就是视口减去面板尺寸后剩下的边距——所以**不写
         `width: 100%`**，也不写 `inset: 0`。
         ⚠️ "固定"指的是**不随内容/页签变化**，不是"写死像素"：手机上必须用
           `min(vw, 上限)` 把面板收进视口，否则小屏会被裁掉。
         ⚠️ 高度固定之后，"四组一次全展开"那套就不能用了（一屏放不下）；
           所以**三端统一成"左选项卡 + 右内容、一次一组"**——每组最多 5 行，
           任何屏幕都不用滚。这也是原版的样子。 */
      .settings-panel {
        width: var(--panel-w); max-width: var(--panel-w);
        height: var(--panel-h); max-height: var(--panel-h);
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        border-radius: 0;
        padding: 12px 14px; font-size: 13px;
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        display: flex; flex-direction: column; overflow: hidden;
      }
      /* 标题栏：**三列栅格**（左槽 | 标题 | 右槽），标题永远在正中间。
         两页共用同一个骨架：暂停菜单页左槽是空的，设置页左槽是"‹ 返回"。
         于是"换个界面"时唯一会动的只有左槽那颗键，标题一个字都不会移位。 */
      .settings-header {
        display: grid; grid-template-columns: 84px 1fr 84px;
        align-items: center; gap: 8px; flex: 0 0 auto;
      }
      .settings-header-slot { display: flex; min-width: 0; }
      .settings-header-slot:last-child { justify-content: flex-end; }
      .settings-title {
        font-size: 17px; letter-spacing: 1px; color: #fff; text-align: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .settings-back {
        padding: 0 10px; height: 32px; min-width: 76px;
        font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
      }
      .settings-hint { color: #a8a8a8; font-size: 12px; margin: 4px 0 8px; text-align: center; }
      /* 页签 + 内容：**永远"左选项卡 + 右内容"**（原版就是左侧一列） */
      .settings-columns { display: flex; flex-direction: row; gap: 12px; flex: 1 1 auto; min-height: 0; }
      .settings-tabs { display: flex; flex-direction: column; flex: 0 0 104px; gap: 4px; }
      .settings-tab {
        font: inherit; font-size: 13px; padding: 6px 8px; min-height: 34px;
        text-align: left; white-space: nowrap; cursor: pointer; flex: 0 0 auto;
      }
      /* 当前分组：浅灰面 + 深字（原版"选中的那一项"就是反白的一块） */
      .settings-tab.active {
        background: var(--mc-panel); color: var(--mc-text);
        text-shadow: 1px 1px 0 rgba(255, 255, 255, .45);
      }
      .settings-body {
        flex: 1 1 auto; min-height: 0;
        overflow-x: hidden; overflow-y: auto;
        display: flex; flex-direction: column; gap: 6px;
      }
      /* 一次只显示当前分组（组名写在左边的选项卡上，段内标题是重复信息） */
      .settings-section { display: none; flex-direction: column; gap: 6px; }
      .settings-section.active { display: flex; }
      .settings-group { display: none; }
      .settings-meta { flex: 0 0 auto; margin: 8px 0 0; }
      .settings-row { display: grid; grid-template-columns: minmax(96px, auto) 1fr 52px; align-items: center; gap: 8px; }

      /* ---------------- 暂停菜单那一页（批次 108） ----------------
         同一份 DOM 的两页：`.pause-page.active` 才是当前这一页。
         暂停菜单那几颗按钮**竖着一列**——一页只放"几个主要按钮"。
         原来"继续游戏/成就/保存并回到主菜单/删除本世界"和十几行设置并排挤在
         一页上，用户的原话是"按钮非常大、又占了全屏、有点乱"。
         按钮的斜角与主菜单那套一致（亮左上 / 暗右下，按下时翻过来）。 */
      .pause-page { display: none; }
      .pause-page.active {
        display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
        overflow-x: hidden; overflow-y: hidden;
      }
      /* 菜单页的内容不是"一格滚动区"，它自己滚；设置页由里面的 `.settings-body` 滚 */
      .pause-page[data-page='menu'].active { overflow-y: auto; }
      /* 按钮列**在面板里垂直居中**：面板高度是固定的，不居中底下会空一大片。
         ⚠️ 宽度收到 300px（批次 111，用户："暂停界面按钮可以窄一点"）：
         面板宽 760px，一列按钮拉到满宽太宽——原版那一列只占面板的一小半。
         `margin: auto` 的上下 auto 负责垂直居中，左右 auto 负责水平居中。 */
      .pause-actions {
        display: flex; flex-direction: column; gap: 8px;
        margin: auto; width: 100%; max-width: 300px;
      }
      .pause-action {
        font: inherit; font-size: 14px; padding: 9px; min-height: 42px; cursor: pointer;
      }
      .settings-row i { font-style: normal; color: var(--mc-text-light); text-align: right; }
      /* ---------------- 循环切换控件（批次 109） ----------------
         ⚠️ 基岩版的设置界面里**没有复选框、也没有下拉框**：布尔项与"几选一"项
         都是同一颗灰按钮（`开 / 关`、`‹ 中 ›`），点一下换下一个值。
         所以这里不再有自绘开关——按钮的灰色面/黑描边/斜面统一由文件末尾那节
         "界面按钮统一"给（`.settings-cycle` 在那个清单里）。 */
      .settings-cycle {
        justify-self: start; min-width: 92px; padding: 5px 8px;
        font: inherit; font-size: 12px; line-height: 1.5; cursor: pointer; text-align: center;
      }
      /* ---------------- 滑杆（range 自绘，原版形态） ----------------
         原版滑块 = **深色凹槽 + 浅灰方块把手**（把手是一块带斜面的灰块，
         不是圆点、也不是绿色）。用 inset 硬阴影而不是 border：border 会把 track
         撑高，thumb 的 `margin-top` 就对不上了（那条 -6px 由 22 与 10 的差算出）。 */
      .settings-row input[type="range"] {
        appearance: none; -webkit-appearance: none;
        width: 100%; height: 22px; background: transparent; cursor: pointer;
        /* 面板宽到 760px 之后，`1fr` 会把滑杆拉到近 600px 长——原版没那么长的滑杆。
           给个上限，让它左对齐、长度固定，宽屏多出来的地方留白 */
        max-width: 300px;
      }
      .settings-row input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        background: #1a1a1a;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-row input[type="range"]::-webkit-slider-thumb {
        appearance: none; -webkit-appearance: none;
        width: 12px; height: 22px;
        margin-top: -6px; background: var(--mc-panel);
        border: none;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark),
                    0 0 0 2px var(--mc-outline);
      }
      .settings-row input[type="range"]::-moz-range-track {
        height: 10px; background: #1a1a1a;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-row input[type="range"]::-moz-range-thumb {
        width: 12px; height: 22px; border: none;
        background: var(--mc-panel);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark),
                    0 0 0 2px var(--mc-outline);
      }
      /* 分类小标题：设置项变多之后需要分组，否则一长条看不清 */
      .settings-group {
        margin: 10px 0 -2px; padding-top: 8px; font-size: 12px; color: #a8a8a8;
        border-top: 2px solid rgba(255, 255, 255, .16); letter-spacing: 1px;
      }
      /* 文件选择按钮自绘（原生那个浅灰方块在深色面板上非常突兀） */
      .settings-panel input[type="file"]::file-selector-button {
        font: inherit; font-size: 12px; margin-right: 8px; padding: 5px 10px;
        cursor: pointer; color: var(--btn-text);
        background: var(--btn-bg);
        border: 2px solid var(--mc-outline);
      }
      .settings-panel input[type="file"]::file-selector-button:active { background: var(--mc-face-hover); }
      .settings-row input[type="file"] { font: inherit; font-size: 11px; color: #a8a8a8; }

      /* ---------------- 触摸端：只放大热区，**不动面板尺寸**（批次 110） ----------------
         ⚠️ 面板的宽高从批次 110 起由 `--panel-w` / `--panel-h` 统一给（两页共用、
         固定值）。触摸端**不再自己写一套尺寸**——"换个界面就换一个宽高"正是从
         `body.touch-mode .settings-panel { width: ... }` 这类规则来的。
         这里只留两件事：把行高与热区放大到手指点得准。
         ⚠️ 判据用 `body.touch-mode` 而不是 `@media (max-width: 900px)`：
         平板（1024×768 触摸屏）也该拿这套，而它不命中那个宽度断点。 */
      body.touch-mode .settings-row {
        grid-template-columns: minmax(86px, auto) 1fr 54px; min-height: 36px;
      }
      body.touch-mode .settings-row input[type="range"] { height: 34px; }
      body.touch-mode .settings-row input[type="range"]::-webkit-slider-thumb {
        width: 16px; height: 26px; margin-top: -8px;
      }
      body.touch-mode .settings-cycle { min-width: 100px; padding: 6px 8px; font-size: 13px; }
      body.touch-mode .settings-tab { min-height: 40px; padding: 8px 10px; }
      body.touch-mode .settings-tabs { flex: 0 0 88px; }
      body.touch-mode .settings-back { height: 38px; font-size: 14px; }
      body.touch-mode .pause-action { min-height: 46px; font-size: 15px; }

      /* ================================================================
         手机横屏：**本项目的主要场景**（批次 109）
         ================================================================
         用户点明"我们的游戏在手机端是横屏的"。横屏高度只有 ~390px，所以这里
         只压**主菜单**（标题/按钮列）——设置与暂停面板的尺寸已经由
         `--panel-w/--panel-h` 统一给（固定尺寸，横竖屏不再各写一套）。
         ⚠️ 只对 `body.touch-mode` 生效：桌面端把窗口拉矮时不该突然换一套排法
            （PC 端验收脚本按 1440×900 跑）。 */
      @media (orientation: landscape) and (max-height: 560px) {
        /* 横屏的面板高度只有 ~343px：把暂停菜单的按钮从 46px 收到 42px，
           5 颗按钮 + 标题 + 存档信息刚好放得下（面板尺寸不变，只是里面排得更紧） */
        body.touch-mode .pause-action { min-height: 42px; font-size: 14px; }
        /* 那一小段按键/手势说明在横屏下藏起来（高度实在不够，它会顶出滚动条）——
           PC 竖屏/宽屏都能看到，触屏玩家本来也不需要键盘对照表 */
        body.touch-mode .pause-help { display: none; }

        /* ---- 主菜单：横屏宽度富余、高度紧张 ---- */
        body.touch-mode .world-title { font-size: 20px; }
        body.touch-mode .world-menu { gap: 8px; margin-top: 10px; }
        body.touch-mode .world-primary { min-height: 44px; font-size: 14px; }
        body.touch-mode .world-secondary { min-height: 44px; }
      }

      /* ---------------- 状态效果 HUD ---------------- */
      #effects-hud {
        position: fixed; right: 10px; top: 12px; z-index: 12;
        display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
        pointer-events: none; font-size: 12px;
      }
      .effect-chip {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 9px; border-radius: 999px; color: #fff;
        background: var(--hud-bg); border: 1px solid var(--hud-border);
        box-shadow: var(--hud-shadow);
        text-shadow: 1px 1px 0 #000;
      }
      /* 左边一颗小色点标"这是好效果还是坏效果"：整块变色的可读性不如一个明确的点 */
      .effect-chip::before {
        content: ''; width: 7px; height: 7px; border-radius: 50%;
        background: #b9c2cc; box-shadow: 0 0 6px currentColor;
      }
      .effect-chip.good { border-color: #79c46b66; }
      .effect-chip.good::before { background: #79c46b; box-shadow: 0 0 6px #79c46b; }
      .effect-chip.bad { border-color: #d46b6b66; }
      .effect-chip.bad::before { background: #d46b6b; box-shadow: 0 0 6px #d46b6b; }
      .effect-chip.instant { border-color: #6b9cd466; }
      .effect-chip.instant::before { background: #6b9cd4; box-shadow: 0 0 6px #6b9cd4; }

      /* ---------------- 聊天与命令 ---------------- */
      #chat {
        /* z-index 低于背包(10)：打开面板时聊天不该压在面板上（原版也这样）。
           但仍然高于 HUD 与遮罩，游戏里照常可见。 */
        position: fixed; left: 10px; z-index: 8;
        bottom: calc(82px + env(safe-area-inset-bottom, 0px));
        width: min(52vw, 620px); display: flex; flex-direction: column; gap: 2px;
        font-size: 13px; line-height: 1.45; pointer-events: none;
      }
      #chat.open { pointer-events: auto; }
      .chat-log { display: flex; flex-direction: column; gap: 1px; max-height: 34vh; overflow: hidden; }
      .chat-line {
        padding: 3px 8px; border-radius: var(--radius-sm); color: #fff;
        background: rgba(0, 0, 0, .42);
        border-left: 2px solid rgba(255, 255, 255, .18);
        text-shadow: 1px 1px 0 #000;
        transition: opacity .8s linear; overflow-wrap: anywhere;
        animation: chat-in var(--dur-med) var(--ease);
        /* 多行反馈（/help）保留换行 */
        white-space: normal;
      }
      /* 新消息淡入并微微上移（原来是一行行"凭空出现"） */
      @keyframes chat-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }
      .chat-line.chat-system { color: #d8e6b0; border-left-color: #a9c46b; }
      .chat-line.chat-error { color: #ff9a8a; border-left-color: #e0604c; }
      .chat-line.chat-player { color: #fff; border-left-color: #7db6f0; }
      .chat-line.fading { opacity: .45; }
      .chat-hint {
        padding: 2px 6px; color: #c8c8c8; font-size: 12px;
        background: rgba(0, 0, 0, .35); border-radius: 3px;
      }
      .chat-input {
        font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 3px;
        background: rgba(0, 0, 0, .78); color: #fff; border: 1px solid #ffffff44;
        outline: none;
      }
      /* 触屏的"发送"按钮：与输入框同一行（手机虚拟键盘不一定给 Enter 的 keydown） */
      .chat-send {
        align-self: flex-start; margin-top: 2px; padding: 8px 16px;
        font: inherit; font-size: 13px; color: #fff; cursor: pointer;
        background: #3a7d33; border: 1px solid #ffffff55; border-radius: 4px;
        min-height: 36px;
      }
      .chat-send:active { background: #2f6629; }
      .chat-input.hidden, .chat-hint.hidden, .chat-send.hidden { display: none; }

      /* ---------------- 物品提示框 ---------------- */
      #item-tooltip {
        position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
        max-width: 300px; padding: 9px 12px;
        /* 原版提示框是**近黑的紫底 + 紫色边框**（不是中性灰），文字白字带阴影。
           这里保留"左侧一条稀有度色条"（原版没有，但它是我们唯一能一眼看出品质的地方） */
        background: #100010f2;
        border: 2px solid #2d0a63;
        border-left: 4px solid var(--rarity-common);
        border-radius: 0;
        color: #e6e6e6; font-size: 12px; line-height: 1.55;
        text-shadow: 1px 1px 0 #000;
        box-shadow: 0 0 0 2px var(--mc-outline);
      }
      #item-tooltip.hidden { display: none; }
      /* 稀有度决定左侧色条（标题另外按类名上色，见上面的 .rarity-*） */
      #item-tooltip[data-rarity='uncommon'] { border-left-color: var(--rarity-uncommon); }
      #item-tooltip[data-rarity='rare'] { border-left-color: var(--rarity-rare); }
      #item-tooltip[data-rarity='epic'] { border-left-color: var(--rarity-epic); }
      #item-tooltip .tooltip-title { font-size: 13px; font-weight: 700; }
      #item-tooltip .tooltip-subtitle { color: #7f8c9b; font-size: 11px; margin-bottom: 4px; }
      #item-tooltip .tooltip-desc { color: #d8d8d8; }
      /* 附魔一条一行、青蓝色（与"稀有"同一个色系，一眼能看出是附魔） */
      #item-tooltip .tooltip-enchants { margin-top: 4px; }
      #item-tooltip .tooltip-enchant { color: var(--rarity-rare); font-size: 11px; }
      /* 耐久：文案 + 一条迷你条（快坏了能一眼看出来，不用去读数字） */
      #item-tooltip .tooltip-durability {
        display: flex; align-items: center; gap: 6px;
        margin-top: 5px; color: #b9c2cc; font-size: 11px;
      }
      #item-tooltip .tooltip-durability .dur-bar {
        position: static; width: 56px; height: 4px; flex: none;
      }
      #item-tooltip .tooltip-meta { color: #9a9a9a; font-size: 11px; margin-top: 5px; }

      #break-progress {
        position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
        width: 120px; height: 6px;
        background: rgba(0, 0, 0, .62);
        border-radius: 3px; overflow: hidden; display: none;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .12);
      }
      #break-progress.on { display: block; }
      #break-progress i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#ffffff, #c8c8c8);
        box-shadow: 0 0 8px rgba(255, 255, 255, .5);
      }

      /* boss 血条（末影龙）：只在 boss 存活时显示 */
      #boss-bar {
        position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
        width: min(420px, 68vw); display: none;
        background: var(--hud-bg);
        border: 1px solid var(--hud-border);
        border-radius: var(--radius-md); padding: 4px 10px 6px;
        text-align: center; color: #fff; font-size: 12px;
        box-shadow: var(--hud-shadow);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .8);
      }
      #boss-bar.on { display: block; }
      #boss-bar b { font-weight: normal; letter-spacing: 1px; }
      #boss-bar i {
        display: block; height: 8px; margin-top: 3px; border-radius: 4px;
        background: rgba(255, 255, 255, .14);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .75);
        overflow: hidden;
      }
      /* 凋灵（批次 116）：同一条血条，只是配色偏暗红——一眼能分出"现在打的是谁" */
      #boss-bar.wither i s {
        background: linear-gradient(#e0665a, #7a1a14);
        box-shadow: 0 0 10px rgba(214, 80, 60, .6);
      }
      /* 护盾期（转阶段那 5 秒）：血条闪蓝，说明"现在打它不掉血" */
      #boss-bar.shielded i s {
        background: linear-gradient(#8fd8ff, #2f7fbf);
        box-shadow: 0 0 10px rgba(120, 200, 255, .7);
      }
      #boss-bar i s {
        display: block; height: 100%; width: 100%;
        background: linear-gradient(#f56cf5, #b02ab0);
        box-shadow: 0 0 10px rgba(214, 59, 214, .6);
        transition: width .18s linear;
      }

      #hotbar .slot .count {
        position: absolute; right: 2px; bottom: 1px; font-size: 12px; color: #fff;
        /* 数字压在图标上有时候看不清，加一圈描边（比单方向阴影更稳） */
        text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
      }
      #hotbar .slot .icon { width: 32px; height: 32px; visibility: hidden; }

      /* ---------------- 背包界面 ---------------- */
      #inventory-screen {
        position: fixed; inset: 0; z-index: 10;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .55);
      }
      #inventory-screen.hidden { display: none; }

      .inv-panel {
        background: var(--panel-bg);
        /* 像素斜角（批次 108）：左上亮、右下暗的一圈硬边，直角 */
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius);
        padding: 14px 16px;
        /* 贴合内容：固定 660px 时"主背包"右边会空出一大片灰（看着像没排好版） */
        width: fit-content; min-width: min(420px, 92vw);
        max-width: 660px; max-height: 92vh; overflow-y: auto;
        box-shadow: var(--panel-shadow);
      }
      .inv-header {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 8px 18px; flex-wrap: wrap;
        color: var(--panel-text); font-size: 14px;
        padding-bottom: 8px; margin-bottom: 4px;
        border-bottom: 2px solid #a9a9a9;
      }
      .inv-header b { font-size: 16px; letter-spacing: 1px; }
      .inv-header kbd {
        padding: 0 4px; border: 1px solid #777; border-radius: 3px;
        background: #e6e6e6; font-size: 12px;
      }
      /* 分区标题：前面一小条强调色（比纯文字更"分得开"，也不占地方） */
      .inv-label { color: #3a3a3a; font-size: 12px; margin: 10px 0 5px; letter-spacing: .5px; }
      .inv-label::before {
        content: ''; display: inline-block; width: 3px; height: 11px;
        margin-right: 6px; vertical-align: -1px;
        background: var(--accent); border-radius: 2px;
      }

      .inv-craft { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 8px; }
      .inv-craft-grid.size-2 { grid-template-columns: repeat(2, 42px); }
      .inv-craft-grid.size-3 { grid-template-columns: repeat(3, 42px); }
      .inv-arrow { font-size: 22px; color: #4a4a4a; }
      /* 能合成 / 能取走的槽位：一层柔和的强调底（比原来纯色块更"活"） */
      .inv-slot.ready {
        background: linear-gradient(#9fce9c, #86b083);
        box-shadow: inset 0 0 10px rgba(120, 220, 120, .35);
      }
      /* 只取不放的槽位（合成结果、熔炉产物）用暖色底提示 */
      .inv-slot.take-only { background: linear-gradient(#a8a897, #93937f); }

      /* ---------------- 铁砧（H8） ---------------- */
      .anvil-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .anvil-row { display: flex; align-items: flex-end; gap: 8px; }
      .anvil-row .inv-label { align-self: flex-end; padding-bottom: 4px; }
      .anvil-side { display: flex; flex-direction: column; gap: 6px; min-width: 190px; flex: 1; }
      .anvil-name {
        font: inherit; font-size: 12px; padding: 5px 7px; color: #2b2b2b;
        background: #b8b8b8; border: 2px solid; border-color: #6a6a6a #ffffff #ffffff #6a6a6a;
      }
      .anvil-name::placeholder { color: #5f5f5f; }
      .anvil-cost { font-size: 12px; color: #2b5a2b; min-height: 16px; }
      .anvil-cost.bad { color: #7a2020; }

      /* ---------------- 切石机（H11，批次 44） ---------------- */
      /* 左边一格输入、右边一列"能切出什么"；窄屏时上下堆叠（手机竖屏也能用） */
      .stonecutter-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .stonecutter-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .stonecutter-col .inv-label { align-self: flex-start; }
      .stonecutter-right { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
      .stonecutter-list { display: flex; flex-wrap: wrap; gap: 4px; }
      /* 每一项都是"图标 + 名字 ×份数"，一眼能看出切成什么、切出几件 */
      .stonecutter-option {
        display: flex; align-items: center; gap: 6px;
        font: inherit; font-size: 12px; text-align: left; padding: 4px 8px 4px 4px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .stonecutter-option canvas { width: 28px; height: 28px; image-rendering: pixelated; }
      .stonecutter-option:active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }

      /* ---------------- 村民交易（J11，批次 88） ---------------- */
      /* 一条交易 = [他收的] → [他给的] + 剩余次数：比原版那套"两个收货格"更适合手指 */
      .trade-info { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
      .trade-level { display: flex; flex-direction: column; gap: 2px; }
      .trade-who { font-size: 14px; color: var(--panel-text); }
      .trade-xp { font-size: 12px; color: #4a4a4a; }
      .trade-list { flex-direction: column; align-items: stretch; }
      .trade-option { flex-wrap: wrap; }
      /* 交易两边的图标都小一号（一屏要放 6~8 条） */
      .trade-option canvas { width: 24px; height: 24px; }
      .trade-cost, .trade-gain { display: flex; align-items: center; gap: 2px; }
      .trade-cost span, .trade-gain span { font-size: 12px; }
      .trade-arrow { color: #3a3a3a; padding: 0 2px; }
      .trade-uses { margin-left: auto; font-size: 11px; color: #4a4a4a; }
      .trade-note { flex-basis: 100%; font-size: 11px; color: #8a3a3a; }
      /* 材料不够 / 次数用完：整条压暗（**不用 disabled**——禁用的按钮收不到悬停提示，
         而"为什么不能点"正是玩家最需要看到的；点击时也给提示） */
      .trade-option.blocked { filter: brightness(.82); }
      .trade-option.blocked .trade-gain { opacity: .6; }

      /* ---------------- 营火（批次 47） ---------------- */
      /* 4 个格子排成一行，每格下面一条自己的进度条 */
      .campfire-grid { display: flex; gap: 8px; flex-wrap: wrap; }
      .campfire-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .campfire-cook { width: 42px; }
      .campfire-side { display: flex; flex-direction: column; gap: 4px; min-width: 170px; flex: 1; }

      /* ---------------- 附魔台（H9） ---------------- */
      .enchant-layout { display: flex; gap: 14px; align-items: flex-start; }
      .enchant-col {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .enchant-col .inv-label { align-self: flex-start; }
      .enchant-options { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
      .enchant-option {
        font: inherit; font-size: 12px; text-align: left; padding: 6px 10px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 点得动的候选用暖色高亮（与原版"能附魔的那几行会发光"同一个意思） */
      .enchant-option.on { background: #d8c8f0; border-color: #ffffff #4a3a6a #4a3a6a #ffffff; }
      .enchant-option:disabled { color: #6a6a6a; cursor: not-allowed; }
      .enchant-option:not(:disabled):active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .enchant-status { font-size: 12px; color: #2b5a2b; min-height: 16px; }
      .enchant-status.bad { color: #7a2020; }
      .enchant-hint { font-size: 11px; color: #5a5a5a; margin-top: 2px; }

      /* ---------------- 玩家那一块的两列（批次 111，对齐原版） ----------------
         原版物品栏：**左栏是盔甲 4 格竖排 + 副手**，右栏是"合成 / 容器 + 3×9 主背包
         + 9 快捷栏"。原来我们是竖着堆五段、每段还带一行文字标签（「主背包 / 快捷栏 /
         盔甲与副手」）——原版没有这些字，靠位置和一道缝就能分清。
         ⚠️ 两列用 fixed 的 grid-column/row 定位而不是 DOM 顺序：`topArea`
         （随模式切换的合成/箱子/熔炉）在构造函数里先于装备列被建出来。 */
      .inv-body { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
      .inv-gear { grid-column: 1; grid-row: 1; }
      .inv-main { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 4px; }
      /* 快捷栏与主背包之间空一道缝（原版这两排是紧挨着的，靠缝区分） */
      .inv-main .inv-hotbar { margin-top: 5px; }

      /* ---------------- 盔甲与副手（36-40 号槽，竖排一列） ---------------- */
      .inv-grid.inv-armor { grid-template-columns: 42px; }
      /* 空槽里写"头/胸/腿/靴/副"：触摸端没有悬停提示，只能靠槽位自己说明 */
      .inv-slot-hint {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: #5f5f5f; font-size: 14px; pointer-events: none; user-select: none;
      }
      .inv-slot.has-item .inv-slot-hint { display: none; }
      /* 放不下（例如把石头塞进头盔位）：抖一下，别让玩家以为是点击没生效 */
      @keyframes inv-reject-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
      }
      .inv-slot.inv-reject { animation: inv-reject-shake .18s linear; }

      .inv-chest { grid-template-columns: repeat(9, 42px); }
      /* 漏斗（批次 58）：5 格排成一行（原版界面就是这样一条） */
      .inv-hopper { grid-template-columns: repeat(5, 42px); }
      /* 投掷器与发射器（批次 59/60）：3×3 九宫格（原版这两兄弟的界面都是九宫格） */
      .inv-nine { grid-template-columns: repeat(3, 42px); justify-content: start; }

      /* ---------------- 熔炉 ---------------- */
      .furnace-layout {
        display: flex; align-items: center; gap: 14px;
        margin: 6px 0 10px; padding: 8px 4px;
      }
      .furnace-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .furnace-flame {
        position: relative; width: 18px; height: 20px;
        background: rgba(0, 0, 0, .28); border-radius: 3px; overflow: hidden;
      }
      .furnace-flame i {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 0;
        background: linear-gradient(#ffd76a, #ff8a1e); transition: height .1s linear;
      }
      .furnace-flame.lit i { box-shadow: 0 0 6px #ff9a2e; }
      .furnace-middle { width: 70px; }
      .furnace-cook {
        height: 12px; background: rgba(0, 0, 0, .28);
        border-radius: 3px; overflow: hidden;
      }
      .furnace-cook i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, #cfe6ff, #6fa8dc);
        transition: width .1s linear;
      }

      /* ---------------- 酿造台（H10） ---------------- */
      .brewing-layout {
        display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap;
        margin: 6px 0 10px; padding: 8px 4px;
      }
      /* 三个药水槽横排（与原版一致：三瓶同时酿，摆在同一条线上最直观） */
      .brewing-bottles { display: flex; gap: 6px; }
      .brewing-col { display: flex; flex-direction: column; align-items: flex-start; }
      .brewing-middle { display: flex; flex-direction: column; gap: 4px; width: 96px; }
      .brewing-fuel-text { font-size: 11px; color: #2b5a2b; }
      .brewing-fuel-text.bad { color: #7a2020; }

      .inv-grid { display: grid; grid-template-columns: repeat(9, 42px); gap: 3px; justify-content: center; }
      /* 创造栏自己滚：翻页条因此始终留在视野里（宽屏上原来要滚到面板底部才能翻页） */
      .inv-grid.inv-creative {
        grid-template-columns: repeat(12, 34px); gap: 2px;
        max-height: 46vh; overflow-y: auto; padding-right: 2px;
      }

      /* ---------------- 创造物品栏：分类、搜索与分页 ---------------- */
      .inv-creative-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 4px 0 6px; }
      .inv-tabs { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
      /* 分页条：PC 与手机共用；只有一页时整条隐藏（`hidden` 由界面加） */
      .inv-pager { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 8px 0 2px; }
      /* ⚠️ 装备列是"左栏竖排"，不能再居中（居中会让它在自己那一列里左右飘） */
      .inv-chest { justify-content: center; }
      .inv-pager.hidden { display: none; }
      .inv-page-button {
        font: inherit; font-size: 13px; padding: 8px 14px; min-height: 40px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .inv-page-button:disabled { color: #7a7a7a; background: #9a9a9a; cursor: default; }
      .inv-page-button:not(:disabled):active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .inv-page-label { font-size: 12px; color: #3a3a3a; min-width: 108px; text-align: center; }
      .inv-tab {
        font: inherit; font-size: 12px; padding: 3px 9px; cursor: pointer;
        /* 图标 + 文字横排（批次 98）：图标是注册表里的真实物品，尺寸交给 `.inv-tab-icon` */
        display: inline-flex; align-items: center; gap: 4px;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .inv-tab-icon { width: 18px; height: 18px; image-rendering: pixelated; flex: 0 0 auto; }
      .inv-tab.active { background: #dcdec4; border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .inv-tab:active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .inv-search {
        flex: 1; min-width: 130px; font: inherit; font-size: 12px; padding: 3px 6px;
        background: #efefef; color: #222;
        border: 2px solid; border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
        outline: none;
      }
      .inv-count-label { color: #6a6a6a; font-size: 11px; }
      /* 空状态提示在网格里要跨满整行，否则会被 34px 的列宽挤成一列字 */
      .inv-empty { grid-column: 1 / -1; color: #5a5a5a; font-size: 12px; padding: 10px 2px; }
      .inv-slot {
        position: relative; width: 42px; height: 42px;
        display: grid; place-items: center;
        background: var(--slot-bg);
        border: 2px solid;
        border-color: var(--slot-edge-dark) var(--slot-edge-light) var(--slot-edge-light) var(--slot-edge-dark);
        border-radius: var(--slot-radius);
        transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      }
      /* 悬停亮一档、按下凹一点：此前槽位完全没有交互反馈（点了才知道点到了没） */
      .inv-slot:hover { background: var(--slot-bg-hover); }
      .inv-slot:active { transform: scale(.96); }

      /* ---------------- 耐久条（批次 28） ----------------
         受损的工具/盔甲在格子底部显示一条 3px 的条，颜色随剩余耐久 绿→黄→红。
         快捷栏与背包共用同一套类名（都走 `ui/SlotVisuals.updateDurabilityBar`）。 */
      .dur-bar {
        position: absolute; left: 3px; right: 3px; bottom: 2px; height: 3px;
        background: rgba(0, 0, 0, .65); border-radius: 2px; overflow: hidden;
        pointer-events: none;
      }
      .dur-bar.hidden { display: none; }
      .dur-bar b {
        display: block; height: 100%; width: 100%;
        background: var(--dur-high);
        transition: width var(--dur-med) var(--ease), background var(--dur-med) var(--ease);
      }
      .dur-bar.dur-mid b { background: var(--dur-mid); }
      .dur-bar.dur-low b { background: var(--dur-low); }

      /* ---------------- 稀有度配色 ----------------
         色值在 `:root` 里（与 `itemVisuals.ts` 的档位一一对应），这里只做映射。 */
      .rarity-common { color: var(--rarity-common); }
      .rarity-uncommon { color: var(--rarity-uncommon); }
      .rarity-rare { color: var(--rarity-rare); }
      .rarity-epic { color: var(--rarity-epic); }

      /* ---------------- 按钮统一 ----------------
         原来每个按钮各写一遍斜面与按下态，于是"有些按钮按下去有反馈、有些不"。
         这里收成一组：斜面 + 按下时斜面翻转并下移 1px（像真的按进去）。 */
      :is(.inv-page-button, .inv-tab, .inv-recipes-btn, .recipe-close, .enchant-option) {
        font: inherit; cursor: pointer; color: var(--btn-text);
        background: var(--btn-bg);
        border: 2px solid;
        border-color: var(--panel-edge-light) var(--panel-edge-dark) var(--panel-edge-dark) var(--panel-edge-light);
        border-radius: var(--btn-radius);
        transition: background var(--dur-fast) var(--ease), transform var(--dur-fast) var(--ease);
      }
      :is(.inv-page-button, .inv-tab, .inv-recipes-btn, .recipe-close, .enchant-option):not(:disabled):active {
        background: var(--btn-bg-down);
        border-color: var(--panel-edge-dark) var(--panel-edge-light) var(--panel-edge-light) var(--panel-edge-dark);
        transform: translateY(1px);
      }
      :is(.inv-page-button, .inv-tab, .inv-recipes-btn, .recipe-close, .enchant-option):disabled {
        color: #7d7d7d; background: #9c9c9c; cursor: default;
      }
      .inv-grid.inv-creative .inv-slot { width: 34px; height: 34px; }
      .inv-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
      .inv-grid.inv-creative .inv-slot canvas { width: 28px; height: 28px; }
      .inv-count {
        position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }

      #inv-held {
        position: fixed; z-index: 11; pointer-events: none;
        transform: translate(-50%, -50%); display: none;
      }
      #inv-held.on { display: block; }
      #inv-held canvas { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
      #inv-held span {
        position: absolute; right: -2px; bottom: -2px; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }

      /* ---------------- 触摸操作层（手机 / 平板）----------------
         放在 #hud 里面，但 #hud 是 pointer-events: none，
         所以这里只给真正要接收手势的元素打开 pointer-events。 */
      #touch-ui {
        position: fixed; inset: 0; pointer-events: none;
        /* 刘海屏/圆角屏：把 UI 收进安全区 */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
                 env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #touch-ui.hidden { display: none; }

      /* 视角面铺满全屏：承接拖动转视角，以及轻点/长按 */
      #touch-look {
        position: absolute; inset: 0;
        pointer-events: auto; touch-action: none;
      }

      #touch-stick {
        position: absolute; left: 22px; bottom: 96px;
        /* 尺寸乘 `--touch-scale`（批次 97）：设置里的"触摸按钮大小"直接改这个变量，
           摇杆与按钮一起缩放（分别调会更乱：两者的比例本来就是配好的） */
        width: calc(132px * var(--touch-scale, 1));
        height: calc(132px * var(--touch-scale, 1));
        border-radius: 50%;
        background: rgba(255, 255, 255, .13);
        border: 2px solid rgba(255, 255, 255, .3);
        pointer-events: auto; touch-action: none;
        display: grid; place-items: center;
        transition: background .15s;
      }
      #touch-stick.active { background: rgba(255, 255, 255, .22); }
      #touch-stick .knob {
        width: calc(56px * var(--touch-scale, 1));
        height: calc(56px * var(--touch-scale, 1));
        border-radius: 50%;
        background: rgba(255, 255, 255, .55);
        border: 2px solid rgba(255, 255, 255, .8);
        will-change: transform;
      }

      /* 右下那一簇（批次 107 起只有"潜行 + 跳跃"两颗，批次 111 对齐原版排法）：
         **一排右对齐——跳跃在右（最大、拇指最常够到），潜行在它左边**。
         原版手机默认布局就是这样（原来我们排成了上下两行，和原版不一致）。
         背包与聊天不在这里，它们在快捷栏两侧（见下面 `.touch-side-btn`）。 */
      #touch-buttons {
        position: absolute; right: 20px; bottom: 96px;
        display: flex; flex-direction: row; align-items: flex-end;
        gap: calc(12px * var(--touch-scale, 1));
        pointer-events: none;
      }
      .touch-button {
        width: calc(62px * var(--touch-scale, 1));
        height: calc(62px * var(--touch-scale, 1));
        border-radius: 50%; padding: 0;
        display: grid; place-items: center;
        font: inherit; font-size: 17px; color: #fff;
        background: rgba(255, 255, 255, .16);
        border: 2px solid rgba(255, 255, 255, .34);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .6);
        pointer-events: auto; touch-action: none;
        user-select: none; -webkit-user-select: none;
      }
      /* 图标是内联 SVG：跟着按钮缩放，颜色用 currentColor 与按钮文字同色 */
      .touch-button svg { width: 58%; height: 58%; display: block; fill: currentColor; }
      .touch-button.on { background: rgba(140, 220, 140, .38); border-color: rgba(200, 255, 200, .8); }
      .touch-button.jump {
        width: calc(76px * var(--touch-scale, 1));
        height: calc(76px * var(--touch-scale, 1));
        font-size: 19px;
      }
      .touch-button.jump svg { width: 52%; height: 52%; }

      /* 飞行时的升降提示（批次 96）：飞起来之后"跳跃/潜行"这两颗键的含义变成了
         上升/下降，不提示就只能靠试（基岩版也在这两颗键上画箭头）。
         用伪元素画：不往按钮里塞文字节点（读屏与验收脚本看到的仍然只有图标）。 */
      #touch-ui.flying .touch-button.jump::after,
      #touch-ui.flying .touch-button[data-icon="sneak"]::after {
        position: absolute; left: 50%; transform: translateX(-50%);
        font-size: 11px; line-height: 1; color: rgba(255, 255, 255, .92);
        text-shadow: 0 0 3px rgba(0, 0, 0, .8);
      }
      #touch-ui.flying .touch-button.jump::after { content: '▲'; top: 4px; }
      #touch-ui.flying .touch-button[data-icon="sneak"]::after { content: '▼'; bottom: 3px; }
      .touch-button { position: relative; }

      /* 动态摇杆（批次 96）：平时隐形待命，按下才出现在手指下面。
         ⚠️ 只改透明度、不改 display：`beginDynamicStick` 要靠 getBoundingClientRect
         拿到半径与中心（display: none 下这个矩形全是 0，摇杆会"按下去就死"）。 */
      #touch-stick.dynamic { opacity: 0; }
      #touch-stick.dynamic.active { opacity: 1; }

      #touch-hint {
        position: absolute; left: 50%; bottom: 214px; transform: translateX(-50%);
        padding: 7px 14px; border-radius: 16px;
        background: rgba(0, 0, 0, .5); color: #fff; font-size: 12px;
        white-space: nowrap; transition: opacity .6s;
      }
      #touch-hint.fade { opacity: 0; }

      /* ---------------- 顶部暂停键（批次 104） ----------------
         基岩版手机在屏幕**上方正中**放一颗暂停键，点开就是暂停/设置菜单。
         本项目此前没有这一颗：PC 靠 Esc，而手机既没有 Esc、操作层里也没入口——
         手机上打不开设置（音量/视距/灵敏度都改不了），想换世界只能退出页面。
         ⚠️ 尺寸同样乘 `--touch-scale`（与右下那一簇共用"触摸按钮大小"这个设置项）。 */
      #touch-pause {
        position: absolute; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px));
        transform: translateX(-50%);
        pointer-events: none;
      }
      #touch-pause .touch-button {
        width: calc(52px * var(--touch-scale, 1));
        height: calc(52px * var(--touch-scale, 1));
        background: rgba(0, 0, 0, .34);
        border-color: rgba(255, 255, 255, .42);
      }

      /* ---------------- 快捷栏两侧的背包 / 聊天（批次 107） ----------------
         基岩版手机把"背包"放在**快捷栏右边**、"聊天"放在左边，而不是混进右手
         那一簇操作键里。这里挂进 `#hotbar` 内部并用绝对定位：
         ① 快捷栏自己就是定位父元素，"贴着它两端"不用算任何像素；
         ② 它们**不参与那一行 9 个格子的宽度计算**（竖屏手机上 9 × 44px ≈ 408px
            已经把 430px 的屏宽占满，再往行里塞按钮必然溢出）。
         默认摆在快捷栏**两端上方**；屏幕够宽时按基岩版摆到左右两侧。 */
      #hotbar .touch-side-btn {
        position: absolute; bottom: calc(100% + 4px);
        width: calc(44px * var(--touch-scale, 1));
        height: calc(44px * var(--touch-scale, 1));
        background: rgba(0, 0, 0, .34);
        border-color: rgba(255, 255, 255, .42);
      }
      #touch-hotbar-inventory { right: 0; }
      #touch-hotbar-chat { left: 0; }
      @media (min-width: 760px) {
        #hotbar .touch-side-btn { bottom: 0; }
        #touch-hotbar-inventory { right: auto; left: calc(100% + 8px); }
        #touch-hotbar-chat { left: auto; right: calc(100% + 8px); }
      }

      /* 顶部那一行现在被暂停键占着：血条与调试信息往下让一格，免得叠在一起 */
      body.touch-mode #boss-bar { top: calc(64px + env(safe-area-inset-top, 0px)); }
      /* 调试信息在手机上收窄（它是开发用的面板，不该挤到屏幕中间的暂停键） */
      body.touch-mode #debug { max-width: 34vw; }

      /* 手机端不显示快捷栏上的 1~9 序号：那是"按键盘数字键切槽"的提示，
         手机上没有这些键，留着只是噪音（基岩版手机也不显示）。 */
      body.touch-mode #hotbar .slot .index { display: none; }

      /* 面板里那几个"小字按钮"在手机上要放大到能点得到（44px 是平台下限）：
         背包标题栏的"配方书/成就"原来只有 12px 字 + 3px 内边距，手机上很难点 */
      body.touch-mode .inv-recipes-btn { min-height: 44px; padding: 8px 14px; font-size: 14px; }
      body.touch-mode .recipe-close,
      body.touch-mode .inv-close,
      body.touch-mode .adv-close { min-width: 48px; min-height: 44px; font-size: 17px; padding: 8px 12px; }
      /* 配方书的标签栏（批次 133）：手机上热区放到 40px——页签是"翻配方"的主入口，
         比每张卡片上那颗"合成"用得更频繁 */
      body.touch-mode .recipe-tab,
      body.touch-mode .recipe-filter { min-height: 40px; padding: 8px 11px; font-size: 13px; }

      /* 主菜单（世界列表 / 新建世界）同理：这几个按钮原是按鼠标尺寸做的（高约 30px），
         手机上点"进入/删除"经常点到隔壁。手机上统一抬到 44px。 */
      body.touch-mode .world-card-actions button,
      body.touch-mode .world-mini,
      body.touch-mode .world-secondary,
      body.touch-mode .world-back { min-height: 44px; padding: 8px 14px; }
      body.touch-mode .world-primary { min-height: 52px; }
      body.touch-mode .world-input { padding: 10px 10px; font-size: 14px; }
      /* 二级页面的"‹ 返回"固定在左上、标题跟着它，拇指区一眼就能找到出口 */
      body.touch-mode .world-nav { margin-bottom: 14px; }

      /* ---------------- 小屏适配 ----------------
         目标：竖屏/横屏手机都能操作，且界面不溢出、热区够大。 */
      @media (max-width: 900px), (max-height: 560px) {
        #debug { font-size: 10px; line-height: 1.45; padding: 4px 6px; max-width: 46vw; }
        #hotbar { bottom: 12px; padding: 2px; gap: 1px; }
        /* 槽位从 36 提到 44（批次 95）：触摸端要"点得准"，44px 是平台最小手势尺寸，
           而 36px 的格子在实际操作里经常点到隔壁。9 × 44 + 间隙 ≈ 408px，430px 宽的
           竖屏手机放得下 */
        #hotbar .slot { width: 44px; height: 44px; }
        #hotbar .slot canvas { width: 36px; height: 36px; }
        #hotbar .slot .index { font-size: 9px; }
        #hotbar .slot .count { font-size: 11px; }
        /* 小屏：快捷栏更低，经验条与状态 HUD 跟着一起上移 */
        #xp-bar { bottom: 58px; width: 156px; }
        #xp-level { font-size: 11px; }
        #vitals { bottom: 74px; }
        .vital-row svg.vital-icon { width: 14px; height: 14px; }

        /* 背包/容器面板在小屏上几乎全屏，并把槽位放大到好点按的尺寸 */
        .inv-panel {
          max-width: 96vw; max-height: 92vh; padding: 10px;
          border-width: 2px;
        }
        /* 成就面板同理（批次 87）：手机上几乎全屏，行高留够点按尺寸 */
        .adv-panel { max-width: 96vw; max-height: 92vh; padding: 10px; border-width: 2px; }
        .adv-row { min-height: 48px; }
        #adv-toasts { max-width: 88vw; }
        .inv-grid { grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 2px; }
        .inv-grid .inv-slot { width: auto; aspect-ratio: 1; }
        /* 装备仍是"竖排一列"（窄屏下占满这一列宽） */
        .inv-grid.inv-armor { grid-template-columns: minmax(0, 1fr); }
        /* 漏斗：窄屏也保持一排 5 格（继承上面那条 9 列规则会把它拉成两行） */
        .inv-grid.inv-hopper { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        /* 投掷器/发射器：窄屏保持 3 列（否则会被上面那条 9 列规则拉成一行） */
        .inv-grid.inv-nine { grid-template-columns: repeat(3, 46px); justify-content: start; }
        .inv-grid.inv-creative { grid-template-columns: repeat(8, minmax(0, 1fr)); }
        .inv-grid.inv-creative .inv-slot { width: auto; }
        .inv-craft-grid.size-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .inv-craft-grid.size-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .inv-craft .inv-slot { width: 46px; }
        /* 面板内允许纵向拖动滚动，其余手势交给操作层 */
        .inv-panel { touch-action: pan-y; }
        .inv-slot { -webkit-tap-highlight-color: transparent; }

        /* 分类标签：10 个换行会占掉三行屏幕，窄屏改成**单行横向滚动** */
        .inv-tabs {
          /* ⚠️ 横向滚动时必须靠左：`justify-content: center` 会让溢出的内容
             两边同时被裁掉，左侧那几个分类**永远滚不到**（实测就是"全部/建筑"消失） */
          justify-content: flex-start;
          flex-wrap: nowrap; overflow-x: auto; overflow-y: hidden;
          -webkit-overflow-scrolling: touch;
          max-width: 100%; padding-bottom: 2px;
        }
        .inv-tab {
          /* 窄屏只按图标算宽度（批次 98）：十个分类的图标排一行正好放得下——
             文字标签加起来要四百多像素，手机上必须横向滚才能换分类。
             文字仍然留在 DOM 里（读屏与搜索能读到），只是不显示 */
          font-size: 13px; padding: 7px 10px; min-height: 38px;
          white-space: nowrap; flex: 0 0 auto;
        }
        .inv-tab-label { display: none; }
        /* 物品网格自己滚：翻页条因此始终留在视野里（不用滚到底才能翻页） */
        .inv-grid.inv-creative { max-height: 46vh; overflow-y: auto; }
        /* 翻页键要够大：手机上 44px 是可用下限 */
        .inv-page-button { min-height: 44px; padding: 10px 16px; font-size: 14px; }
        .inv-page-label { font-size: 12px; min-width: 96px; }
        .chat-send { min-height: 42px; padding: 10px 18px; font-size: 14px; }

        /* 世界列表的"名称 + 输入框 + 随机"三列在窄屏挤成一团，改成两行 */
        .world-row { grid-template-columns: 1fr auto; }
        .world-row .world-input { grid-column: 1 / -1; }
      }

      /* 竖屏手机：摇杆与按钮簇都往上收一点，给屏幕中间留出视野 */
      @media (orientation: portrait) and (max-width: 900px) {
        /* ⚠️ 这里的尺寸**必须**乘 `--touch-scale`：竖屏手机是最常见的场景，
           而这几条规则会盖掉上面那些（同优先级、后出现）——不乘的话
           "触摸按钮大小"这个设置项在手机上等于没接线（批次 98 顺手修） */
        #touch-stick {
          left: 18px; bottom: calc(104px + env(safe-area-inset-bottom, 0px));
          width: calc(124px * var(--touch-scale, 1));
          height: calc(124px * var(--touch-scale, 1));
        }
