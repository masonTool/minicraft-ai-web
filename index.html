        font-size: 8px; line-height: 1.2; color: #9a9a9a; text-align: center;
        padding: 0 0 2px; pointer-events: none; text-shadow: 1px 1px 0 #000;
      }
      /* 「全身 / 面部」放在画布下方单独一行：叠在画布上会盖住脚，也点不准 */
      .appearance-focus {
        display: flex; gap: 2px; padding: 2px;
        background: #0d1013;
      }
      .appearance-focus-button {
        flex: 1 1 0; min-width: 0; min-height: 22px;
        font: inherit; font-size: 11px; line-height: 1.3; padding: 2px 0; cursor: pointer;
      }
      body.touch-mode .appearance-focus-button { min-height: 26px; }
      /* 右栏 2 列 × 6 行，行高 30px；`align-content: space-between` 把行均匀撑开，
         容器高度由左侧 stage 的 min-height 决定——两边永远等高。 */
      .appearance-fields {
        flex: 1 1 auto; min-width: 0; height: 100%;
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 10px; align-content: space-between;
      }
      #settings-screen .appearance-fields .settings-row { min-height: 28px; }
      .appearance-presets {
        grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px;
      }
      .appearance-preset {
        flex: 1 1 0; min-width: 0;
        font: inherit; font-size: 11px; line-height: 1.3; padding: 4px 3px;
        text-align: center; white-space: nowrap; cursor: pointer;
      }
      /* 竖屏窄屏才上下堆叠：横屏即使只有 640 宽也要并排（高度更紧张）。 */
      @media (max-width: 640px) {
        .appearance-hero { flex-direction: column; }
        .appearance-stage { flex: 0 0 auto; width: 140px; min-height: 200px; align-self: center; }
        .appearance-fields {
          width: 100%; height: auto;
          grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        }
      }
      /* 恢复默认（批次 185）：整行一颗键，描边偏红——它是"会改掉所有设置"的动作，
         但不像"删除世界"那样不可逆，所以只做提示色、不加二次确认。 */
      .settings-reset-row { padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, .1); }
      .settings-reset {
        grid-column: 1 / -1;
        width: 100%; min-height: 34px; padding: 5px 10px;
        font: inherit; font-size: 13px; cursor: pointer;
        color: #ffd9d6; background: #5a2b28;
        border: 2px solid; border-color: #a0544f #2a1210 #2a1210 #a0544f;
      }
      .settings-reset:active {
        background: #6b332f;
        border-color: #2a1210 #a0544f #a0544f #2a1210;
      }
      /* ---------------- 滑杆（range 自绘，原版形态） ----------------
         原版滑块 = **深色凹槽 + 浅灰方块把手**（把手是一块带斜面的灰块，
         不是圆点、也不是绿色）。用 inset 硬阴影而不是 border：border 会把 track
         撑高，thumb 的 `margin-top` 就对不上了（那条 -6px 由 22 与 10 的差算出）。 */
      .settings-row input[type="range"] {
        appearance: none; -webkit-appearance: none;
        width: 100%; height: 22px; background: transparent; cursor: pointer;
        /* 批次 528（用户）：滑杆填满中间列，右侧读数紧挨着它。
           这样"标签—滑杆—数字"三段之间的左右边距相等（row 的 column-gap = 8px），
           不会再出现"滑杆只到 300px、数字被甩到行尾"的参差。 */
        max-width: none;
      }
      .settings-row input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        background: #1a1a1a;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-row input[type="range"]::-webkit-slider-thumb {
        appearance: none; -webkit-appearance: none;
        width: 12px; height: 22px;
        margin-top: -6px; background: var(--mc-panel);
        border: none;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark),
                    0 0 0 2px var(--mc-outline);
      }
      .settings-row input[type="range"]::-moz-range-track {
        height: 10px; background: #1a1a1a;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-row input[type="range"]::-moz-range-thumb {
        width: 12px; height: 22px; border: none;
        background: var(--mc-panel);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark),
                    0 0 0 2px var(--mc-outline);
      }
      /* 分类小标题：设置项变多之后需要分组，否则一长条看不清 */
      .settings-group {
        margin: 10px 0 -2px; padding-top: 8px; font-size: 12px; color: #a8a8a8;
        border-top: 2px solid rgba(255, 255, 255, .16); letter-spacing: 1px;
      }
      /* 文件选择按钮自绘（原生那个浅灰方块在深色面板上非常突兀） */
      .settings-panel input[type="file"]::file-selector-button {
        font: inherit; font-size: 12px; margin-right: 8px; padding: 5px 10px;
        cursor: pointer; color: var(--btn-text);
        background: var(--btn-bg);
        border: 2px solid var(--mc-outline);
      }
      .settings-panel input[type="file"]::file-selector-button:active { background: var(--mc-face-hover); }
      .settings-row input[type="file"] { font: inherit; font-size: 11px; color: #a8a8a8; }

      /* ---------------- 触摸端：只放大热区，**不动面板尺寸**（批次 110） ----------------
         ⚠️ 面板的宽高从批次 110 起由 `--panel-w` / `--panel-h` 统一给（两页共用、
         固定值）。触摸端**不再自己写一套尺寸**——"换个界面就换一个宽高"正是从
         `body.touch-mode .settings-panel { width: ... }` 这类规则来的。
         这里只留两件事：把行高与热区放大到手指点得准。
         ⚠️ 判据用 `body.touch-mode` 而不是 `@media (max-width: 900px)`：
         平板（1024×768 触摸屏）也该拿这套，而它不命中那个宽度断点。 */
      body.touch-mode .settings-row {
        grid-template-columns: minmax(72px, auto) minmax(0, 1fr) minmax(42px, auto);
        min-height: 34px;
      }
      body.touch-mode .settings-row.pair { grid-template-columns: minmax(72px, auto) minmax(0, 1fr); }
      body.touch-mode .settings-row.action { grid-template-columns: minmax(72px, auto) auto minmax(0, 1fr); }
      body.touch-mode .settings-block { gap: 4px 12px; }
      body.touch-mode .settings-row input[type="range"] { height: 34px; }
      body.touch-mode .settings-row input[type="range"]::-webkit-slider-thumb {
        width: 16px; height: 26px; margin-top: -8px;
      }
      /* 批次 167 / 335：两列并排之后每格只有 ~300px；按钮统一 96px、热区 34px */
      body.touch-mode .settings-cycle,
      body.touch-mode .settings-dropdown-button {
        min-width: var(--settings-ctrl-w); padding: 5px 6px; font-size: 13px;
      }
      body.touch-mode .settings-tab { min-height: 40px; padding: 8px 10px; }
      body.touch-mode .settings-tabs { flex: 0 0 88px; }
      body.touch-mode .settings-back { height: 38px; font-size: 14px; }
      body.touch-mode .pause-action { min-height: 46px; font-size: 15px; }

      /* ================================================================
         手机横屏：**本项目的主要场景**（批次 109）
         ================================================================
         用户点明"我们的游戏在手机端是横屏的"。横屏高度只有 ~390px，所以这里
         只压**主菜单**（标题/按钮列）——设置与暂停面板的尺寸已经由
         `--panel-w/--panel-h` 统一给（固定尺寸，横竖屏不再各写一套）。
         ⚠️ 只对 `body.touch-mode` 生效：桌面端把窗口拉矮时不该突然换一套排法
            （PC 端验收脚本按 1440×900 跑）。 */
      @media (orientation: landscape) and (max-height: 560px) {
        /* 横屏的面板高度只有 ~343px：把暂停菜单的按钮从 46px 收到 42px，
           5 颗按钮 + 标题 + 存档信息刚好放得下（面板尺寸不变，只是里面排得更紧） */
        body.touch-mode .pause-action { min-height: 42px; font-size: 14px; }
        /* 那一小段按键/手势说明在横屏下藏起来（高度实在不够，它会顶出滚动条）——
           PC 竖屏/宽屏都能看到，触屏玩家本来也不需要键盘对照表 */
        body.touch-mode .pause-help { display: none; }

        /* ---- 主菜单：横屏宽度富余、高度紧张 ---- */
        body.touch-mode .world-logo { font-size: 42px; }
        body.touch-mode .world-edition { margin-top: 6px; font-size: 10px; }
        body.touch-mode .world-splash { top: 38px; font-size: 12px; }
        body.touch-mode .world-menu { gap: 8px; margin-top: 10px; }
        body.touch-mode .world-primary { min-height: 44px; font-size: 14px; }
        body.touch-mode .world-secondary { min-height: 44px; }

        /* ---- 设置：横屏只有 ~343px 高，一屏放完全靠"更紧的行 + 更密的列" ----
           （批次 167。面板尺寸仍然不变，只是里面的行压到 30px、循环按钮再收一档） */
        body.touch-mode .settings-row { min-height: 30px; }
        body.touch-mode .settings-block { gap: 2px 12px; }
        body.touch-mode .settings-block + .settings-block { margin-top: 0; padding-top: 4px; }
        body.touch-mode .settings-cycle,
        body.touch-mode .settings-dropdown-button {
          min-width: var(--settings-ctrl-w); padding: 3px 6px; font-size: 12px;
        }
        body.touch-mode .settings-hint { margin: 2px 0 6px; font-size: 11px; }
        /* 批次 333：横屏形象区再收一档，给 11 行外观控件留高度 */
        body.touch-mode .appearance-stage { flex-basis: 88px; width: 88px; height: 158px; }
        body.touch-mode .appearance-preset { min-width: 62px; padding: 4px 3px; font-size: 11px; }
        /* 批次 334：横屏高度紧张，switch 与底部恢复默认再收一档 */
        body.touch-mode .settings-switch { width: 50px; height: 26px; }
        body.touch-mode .settings-switch-knob { width: 18px; height: 18px; }
        body.touch-mode .settings-switch.on .settings-switch-knob { left: 26px; }
        body.touch-mode .settings-footer { margin-top: 2px; padding-top: 4px; }
        body.touch-mode .settings-footer .settings-reset { min-height: 28px; padding: 3px 8px; font-size: 12px; }
      }

      /* ---------------- 状态效果 HUD ---------------- */
      #effects-hud {
        display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
        pointer-events: none; font-size: 12px;
      }
      .effect-chip {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 9px; border-radius: 999px; color: #fff;
        background: var(--hud-bg); border: 1px solid var(--hud-border);
        box-shadow: var(--hud-shadow);
        text-shadow: 1px 1px 0 #000;
      }
      /* 左边一颗小色点标"这是好效果还是坏效果"：整块变色的可读性不如一个明确的点 */
      .effect-chip::before {
        content: ''; width: 7px; height: 7px; border-radius: 50%;
        background: #b9c2cc; box-shadow: 0 0 6px currentColor;
      }
      .effect-chip.good { border-color: #79c46b66; }
      .effect-chip.good::before { background: #79c46b; box-shadow: 0 0 6px #79c46b; }
      .effect-chip.bad { border-color: #d46b6b66; }
      .effect-chip.bad::before { background: #d46b6b; box-shadow: 0 0 6px #d46b6b; }
      .effect-chip.instant { border-color: #6b9cd466; }
      .effect-chip.instant::before { background: #6b9cd4; box-shadow: 0 0 6px #6b9cd4; }

      /* ---------------- 聊天与玩家信息（左上角，批次 206） ----------------
         用户："聊天界面应该显示在左上角，聊天输入框也是左上角；
         玩家被攻击、扣血、掉饥饿值这些信息也在左上角显示。"
         以前它在左下（快捷栏上方），手机上会和摇杆、血条抢地方。 */
      #chat {
        /* z-index 低于背包(10)：打开面板时聊天不该压在面板上（原版也这样）。
           但仍然高于 HUD 与遮罩，游戏里照常可见。 */
        position: fixed; left: 10px; top: calc(8px + env(safe-area-inset-top, 0px));
        z-index: 8;
        width: min(52vw, 620px); display: flex; flex-direction: column; gap: 2px;
        /* 字号（批次 532）：**出现时 = 展开时 ×1.1**。
           - 展开聊天（输入框 / 提示 / 历史）统一 12px，翻 120 行也读得清；
           - 收起时弹出的消息用 13.2px，比展开略大一点，不再用 24px 那种大块头。
           改这里一处即可，别的地方不要写死 px。 */
        --chat-open-size: 12px;
        --chat-pop-size: calc(var(--chat-open-size) * 1.1);
        font-size: var(--chat-open-size); line-height: 1.45; pointer-events: none;
        /* 面板本身不滚动：滚的是里面的 .chat-log，输入框始终留在原地。
           ⚠️ 别把 `--kb-inset` 减在这里：横屏手机本身只有 ~390px 高，键盘一弹
           再减 250px 就把整块压成 0 高（输入框被 flex 挤没），看起来就是"闪一下不见了"。
           键盘在屏幕底部，顶部这块不需要为它让高度；让日志自己算。 */
        max-height: calc(100dvh - 120px);
      }
      #chat.open { pointer-events: auto; }
      /* 消息显示期间点一下直接进聊天（批次 220，用户："在显示时，点击可以立即进入聊天状态"）。
         只有收起状态下**画出来的消息条**接手势：缝隙与空白处照常转视角，
         消息全部过期后 JS 会摘掉 `.peek`，不会在屏幕左上角留一块看不见的点击陷阱。 */
      #chat.peek { cursor: pointer; }
      #chat.peek .chat-log { pointer-events: auto; touch-action: manipulation; }
      /* 输入行固定在最上面（左上角），不许被 flex 压缩 */
      .chat-entry { display: flex; gap: 4px; align-items: stretch; flex: 0 0 auto; }
      .chat-entry.hidden { display: none; }
      .chat-entry .chat-input { flex: 1 1 auto; min-width: 0; }
      .chat-entry .chat-send { flex: 0 0 auto; }
      .chat-hint { flex: 0 0 auto; }
      /* 提示行里的 help 是可点的（批次 534）：点一下把 /help 填进输入框，
         不再单独占一行放按钮。 */
      .chat-help-link {
        font: inherit; font-size: inherit; line-height: inherit;
        padding: 0; margin: 0; cursor: pointer;
        color: #b8f09a; background: none; border: 0;
        text-decoration: underline;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .8);
      }
      .chat-help-link:hover { color: #fff; }
      .chat-log {
        display: flex; flex-direction: column; gap: 1px;
        max-height: 34vh; overflow: hidden;
        /* 触屏滑动查看历史（批次 206）：纵向手势交给这一层滚动 */
        touch-action: pan-y; overscroll-behavior: contain;
        flex: 1 1 auto; min-height: 0;
      }
      /* 打开输入框：铺出更多历史并允许滑动；输入行在上、历史在下 */
      #chat.open .chat-log {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-height: max(56px, calc(100dvh - var(--kb-inset, 0px) - 180px));
        /* 批次 528：展开后与输入框 / 提示同字号，不再"下面大一号" */
        font-size: var(--chat-open-size);
        /* 批次 532（用户）：历史区要是一整块，不能每行之间露出一条白缝 */
        gap: 0;
        background: rgba(0, 0, 0, .42);
      }
      /* 展开时每行不再各自铺一层底色：整块用 .chat-log 的背景，
         否则相邻两行的圆角/边框之间会露出细白线。 */
      #chat.open .chat-line {
        background: transparent;
        padding: 1px .45em;
      }
      /* 键盘弹出时布局视口不再变矮（viewport 是 resizes-visual，批次 184）：
         聊天已经在顶部、输入框不会被键盘挡住，这里只需要把历史高度再收一点，
         由上面那条 `max-height` 里的 `--kb-inset` 负责（由 `ui/Keyboard.ts` 维护）。 */
      /* 收起时（弹出消息）字号是展开时的两倍；用 em 留白，两种字号都不会挤/散 */
      #chat:not(.open) .chat-line { font-size: var(--chat-pop-size); }
      .chat-line {
        padding: .16em .45em; border-radius: var(--radius-sm); color: #fff;
        background: rgba(0, 0, 0, .42);
        border-left: 2px solid rgba(255, 255, 255, .18);
        text-shadow: 1px 1px 0 #000;
        /* 淡出 0.8s：消息整条活 3 秒（2.2s 清晰 + 0.8s 淡出），过渡正好在移出前走完 */
        transition: opacity .8s linear; overflow-wrap: anywhere;
        animation: chat-in var(--dur-med) var(--ease);
        /* 多行反馈（/gamerule）保留换行 */
        white-space: normal;
      }
      /* 多行消息（还有 \n 的旧格式）：保留换行，别再挤成一行 */
      .chat-line.chat-multiline { white-space: pre-wrap; }
      /* 超出一行的消息（批次 279）：默认只显示一行（末尾省略号），点一下展开。
         用 `nowrap + ellipsis` 而不是 `line-clamp`：这样 JS 量 `scrollWidth > clientWidth`
         就是可靠的"到底有没有超"，不依赖 WebKit 对 clamped 元素 scrollHeight 的实现。 */
      .chat-line.collapsible {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      /* 批次 532（用户）：被截断的行要有明确的"展开"提示——
         以前只有末尾省略号，玩家不知道整行可以点。 */
      #chat.open .chat-line.collapsible {
        position: relative;
        padding-right: 30px;
      }
      #chat.open .chat-line.collapsible::after {
        content: '展开';
        position: absolute; right: 3px; top: 50%;
        transform: translateY(-50%);
        padding: 1px 3px;
        font-size: 9px; line-height: 1.3; color: #ffd98a;
        background: rgba(0, 0, 0, .55);
        pointer-events: none;
      }
      .chat-line.collapsible.expanded {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }
      #chat.open .chat-line.collapsible.expanded {
        padding-right: .45em;
      }
      #chat.open .chat-line.collapsible.expanded::after { display: none; }
      /* 新消息淡入并微微上移（原来是一行行"凭空出现"） */
      @keyframes chat-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }

      /* ================================================================
         命令帮助弹窗（批次 533）
         `/help` 不再刷聊天历史；左边命令列表、右边说明 + 表单生成器。
         视觉沿用设置/世界面板：深色底 + 3px 像素斜面 + 暗投影。
         ================================================================ */
      #command-help {
        position: fixed; inset: 0; z-index: 64;
        display: flex; align-items: center; justify-content: center;
        padding: 12px; background: rgba(0, 0, 0, .58);
      }
      #command-help.hidden { display: none; }
      .cmd-help-panel {
        width: min(92vw, 880px); height: min(88dvh, 620px);
        display: flex; flex-direction: column; overflow: hidden;
        padding: 12px 14px;
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        font-size: 13px; text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .cmd-help-header {
        display: flex; align-items: center; gap: 10px;
        flex: 0 0 auto; padding-bottom: 8px;
        border-bottom: 2px solid rgba(255, 255, 255, .16);
      }
      .cmd-help-title { font-size: 15px; color: #fff; white-space: nowrap; }
      .cmd-help-search { flex: 1 1 auto; min-width: 0; }
      .cmd-help-close {
        flex: 0 0 auto; font: inherit; font-size: 13px; line-height: 1;
        min-width: 28px; min-height: 26px; padding: 0 7px; cursor: pointer;
        background: var(--btn-bg); color: var(--btn-text);
        border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .cmd-help-body {
        display: flex; gap: 12px; flex: 1 1 auto; min-height: 0; padding-top: 10px;
      }
      .cmd-help-list {
        width: 184px; flex: 0 0 184px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 2px; padding-right: 4px;
      }
      .cmd-help-item {
        display: block; width: 100%; text-align: left;
        background: transparent; border: 0; border-left: 3px solid transparent;
        color: #d8d8d8; padding: 6px 8px; cursor: pointer; font: inherit;
      }
      .cmd-help-item:hover { background: rgba(255, 255, 255, .08); color: #fff; }
      .cmd-help-item.active {
        background: rgba(108, 195, 73, .16);
        border-left-color: #6cc349; color: #c8f5b5;
      }
      .cmd-help-item-name { display: block; font-size: 12px; color: inherit; }
      .cmd-help-item-desc {
        display: block; margin-top: 1px; font-size: 10px; color: #9a9a9a;
        line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .cmd-help-item.active .cmd-help-item-desc { color: #a9c99b; }
      .cmd-help-empty { padding: 8px; color: #999; font-size: 11px; }
      .cmd-help-detail { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding-right: 2px; }
      .cmd-help-detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cmd-help-detail-head b { font-size: 16px; color: #fff; }
      .cmd-help-tag {
        padding: 1px 5px; font-size: 9px; color: #ffd98a;
        background: rgba(0, 0, 0, .25); border: 1px solid #8a6f2f;
      }
      .cmd-help-usage {
        margin-top: 6px; padding: 6px 8px;
        background: rgba(0, 0, 0, .32); border-left: 3px solid #6cc349;
        color: #fff; font-size: 11px; line-height: 1.45; word-break: break-all;
      }
      .cmd-help-desc {
        margin: 7px 0 4px; color: #c8c8c8; font-size: 12px; line-height: 1.55;
      }
      .cmd-help-note {
        margin: 0 0 10px; color: #9fb08f; font-size: 10px; line-height: 1.45;
      }
      .cmd-help-form {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px 10px;
      }
      .cmd-help-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .cmd-help-field label { font-size: 10px; color: #a8a8a8; }
      .cmd-help-field .world-input { width: 100%; box-sizing: border-box; }
      /* 物品/方块自动联想占满整行，结果列表直接展开在输入框下面（不遮挡其它字段） */
      .cmd-help-field-suggest { grid-column: 1 / -1; }
      .cmd-help-suggest-list {
        display: flex; flex-direction: column;
        max-height: 168px; overflow-y: auto; margin-top: 2px;
        background: #1c1c1c; border: 2px solid rgba(255, 255, 255, .16);
        touch-action: pan-y; overscroll-behavior: contain;
      }
      .cmd-help-suggest-list[hidden] { display: none; }
      .cmd-help-suggest-item {
        font: inherit; font-size: 11px; text-align: left;
        padding: 4px 8px; cursor: pointer;
        background: transparent; border: 0; color: #d8d8d8;
      }
      .cmd-help-suggest-item:hover { background: rgba(108, 195, 73, .18); color: #fff; }
      .cmd-help-combo-custom { margin-top: 4px; }
      .cmd-help-combo-custom[hidden] { display: none; }
      .cmd-help-preview {
        margin-top: 10px; padding: 8px; min-height: 30px;
        background: rgba(0, 0, 0, .38); border: 2px solid rgba(255, 255, 255, .14);
        color: #b8f09a; font-size: 12px; line-height: 1.4; word-break: break-all;
      }
      .cmd-help-preview.bad { color: #ff9b8a; }
      .cmd-help-error { min-height: 14px; margin-top: 4px; color: #ff9b8a; font-size: 10px; }
      .cmd-help-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
      .cmd-help-fill {
        font: inherit; font-size: 13px; min-height: 34px; padding: 6px 16px; cursor: pointer;
        background: #3f6f2d; color: #fff; border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .cmd-help-fill:not(:disabled):hover { background: #4a8236; }
      .cmd-help-fill:disabled { opacity: .5; cursor: default; }
      body.touch-mode .cmd-help-panel {
        width: 96vw; height: min(92dvh, calc(100dvh - 24px)); padding: 10px;
      }
      body.touch-mode .cmd-help-item { min-height: 40px; }
      body.touch-mode .cmd-help-field .world-input { font-size: 13px; padding: 7px 8px; }
      @media (max-width: 620px) {
        .cmd-help-body { flex-direction: column; }
        .cmd-help-list {
          width: 100%; flex: 0 0 auto; max-height: 104px;
          flex-direction: row; overflow-x: auto; overflow-y: hidden;
        }
        .cmd-help-item { min-width: 132px; }
      }
      .chat-line.chat-system { color: #d8e6b0; border-left-color: #a9c46b; }
      .chat-line.chat-error { color: #ff9a8a; border-left-color: #e0604c; }
      .chat-line.chat-player { color: #fff; border-left-color: #7db6f0; }
      /* 玩家信息（批次 206）：受伤 / 回复 / 警告三种一眼能分开 */
      .chat-line.chat-damage { color: #ff9c9c; border-left-color: #d64545; }
      .chat-line.chat-gain { color: #a9e5a0; border-left-color: #57a94a; }
      .chat-line.chat-warning { color: #ffd98a; border-left-color: #d8a028; }
      .chat-line.fading { opacity: .45; }
      .chat-hint {
        padding: 2px 6px; color: #c8c8c8; font-size: var(--chat-open-size);
        background: rgba(0, 0, 0, .35); border-radius: 3px;
      }
      .chat-input {
        font: inherit; font-size: var(--chat-open-size); padding: 5px 8px; border-radius: 3px;
        background: rgba(0, 0, 0, .78); color: #fff; border: 1px solid #ffffff44;
        outline: none;
      }
      /* 触屏的"发送"按钮：与输入框同一行（手机虚拟键盘不一定给 Enter 的 keydown） */
      .chat-send {
        align-self: flex-start; margin-top: 2px; padding: 8px 16px;
        font: inherit; font-size: var(--chat-open-size); color: #fff; cursor: pointer;
        background: #3a7d33; border: 1px solid #ffffff55; border-radius: 4px;
        min-height: 36px;
      }
      .chat-send:active { background: #2f6629; }
      .chat-input.hidden, .chat-hint.hidden, .chat-send.hidden { display: none; }

      /* ---------------- 物品提示框 ---------------- */
      #item-tooltip {
        position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
        max-width: 300px; padding: 9px 12px;
        /* 原版提示框是**近黑的紫底 + 紫色边框**（不是中性灰），文字白字带阴影。
           这里保留"左侧一条稀有度色条"（原版没有，但它是我们唯一能一眼看出品质的地方） */
        background: #100010f2;
        border: 2px solid #2d0a63;
        border-left: 4px solid var(--rarity-common);
        border-radius: 0;
        color: #e6e6e6; font-size: 12px; line-height: 1.55;
        text-shadow: 1px 1px 0 #000;
        box-shadow: 0 0 0 2px var(--mc-outline);
      }
      #item-tooltip.hidden { display: none; }
      /* 稀有度决定左侧色条（标题另外按类名上色，见上面的 .rarity-*） */
      #item-tooltip[data-rarity='uncommon'] { border-left-color: var(--rarity-uncommon); }
      #item-tooltip[data-rarity='rare'] { border-left-color: var(--rarity-rare); }
      #item-tooltip[data-rarity='epic'] { border-left-color: var(--rarity-epic); }
      #item-tooltip .tooltip-title { font-size: 13px; font-weight: 700; }
      #item-tooltip .tooltip-subtitle { color: #7f8c9b; font-size: 11px; margin-bottom: 4px; }
      #item-tooltip .tooltip-desc { color: #d8d8d8; }
      /* 附魔一条一行、青蓝色（与"稀有"同一个色系，一眼能看出是附魔） */
      #item-tooltip .tooltip-enchants { margin-top: 4px; }
      #item-tooltip .tooltip-enchant { color: var(--rarity-rare); font-size: 11px; }
      /* 耐久：文案 + 一条迷你条（快坏了能一眼看出来，不用去读数字） */
      #item-tooltip .tooltip-durability {
        display: flex; align-items: center; gap: 6px;
        margin-top: 5px; color: #b9c2cc; font-size: 11px;
      }
      #item-tooltip .tooltip-durability .dur-bar {
        position: static; width: 56px; height: 4px; flex: none;
      }
      #item-tooltip .tooltip-meta { color: #9a9a9a; font-size: 11px; margin-top: 5px; }

      #break-progress {
        position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
        width: 120px; height: 6px;
        background: rgba(0, 0, 0, .62);
        border-radius: 3px; overflow: hidden; display: none;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .12);
      }
      #break-progress.on { display: block; }
      #break-progress i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#ffffff, #c8c8c8);
        box-shadow: 0 0 8px rgba(255, 255, 255, .5);
      }
      /* 进食进度条（批次 219）：与破坏进度条同一套视觉，位置往上一格。
         两者不会同时出现（挖掘要求准星对着方块，进食要求没对着），所以不打架。 */
      #eat-progress {
        position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%);
        width: 120px; height: 6px;
        background: rgba(0, 0, 0, .62);
        overflow: hidden; display: none;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .12);
      }
      #eat-progress.on { display: block; }
      #eat-progress i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#ffe9a8, #e0b552);
        box-shadow: 0 0 8px rgba(255, 210, 120, .5);
      }

      /* boss 血条（末影龙）：只在 boss 存活时显示 */
      #boss-bar {
        position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
        width: min(420px, 68vw); display: none;
        background: var(--hud-bg);
        border: 1px solid var(--hud-border);
        border-radius: var(--radius-md); padding: 4px 10px 6px;
        text-align: center; color: #fff; font-size: 12px;
        box-shadow: var(--hud-shadow);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .8);
      }
      #boss-bar.on { display: block; }
      #boss-bar b { font-weight: normal; letter-spacing: 1px; }
      #boss-bar i {
        display: block; height: 8px; margin-top: 3px; border-radius: 4px;
        background: rgba(255, 255, 255, .14);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .75);
        overflow: hidden;
      }
      /* 凋灵（批次 116）：同一条血条，只是配色偏暗红——一眼能分出"现在打的是谁" */
      #boss-bar.wither i s {
        background: linear-gradient(#e0665a, #7a1a14);
        box-shadow: 0 0 10px rgba(214, 80, 60, .6);
      }
      /* 护盾期（转阶段那 5 秒）：血条闪蓝，说明"现在打它不掉血" */
      #boss-bar.shielded i s {
        background: linear-gradient(#8fd8ff, #2f7fbf);
        box-shadow: 0 0 10px rgba(120, 200, 255, .7);
      }
      #boss-bar i s {
        display: block; height: 100%; width: 100%;
        background: linear-gradient(#f56cf5, #b02ab0);
        box-shadow: 0 0 10px rgba(214, 59, 214, .6);
        transition: width .18s linear;
      }

      #hotbar .slot .count {
        position: absolute; right: 2px; bottom: 1px; font-size: 12px; color: #fff;
        /* 数字压在图标上有时候看不清，加一圈描边（比单方向阴影更稳） */
        text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
      }
      #hotbar .slot .icon { width: 32px; height: 32px; visibility: hidden; }

      /* ---------------- 背包界面 ---------------- */
      #inventory-screen {
        position: fixed; inset: 0; z-index: 10;
        /* 上行：居中 shell；下行：屏幕底快捷栏 dock（携带版） */
        display: grid;
        grid-template-rows: 1fr auto;
        justify-items: center;
        align-items: center;
        background: rgba(0, 0, 0, .55);
        box-sizing: border-box;
      }
      #inventory-screen.hidden { display: none; }
      /* 携带版外壳：左轨 | 灰框 | 右轨（页签在 border 外，对齐 Wiki） */
      .inv-shell {
        grid-row: 1;
        display: flex; flex-direction: row; align-items: stretch;
        justify-content: center; gap: 0;
        max-width: 100%; max-height: 100%;
        min-width: 0; align-self: center;
      }
      .inv-shell:not(.pocket-chrome) .inv-rail-left,
      .inv-shell:not(.pocket-chrome) .inv-rail-right { display: none; }
      .inv-rail-left, .inv-rail-right {
        display: flex; flex-direction: column; flex: 0 0 auto;
        gap: 4px; z-index: 2;
      }
      .inv-rail-left.hidden, .inv-rail-right.hidden { display: none; }
      .inv-shell.pocket-chrome .inv-rail-left {
        /* 批次 184：用户要求"左侧按钮要一个竖列展示，不要换列"——
           批次 181 为解决截断改成的两列**改回单列**。
           截断问题改由"按钮按可用高度均分"解决（见下面 `.inv-pocket-recipes / .inv-tabs`），
           所以创造模式 10 个分类 + 物品栏共 11 颗也能整列放下，不需要滚动。 */
        justify-content: flex-start; align-items: center;
        gap: 2px;
        padding: 4px 0;
        width: 40px; min-height: 0; max-height: 100%;
        overflow: hidden;
      }
      .inv-shell.pocket-chrome .inv-rail-right {
        justify-content: flex-end; align-items: flex-start;
        padding: 0 0 56px; /* 合成/盔甲贴在灰框右下外侧 */
        width: 40px;
      }
      .inv-shell.pocket-chrome .inv-pocket-side {
        position: static; display: flex; flex-direction: column; gap: 4px;
      }
      /* 右轨的"动作键"（成就，批次 185）：与页签同尺寸，但不吃选中态 */
      .inv-shell.pocket-chrome .inv-rail-right .inv-rail-action {
        width: 36px; height: 36px; min-height: 36px;
      }
      .inv-shell.pocket-chrome .inv-pocket-inv-tab { position: static; }
      .inv-shell.pocket-chrome .inv-pocket-recipes {
        position: static;
        /* 单列竖排（批次 184）。`flex: 1 1 auto` + 内部按钮 `flex: 1 1 0`：
           这一组吃掉左轨剩余高度，按钮再多也只会变矮，不会换列/被截断。 */
        display: flex; flex-direction: column; gap: 2px;
        flex: 1 1 auto; min-height: 0;
        align-items: center;
        overflow: hidden; max-height: none;
      }
      /* 携带版快捷栏：屏幕底、面板外（Wiki）；经典时 dock 隐藏、格回面板内 */
      .inv-hotbar-dock {
        grid-row: 2;
        display: none;
        justify-content: center; align-items: center;
        width: 100%; padding: 6px 12px 12px;
        box-sizing: border-box;
        align-self: end;
      }
      .inv-hotbar-dock:not(.hidden) { display: flex; }
      .inv-hotbar-dock.hidden { display: none !important; }
      /* 快捷栏属于整块屏幕，不属于左右并排后的"背包右半屏"。
         固定到视口底边后，合成页打开配方书时也仍与游戏内 HUD 居中对齐。 */
      .inv-hotbar-dock:not(.hidden) {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
        width: 100vw;
      }
      .inv-hotbar-dock .inv-hotbar {
        margin: 0; width: max-content; max-width: none;
        grid-template-columns: repeat(9, 44px);
        gap: 1px;
      }
      .inv-hotbar-dock .inv-slot {
        width: 44px; height: 44px; min-width: 44px;
        max-width: 44px; max-height: 44px; justify-self: center;
      }
      .inv-hotbar-dock .inv-slot canvas {
        width: 36px; height: 36px; max-width: 36px; max-height: 36px;
      }
      /* Wiki：底栏快捷栏自带一圈灰框，与面板分离 */
      .inv-hotbar-dock:not(.hidden) .inv-hotbar {
        padding: 4px 6px;
        background: var(--panel-bg);
        border: 3px solid; border-color: var(--pixel-bevel);
        box-shadow: var(--panel-shadow);
      }
      /* 打开携带版时藏 HUD 快捷栏 / 经验 / 生命，只留 dock 那一排（对齐 Wiki） */
      body.inv-pocket-open #hotbar,
      body.inv-pocket-open #xp-bar,
      body.inv-pocket-open #xp-level,
      body.inv-pocket-open #vitals {
        visibility: hidden; pointer-events: none;
      }
      /* ---------------- 配方书嵌进背包左栏（批次 157） ----------------
         落脚点是 `.inv-recipe-host`（左栏那一格），配方书把 `.recipe-panel`
         搬进来后自己加 `.embedded`。这里只把它压成"填满这一格、内容在格内滚"。 */
      .recipe-panel.embedded {
        position: relative;
        width: 100%; max-width: 100%;
        height: 100%; max-height: 100%;
        margin: 0; padding: 0 2px;
        box-sizing: border-box;
        display: flex; flex-direction: column;
        overflow: hidden;
        /* 它现在是背包左栏里的**内容**，不是一个套在里面的窗口：
           再画一圈边框 + 阴影就成了"面板里嵌面板"，反而看不清分栏。 */
        background: transparent;
        border: 0;
        box-shadow: none;
        border-radius: 0;
      }
      /* 分类页签就是左轨那排图标，面板内不再重复一排 */
      .recipe-panel.embedded .recipe-tabs { display: none; }
      /* 批次 159：嵌在左栏时**整条标题行都不要**——"配方书"三个字和那颗 ✕ 都去掉。
         配方列表上方再写一次自己是多余的；关闭入口移到标题栏那颗开关上
         （另一个出口是左下"我的物品"页签）。 */
      .recipe-panel.embedded .recipe-header { display: none; }
      .recipe-panel.embedded .recipe-hint,
      .recipe-panel.embedded .recipe-detail { display: none; }
      /* 搜索框只属于放大镜（全部）分类；其余分类像原版一样直接从物品格开始。 */
      .recipe-panel.embedded:not([data-tab='all']) .recipe-controls { display: none; }
      .recipe-panel.embedded .recipe-controls {
        flex: 0 0 auto; margin-bottom: 6px;
      }
      .recipe-panel.embedded .recipe-search {
        min-width: 0; height: 30px; box-sizing: border-box;
      }
      .recipe-panel.embedded .recipe-filter {
        width: 30px; height: 30px;
      }
      /* 批次 159：「只显示我拥有的」已经搬到标题栏那颗开关上了，
         面板里再留一颗同样的就是把同一个开关做成两个（且两个不会同步）。 */
      .recipe-panel.embedded .recipe-filter { display: none; }
      /* 只有这一格能滚：外框与左栏网格都不动。
         列数必须与 `RECIPE_PANE_PAGE_SIZE` 对上（7 列 × 4 行），
         半栏宽塞不下 12 列 / 8 列——硬塞会被 `overflow-x: hidden` 裁掉。 */
      .recipe-panel.embedded .recipe-grid {
        grid-template-columns: repeat(7, var(--recipe-cell));
        flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
        overscroll-behavior: contain;
        align-content: start;
      }
      /* 熔炼属于熔炉界面；嵌在左栏时整张熔炼表会把配方网格压成一条缝 */
      .recipe-panel.embedded .recipe-smelting { display: none; }
      /* 批次 159：触摸端改成整表滚动，滚动条要**看得见**——
         看不见就不知道下面还有东西（PC 那条路是底部翻页键，用不上滚动条）。 */
      .recipe-panel.embedded .recipe-grid,
      .inv-panel.creative-ui.pocket-ui .inv-creative {
        scrollbar-width: thin;
        scrollbar-color: #6f6f6f #b9b9b9;
      }
      .recipe-panel.embedded .recipe-grid::-webkit-scrollbar,
      .inv-panel.creative-ui.pocket-ui .inv-creative::-webkit-scrollbar { width: 8px; }
      .recipe-panel.embedded .recipe-grid::-webkit-scrollbar-track,
      .inv-panel.creative-ui.pocket-ui .inv-creative::-webkit-scrollbar-track { background: #b9b9b9; }
      .recipe-panel.embedded .recipe-grid::-webkit-scrollbar-thumb,
      .inv-panel.creative-ui.pocket-ui .inv-creative::-webkit-scrollbar-thumb {
        background: #6f6f6f; border: 1px solid #4a4a4a;
      }
      .recipe-panel.embedded .inv-pager {
        flex: 0 0 auto; margin-top: 4px; gap: 4px;
      }
      .recipe-panel.embedded .inv-page-button {
        min-width: 34px; min-height: 30px; padding: 2px 7px;
        font-size: 0; position: relative;
      }
      .recipe-panel.embedded .inv-page-button::after { font-size: 15px; }
      .recipe-panel.embedded .inv-page-button[data-role='prev']::after { content: '‹'; }
      .recipe-panel.embedded .inv-page-button[data-role='next']::after { content: '›'; }
      .recipe-panel.embedded .inv-page-label { font-size: 11px; }

      .inv-panel {
        background: var(--panel-bg);
        /* 像素斜角（批次 108）：左上亮、右下暗的一圈硬边，直角 */
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius);
        padding: 14px 16px;
        /* 贴合内容：固定 660px 时"主背包"右边会空出一大片灰（看着像没排好版） */
        width: fit-content; min-width: min(420px, 92vw);
        max-width: 660px; max-height: 92vh; overflow-y: auto;
        box-shadow: var(--panel-shadow);
      }
      .inv-header {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 8px 18px; flex-wrap: wrap;
        color: var(--panel-text); font-size: 14px;
        padding-bottom: 8px; margin-bottom: 4px;
        border-bottom: 2px solid #a9a9a9;
      }
      .inv-header b { font-size: 16px; letter-spacing: 1px; }
      .inv-header kbd {
        padding: 0 4px; border: 1px solid #777; border-radius: 3px;
        background: #e6e6e6; font-size: 12px;
      }
      /* 分区标题：前面一小条强调色（比纯文字更"分得开"，也不占地方） */
      .inv-label { color: #3a3a3a; font-size: 12px; margin: 10px 0 5px; letter-spacing: .5px; }
      .inv-label::before {
        content: ''; display: inline-block; width: 3px; height: 11px;
        margin-right: 6px; vertical-align: -1px;
        background: var(--accent); border-radius: 2px;
      }

      .inv-craft { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 8px; }
      .inv-craft-grid.size-2 { grid-template-columns: repeat(2, 42px); }
      .inv-craft-grid.size-3 { grid-template-columns: repeat(3, 42px); }
      .inv-arrow { position: relative; font-size: 22px; color: #4a4a4a; }
      /* 箭头旁边"需要什么站台"的图标组（批次 185，批次 531 支持多个）。
         横排合成：在箭头上方正中间排开；竖排合成（手机）改挂箭头右侧竖排——
         上方是 2×2 材料格，挂上去会盖住最后一排。
         图标本身是按钮（可点击看说明），容器不接手势。 */
      .inv-craft-stations {
        position: absolute; left: 50%; bottom: calc(100% + 4px);
        transform: translateX(-50%);
        display: flex; align-items: center; justify-content: center; gap: 3px;
        flex-wrap: wrap; max-width: 128px;
        z-index: 2; pointer-events: none;
      }
      .inv-craft-stations.hidden { display: none; }
      .inv-craft-station-icon {
        width: 20px; height: 20px; padding: 0; flex: 0 0 auto;
        display: grid; place-items: center; cursor: pointer;
        background: #3a3a3a; border: 2px solid; border-radius: 0;
        border-color: #d0d0d0 #4a4a4a #4a4a4a #d0d0d0;
        box-shadow: 0 1px 0 rgba(0, 0, 0, .4);
        pointer-events: auto; touch-action: manipulation;
      }
      .inv-craft-station-icon:active { background: #5a5a5a; }
      .inv-craft-station-icon canvas { width: 14px; height: 14px; image-rendering: pixelated; }
      .inv-craft.inv-craft-vertical .inv-craft-stations {
        left: auto; right: -24px; top: 50%; bottom: auto;
        transform: translateY(-50%);
        flex-direction: column; flex-wrap: nowrap; max-width: 24px;
      }
      /* 能合成 / 能取走的槽位：一层柔和的强调底（比原来纯色块更"活"） */
      .inv-slot.ready {
        background: linear-gradient(#9fce9c, #86b083);
        box-shadow: inset 0 0 10px rgba(120, 220, 120, .35);
      }
      /* 只取不放的槽位（合成结果、熔炉产物）用暖色底提示 */
      .inv-slot.take-only { background: linear-gradient(#a8a897, #93937f); }
      /* 缺料预览的产物（批次 206）：能看见"会做出什么"，但明确不是可取的实物 */
      .inv-slot.preview-result {
        background: linear-gradient(#a89a8a, #8f8478);
        box-shadow: inset 0 0 0 2px rgba(255, 210, 120, .35);
      }
      .inv-slot.preview-result canvas { opacity: .78; }

      /* ---------------- 铁砧（H8） ---------------- */
      .anvil-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .anvil-row { display: flex; align-items: flex-end; gap: 8px; }
      .anvil-row .inv-label { align-self: flex-end; padding-bottom: 4px; }
      .anvil-side { display: flex; flex-direction: column; gap: 6px; min-width: 190px; flex: 1; }
      .anvil-name {
        font: inherit; font-size: 12px; padding: 5px 7px; color: #2b2b2b;
        background: #b8b8b8; border: 2px solid; border-color: #6a6a6a #ffffff #ffffff #6a6a6a;
      }
      .anvil-name::placeholder { color: #5f5f5f; }
      .anvil-cost { font-size: 12px; color: #2b5a2b; min-height: 16px; }
      .anvil-cost.bad { color: #7a2020; }

      /* ---------------- 切石机（H11，批次 44） ---------------- */
      /* 左边一格输入、右边一列"能切出什么"；窄屏时上下堆叠（手机竖屏也能用） */
      .stonecutter-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .stonecutter-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .stonecutter-col .inv-label { align-self: flex-start; }
      .stonecutter-right { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
      .stonecutter-list { display: flex; flex-wrap: wrap; gap: 4px; }
      /* 每一项都是"图标 + 名字 ×份数"，一眼能看出切成什么、切出几件 */
      .stonecutter-option {
        display: flex; align-items: center; gap: 6px;
        font: inherit; font-size: 12px; text-align: left; padding: 4px 8px 4px 4px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .stonecutter-option canvas { width: 28px; height: 28px; image-rendering: pixelated; }
      .stonecutter-option:active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }

      /* ---------------- 村民交易（J11，批次 88） ---------------- */
      /* 一条交易 = [他收的] → [他给的] + 剩余次数：比原版那套"两个收货格"更适合手指 */
      .trade-info { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
      .trade-level { display: flex; flex-direction: column; gap: 2px; }
      .trade-who { font-size: 14px; color: var(--panel-text); }
      .trade-xp { font-size: 12px; color: #4a4a4a; }
      .trade-list { flex-direction: column; align-items: stretch; }
      .trade-option { flex-wrap: wrap; }
      /* 交易两边的图标都小一号（一屏要放 6~8 条） */
      .trade-option canvas { width: 24px; height: 24px; }
      .trade-cost, .trade-gain { display: flex; align-items: center; gap: 2px; }
      .trade-cost span, .trade-gain span { font-size: 12px; }
      .trade-arrow { color: #3a3a3a; padding: 0 2px; }
      .trade-uses { margin-left: auto; font-size: 11px; color: #4a4a4a; }
      .trade-note { flex-basis: 100%; font-size: 11px; color: #8a3a3a; }
      /* 材料不够 / 次数用完：整条压暗（**不用 disabled**——禁用的按钮收不到悬停提示，
         而"为什么不能点"正是玩家最需要看到的；点击时也给提示） */
      .trade-option.blocked { filter: brightness(.82); }
      .trade-option.blocked .trade-gain { opacity: .6; }

      /* ---------------- 营火（批次 47） ---------------- */
      /* 4 个格子排成一行，每格下面一条自己的进度条 */
      .campfire-grid { display: flex; gap: 8px; flex-wrap: wrap; }
      .campfire-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .campfire-cook { width: 42px; }
      .campfire-side { display: flex; flex-direction: column; gap: 4px; min-width: 170px; flex: 1; }

      /* ---------------- 附魔台（H9） ---------------- */
      .enchant-layout { display: flex; gap: 14px; align-items: flex-start; }
      .enchant-col {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .enchant-col .inv-label { align-self: flex-start; }
      .enchant-options { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
      .enchant-option {
        font: inherit; font-size: 12px; text-align: left; padding: 6px 10px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 点得动的候选用暖色高亮（与原版"能附魔的那几行会发光"同一个意思） */
      .enchant-option.on { background: #d8c8f0; border-color: #ffffff #4a3a6a #4a3a6a #ffffff; }
      .enchant-option:disabled { color: #6a6a6a; cursor: not-allowed; }
      .enchant-option:not(:disabled):active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      .enchant-status { font-size: 12px; color: #2b5a2b; min-height: 16px; }
      .enchant-status.bad { color: #7a2020; }
      .enchant-hint { font-size: 11px; color: #5a5a5a; margin-top: 2px; }

      /* ---------------- 玩家那一块的两列（批次 111，对齐原版） ----------------
         原版物品栏：**左栏是盔甲 4 格竖排 + 副手**，右栏是"合成 / 容器 + 3×9 主背包
         + 9 快捷栏"。原来我们是竖着堆五段、每段还带一行文字标签（「主背包 / 快捷栏 /
         盔甲与副手」）——原版没有这些字，靠位置和一道缝就能分清。
         ⚠️ 两列用 fixed 的 grid-column/row 定位而不是 DOM 顺序：`topArea`
         （随模式切换的合成/箱子/熔炉）在构造函数里先于装备列被建出来。 */
      .inv-body { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
      .inv-gear {
        grid-column: 1; grid-row: 1;
        display: flex; flex-direction: row; align-items: flex-start; gap: 8px;
      }
      /* 玩家预览剪影（批次 141）：盔甲列右侧；色块占位，不是可换皮肤 */
      .inv-player-preview {
        width: 48px; height: 100px; image-rendering: pixelated;
        background: rgba(0, 0, 0, 0.12);
        border: 2px solid; border-color: #5a5a5a #c8c8c8 #c8c8c8 #5a5a5a;
        flex: 0 0 auto;
        /* 3D 预览（批次 185）：拖它转一圈；别让触摸拖动变成滚动页面/背包 */
        touch-action: none;
        cursor: grab;
      }
      .inv-main { grid-column: 2; grid-row: 1; display: flex; flex-direction: column; gap: 4px; }
      /* 快捷栏与主背包之间空一道缝（原版这两排是紧挨着的，靠缝区分） */
      .inv-main .inv-hotbar { margin-top: 5px; }

      /* ---------------- 携带版分标签页（批次 140 → 146） ----------------
         Wiki：合成 / 盔甲 / 物品栏互斥；左轨配方书图标；右轨合成/盔甲；
         左下箱子；快捷栏在屏幕底（面板外）。经典 UI（≥1280）不走这套。 */
      .inv-pocket-recipes {
        display: flex; gap: 4px; align-items: center; flex: 0 0 auto;
      }
      .inv-pocket-recipes.hidden { display: none; }
      .inv-pocket-recipe-tab {
        width: 36px; height: 36px; padding: 0; cursor: pointer;
        display: grid; place-items: center;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .inv-pocket-recipe-tab canvas { width: 16px; height: 16px; image-rendering: pixelated; }
      .inv-pocket-recipe-tab:active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
      /* 批次 159：点中哪一分类就**一直保持按下**的样子（斜面翻进去 + 底色亮一档），
         与创造分类页签 `.inv-tab.active` 同一套——点完看不出选中的那颗等于没反馈。 */
      .inv-pocket-recipe-tab.active {
        background: #dcdec4; border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
      }
      .inv-pocket-recipe-tab.active canvas { opacity: 1; }
      /* 批次 146：页签在 .inv-rail-*（灰框外）；.inv-pocket-tabs 仅 role/.hidden 哨兵 */
      .inv-pocket-tabs {
        position: absolute; width: 0; height: 0; overflow: hidden; pointer-events: none;
      }
      .inv-pocket-tabs.hidden { display: none; }
      .inv-pocket-side {
        display: flex; flex-direction: column; gap: 4px;
      }
      .inv-pocket-inv-tab { flex: 0 0 auto; }
      .inv-pocket-tab {
        width: 36px; height: 36px; padding: 0; cursor: pointer;
        display: grid; place-items: center;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
        box-sizing: border-box;
      }
      .inv-pocket-tab canvas { width: 20px; height: 20px; image-rendering: pixelated; }
      .inv-pocket-tab.active {
        background: #dcdec4; border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
      }
      /* 选中页签贴紧灰框（Wiki：active 页与面板连成一块） */
      .inv-shell.pocket-chrome .inv-rail-left .inv-pocket-tab.active,
      .inv-shell.pocket-chrome .inv-rail-left .inv-tab.active {
        margin-right: -3px;
      }
      .inv-shell.pocket-chrome .inv-rail-right .inv-pocket-tab.active {
        margin-left: -3px;
      }
      .inv-recipes-btn.hidden { display: none; }
      .inv-armor-title {
        display: none;
        width: 100%; text-align: center;
        color: #3a3a3a; font-size: 14px; font-weight: 700;
        letter-spacing: 1px; margin: 0 0 6px;
      }
      .inv-gear-row {
        display: flex; flex-direction: row; align-items: flex-start; gap: 8px;
      }
      .inv-panel.pocket-ui[data-pocket-tab='armor'] .inv-armor-title { display: block; }
      .inv-panel.pocket-ui[data-pocket-tab='armor'] .inv-gear {
        flex-direction: column; align-items: center;
      }

      .inv-panel.pocket-ui {
        position: relative;
        display: flex; flex-direction: column;
        /* 页签已在轨上：灰框只需内容 padding；底留给关闭行即可 */
        padding: 8px 12px 10px;
        box-sizing: border-box;
        overflow: hidden;
        min-width: 0;
        /* 普通背包按 9×44px 槽位反推宽度，不再继承通用 760px 设置面板。
           9 格 × 44 + 8 条 2px 缝 + 内边距/边框 ≈ 438px。 */
        width: var(--inv-pocket-w);
        max-width: var(--inv-pocket-w);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
        /* 给底栏 dock 留出垂直空间 */
        max-height: min(72vh, calc(100vh - 72px));
        flex: 0 1 auto;
      }
      .inv-panel.pocket-ui .inv-header-hint { display: none; }
      /* 批次 159：标题栏改成**三列网格**——左两列平分（配方开关落在左列的右端，
         也就是"左栏的右上角、比较靠中间"），最右一列留给关闭键。
         原来整条 flex-end 会把开关和关闭键挤在一起，分不清哪颗是开关。 */
      .inv-panel.pocket-ui .inv-header {
        flex: 0 0 auto;
        display: grid; grid-template-columns: 1fr 1fr auto;
        align-items: center; gap: 0 8px;
        padding: 0 0 6px; margin: 0;
        border-bottom: 2px solid #a9a9a9;
      }
      .inv-panel.pocket-ui .inv-header > b { display: none; }
      /* 携带版标题栏只留关闭 + 配方开关；成就等其它按钮仍藏 */
      .inv-panel.pocket-ui .inv-header .inv-recipes-btn:not(.inv-creative-toggle):not(.inv-pocket-recipe-toggle) { display: none; }
      .inv-panel.pocket-ui .inv-header .inv-pocket-recipe-toggle { grid-column: 1; justify-self: end; }
      .inv-panel.pocket-ui .inv-header .inv-close { grid-column: 3; justify-self: end; }
      /* 工作站里把标题栏配方书拉到左栏分隔线左侧（批次 321） */
      .inv-panel.pocket-ui.station-ui .inv-header { position: relative; }
      .inv-panel.pocket-ui.station-ui .inv-header .inv-pocket-recipe-toggle {
        position: absolute; top: 0;
        right: calc(100% - var(--station-left-width, 50%) + 8px);
        /* 再向左挪半个按钮宽度（批次 322） */
        transform: translateX(-50%);
      }
      .inv-panel.pocket-ui.station-ui .inv-header .inv-pocket-recipe-toggle.active {
        transform: translate(-50%, 1px);
      }
      /* 批次 159：开关开着 = "本分类全部列出、不拥有的红底"，按下去的样子要跟
         左轨那排分类页签一致（同一套斜面 + 亮一档的底色），否则两种"选中"
         看起来是两种东西。关着 = 只显示自己拥有的。 */
      .inv-panel.pocket-ui .inv-header .inv-pocket-recipe-toggle.active {
        background: #dcdec4;
        border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
        transform: translateY(1px);
      }
      /* 批次 184：用户要求"关闭按钮和配方按钮小一点，那一层不要那么高，缩到之前的 1/2"。
         这里只压标题那一行（它没有标题字，只有两颗键），内容区因此多出约 16px 高度。 */
      .inv-panel.pocket-ui .inv-close { min-width: 24px; min-height: 20px; padding: 0 6px; font-size: 12px; line-height: 1.1; }

      /* 内容区在框内滚动；格子永远 9 列自适应，禁止撑破灰框 */
      .inv-panel.pocket-ui .inv-body {
        flex: 1 1 auto; min-height: 0; min-width: 0;
        width: 100%;
        overflow-x: hidden; overflow-y: auto;
        overscroll-behavior: contain;
        grid-template-columns: 1fr;
        justify-items: stretch;
        align-content: start;
      }
      .inv-panel.pocket-ui .inv-gear,
      .inv-panel.pocket-ui .inv-main {
        grid-column: 1; grid-row: auto; width: 100%; min-width: 0;
      }
      /* 主背包/快捷栏才是 9 列；合成 2×2、盔甲竖列不要被这条盖掉 */
      .inv-panel.pocket-ui .inv-main > .inv-grid,
      .inv-hotbar-dock .inv-hotbar {
        grid-template-columns: repeat(9, 44px);
        gap: 2px;
      }
      .inv-panel.pocket-ui .inv-main {
        width: max-content;
        max-width: 100%;
        margin: 0 auto;
      }
      /* 批次 159：左栏上方那行「物品栏」不要（基岩版左栏没有这行字），
         界面里也不再显示它（`applyInventoryChrome` 恒为 none）。 */
      .inv-personal-title {
        display: none; width: 100%; color: #3a3a3a;
        font-size: 12px; line-height: 16px; text-align: left;
      }
      .inv-panel.pocket-ui .inv-main > .inv-grid .inv-slot,
      .inv-hotbar-dock .inv-slot {
        width: 44px; height: 44px; min-width: 44px;
        max-width: 44px; max-height: 44px; justify-self: center;
      }
      .inv-panel.pocket-ui .inv-main > .inv-grid .inv-slot canvas,
      .inv-hotbar-dock .inv-slot canvas {
        width: 36px; height: 36px; max-width: 36px; max-height: 36px;
      }
      .inv-panel.pocket-ui .inv-craft-grid.size-2 {
        grid-template-columns: repeat(2, minmax(36px, 42px));
        gap: 4px; width: auto;
      }
      .inv-panel.pocket-ui .inv-craft-grid.size-3 {
        grid-template-columns: repeat(3, 36px);
        gap: 2px; width: max-content;
      }
      .inv-panel.pocket-ui .inv-craft-grid.size-2 .inv-slot {
        width: 42px; height: 42px; max-width: 42px; max-height: 42px;
      }
      .inv-panel.pocket-ui .inv-craft-grid.size-3 .inv-slot {
        width: 36px; height: 36px; max-width: 36px; max-height: 36px;
      }
      .inv-panel.pocket-ui.workbench-ui .inv-craft { margin: 0; }
      .inv-panel.pocket-ui .inv-grid.inv-armor {
        grid-template-columns: minmax(0, 40px);
      }
      .inv-panel.pocket-ui .inv-grid.inv-armor .inv-slot {
        max-width: 40px; max-height: 40px;
      }

      /* 物品栏页：只有 3×9（快捷栏在屏幕底 dock） */
      .inv-panel.pocket-ui[data-pocket-tab='inventory'] .inv-gear { display: none; }
      .inv-panel.pocket-ui[data-pocket-tab='inventory'] .inv-body {
        display: flex; flex-direction: column; justify-content: center;
      }
      .inv-panel.pocket-ui[data-pocket-tab='inventory'] .inv-main { max-width: 100%; }

      /* 盔甲页：左主背包 + 右装备（Wiki） */
      .inv-panel.pocket-ui[data-pocket-tab='armor'] .inv-body {
        grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 8px;
      }
      .inv-panel.pocket-ui[data-pocket-tab='armor'] .inv-main {
        grid-column: 1; grid-row: 1; width: 100%;
      }
      .inv-panel.pocket-ui[data-pocket-tab='armor'] .inv-gear {
        grid-column: 2; grid-row: 1; display: flex; flex-direction: column;
        align-items: center; flex: 0 0 auto;
      }

      /* 合成页：居中 2×2，不撑高到溢出 */
      .inv-panel.pocket-ui[data-pocket-tab='crafting'] .inv-body {
        place-content: start center; justify-items: center;
      }
      .inv-panel.pocket-ui[data-pocket-tab='crafting'] .inv-top {
        width: auto; max-width: 100%; display: flex; justify-content: center;
      }
      /* 世界里的工作台：3×3 合成在上、玩家物品栏在下；不是单独一块 760px 通用面板。 */
      .inv-panel.pocket-ui.workbench-ui .inv-body {
        display: grid; grid-template-columns: 1fr; align-content: start;
      }
      .inv-panel.pocket-ui.workbench-ui .inv-main {
        width: 100%; max-width: 100%;
      }
      /* Wiki 携带版合成：2×2 在上 → 箭头朝下 → 产物在下 */
      .inv-panel.pocket-ui .inv-craft.inv-craft-vertical {
        flex-direction: column; gap: 2px; align-items: center;
        margin: 0;
      }
      /* 2×2 合成页还要在同高右窗里完整露出 3×9 个人仓库；
         保持基岩版“上方材料 → 下方产物”的纵向语义，只压缩示意格，不缩玩家物品格。 */
      .inv-panel.pocket-ui .inv-craft.inv-craft-vertical .inv-craft-grid.size-2 {
        grid-template-columns: repeat(2, 30px);
        gap: 2px;
      }
      .inv-panel.pocket-ui .inv-craft.inv-craft-vertical .inv-craft-grid.size-2 .inv-slot {
        width: 30px; height: 30px; min-width: 30px;
        max-width: 30px; max-height: 30px;
      }
      .inv-panel.pocket-ui .inv-craft.inv-craft-vertical .inv-craft-grid.size-2 .inv-slot canvas {
        width: 28px; height: 28px; max-width: 28px; max-height: 28px;
      }
      .inv-panel.pocket-ui .inv-craft.inv-craft-vertical > .inv-slot {
        width: 32px; height: 32px; min-width: 32px;
        max-width: 32px; max-height: 32px;
      }
      .inv-panel.pocket-ui .inv-craft.inv-craft-vertical .inv-arrow {
        font-size: 14px; line-height: 1; transform: none;
      }
      /* ⚠️ 不要对 .inv-main 设 display:none——topArea（2×2 合成）就在 .inv-main 里 */
      .inv-panel.pocket-ui .inv-creative-section {
        flex: 1 1 auto; min-height: 0; overflow: hidden;
        display: flex; flex-direction: column;
      }
      /* 携带版创造：分类已在左轨；面板内只留搜索 + 网格 + 销毁 */
      .inv-panel.creative-ui.pocket-ui {
        width: var(--inv-pocket-w);
        max-width: var(--inv-pocket-w);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
      }
      .inv-panel.creative-ui.pocket-ui .inv-creative-section {
        display: flex; flex-direction: column; gap: 6px;
        min-height: 0; overflow: hidden; flex: 1 1 auto;
      }
      .inv-panel.creative-ui.pocket-ui .inv-creative-section > .inv-label { display: none; }
      .inv-panel.creative-ui.pocket-ui .inv-creative-controls {
        display: flex; flex-direction: row; flex-wrap: nowrap;
        align-items: center; gap: 6px; margin: 0;
      }
      /* 分类已挪到左轨时，controls 里不应再占位 */
      .inv-shell.pocket-chrome .inv-rail-left .inv-tabs {
        /* 单列竖排（批次 184）：10 个创造分类按左轨剩余高度均分，不换列 */
        display: flex; flex-direction: column; gap: 2px;
        flex: 1 1 auto; min-height: 0;
        align-items: center;
        overflow: hidden; max-height: none;
      }
      .inv-shell.pocket-chrome .inv-rail-left .inv-tab .inv-tab-label { display: none; }
      .inv-shell.pocket-chrome .inv-rail-left .inv-tab {
        width: 36px; min-width: 36px; padding: 0;
        height: auto; min-height: 20px; max-height: 36px;
        display: grid; place-items: center; flex: 1 1 0;
        box-sizing: border-box;
      }
      /* 同一条"均分"规则也管生存那 5 个分类与左下那颗物品栏键 */
      .inv-shell.pocket-chrome .inv-rail-left .inv-pocket-recipe-tab {
        width: 36px; min-width: 36px;
        height: auto; min-height: 20px; max-height: 36px;
        flex: 1 1 0; box-sizing: border-box;
      }
      /* 物品栏键是这一列的"出口"，固定高度，不参与均分 */
      .inv-shell.pocket-chrome .inv-rail-left .inv-pocket-inv-tab {
        flex: 0 0 auto; width: 36px; height: 34px; min-height: 34px; max-height: 34px;
      }
      /* 按钮被压矮时图标跟着收，不能被裁掉一半 */
      .inv-shell.pocket-chrome .inv-rail-left .inv-tab canvas,
      .inv-shell.pocket-chrome .inv-rail-left .inv-pocket-recipe-tab canvas,
      .inv-shell.pocket-chrome .inv-rail-left .inv-pocket-tab canvas {
        width: 18px; height: 18px; max-width: 100%; max-height: 100%;
      }
      .inv-shell.pocket-chrome .inv-rail-left .inv-tab svg,
      .inv-shell.pocket-chrome .inv-rail-left .inv-pocket-tab svg {
        max-width: 100%; max-height: 100%;
      }
      .inv-panel.creative-ui.pocket-ui .inv-search {
        width: 100%; min-width: 0; flex: 1 1 auto;
        box-sizing: border-box;
      }
      .inv-panel.creative-ui.pocket-ui .inv-creative {
        min-height: min(38vh, 200px);
        max-height: min(42vh, 220px);
        overflow-x: hidden; overflow-y: auto;
        width: 100%;
        align-content: start;
        justify-content: center;
        grid-template-columns: repeat(10, 44px);
        gap: 2px;
      }
      .inv-panel.creative-ui.pocket-ui .inv-creative .inv-slot {
        width: 44px; height: 44px; max-width: 44px; max-height: 44px;
      }
      .inv-panel.creative-ui.pocket-ui .inv-pager { display: none !important; }

      /* ---------------- 携带版统一双栏（批次 156） ----------------
         生存与创造都用同一副壳：左边角色物品/配方/创造物品，右边合成或装备。
         不再点一次页签就把整扇窗口换成另一种宽高。 */
      .inv-panel.pocket-ui.pocket-dual {
        width: min(calc(100vw - 88px), 800px);
        max-width: min(calc(100vw - 88px), 800px);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
      }
      .inv-panel.pocket-ui.pocket-dual .inv-header {
        position: relative;
        /* 批次 184：34px → 18px（约 1/2）。这一行只有"配方开关 + 关闭键"，没有标题字，
           留着那么高只是把下面的格子挤小。 */
        min-height: 18px;
        padding: 0 0 2px;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-header .inv-pocket-recipe-toggle:not(.hidden) {
        display: block;
        position: absolute;
        left: calc(50% - 28px);
        top: 0;
        min-width: 24px;
        min-height: 18px;
        padding: 0 5px;
        font-size: 0;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-header .inv-pocket-recipe-toggle::after {
        content: '▦';
        font-size: 14px;
        line-height: 1;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-body {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        grid-template-rows: auto minmax(0, 1fr);
        gap: 6px 14px;
        width: 100%;
        overflow: hidden;
        align-items: start;
      }
      /* mainColumn 只是代码层的分组；视觉上让它的三个孩子直接进入双栏网格。 */
      .inv-panel.pocket-ui.pocket-dual .inv-main { display: contents; }
      .inv-panel.pocket-ui.pocket-dual .inv-personal-title {
        display: block;
        grid-column: 1;
        grid-row: 1;
        text-align: center;
      }
      /* 批次 181：双栏左栏**统一 7 列**。
         原来主背包是 9×36px（9×36 + 8×2 = 340px），左栏实际只有 ~330px，
         第一格被 `justify-self: center` 推到容器外面——用户看到的"第一格被挤掉一部分"。
         现在与物品分类/创造栏一样 7 列 × 40px（7×40 + 6×2 = 292px），
         27 格排成 4 行；切左侧按钮时**槽位几何完全不变**，只换槽内物品。 */
      .inv-panel.pocket-ui.pocket-dual .inv-main > .inv-grid {
        grid-column: 1;
        grid-row: 2;
        align-self: start;
        justify-self: center;
        grid-template-columns: repeat(7, 40px);
        gap: 2px;
        max-height: none;
        overflow: visible;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-main > .inv-grid .inv-slot {
        width: 40px;
        height: 40px;
        min-width: 40px;
        max-width: 40px;
        max-height: 40px;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-main > .inv-grid .inv-slot canvas {
        width: 32px;
        height: 32px;
        max-width: 32px;
        max-height: 32px;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-top {
        grid-column: 2;
        grid-row: 1 / span 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-left: 2px solid #8a8a8a;
        box-sizing: border-box;
      }
      /* ---------------- 工作站双栏（批次 276） ----------------
         左栏固定 7×40 的玩家主背包（与工作台同一套几何），右栏是该工作站的操作区。
         面板比普通背包宽：工作站没有左右轨，省下来的 64px 给操作区。 */
      .inv-panel.pocket-ui.pocket-dual.station-ui {
        width: min(calc(100vw - 24px), 800px);
        max-width: min(calc(100vw - 24px), 800px);
      }
      .inv-panel.pocket-ui.pocket-dual.station-ui .inv-body {
        grid-template-columns: auto minmax(0, 1fr);
      }
      .inv-panel.pocket-ui.pocket-dual.station-ui .inv-top {
        min-width: 0;
        /* 铁砧/酿造/切石机这类宽操作区在自己的右栏里滚，不把整块面板撑破。
           ⚠️ 不能居中：内容高于右栏时，居中的 flex 会把顶部溢出到滚动区之外。
           批次 293：工作区 + 下方"需要xxx"改成竖排，说明永远贴在工作区下面。 */
        flex-direction: column;
        align-items: stretch;
        justify-content: flex-start;
        overflow: auto;
      }
      /* 工作区下方那块提示（批次 293）：站台图标 + 需要xxx + 原料/产物图标与名字 */
      .inv-station-hint {
        display: flex;
        flex-direction: column;
        gap: 4px;
        width: 100%;
        box-sizing: border-box;
        margin: 0 0 8px;
        padding: 6px 8px;
        background: rgba(0, 0, 0, .08);
        border: 1px solid rgba(0, 0, 0, .18);
        color: #2b2b2b;
        font-size: 12px;
        line-height: 1.4;
      }
      .inv-station-hint.hidden { display: none; }
      .inv-station-hint-title {
        display: flex; align-items: center; gap: 6px;
        font-weight: 700; color: #5a2b00;
      }
      .inv-station-hint-title canvas { width: 18px; height: 18px; }
      .inv-station-hint-row {
        display: flex; align-items: center; gap: 6px;
        flex-wrap: wrap;
      }
      .inv-station-hint-item {
        display: inline-flex; align-items: center; gap: 3px;
        min-width: 0;
      }
      .inv-station-hint-item canvas { width: 20px; height: 20px; }
      .inv-station-hint-item.missing { color: #7a2020; }
      .inv-station-hint-detail { color: #4a4a4a; }
      /* 工作区在右栏里居中；窄栏时允许换行（左右排不下就上下排） */
      .inv-panel.station-ui .furnace-layout,
      .inv-panel.station-ui .anvil-layout,
      .inv-panel.station-ui .brewing-layout,
      .inv-panel.station-ui .stonecutter-layout {
        justify-content: center;
      }
      .inv-panel.station-ui .furnace-layout { flex-wrap: wrap; }
      /* 熔炉的"产物 / 目标"并排：目标框点一下才开始（批次 295） */
      .furnace-output-row {
        display: flex; align-items: flex-end; gap: 8px; flex-wrap: wrap;
        justify-content: center;
      }
      .inv-slot.station-target {
        cursor: pointer;
        box-shadow: inset 0 0 0 2px rgba(120, 200, 255, .45);
      }
      .inv-slot.station-target.locked {
        cursor: not-allowed;
        box-shadow: inset 0 0 0 2px rgba(180, 60, 60, .55);
      }
      .inv-slot.station-target.hidden { display: none; }
      /* 目标框没选中配方时连"目标"这行标题一起藏掉 */
      .inv-panel.station-ui .furnace-col.hidden,
      .inv-panel.station-ui .brewing-col.hidden { display: none; }
      /* 右栏偏窄时允许横排换行：`.anvil-row` 原本是 nowrap，窄栏会直接溢出 */
      .inv-panel.pocket-ui.pocket-dual.station-ui .anvil-row,
      .inv-panel.pocket-ui.pocket-dual.station-ui .enchant-layout {
        flex-wrap: wrap;
      }
      /* 触摸端的面板宽度/高度由 --inv-pocket-* 统一定，station 只是取更宽的那一档 */
      body.touch-mode .inv-panel.pocket-ui.pocket-dual.station-ui {
        width: min(calc(100vw - 24px), 800px);
        max-width: min(calc(100vw - 24px), 800px);
        height: var(--inv-pocket-h);
        max-height: var(--inv-pocket-h);
      }
      /* 批次 277：工作站左栏的两个页签 + 可做列表 */
      .inv-station-tabs {
        display: none;
        grid-column: 1;
        grid-row: 1;
        align-items: center;
        gap: 4px;
        min-height: 0;
      }
      .inv-panel.station-ui .inv-station-tabs { display: flex; }
      .inv-station-tab {
        font: inherit; font-size: 12px; line-height: 1.2;
        padding: 3px 10px; cursor: pointer;
        color: #2b2b2b; background: #a8a8a8;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .inv-station-tab.active {
        background: #dcdec4;
        border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
      }
      .inv-station-recipes {
        display: none;
        grid-column: 1;
        grid-row: 2;
        min-height: 0;
        overflow-y: auto;
        flex-direction: column;
        gap: 6px;
        align-content: start;
      }
      .inv-panel.station-ui .inv-station-recipes { display: flex; }
      .inv-station-grid {
        display: grid;
        grid-template-columns: repeat(7, 40px);
        gap: 2px;
        align-content: start;
      }
      .inv-station-grid .inv-slot {
        width: 40px; height: 40px;
        max-width: 40px; max-height: 40px;
      }
      .inv-station-grid .inv-slot canvas { width: 28px; height: 28px; }
      /* 底部统计行贴底，不要被上面的格子挤没 */
      .inv-station-recipes .inv-category-info { margin-top: auto; }
      /* 竖屏 / 极窄屏放不下并排：退回"工作站在上、背包在下"，面板自己滚 */
      @media (max-width: 560px) {
        .inv-panel.pocket-ui.pocket-dual.station-ui .inv-body {
          grid-template-columns: minmax(0, 1fr);
          grid-template-rows: auto minmax(0, 1fr);
          overflow-y: auto;
        }
        .inv-panel.pocket-ui.pocket-dual.station-ui .inv-top {
          grid-column: 1;
          grid-row: 1;
          height: auto;
          border-left: 0;
          border-bottom: 2px solid #8a8a8a;
        }
        .inv-panel.pocket-ui.pocket-dual.station-ui .inv-category-section,
        .inv-panel.pocket-ui.pocket-dual.station-ui .inv-main > .inv-grid,
        .inv-panel.pocket-ui.pocket-dual.station-ui .inv-station-recipes {
          grid-column: 1;
          grid-row: 2;
        }
      }
      .inv-panel.pocket-ui.pocket-dual .inv-gear {
        grid-column: 2;
        grid-row: 1 / span 2;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        border-left: 2px solid #8a8a8a;
        box-sizing: border-box;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-gear-row {
        align-items: center;
        justify-content: center;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-player-preview {
        width: 170px;
        height: 190px;
        background: #080808;
      }
      /* 批次 275：640px 横屏（手机主场景）下，右栏 170px 预览会把 9 列背包挤到裁切。
         盔甲页把预览收到 90×140、格子降到 40px：
         9×40 + 8×2 缝 + 40 装备列 + 8 间隙 + 90 预览 ≈ 514px，能放进 552px 的双栏面板。 */
      @media (max-width: 759px) {
        .inv-panel.pocket-ui.pocket-dual[data-pocket-tab='armor'] .inv-player-preview {
          width: 90px;
          height: 140px;
        }
        .inv-panel.pocket-ui.pocket-dual[data-pocket-tab='armor'] .inv-main > .inv-grid {
          grid-template-columns: repeat(9, 40px);
        }
      }
      .inv-panel.pocket-ui.pocket-dual .inv-creative-section {
        grid-column: 1;
        grid-row: 1 / span 2;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-creative-controls {
        min-height: 32px;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-creative {
        grid-template-columns: repeat(7, 40px);
        gap: 2px;
        max-height: 174px;
        min-height: 0;
        overflow-y: auto;
      }
      .inv-panel.pocket-ui.pocket-dual .inv-creative .inv-slot {
        width: 40px;
        height: 40px;
        max-width: 40px;
        max-height: 40px;
      }
      /* 截图里的两颗右侧键在右下角：第一颗工作台，第二颗人物装备。 */
      .inv-shell.pocket-chrome:has(.pocket-dual) .inv-rail-right {
        justify-content: flex-end;
        padding-bottom: 8px;
      }

      /* ---------------- 左栏：我的物品 / 创造物品 / 物品分类 ----------------
         三份内容**占的是同一个格子**（col 1、row 1/span 2），切换只换内容：
         面板宽高、两栏的分界、右栏的位置全都不动——这就是"不该跳"的落点。 */
      .inv-panel.pocket-ui.pocket-dual .inv-category-section {
        position: relative;
        grid-column: 1;
        grid-row: 1 / span 2;
        display: none;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
        /* ⚠️ 父网格是 `align-items: start`：不显式拉伸的话，这一栏只有"内容高度"，
           分类物品多时会一路长到面板外（被 overflow 裁掉）且永远不会滚。
           用户反馈的"分类只有 3 行"就是这一条 + 旧的 max-height 一起造成的。 */
        align-self: stretch;
        height: 100%;
        max-height: 100%;
      }
      /* ⚠️ 搜索框在**竖排**容器里不能沿用 `flex: 1`（那是"吃掉剩余高度"），
         否则它会把下面的物品网格挤出可视区——表现就是"这一栏里什么都看不见" */
      .inv-category-section .inv-search {
        flex: 0 0 auto;
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      /* 分类底部信息栏（批次 185）：当前分类"我有几种 / 共几种"。
         高度固定一行，不能吃掉网格的高度（网格是 flex:1 那一个）。 */
      .inv-category-info {
        flex: 0 0 auto;
        width: 100%;
        padding: 2px 4px 0;
        box-sizing: border-box;
        border-top: 1px solid rgba(255, 255, 255, .12);
        color: #9a9a9a;
        font-size: 10px;
        line-height: 1.4;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      /* 分类里的物品：半栏宽塞不下 9 列，7 列 × 40px 与创造栏一致 */
      .inv-grid.inv-category {
        grid-template-columns: repeat(7, 40px);
        gap: 2px;
        justify-content: center;
        align-content: start;
        min-height: 0;
        /* 批次 181：不再写死 4 行（横屏 32vh 只有 ~125px，正好 3 行）。
           改成吃掉左栏剩余高度并滚动——用户要求"格子铺满区域，铺满后上下滑"。 */
        flex: 1 1 auto;
        max-height: none;
        /* 批次 538（用户）：超过一屏时滚动条要常驻。
           原生滚动条在 iOS 是"划过才出现"的 overlay，所以隐藏它，
           改由 `.inv-category-scrollbar` 自绘一根始终可见的细条。 */
        overflow-y: scroll;
        overflow-x: hidden;
        scrollbar-width: none;
        overscroll-behavior: contain;
        /* 批次 211：纵向仍是滚动列表；**横向拖动交给 JS** 做"按住滑动看配方" */
        touch-action: pan-y;
      }
      .inv-grid.inv-category::-webkit-scrollbar { display: none; width: 0; height: 0; }
      /* 创造分类列表同样改用自绘常驻滚动条（原生 overlay 在 iOS 不常驻） */
      .inv-grid.inv-creative { scrollbar-width: none; }
      .inv-grid.inv-creative::-webkit-scrollbar { display: none; width: 0; height: 0; }
      /* 自绘常驻滚动条：父级 `.inv-category-section` 已经是 position: relative */
      .inv-category-scrollbar {
        position: absolute; right: 1px; width: 6px;
        background: rgba(0, 0, 0, .26);
        border-radius: 3px; z-index: 3; pointer-events: none;
      }
      .inv-category-scroll-thumb {
        position: absolute; left: 0; top: 0; width: 100%; min-height: 18px;
        background: #9a9a9a; border: 1px solid #4a4a4a;
        border-radius: 3px; box-sizing: border-box;
        pointer-events: auto; cursor: pointer; touch-action: none;
      }
      .inv-category-scroll-thumb:hover { background: #b8b8b8; }
      .inv-grid.inv-category .inv-slot { width: 40px; height: 40px; max-width: 40px; max-height: 40px; }
      .inv-grid.inv-category .inv-slot canvas { width: 28px; height: 28px; }
      /* 我没有的那些：红底（配方开关打开时才可能出现在这一栏里） */
      .inv-slot.locked {
        background: #9b3b35;
        border-color: #cf7770 #54201c #54201c #cf7770;
      }
      .inv-slot.locked canvas { opacity: .62; filter: grayscale(.35); }
      /* 红底那格的点击反馈（批次 184）：它不能被选中，所以没有 `.selected`；
         只缩一下 + 亮一下，表示"这一下收到了"（名称与配方照常响应）。 */
      @keyframes inv-locked-tap {
        0% { transform: scale(.9); filter: brightness(1.12); }
        100% { transform: none; filter: none; }
      }
      /* 分类栏的"点击效果"：只缩一下（`.tapped`），不套 `.pressing/.selected` 的白框 */
      .inv-slot.tapped { animation: inv-locked-tap .22s ease-out; }
      .inv-slot.category-slot.pressing,
      .inv-slot.category-slot.selected {
        background: var(--slot-bg-hover);
        border-color: var(--mc-face-dark, #373737) #cfcfcf #cfcfcf var(--mc-face-dark, #373737);
        box-shadow: none;
        transform: scale(.94);
      }
      /* 配方预览里"差的那件"同样是红底（格子里是预览，不是实物） */
      .inv-slot.ghost-missing {
        background: #9b3b35;
        border-color: #cf7770 #54201c #54201c #cf7770;
      }
      .inv-slot.ghost-missing canvas { opacity: .62; filter: grayscale(.35); }
      /* 换栏目内容时的淡入：只改透明度，**不碰几何**（一碰就又变成"面板在动"） */
      @keyframes inv-pane-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .inv-pane-enter { animation: inv-pane-in var(--dur-fast) ease-out; }

      /* ---------------- 盔甲与副手（36-40 号槽，竖排一列） ---------------- */
      .inv-grid.inv-armor { grid-template-columns: 42px; }
      /* 空槽里写"头/胸/腿/靴/副手"：触摸端没有悬停提示，只能靠槽位自己说明。
         副手是两个字，40px 槽位放不下 14px，单独收一号（批次 275）。 */
      .inv-slot-hint {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: #5f5f5f; font-size: 14px; pointer-events: none; user-select: none;
      }
      .inv-slot-hint-wide { font-size: 11px; letter-spacing: -0.5px; }
      .inv-slot.has-item .inv-slot-hint { display: none; }
      /* 放不下（例如把石头塞进头盔位）：抖一下，别让玩家以为是点击没生效 */
      @keyframes inv-reject-shake {
        0%, 100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
      }
      .inv-slot.inv-reject { animation: inv-reject-shake .18s linear; }

      .inv-chest { grid-template-columns: repeat(9, 42px); }
      /* 漏斗（批次 58）：5 格排成一行（原版界面就是这样一条） */
      .inv-hopper { grid-template-columns: repeat(5, 42px); }
      /* 投掷器与发射器（批次 59/60）：3×3 九宫格（原版这两兄弟的界面都是九宫格） */
      .inv-nine { grid-template-columns: repeat(3, 42px); justify-content: start; }

      /* ---------------- 熔炉 ---------------- */
      .furnace-layout {
        display: flex; flex-direction: column; align-items: center;
        margin: 6px 0 10px; padding: 8px 4px;
      }
      .furnace-stage { display: flex; align-items: center; }
      .furnace-core {
        display: flex; flex-direction: column; align-items: center; gap: 6px;
        width: 132px;
      }
      /* 材料/燃料槽左侧说明（批次 312） */
      .furnace-slot-with-label {
        position: relative; width: 44px; height: 44px;
      }
      .furnace-slot-side-label {
        position: absolute; right: calc(100% + 4px); top: 50%;
        transform: translateY(-50%);
        font-size: 11px; line-height: 1; color: #4a4a4a;
        white-space: nowrap;
      }
      /*
       * 进度箭头（批次 330）：熔炉与酿造台共用同一套外观，宽度由各自布局定。
       * 原来整条规则挂在 `.furnace-progress` 下，酿造台的 `.furnace-cook`
       * 没有高度/背景/填充色，进度条一直是"看不见的 0 高度"。
       */
      .furnace-cook {
        position: relative; height: 16px;
        background: rgba(0, 0, 0, .28); overflow: hidden;
        clip-path: polygon(0 0, 82% 0, 100% 50%, 82% 100%, 0 100%);
      }
      /* 熔炉：左边缘贴到 44px 原料/燃料槽的右边缘（132 列居中 → x=88） */
      .furnace-progress { width: 72px; margin-left: -44px; }
      .furnace-progress .furnace-cook { width: 72px; }
      .furnace-cook i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, #cfe6ff, #6fa8dc);
        transition: width .1s linear;
      }
      .furnace-slot-row {
        position: relative;
        display: flex; align-items: center; gap: 8px; margin-left: 8px;
      }
      .furnace-slot-col {
        position: relative; width: 44px; height: 44px;
      }
      .furnace-slot-label {
        position: absolute; left: 50%; bottom: calc(100% + 2px);
        transform: translateX(-50%);
        font-size: 11px; line-height: 1; color: #4a4a4a;
        white-space: nowrap;
      }
      .furnace-bottom {
        display: flex; flex-direction: column; width: 264px;
        margin-top: 8px;
      }
      /* 退还仓库绝对定位在目标/产物下方，不占布局行（批次 316） */
      .furnace-return {
        position: absolute; top: calc(100% + 4px); right: 0;
        font: inherit; font-size: 11px; line-height: 1.2;
        padding: 3px 6px; cursor: pointer; white-space: nowrap;
        color: #2b2b2b; background: #c9b28f;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .furnace-return.hidden { display: none; }
      /* 备选燃料：小图标横排、自动换行 */
      .furnace-fuel-hint {
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        width: 132px; max-width: 132px; margin-top: 6px;
        align-self: flex-start;
        font-size: 10px; color: #4a4a4a;
        line-height: 1.25; text-align: center;
      }
      .furnace-options-label {
        font-size: 11px; line-height: 1; color: #4a4a4a;
      }
      .furnace-fuel-text {
        max-width: 132px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .furnace-fuel-options {
        display: flex; flex-wrap: wrap; gap: 3px; justify-content: center;
        width: 132px; max-width: 132px;
      }
      .furnace-fuel-options.hidden { display: none; }
      .furnace-fuel-option {
        position: relative; width: 28px; height: 28px; padding: 0;
        cursor: pointer; background: #b8b8b8;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
        display: flex; align-items: center; justify-content: center;
      }
      .furnace-fuel-option.active {
        border-color: #5a5a5a #ffffff #ffffff #5a5a5a;
        box-shadow: inset 0 0 0 1px #6aa84f;
      }
      .furnace-fuel-option canvas { width: 20px; height: 20px; }
      .furnace-fuel-count {
        position: absolute; right: 1px; bottom: 0;
        font-size: 9px; line-height: 1; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }

      /* 火焰（批次 309）：空槽也显示三条灰色线，燃烧时用彩色线填充 */
      .furnace-flame {
        position: relative; width: 18px; height: 20px; overflow: hidden;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 3px,
          rgba(90, 90, 90, .38) 3px 5px,
          transparent 5px 6px
        );
      }
      .furnace-flame i {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 0;
        background: repeating-linear-gradient(
          90deg,
          transparent 0 3px,
          #ffb13b 3px 5px,
          transparent 5px 6px
        );
        transition: height .1s linear;
        filter: drop-shadow(0 0 2px rgba(255, 140, 20, .65));
      }
      .furnace-flame.lit i { filter: drop-shadow(0 0 5px rgba(255, 150, 30, .9)); }
      @media (max-width: 430px) {
        .furnace-core { width: 112px; }
        .furnace-progress { margin-left: -34px; }
        .furnace-bottom { width: 254px; }
        .furnace-fuel-hint,
        .furnace-fuel-options { width: 112px; max-width: 112px; }
      }

      /* ---------------- 酿造台（H10） ---------------- */
      /*
       * 批次 331（用户）：左侧竖排「药水 → 材料 → 燃料」，右边进度，再右边目标；
       * 退还仓库在目标下方，绝对定位、不参与流布局。
       */
      .brewing-layout {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
        margin: 6px 0 10px; padding: 8px 0;
      }
      .brewing-left { display: flex; flex-direction: column; gap: 6px; }
      .brewing-line { display: flex; align-items: center; gap: 4px; }
      .brewing-line-label {
        flex: 0 0 24px; width: 24px;
        font-size: 11px; line-height: 1; color: #4a4a4a; white-space: nowrap;
      }
      /* 三个药水槽横排（与原版一致：三瓶同时酿，摆在同一条线上最直观） */
      .brewing-bottles { display: flex; gap: 4px; }
