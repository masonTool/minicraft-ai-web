         打开命中 + 抬高层级之后，点格子才真的会切槽。
         ⚠️ 这一条**不限定触摸设备**：桌面端同样是 pointer-events: none，所以"悬停快捷栏看物品
         提示"与"点快捷栏切槽"在 PC 上也一直是死的（指针锁定期间鼠标事件不会落到 HUD 上，
         解锁时又基本被暂停菜单盖住，所以打开它不会误伤操作）。 */
      #hotbar { pointer-events: auto; z-index: 1; }
      body.touch-mode #hotbar .slot { touch-action: manipulation; }
      /* 手指按下去要有反馈：选中靠 `.active`，按下的瞬间也要变一下 */
      body.touch-mode #hotbar .slot:active { background: rgba(255, 255, 255, .34); }

      /* 选中物品的名字浮标（批次 95，对齐基岩版）：换槽时在快捷栏上方浮一条，
         2 秒后淡出。手机上一眼能看到"手上是什么"，不用去翻背包 */
      #selected-item-name {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        padding: 4px 12px; border-radius: 14px;
        background: rgba(0, 0, 0, .58); color: #fff; font-size: 13px;
        white-space: nowrap; pointer-events: none;
        opacity: 0; transition: opacity .35s;
      }
      #selected-item-name.show { opacity: 1; }

      /* ---------------- 经验条（快捷栏正上方，等级数字压在条中间） ---------------- */
      #xp-bar {
        position: absolute; left: 50%; transform: translateX(-50%);
        bottom: calc(68px + env(safe-area-inset-bottom, 0px));
        width: 182px; height: 6px;
        background: #14150f;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .9), 0 0 0 1px rgba(0, 0, 0, .6);
        border-radius: 3px;
        overflow: visible;
      }
      #xp-bar.hidden { display: none; }
      #xp-bar #xp-fill {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#c2ff7a, #63c335);
        border-radius: 3px;
        box-shadow: 0 0 8px rgba(120, 220, 60, .55);
        transition: width var(--dur-med) var(--ease);
      }
      /* 等级数字压在一小块深色牌子上：压在进度条上时原来的绿字会看不清 */
      #xp-level {
        position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
        padding: 0 5px; border-radius: 4px;
        font-size: 13px; font-weight: 700; line-height: 1.35; color: #80ff20;
        background: rgba(0, 0, 0, .42);
        /* 原版是黑描边，压在绿色进度条上也读得清 */
        text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
        pointer-events: none;
      }

      /* ---------------- 生命 / 饥饿 / 氧气 / 护甲 ----------------
         批次 222（用户："生命值和饥饿值放在快捷栏的两端，不要挡住进度按钮"）：
         两列**贴住快捷栏的左右两端**（与它同宽），中间完全让给经验条与等级数字。
         竖向顺序照原版：护甲在心上、气泡在鸡腿上，两列**底边对齐**（心和鸡腿同一行）。 */
      #vitals {
        position: absolute; left: 50%; transform: translateX(-50%);
        /* 在经验条（68~74px）之上，留 12px 空隙 */
        bottom: calc(86px + env(safe-area-inset-bottom, 0px));
        width: var(--hotbar-w);
        display: flex; align-items: flex-end; justify-content: space-between;
        pointer-events: none;
      }
      #vitals .vital-defs { position: absolute; width: 0; height: 0; }
      #vitals .vital-side { display: flex; flex-direction: column; gap: 2px; }
      /* 右列（气泡 + 鸡腿）靠右：10 个图标刚好贴住快捷栏右端 */
      #vitals .vital-side.right { align-items: flex-end; }
      .vital-row { display: flex; gap: 1px; }
      .vital-row svg.vital-icon { width: 18px; height: 18px; display: block; }
      #vital-air { visibility: hidden; }
      #vital-air.on { visibility: visible; }
      /* 护甲条只在身上有甲时出现（与原版一致：脱了就整条收起，不占屏） */
      #vital-armor { visibility: hidden; }
      #vital-armor.on { visibility: visible; }
      /* 创造模式：原版不显示生命 / 饥饿 / 护甲 / 氧气整条状态栏。
         用 display:none（不是 visibility:hidden）——横屏手机高度本来就紧张，
         藏了还要占着一块布局高度就白改了。掉虚空/自杀的提示仍走左上角聊天栏 */
      #vitals.creative-mode { display: none; }

      /* ---------------- 暂停 / 设置 ---------------- */
      #settings-screen {
        /* z-index 要高于主菜单（40）：设置面板既能从游戏里打开，也能从主菜单打开 */
        position: fixed; inset: 0; z-index: 50;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .42);
      }
      #settings-screen.hidden { display: none; }
      /* 关闭时的淡出（批次 231）：`SettingsScreen.hide()` 先挂这个类，
         130ms 后才加 `.hidden`。**时序是功能的一部分**——面板必须比
         "触摸操作层恢复"晚几帧消失，否则同一帧拆/建两层会让浏览器重算
         触摸坐标映射（下一次 pointerdown 的 clientX/Y 变成 0,0）。
         这一层同时 `pointer-events: none`：淡出期间那一下点击直接落到游戏里。 */
      #settings-screen.closing {
        opacity: 0; pointer-events: none;
        transition: opacity .12s linear;
      }
      /* ================================================================
         暂停 / 设置面板：**固定尺寸 + 统一标题栏**（批次 110）
         ================================================================
         用户反馈："不管手机还是 PC，设置的界面应该是固定宽高的；不能这个界面一个
         宽高、跳另一个界面又是一个宽高，应该是统一大小的；它都覆盖在游戏界面上，
         然后有一点点外部的游戏区域；右上角统一加关闭按钮，或者左上角统一加返回按钮
         （暂停那个界面有继续游戏，可能就不需要关闭按钮了）。"

         之前的问题正是这两句：
           · 批次 107~109 给"暂停菜单页"和"设置页"**各写了一套宽度**
             （菜单页 `min(72vw,400px)`、设置页 `min(96vw,820px)`）——切页时面板会**跳大小**；
           · 高度写的是 `auto`：内容多少就多高，换一个分组也跟着变。

         现在：尺寸只出现在 `:root` 的 `--panel-w` / `--panel-h` 这一对变量里，
         **两页共用**，高度是固定值（内容多就在内部滚动，面板本身不动）。
         四周那圈"外部的游戏区域"就是视口减去面板尺寸后剩下的边距——所以**不写
         `width: 100%`**，也不写 `inset: 0`。
         ⚠️ "固定"指的是**不随内容/页签变化**，不是"写死像素"：手机上必须用
           `min(vw, 上限)` 把面板收进视口，否则小屏会被裁掉。
         ⚠️ 高度固定之后，"四组一次全展开"那套就不能用了（一屏放不下）；
           所以**三端统一成"左选项卡 + 右内容、一次一组"**——每组最多 5 行，
           任何屏幕都不用滚。这也是原版的样子。 */
      .settings-panel {
        width: var(--panel-w); max-width: var(--panel-w);
        height: var(--panel-h); max-height: var(--panel-h);
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        border-radius: 0;
        padding: 12px 14px; font-size: 13px;
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        display: flex; flex-direction: column; overflow: hidden;
        /* 切页时宽度会变（菜单页窄 / 设置页宽）：补一条过渡，别让面板"啪"地跳一下 */
        transition: width .16s var(--ease);
      }
      /* 暂停菜单页：收到 `--pause-w`（批次 231）。`SettingsScreen#setPage` 一直
         会写面板的 `data-page`，这里才第一次真正用它。 */
      .settings-panel[data-page='menu'] {
        width: var(--pause-w); max-width: var(--pause-w);
      }
      /* 面板窄到 460 之后，300px 的按钮列会在里面留出两条 66px 的空边：
         放到 340（左右各 46px），一列按钮仍然"不顶满面板"，与原版同一种观感 */
      .settings-panel[data-page='menu'] .pause-actions {
        max-width: min(100%, 340px);
      }
      /* 标题栏：**三列栅格**（左槽 | 标题 | 右槽），标题永远在正中间。
         两页共用同一个骨架：暂停菜单页左槽是空的，设置页左槽是"‹ 返回"。
         于是"换个界面"时唯一会动的只有左槽那颗键，标题一个字都不会移位。 */
      .settings-header {
        display: grid; grid-template-columns: 84px 1fr 84px;
        align-items: center; gap: 8px; flex: 0 0 auto;
      }
      .settings-header-slot { display: flex; min-width: 0; }
      .settings-header-slot:last-child { justify-content: flex-end; }
      .settings-title {
        font-size: 17px; letter-spacing: 1px; color: #fff; text-align: center;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .settings-back {
        padding: 0 10px; height: 32px; min-width: 76px;
        font: inherit; font-size: 13px; line-height: 1; cursor: pointer;
      }
      .settings-hint { color: #a8a8a8; font-size: 12px; margin: 4px 0 8px; text-align: center; }
      /* 说明行（批次 215）：跟在某一项下面解释"为什么"，不占控件位置。
         跨满整行（`1 / -1`）：它讲的是上面那一项，压到半栏会被读成"属于右边那一项" */
      .settings-note {
        grid-column: 1 / -1; color: #8f8f8f; font-size: 11px; line-height: 1.35;
        margin: -2px 0 2px;
      }
      /* 页签 + 内容：**永远"左选项卡 + 右内容"**（原版就是左侧一列） */
      .settings-columns { display: flex; flex-direction: row; gap: 12px; flex: 1 1 auto; min-height: 0; }
      .settings-tabs { display: flex; flex-direction: column; flex: 0 0 104px; gap: 4px; }
      .settings-tab {
        position: relative;
        font: inherit; font-size: 13px; padding: 6px 8px; min-height: 34px;
        text-align: center; white-space: nowrap; cursor: pointer; flex: 0 0 auto;
      }
      /* 当前分组：浅灰面 + 深字（原版"选中的那一项"就是反白的一块） */
      .settings-tab.active {
        background: var(--mc-panel); color: var(--mc-text);
        text-shadow: 1px 1px 0 rgba(255, 255, 255, .45);
      }
      .settings-tab.active::before {
        content: ''; position: absolute; left: -5px; top: 2px; bottom: 2px; width: 3px;
        background: #6cc349; box-shadow: 1px 0 0 #284c1c;
      }
      .settings-body {
        flex: 1 1 auto; min-height: 0;
        overflow-x: hidden; overflow-y: auto;
        display: flex; flex-direction: column; gap: 6px;
      }
      /* 一次只显示当前分组（组名写在左边的选项卡上，段内标题是重复信息）。
         批次 335：分组内再分「块」——按钮/下拉/开关一块、滑杆一块；
         块内两列并排，块与块之间一条细分隔线。 */
      .settings-section {
        display: none; flex-direction: column; gap: 8px;
        align-content: start; flex: 0 0 auto;
      }
      .settings-section.active { display: flex; }
      .settings-group { display: none; }
      .settings-meta { flex: 0 0 auto; margin: 8px 0 0; }
      .settings-block {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
        gap: 4px 14px; align-content: start; min-width: 0;
      }
      .settings-block + .settings-block {
        margin-top: 2px; padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, .1);
      }
      /* 行内三列：标签 | 控件 | 读数。标签与控件紧挨着，第二列左对齐 */
      .settings-row {
        display: grid; grid-template-columns: minmax(72px, auto) minmax(0, 1fr) minmax(44px, auto);
        align-items: center; gap: 4px 8px; min-width: 0; min-height: 32px;
      }
      /* 开关 / 下拉：两列（没有读数），控件紧跟标签 */
      .settings-row.pair { grid-template-columns: minmax(72px, auto) minmax(0, 1fr); }
      /* 游戏模式 + 飞行同一行（批次 528）：左半模式、右半飞行，整行跨满两列。
         里面两个 `.mode-cell` 各自再放一条普通的 pair 行。 */
      #settings-screen .settings-row.mode {
        grid-column: 1 / -1;
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px 12px; align-items: center;
      }
      #settings-screen .settings-row.mode > .mode-cell { min-width: 0; }
      #settings-screen .settings-row.mode .settings-row { margin: 0; }
      @media (max-width: 520px) {
        #settings-screen .settings-row.mode { grid-template-columns: minmax(0, 1fr); }
      }
      /* 动作行：标签 | 按钮 | 状态文字（资源包 / 日志导出） */
      .settings-row.action { grid-template-columns: minmax(72px, auto) auto minmax(0, 1fr); }
      .settings-status {
        min-width: 0; color: #a8a8a8; font-size: 11px; line-height: 1.3;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      /* 状态文字跟在按钮右边、左对齐（`.settings-row i` 的右对齐特异性更高，单独覆盖） */
      .settings-row i.settings-status { text-align: left; }

      /* ==================================================================
         控件统一规格（2026-10-27）
         用户："设置里所有的按钮、文字、输入框都应该符合一个统一的规则，不应该有的
         大有的小、有的高有的低；弹框的位置、背景、关闭按钮也应该是统一规格。"
         规则就七条，尺寸全部来自 `:root` 的 `--ctl-*` / `--modal-*`：
           ① 输入框：同高度、同字号、同内边距
           ② 次级按钮：同高度（图形开关 `.settings-switch` 不在此列）
           ③ 主按钮：统一高一档，一处只出现一颗
           ④ 弹层：同宽、同内边距、同背景、同边框
           ⑤ 关闭按钮：同一个正方形尺寸 + 同一个位置（右上角）
           ⑥ 浮窗是第二层：窄一档，并把下层压暗 + 虚化
           ⑦ 标签：全站 12px
         新增控件挂上对应选择器即可，**不要**再各写一套 padding / height。
         ================================================================== */

      /* ① 输入框 */
      .world-input,
      .mp-row input,
      .settings-row input[type='text'],
      .settings-row input[type='number'],
      .settings-row select {
        box-sizing: border-box;
        height: var(--ctl-h);
        padding: 0 var(--ctl-pad-x);
        font: inherit;
        font-size: var(--ctl-font);
        line-height: 1;
      }

      /* ② 次级按钮 */
      .settings-cycle,
      .settings-dropdown-button,
      .settings-reset,
      .world-mini,
      .server-picker-button {
        box-sizing: border-box;
        min-height: var(--ctl-h);
        font: inherit;
        font-size: var(--ctl-font);
      }

      /* 「选择」是文字按钮：高度对齐，但不加边框（设计图里它就是一段文字） */
      .mp-pick {
        box-sizing: border-box;
        height: var(--ctl-h);
        display: inline-flex;
        align-items: center;
        font-size: var(--ctl-font);
      }

      /* ③ 主按钮 */
      .mp-action.primary,
      .world-edit-save {
        box-sizing: border-box;
        height: var(--ctl-h-lg);
        font-size: 14px;
      }

      /* ④ 弹层：对话框两份（联机 / 世界卡片）共用一套盒子 */
      .mp-panel,
      .world-modal-panel {
        box-sizing: border-box;
        width: min(92vw, var(--modal-w));
        padding: var(--modal-pad);
        background: var(--modal-bg);
        border: 3px solid;
        border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
      }

      /* ⑤ 关闭按钮：两个对话框同一个尺寸、同一个位置 */
      .mp-close,
      .world-modal-close {
        box-sizing: border-box;
        position: absolute; right: 0; top: 0;
        width: var(--modal-close); height: var(--modal-close);
        min-width: var(--modal-close); min-height: var(--modal-close);
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0; font-size: 14px; line-height: 1;
      }

      /* ⑥ 浮窗（第二层）：窄一档 + 把下层压暗虚化，避免两层文字打架 */
      .server-picker {
        background: rgba(0, 0, 0, .45);
        backdrop-filter: blur(2px);
        -webkit-backdrop-filter: blur(2px);
      }
      .server-picker-panel {
        box-sizing: border-box;
        width: min(92vw, 340px);
        padding: var(--modal-pad);
        background: var(--modal-bg);
        border: 3px solid;
        border-color: var(--pixel-bevel-dark);
      }
      .server-picker-toggle {
        box-sizing: border-box;
        height: 26px; padding: 0 10px;
        font: inherit; font-size: 12px;
      }

      /* ⑦ 标签 */
      .mp-row > span,
      .world-row > span,
      .settings-row > span {
        font-size: 12px;
      }


      /* ---------------- 暂停菜单那一页（批次 108） ----------------
         同一份 DOM 的两页：`.pause-page.active` 才是当前这一页。
         暂停菜单那几颗按钮**竖着一列**——一页只放"几个主要按钮"。
         原来"继续游戏/成就/保存并回到主菜单/删除本世界"和十几行设置并排挤在
         一页上，用户的原话是"按钮非常大、又占了全屏、有点乱"。
         按钮的斜角与主菜单那套一致（亮左上 / 暗右下，按下时翻过来）。 */
      .pause-page { display: none; }
      .pause-page.active {
        display: flex; flex-direction: column; flex: 1 1 auto; min-height: 0;
        overflow-x: hidden; overflow-y: hidden;
      }
      /* 菜单页的内容不是"一格滚动区"，它自己滚；设置页由里面的 `.settings-body` 滚 */
      .pause-page[data-page='menu'].active { overflow-y: auto; }
      /* 按钮列**在面板里垂直居中**：面板高度是固定的，不居中底下会空一大片。
         ⚠️ 宽度收到 300px（批次 111，用户："暂停界面按钮可以窄一点"）：
         面板宽 760px，一列按钮拉到满宽太宽——原版那一列只占面板的一小半。
         `margin: auto` 的上下 auto 负责垂直居中，左右 auto 负责水平居中。 */
      .pause-actions {
        display: flex; flex-direction: column; gap: 8px;
        margin: auto; width: 100%; max-width: 300px;
      }
      .pause-action {
        font: inherit; font-size: 14px; padding: 9px; min-height: 42px; cursor: pointer;
      }
      /* ---------------- 联机入口面板（联机9） ----------------
         手机横屏是本项目的主场景（高度只有 360~430），所以面板**矮而宽**：
         两行输入横排（标签定宽 + 输入框吃掉剩余宽度）、一行状态、一行按钮。
         刻意不做大厅：没有房间列表，能把地址填进去连上就够了。 */
      /* 全屏页（2026-10-27 第二版）：不透明，底层世界列表完全不再透过来。
         用户原话"层级过高、弹窗上又弹窗"——根治办法是让每一层都是**页面**，
         层次靠明度与光晕表达，而不是靠叠半透明遮罩。 */
      #multiplayer-screen {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        background:
          radial-gradient(ellipse 62% 46% at 50% 46%, rgba(118, 156, 112, .20), transparent 72%),
          radial-gradient(ellipse 130% 96% at 50% -12%, rgba(0, 0, 0, .55), transparent 64%),
          var(--mc-menu-bg);
      }
      #multiplayer-screen.hidden { display: none; }
      /* 单列卡片（2026-10-27 按设计图重排）：居中标题 + 四行表单 + 红字错误 + 通栏按钮。
         宽度收在 460px：横屏手机上它只是屏幕中间一条，不铺满。 */
      .mp-panel {
        width: min(92vw, 460px); max-height: 100%;
        display: flex; flex-direction: column; gap: 10px;
        padding: 12px 14px; overflow: auto;
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        font-size: 13px;
      }
      /* 标题居中、✕ 钉在右上角（设计图第一行就是这样） */
      .mp-head {
        position: relative; display: flex; align-items: center; justify-content: center;
        min-height: var(--modal-close);
        padding-bottom: 10px;
        border-bottom: 2px solid rgba(255, 255, 255, .1);
      }
      .mp-title { font-size: 16px; letter-spacing: 1px; }
      .mp-close {
        position: absolute; right: 0; top: 0;
        width: 26px; height: 26px; padding: 0;
        font: inherit; font-size: 14px; line-height: 1;
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
        border: 2px solid; border-color: var(--pixel-bevel-dark); cursor: pointer;
      }
      .mp-form { display: flex; flex-direction: column; gap: 8px; }
      /* 一行 = 标签（定宽）+ 输入框（吃满剩余）；地址行后面还挂 `:` 端口 与「选择」 */
      .mp-row { display: flex; align-items: center; gap: 8px; }
      .mp-row > span { flex: 0 0 5em; white-space: nowrap; }
      .mp-row input {
        flex: 1 1 auto; min-width: 0; font: inherit; font-size: 13px;
        padding: 6px 8px; border: 2px solid; border-color: var(--pixel-bevel-dark);
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
      }
      /* 地址行（2026-10-27 第二版）：标签 / 地址 / `:` / 端口 / 选择 五格用 grid 定宽，
         地址吃掉剩余宽度 → 右边缘与下面三行的输入框**严格对齐**。
         以前用 flex，地址框宽多少取决于内容，那一行看起来永远是"参差的"。 */
      .mp-row.mp-row-address {
        display: grid;
        grid-template-columns: 5em minmax(0, 1fr) auto 4.6em auto;
        gap: 6px;
        align-items: center;
      }
      .mp-row.mp-row-address > input { width: 100%; min-width: 0; }
      .mp-row.mp-row-address > .mp-pick { padding: 0 10px; }
      /* 地址与端口之间的冒号 */
      .mp-colon { flex: 0 0 auto; color: #cfcfcf; }
      /* 端口：窄一格、数字等宽居中（可编辑，默认 8887） */
      .mp-row input.mp-port-input {
        flex: 0 0 5.2em; text-align: center; font-variant-numeric: tabular-nums;
      }
      /* 「选择」：跟在端口后面，纯文字按钮（设计图里没有框） */
      .mp-pick {
        flex: 0 0 auto; font: inherit; font-size: 13px; padding: 2px 4px;
        background: none; border: none; color: var(--mc-text-light);
        text-decoration: underline; cursor: pointer;
      }
      /* 「找房间」小按钮：跟在地址后面，不占一整行（横屏高度紧张） */
      /* ---- 「选择房间 / 选择服务器」二级页面（2026-10-27 第二版）
         用户说"层级太高、弹窗上又弹窗"：这一层于是改成**与联机面板同宽同位置的页面**，
         左上「‹ 返回」、标题居中、副标题一行小字。切换时看起来是翻页，不是套娃。
         外层遮罩同步加深 + 虚化，把下层彻底压成背景。 */
      .server-picker {
        position: fixed; inset: 0; z-index: 70;
        display: flex; align-items: center; justify-content: center;
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
        /* 比联机页**再深一档**：靠明度差表达"进得更深一层" */
        background:
          radial-gradient(ellipse 62% 46% at 50% 46%, rgba(104, 138, 100, .14), transparent 72%),
          radial-gradient(ellipse 130% 96% at 50% -12%, rgba(0, 0, 0, .6), transparent 64%),
          #1b1b1b;
      }
      .server-picker.hidden { display: none; }
      .server-picker-panel {
        box-sizing: border-box;
        width: min(92vw, var(--modal-w));
        max-height: min(86vh, 620px);
        display: flex; flex-direction: column; gap: 8px;
        padding: var(--modal-pad);
        background: var(--modal-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .server-picker-head {
        position: relative;
        display: flex; flex-direction: column; align-items: center; gap: 3px;
        padding-bottom: 8px;
        border-bottom: 2px solid rgba(255, 255, 255, .14);
      }
      /* 返回：与两个对话框的 ✕ 同尺寸、同位置（只是换成左箭头） */
      .server-picker-back {
        position: absolute; left: 0; top: 0;
        box-sizing: border-box;
        width: var(--modal-close); height: var(--modal-close);
        display: inline-flex; align-items: center; justify-content: center;
        padding: 0; font: inherit; font-size: 19px; line-height: 1;
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
        border: 2px solid; border-color: var(--pixel-bevel-dark); cursor: pointer;
      }
      .server-picker-back:hover { background: rgba(255, 255, 255, .1); }
      .server-picker-title { font-size: 16px; letter-spacing: 1px; }
      .server-picker-sub { font-size: 11px; color: #a8a8a8; }
      /* 正文自己滚：标题与底部按钮固定，列表再长也不会把「确定」顶出屏幕 */
      .server-picker-body {
        display: flex; flex-direction: column; gap: 6px;
        overflow-y: auto; min-height: 0;
      }
      .server-picker-section { display: flex; flex-direction: column; gap: 4px; }
      .server-picker-label { font-size: 13px; color: #e6e6e6; padding: 2px 0; }
      .server-picker-status { font-size: 11px; line-height: 1.5; color: #a8a8a8; min-height: 15px; }
      .server-picker-list { display: flex; flex-direction: column; gap: 2px; }
      /* 一台服务器：`IP -------- 延迟`（虚线用 flex 撑开，对应设计图那串横线） */
      .server-picker-item {
        display: flex; align-items: baseline; gap: 6px; width: 100%;
        padding: 4px 2px; font: inherit; font-size: 12px; text-align: left;
        color: var(--mc-text-light); background: none; border: none; cursor: pointer;
      }
      .server-picker-item:hover { background: rgba(255, 255, 255, .06); }
      .server-picker-item.selected { background: rgba(120, 190, 255, .22); color: #fff; }
      .server-picker-host { flex: 0 0 auto; }
      .server-picker-dash {
        flex: 1 1 auto; min-width: 12px; height: 0; align-self: center;
        border-top: 2px dotted rgba(255, 255, 255, .45);
      }
      .server-picker-rtt { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: #9fd08a; }
      /* 房间缩进在服务器下面（设计图里房间是服务器的子项） */
      .server-picker-rooms { display: flex; flex-direction: column; gap: 1px; padding-left: 18px; }
      .server-picker-room {
        display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
        padding: 3px 4px; font: inherit; font-size: 12px; text-align: left;
        color: #dcdcdc; background: none; border: none; cursor: pointer;
      }
      .server-picker-room:hover { background: rgba(255, 255, 255, .06); }
      .server-picker-room.selected { background: rgba(120, 190, 255, .22); color: #fff; }
      /* 开房模式下房间行只展示（不能选别人的房名） */
      .server-picker-room.readonly { cursor: default; color: #b9b9b9; }
      .server-picker-room.readonly:hover { background: none; }
      .server-picker-room-online { flex: 0 0 auto; font-variant-numeric: tabular-nums; color: #9fd08a; }
      .server-picker-room-empty { font-size: 11px; color: #8d8d8d; padding: 2px 4px; }
      /* 本机：`本机  允许其它人建房？ 是 否` */
      .server-picker-local { display: flex; align-items: center; gap: 8px; font-size: 12px; }
      .server-picker-local-ask { flex: 1 1 auto; text-align: right; color: #cfcfcf; }
      .server-picker-toggle {
        flex: 0 0 auto; padding: 2px 8px; font: inherit; font-size: 12px;
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
        border: 2px solid; border-color: var(--pixel-bevel-dark); cursor: pointer;
      }
      .server-picker-toggle[aria-pressed="true"] {
        background: rgba(120, 190, 255, .3); border-color: #8fc7ff;
      }
      /* 底部 取消 / 确定：两颗等宽（设计图里就是左右各一颗） */
      .server-picker-actions { display: flex; gap: 8px; }
      .server-picker-button {
        flex: 1 1 0; padding: 7px 10px; font: inherit; font-size: 13px; cursor: pointer;
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
        border: 2px solid; border-color: var(--pixel-bevel-dark);
      }
      .server-picker-button.primary { background: rgba(90, 140, 90, .55); }
      .server-picker-button:disabled { opacity: .45; cursor: default; }
      .mp-mini {
        flex: 0 0 auto; font: inherit; font-size: 12px; padding: 6px 8px; cursor: pointer;
      }
      /* 开关型按钮（本批：「允许其它人建房」的是/否）：选中的那个高亮。
         用 outline 而不是 border —— 不改 .mp-mini 的盒模型，其它按钮不受影响 */
      .mp-mini[aria-pressed="true"] {
        background: rgba(120, 190, 255, .22);
        outline: 2px solid #8fc7ff;
        color: #fff;
      }
      /* 房间/口令同一行：口令那一格的标签比主标签窄一半 */
      .mp-row > span.mp-row-label-sub { flex: 0 0 2.6em; text-align: right; opacity: .8; }
      /* 房间列表：占满右列剩下的高度（列内自己滚），不再固定 96px 三行 */
      .mp-rooms {
        display: flex; flex-direction: column; gap: 3px;
        flex: 1 1 auto; min-height: 72px; max-height: none; overflow: auto;
        padding: 3px; background: rgba(0, 0, 0, .3);
      }
      /* 紧凑版行（本轮）：一行放下"房名 + 人数 · 世界 · 无房主"，
         字号 11 / 上下内边距 3，短屏里能多看到两三行 */
      .mp-room-row {
        display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap;
        font: inherit; font-size: 11px; line-height: 1.35; text-align: left; cursor: pointer;
        padding: 3px 6px; border: 2px solid var(--pixel-bevel-dark);
        color: var(--mc-text-light); background: rgba(0, 0, 0, .25);
      }
      .mp-room-row b { font-size: 12px; }
      .mp-room-row span { opacity: .8; }
      /* 竖屏 / 极窄：两栏回落成单列，列表回到固定高度滚动（与分栏前的观感一致） */
      @media (max-width: 620px), (orientation: portrait) {
        .mp-columns { flex-direction: column; }
        .mp-col-rooms { flex: 0 0 auto; }
        .mp-rooms { max-height: 96px; }
      }
      /* ---------------- 本局房间信息卡（L9） ---------------- */
      #room-card {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
          max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
        background: rgba(0, 0, 0, .55);
      }
      #room-card.hidden { display: none; }
      .room-panel {
        width: min(92vw, 420px); max-height: 100%;
        display: flex; flex-direction: column; gap: 6px;
        padding: 10px 12px; overflow: auto;
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
        font-size: 13px;
      }
      .room-title { font-size: 15px; text-align: center; }
      .room-body { display: flex; flex-direction: column; gap: 2px; }
      .room-row { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
      .room-row span { opacity: .8; }
      .room-invite {
        font: inherit; font-size: 12px; padding: 6px 8px; width: 100%;
        border: 2px solid; border-color: var(--pixel-bevel-dark);
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
      }
      .room-hint { font-size: 11px; opacity: .75; }
      .room-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .room-action {
        flex: 1 1 auto; min-width: 6em;
        font: inherit; font-size: 13px; padding: 8px; min-height: 38px; cursor: pointer;
      }
      body.touch-mode .room-action { min-height: 44px; font-size: 14px; }
      /* 最近连接：一行小胶囊，放不下就横向滚（不换行、不撑高） */
      .mp-recent { display: flex; gap: 6px; align-items: center; overflow-x: auto; padding-bottom: 2px; }
      .mp-recent-label { font-size: 11px; opacity: .7; flex: 0 0 auto; }
      .mp-recent-chip {
        flex: 0 0 auto; font: inherit; font-size: 12px; padding: 4px 8px; cursor: pointer;
        border: 2px solid var(--pixel-bevel-dark); color: var(--mc-text-light);
        background: rgba(0, 0, 0, .25); white-space: nowrap;
      }
      .mp-rooms-empty { font-size: 11px; opacity: .75; padding: 2px 4px; }
      /* 空状态（idle 且没错误）整行撤掉：不占位、不留白，按钮紧跟表单 */
      .mp-status { font-size: 12px; }
      .mp-status:empty { display: none; }
      .mp-status[data-state='connected'] { color: #8ee08e; }
      .mp-status[data-state='error'] { color: #ff9a9a; }
      /* 四颗按钮（开房 / 加入 / 断开 / 关闭）：窄屏放不下就折成两行，
         而不是挤成一条读不出来的字（德语/俄语的按钮词比中文长一倍） */
      /* 主按钮通栏（设计图：加入 / 确定并进入都是一整条大按钮） */
      .mp-actions { display: flex; gap: 8px; flex-wrap: wrap; }
      .mp-action {
        flex: 1 1 100%; min-width: 5.5em;
        font: inherit; font-size: 14px; padding: 8px; min-height: 40px; cursor: pointer;
        color: var(--mc-text-light); background: rgba(0, 0, 0, .35);
        border: 2px solid; border-color: var(--pixel-bevel-dark);
      }
      .mp-action.primary { background: #3f6f2d; color: #fff; }
      .mp-action.primary:hover { background: #4a8236; }
      .mp-action:disabled { cursor: default; color: var(--mc-text-disabled); }
      .mp-hint { font-size: 11px; opacity: .75; }
      /* 触摸端把热区再放大一点（与 `.pause-action` 同一档） */
      body.touch-mode .mp-action { min-height: 44px; font-size: 14px; }
      .settings-row i {
        font-style: normal; color: var(--mc-text-light); text-align: right; white-space: nowrap;
        /* 数字宽度稳定：拖动滑杆时读数不会左右跳 */
        font-variant-numeric: tabular-nums;
      }
      /* 诊断日志与资源包在批次 335 收成了普通动作行（`.settings-row.action`），
         不再需要横跨整行的 diag-block 样式。 */
      /* ---------------- 循环切换控件（批次 109） ----------------
         ⚠️ 基岩版的设置界面里**没有复选框、也没有下拉框**：布尔项与"几选一"项
         都是同一颗灰按钮（`开 / 关`、`‹ 中 ›`），点一下换下一个值。
         所以这里不再有自绘开关——按钮的灰色面/黑描边/斜面统一由文件末尾那节
         "界面按钮统一"给（`.settings-cycle` 在那个清单里）。 */
      .settings-cycle {
        justify-self: start; width: var(--settings-ctrl-w); min-width: var(--settings-ctrl-w);
        min-height: var(--settings-ctrl-h); padding: 4px 6px;
        font: inherit; font-size: 12px; line-height: 1.5; cursor: pointer; text-align: center;
      }
      /* ---------------- 开关（批次 334，用户要求 switch） ----------------
         只有开关本身能点：行容器是 `<div>`，不会像 `<label>` 那样把整行点击转发进来。 */
      .settings-switch {
        position: relative; justify-self: start;
        width: 52px; height: 26px; padding: 0; cursor: pointer;
        background: #2f2f2f; border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-switch-knob {
        position: absolute; top: 2px; left: 2px; width: 18px; height: 18px;
        background: #b9b9b9; border: 2px solid var(--mc-outline);
        box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #6a6a6a;
        transition: left .12s var(--ease);
      }
      .settings-switch.on { background: #3f6f2d; }
      .settings-switch.on .settings-switch-knob { left: 28px; background: #9be06d; }
      .settings-switch:active { box-shadow: inset 2px 2px 0 rgba(255, 255, 255, .18), inset -2px -2px 0 rgba(0, 0, 0, .75); }
      body.touch-mode .settings-switch { width: 58px; height: 30px; }
      body.touch-mode .settings-switch-knob { width: 22px; height: 22px; }
      body.touch-mode .settings-switch.on .settings-switch-knob { left: 30px; }

      /* ---------------- 下拉按钮（批次 334，用户要求多选项用下拉） ----------------
         菜单是 `position: fixed` 挂在 body 上（见 SettingsScreen#openDropdownMenu），
         不然会被设置内容区的 `overflow-y: auto` 裁掉。 */
      .settings-dropdown { justify-self: start; min-width: var(--settings-ctrl-w); }
      /* 世界表单里的下拉铺满控件列（按钮靠左，不再是设置里那种居中短按钮） */
      .settings-dropdown.settings-dropdown-full { width: 100%; min-width: 0; }
      .settings-dropdown.settings-dropdown-full .settings-dropdown-button {
        width: 100%; min-width: 0; text-align: left;
      }
      .settings-dropdown-button {
        width: 100%; min-width: var(--settings-ctrl-w); min-height: var(--settings-ctrl-h); padding: 4px 6px;
        font: inherit; font-size: 12px; line-height: 1.5; cursor: pointer; text-align: center;
      }
      body.touch-mode .settings-dropdown-button { min-width: var(--settings-ctrl-w); padding: 5px 6px; font-size: 13px; }
      .settings-dropdown-menu {
        position: fixed; z-index: 70; display: none;
        padding: 2px; overflow-y: auto;
        background: var(--mc-panel); color: var(--mc-text);
        border: 2px solid var(--mc-outline); border-radius: 0;
        box-shadow: var(--panel-shadow);
      }
      .settings-dropdown-option {
        display: block; width: 100%; padding: 5px 8px;
        font: inherit; font-size: 12px; line-height: 1.4; text-align: left;
        color: var(--mc-text); background: transparent;
        border: 0; cursor: pointer; white-space: nowrap;
      }
      .settings-dropdown-option:hover { background: #cfe8c2; }
      .settings-dropdown-option.selected { background: #6cc349; color: #10230a; }
      body.touch-mode .settings-dropdown-option { min-height: 34px; padding: 7px 9px; font-size: 13px; }

      /* ---------------- 恢复默认（批次 334）：固定在整个设置页最底部 ----------------
         它影响所有分组，所以放在内容滚动区之外，不跟随某个页签。 */
      .settings-footer {
        flex: 0 0 auto; margin-top: 4px; padding-top: 6px;
        border-top: 1px solid rgba(255, 255, 255, .14);
      }
      .settings-footer .settings-reset { width: 100%; }
      /* 批次 20261025-0117：资源包免责（整行跨列）与设置页底部的「非官方」声明。
         两处都刻意做得最不抢眼：11px→10px 的灰字，不参与任何交互，但不用悬停也能读到。 */
      .settings-note {
        grid-column: 1 / -1; margin: 0 0 2px; padding: 0 2px;
        color: rgba(255, 255, 255, .5); font-size: 10px; line-height: 1.35;
      }
      .settings-notice {
        margin: 0 0 6px; color: rgba(255, 255, 255, .45);
        font-size: 10px; line-height: 1.35; text-align: center;
      }
      /* ---------------- 角色形象（批次 296 → 528 改成二级弹窗） ----------------
         用户："外观这里人物的形象的设置可以放到二级弹窗里面去完成，
         二级弹窗里人物可以高一点，右侧按钮紧凑、高度跟人物一致。"
         外观页只留「亮度」与「角色形象：编辑」两行；控件全部搬进弹窗。 */
      .appearance-entry { grid-column: 1 / -1; }
      .appearance-modal {
        position: absolute; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        padding: 8px; background: rgba(0, 0, 0, .55);
      }
      .appearance-modal.hidden { display: none; }
      .appearance-modal-panel {
        width: min(92vw, 620px); max-height: calc(100dvh - 16px);
        display: flex; flex-direction: column; overflow: hidden;
        padding: 8px 10px;
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .appearance-modal-header {
        flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
        padding-bottom: 6px; margin-bottom: 6px;
        border-bottom: 2px solid #9a9a9a;
      }
      .appearance-modal-header b { font-size: 14px; }
      .appearance-close { margin-left: auto; }
      body.touch-mode .appearance-modal .appearance-close {
        min-width: 24px; min-height: 20px; padding: 0 6px; font-size: 12px; line-height: 1.1;
      }
      .appearance-modal-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
      .appearance-hero {
        display: flex; align-items: stretch; gap: 10px;
        min-width: 0; height: 100%;
      }
      .appearance-stage {
        position: relative; flex: 0 0 150px; width: 150px; height: auto; min-height: 240px;
        display: grid; grid-template-rows: 1fr auto auto;
        background: linear-gradient(#1a1f24, #0d1013);
        border: 2px solid; border-color: #5a5a5a #c8c8c8 #c8c8c8 #5a5a5a;
        overflow: hidden;
      }
      .appearance-avatar {
        display: block; width: 100%; height: 100%; min-height: 0;
        touch-action: none; cursor: grab;
      }
      /* 提示单独占画布下方一行：叠在画布上会盖住头发，脸在全身像里本来就小 */
      .appearance-tip {
        font-size: 8px; line-height: 1.2; color: #9a9a9a; text-align: center;
        padding: 0 0 2px; pointer-events: none; text-shadow: 1px 1px 0 #000;
      }
      /* 「全身 / 面部」放在画布下方单独一行：叠在画布上会盖住脚，也点不准 */
      .appearance-focus {
        display: flex; gap: 2px; padding: 2px;
        background: #0d1013;
      }
      .appearance-focus-button {
        flex: 1 1 0; min-width: 0; min-height: 22px;
        font: inherit; font-size: 11px; line-height: 1.3; padding: 2px 0; cursor: pointer;
      }
      body.touch-mode .appearance-focus-button { min-height: 26px; }
      /* 右栏 2 列 × 6 行，行高 30px；`align-content: space-between` 把行均匀撑开，
         容器高度由左侧 stage 的 min-height 决定——两边永远等高。 */
      .appearance-fields {
        flex: 1 1 auto; min-width: 0; height: 100%;
        display: grid; grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 3px 10px; align-content: space-between;
      }
      #settings-screen .appearance-fields .settings-row { min-height: 28px; }
      .appearance-presets {
        grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px;
      }
      .appearance-preset {
        flex: 1 1 0; min-width: 0;
        font: inherit; font-size: 11px; line-height: 1.3; padding: 4px 3px;
        text-align: center; white-space: nowrap; cursor: pointer;
      }
      /* 竖屏窄屏才上下堆叠：横屏即使只有 640 宽也要并排（高度更紧张）。 */
      @media (max-width: 640px) {
        .appearance-hero { flex-direction: column; }
        .appearance-stage { flex: 0 0 auto; width: 140px; min-height: 200px; align-self: center; }
        .appearance-fields {
          width: 100%; height: auto;
          grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        }
      }
      /* 恢复默认（批次 185）：整行一颗键，描边偏红——它是"会改掉所有设置"的动作，
         但不像"删除世界"那样不可逆，所以只做提示色、不加二次确认。 */
      .settings-reset-row { padding-top: 4px; border-top: 1px solid rgba(255, 255, 255, .1); }
      .settings-reset {
        grid-column: 1 / -1;
        width: 100%; min-height: 34px; padding: 5px 10px;
        font: inherit; font-size: 13px; cursor: pointer;
        color: #ffd9d6; background: #5a2b28;
        border: 2px solid; border-color: #a0544f #2a1210 #2a1210 #a0544f;
      }
      .settings-reset:active {
        background: #6b332f;
        border-color: #2a1210 #a0544f #a0544f #2a1210;
      }
      /* ---------------- 滑杆（range 自绘，原版形态） ----------------
         原版滑块 = **深色凹槽 + 浅灰方块把手**（把手是一块带斜面的灰块，
         不是圆点、也不是绿色）。用 inset 硬阴影而不是 border：border 会把 track
         撑高，thumb 的 `margin-top` 就对不上了（那条 -6px 由 22 与 10 的差算出）。 */
      .settings-row input[type="range"] {
        appearance: none; -webkit-appearance: none;
        width: 100%; height: 22px; background: transparent; cursor: pointer;
        /* 批次 528（用户）：滑杆填满中间列，右侧读数紧挨着它。
           这样"标签—滑杆—数字"三段之间的左右边距相等（row 的 column-gap = 8px），
           不会再出现"滑杆只到 300px、数字被甩到行尾"的参差。 */
        max-width: none;
      }
      .settings-row input[type="range"]::-webkit-slider-runnable-track {
        height: 10px;
        background: #1a1a1a;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-row input[type="range"]::-webkit-slider-thumb {
        appearance: none; -webkit-appearance: none;
        width: 12px; height: 22px;
        margin-top: -6px; background: var(--mc-panel);
        border: none;
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark),
                    0 0 0 2px var(--mc-outline);
      }
      .settings-row input[type="range"]::-moz-range-track {
        height: 10px; background: #1a1a1a;
        box-shadow: inset 2px 2px 0 rgba(0, 0, 0, .75), inset -2px -2px 0 rgba(255, 255, 255, .18);
      }
      .settings-row input[type="range"]::-moz-range-thumb {
        width: 12px; height: 22px; border: none;
        background: var(--mc-panel);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark),
                    0 0 0 2px var(--mc-outline);
      }
      /* 分类小标题：设置项变多之后需要分组，否则一长条看不清 */
      .settings-group {
        margin: 10px 0 -2px; padding-top: 8px; font-size: 12px; color: #a8a8a8;
        border-top: 2px solid rgba(255, 255, 255, .16); letter-spacing: 1px;
      }
      /* 文件选择按钮自绘（原生那个浅灰方块在深色面板上非常突兀） */
      .settings-panel input[type="file"]::file-selector-button {
        font: inherit; font-size: 12px; margin-right: 8px; padding: 5px 10px;
        cursor: pointer; color: var(--btn-text);
        background: var(--btn-bg);
        border: 2px solid var(--mc-outline);
      }
      .settings-panel input[type="file"]::file-selector-button:active { background: var(--mc-face-hover); }
      .settings-row input[type="file"] { font: inherit; font-size: 11px; color: #a8a8a8; }

      /* ---------------- 触摸端：只放大热区，**不动面板尺寸**（批次 110） ----------------
         ⚠️ 面板的宽高从批次 110 起由 `--panel-w` / `--panel-h` 统一给（两页共用、
         固定值）。触摸端**不再自己写一套尺寸**——"换个界面就换一个宽高"正是从
         `body.touch-mode .settings-panel { width: ... }` 这类规则来的。
         这里只留两件事：把行高与热区放大到手指点得准。
         ⚠️ 判据用 `body.touch-mode` 而不是 `@media (max-width: 900px)`：
         平板（1024×768 触摸屏）也该拿这套，而它不命中那个宽度断点。 */
      body.touch-mode .settings-row {
        grid-template-columns: minmax(72px, auto) minmax(0, 1fr) minmax(42px, auto);
        min-height: 34px;
      }
      body.touch-mode .settings-row.pair { grid-template-columns: minmax(72px, auto) minmax(0, 1fr); }
      body.touch-mode .settings-row.action { grid-template-columns: minmax(72px, auto) auto minmax(0, 1fr); }
      body.touch-mode .settings-block { gap: 4px 12px; }
      body.touch-mode .settings-row input[type="range"] { height: 34px; }
      body.touch-mode .settings-row input[type="range"]::-webkit-slider-thumb {
        width: 16px; height: 26px; margin-top: -8px;
      }
      /* 批次 167 / 335：两列并排之后每格只有 ~300px；按钮统一 96px、热区 34px */
      body.touch-mode .settings-cycle,
      body.touch-mode .settings-dropdown-button {
        min-width: var(--settings-ctrl-w); padding: 5px 6px; font-size: 13px;
      }
      body.touch-mode .settings-tab { min-height: 40px; padding: 8px 10px; }
      body.touch-mode .settings-tabs { flex: 0 0 88px; }
      body.touch-mode .settings-back { height: 38px; font-size: 14px; }
      body.touch-mode .pause-action { min-height: 46px; font-size: 15px; }

      /* ================================================================
         手机横屏：**本项目的主要场景**（批次 109）
         ================================================================
         用户点明"我们的游戏在手机端是横屏的"。横屏高度只有 ~390px，所以这里
         只压**主菜单**（标题/按钮列）——设置与暂停面板的尺寸已经由
         `--panel-w/--panel-h` 统一给（固定尺寸，横竖屏不再各写一套）。
         ⚠️ 只对 `body.touch-mode` 生效：桌面端把窗口拉矮时不该突然换一套排法
            （PC 端验收脚本按 1440×900 跑）。 */
      @media (orientation: landscape) and (max-height: 560px) {
        /* 横屏的面板高度只有 ~343px：把暂停菜单的按钮从 46px 收到 42px，
           5 颗按钮 + 标题 + 存档信息刚好放得下（面板尺寸不变，只是里面排得更紧） */
        body.touch-mode .pause-action { min-height: 42px; font-size: 14px; }
        /* 那一小段按键/手势说明在横屏下藏起来（高度实在不够，它会顶出滚动条）——
           PC 竖屏/宽屏都能看到，触屏玩家本来也不需要键盘对照表 */
        body.touch-mode .pause-help { display: none; }

        /* ---- 主菜单：横屏宽度富余、高度紧张 ---- */
        body.touch-mode .world-logo { font-size: clamp(24px, 8vh, 42px); }
        body.touch-mode .world-edition { margin-top: 6px; font-size: 10px; }
        body.touch-mode .world-menu { gap: clamp(4px, 1.2vh, 8px); margin-top: clamp(4px, 2vh, 10px); }
        /* 高度两者一致（批次 20261024-1152）：主/次按钮只该在字号上不同 */
        body.touch-mode .world-primary { min-height: 52px; font-size: 14px; }
        body.touch-mode .world-secondary { min-height: 52px; }

        /* ---- 设置：横屏只有 ~343px 高，一屏放完全靠"更紧的行 + 更密的列" ----
           （批次 167。面板尺寸仍然不变，只是里面的行压到 30px、循环按钮再收一档） */
        body.touch-mode .settings-row { min-height: 30px; }
        body.touch-mode .settings-block { gap: 2px 12px; }
        body.touch-mode .settings-block + .settings-block { margin-top: 0; padding-top: 4px; }
        body.touch-mode .settings-cycle,
        body.touch-mode .settings-dropdown-button {
          min-width: var(--settings-ctrl-w); padding: 3px 6px; font-size: 12px;
        }
        body.touch-mode .settings-hint { margin: 2px 0 6px; font-size: 11px; }
        /* 批次 333：横屏形象区再收一档，给 11 行外观控件留高度 */
        body.touch-mode .appearance-stage { flex-basis: 88px; width: 88px; height: 158px; }
        body.touch-mode .appearance-preset { min-width: 62px; padding: 4px 3px; font-size: 11px; }
        /* 批次 334：横屏高度紧张，switch 与底部恢复默认再收一档 */
        body.touch-mode .settings-switch { width: 50px; height: 26px; }
        body.touch-mode .settings-switch-knob { width: 18px; height: 18px; }
        body.touch-mode .settings-switch.on .settings-switch-knob { left: 26px; }
        body.touch-mode .settings-footer { margin-top: 2px; padding-top: 4px; }
        body.touch-mode .settings-footer .settings-reset { min-height: 28px; padding: 3px 8px; font-size: 12px; }
        /* 批次 20261025-0117：横屏高度紧张，两条声明各收一档（仍是 9px 可读） */
        body.touch-mode .settings-note,
        body.touch-mode .settings-notice { font-size: 9px; line-height: 1.3; }
        body.touch-mode .settings-notice { margin-bottom: 4px; }
      }

      /* ---------------- 状态效果 HUD ---------------- */
      #effects-hud {
        display: flex; flex-direction: column; gap: 3px; align-items: flex-end;
        pointer-events: none; font-size: 12px;
      }
      .effect-chip {
        display: flex; align-items: center; gap: 6px;
        padding: 3px 9px; border-radius: 999px; color: #fff;
        background: var(--hud-bg); border: 1px solid var(--hud-border);
        box-shadow: var(--hud-shadow);
        text-shadow: 1px 1px 0 #000;
      }
      /* 左边一颗小色点标"这是好效果还是坏效果"：整块变色的可读性不如一个明确的点 */
      .effect-chip::before {
        content: ''; width: 7px; height: 7px; border-radius: 50%;
        background: #b9c2cc; box-shadow: 0 0 6px currentColor;
      }
      .effect-chip.good { border-color: #79c46b66; }
      .effect-chip.good::before { background: #79c46b; box-shadow: 0 0 6px #79c46b; }
      .effect-chip.bad { border-color: #d46b6b66; }
      .effect-chip.bad::before { background: #d46b6b; box-shadow: 0 0 6px #d46b6b; }
      .effect-chip.instant { border-color: #6b9cd466; }
      .effect-chip.instant::before { background: #6b9cd4; box-shadow: 0 0 6px #6b9cd4; }

      /* ---------------- 聊天与玩家信息（左上角，批次 206） ----------------
         用户："聊天界面应该显示在左上角，聊天输入框也是左上角；
         玩家被攻击、扣血、掉饥饿值这些信息也在左上角显示。"
         以前它在左下（快捷栏上方），手机上会和摇杆、血条抢地方。 */
      #chat {
        /* z-index 低于背包(10)：打开面板时聊天不该压在面板上（原版也这样）。
           但仍然高于 HUD 与遮罩，游戏里照常可见。 */
        position: fixed; left: 10px; top: calc(8px + env(safe-area-inset-top, 0px));
        z-index: 8;
        width: min(52vw, 620px); display: flex; flex-direction: column; gap: 2px;
        /* 字号（批次 532）：**出现时 = 展开时 ×1.1**。
           - 展开聊天（输入框 / 提示 / 历史）统一 12px，翻 120 行也读得清；
           - 收起时弹出的消息用 13.2px，比展开略大一点，不再用 24px 那种大块头。
           改这里一处即可，别的地方不要写死 px。 */
        --chat-open-size: 12px;
        --chat-pop-size: calc(var(--chat-open-size) * 1.1);
        font-size: var(--chat-open-size); line-height: 1.45; pointer-events: none;
        /* 面板本身不滚动：滚的是里面的 .chat-log，输入框始终留在原地。
           ⚠️ 别把 `--kb-inset` 减在这里：横屏手机本身只有 ~390px 高，键盘一弹
           再减 250px 就把整块压成 0 高（输入框被 flex 挤没），看起来就是"闪一下不见了"。
           键盘在屏幕底部，顶部这块不需要为它让高度；让日志自己算。 */
        max-height: calc(100dvh - 120px);
      }
      #chat.open { pointer-events: auto; }
      /* 消息显示期间点一下直接进聊天（批次 220，用户："在显示时，点击可以立即进入聊天状态"）。
         只有收起状态下**画出来的消息条**接手势：缝隙与空白处照常转视角，
         消息全部过期后 JS 会摘掉 `.peek`，不会在屏幕左上角留一块看不见的点击陷阱。 */
      #chat.peek { cursor: pointer; }
      #chat.peek .chat-log { pointer-events: auto; touch-action: manipulation; }
      /* 输入行固定在最上面（左上角），不许被 flex 压缩 */
      .chat-entry { display: flex; gap: 4px; align-items: stretch; flex: 0 0 auto; }
      .chat-entry.hidden { display: none; }
      .chat-entry .chat-input { flex: 1 1 auto; min-width: 0; }
      .chat-entry .chat-send { flex: 0 0 auto; }
      .chat-hint { flex: 0 0 auto; }
      /* 提示行里的 help 是可点的（批次 534）：点一下把 /help 填进输入框，
         不再单独占一行放按钮。 */
      .chat-help-link {
        font: inherit; font-size: inherit; line-height: inherit;
        padding: 0; margin: 0; cursor: pointer;
        color: #b8f09a; background: none; border: 0;
        text-decoration: underline;
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .8);
      }
      .chat-help-link:hover { color: #fff; }
      .chat-log {
        display: flex; flex-direction: column; gap: 1px;
        max-height: 34vh; overflow: hidden;
        /* 触屏滑动查看历史（批次 206）：纵向手势交给这一层滚动 */
        touch-action: pan-y; overscroll-behavior: contain;
        flex: 1 1 auto; min-height: 0;
      }
      /* 打开输入框：铺出更多历史并允许滑动；输入行在上、历史在下 */
      #chat.open .chat-log {
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        max-height: max(56px, calc(100dvh - var(--kb-inset, 0px) - 180px));
        /* 批次 528：展开后与输入框 / 提示同字号，不再"下面大一号" */
        font-size: var(--chat-open-size);
        /* 批次 532（用户）：历史区要是一整块，不能每行之间露出一条白缝 */
        gap: 0;
        background: rgba(0, 0, 0, .42);
      }
      /* 展开时每行不再各自铺一层底色：整块用 .chat-log 的背景，
         否则相邻两行的圆角/边框之间会露出细白线。 */
      #chat.open .chat-line {
        background: transparent;
        padding: 1px .45em;
      }
      /* 键盘弹出时布局视口不再变矮（viewport 是 resizes-visual，批次 184）：
         聊天已经在顶部、输入框不会被键盘挡住，这里只需要把历史高度再收一点，
         由上面那条 `max-height` 里的 `--kb-inset` 负责（由 `ui/Keyboard.ts` 维护）。 */
      /* 收起时（弹出消息）字号是展开时的两倍；用 em 留白，两种字号都不会挤/散 */
      #chat:not(.open) .chat-line { font-size: var(--chat-pop-size); }
      .chat-line {
        padding: .16em .45em; border-radius: var(--radius-sm); color: #fff;
        background: rgba(0, 0, 0, .42);
        border-left: 2px solid rgba(255, 255, 255, .18);
        text-shadow: 1px 1px 0 #000;
        /* 淡出 0.8s：消息整条活 3 秒（2.2s 清晰 + 0.8s 淡出），过渡正好在移出前走完 */
        transition: opacity .8s linear; overflow-wrap: anywhere;
        animation: chat-in var(--dur-med) var(--ease);
        /* 多行反馈（/gamerule）保留换行 */
        white-space: normal;
      }
      /* 多行消息（还有 \n 的旧格式）：保留换行，别再挤成一行 */
      .chat-line.chat-multiline { white-space: pre-wrap; }
      /* 超出一行的消息（批次 279）：默认只显示一行（末尾省略号），点一下展开。
         用 `nowrap + ellipsis` 而不是 `line-clamp`：这样 JS 量 `scrollWidth > clientWidth`
         就是可靠的"到底有没有超"，不依赖 WebKit 对 clamped 元素 scrollHeight 的实现。 */
      .chat-line.collapsible {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      /* 批次 532（用户）：被截断的行要有明确的"展开"提示——
         以前只有末尾省略号，玩家不知道整行可以点。 */
      #chat.open .chat-line.collapsible {
        position: relative;
        padding-right: 30px;
      }
      #chat.open .chat-line.collapsible::after {
        /* 批次 20261025-0105：角标文字不能写死在 CSS 里（静态样式不参与切语言重绘，
           英文模式下会永远显示「展开」）。改由 `ui/ChatInput.ts` 写 `data-expand-badge`，
           这里只负责取——缺属性时 `content` 为空，角标退化成一个空底色，不会露出键名。 */
        content: attr(data-expand-badge);
        position: absolute; right: 3px; top: 50%;
        transform: translateY(-50%);
        padding: 1px 3px;
        font-size: 9px; line-height: 1.3; color: #ffd98a;
        background: rgba(0, 0, 0, .42);
        pointer-events: none;
      }
      .chat-line.collapsible.expanded {
        white-space: normal;
        overflow: visible;
        text-overflow: clip;
      }
      #chat.open .chat-line.collapsible.expanded {
        padding-right: .45em;
      }
      #chat.open .chat-line.collapsible.expanded::after { display: none; }
      /* 新消息淡入并微微上移（原来是一行行"凭空出现"） */
      @keyframes chat-in {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: none; }
      }

      /* ================================================================
         命令帮助弹窗（批次 533）
         `/help` 不再刷聊天历史；左边命令列表、右边说明 + 表单生成器。
         视觉沿用设置/世界面板：深色底 + 3px 像素斜面 + 暗投影。
         ================================================================ */
      #command-help {
        position: fixed; inset: 0; z-index: 64;
        display: flex; align-items: center; justify-content: center;
        padding: 12px; background: rgba(0, 0, 0, .58);
      }
      #command-help.hidden { display: none; }
      .cmd-help-panel {
        width: min(92vw, 880px); height: min(88dvh, 620px);
        display: flex; flex-direction: column; overflow: hidden;
        padding: 12px 14px;
        background: var(--mc-menu-bg); color: var(--mc-text-light);
        border: 3px solid; border-color: var(--pixel-bevel-dark);
        box-shadow: var(--panel-shadow);
        font-size: 13px; text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .cmd-help-header {
        display: flex; align-items: center; gap: 10px;
        flex: 0 0 auto; padding-bottom: 8px;
        border-bottom: 2px solid rgba(255, 255, 255, .16);
      }
      .cmd-help-title { font-size: 15px; color: #fff; white-space: nowrap; }
      .cmd-help-search { flex: 1 1 auto; min-width: 0; }
      .cmd-help-close {
        flex: 0 0 auto; font: inherit; font-size: 13px; line-height: 1;
        min-width: 28px; min-height: 26px; padding: 0 7px; cursor: pointer;
        background: var(--btn-bg); color: var(--btn-text);
        border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .cmd-help-body {
        display: flex; gap: 12px; flex: 1 1 auto; min-height: 0; padding-top: 10px;
      }
      .cmd-help-list {
        width: 184px; flex: 0 0 184px; overflow-y: auto;
        display: flex; flex-direction: column; gap: 2px; padding-right: 4px;
      }
      .cmd-help-item {
        display: block; width: 100%; text-align: left;
        background: transparent; border: 0; border-left: 3px solid transparent;
        color: #d8d8d8; padding: 6px 8px; cursor: pointer; font: inherit;
      }
      .cmd-help-item:hover { background: rgba(255, 255, 255, .08); color: #fff; }
      .cmd-help-item.active {
        background: rgba(108, 195, 73, .16);
        border-left-color: #6cc349; color: #c8f5b5;
      }
      .cmd-help-item-name { display: block; font-size: 12px; color: inherit; }
      .cmd-help-item-desc {
        display: block; margin-top: 1px; font-size: 10px; color: #9a9a9a;
        line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .cmd-help-item.active .cmd-help-item-desc { color: #a9c99b; }
      .cmd-help-empty { padding: 8px; color: #999; font-size: 11px; }
      .cmd-help-detail { flex: 1 1 auto; min-width: 0; overflow-y: auto; padding-right: 2px; }
      .cmd-help-detail-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .cmd-help-detail-head b { font-size: 16px; color: #fff; }
      .cmd-help-tag {
        padding: 1px 5px; font-size: 9px; color: #ffd98a;
        background: rgba(0, 0, 0, .25); border: 1px solid #8a6f2f;
      }
      .cmd-help-usage {
        margin-top: 6px; padding: 6px 8px;
        background: rgba(0, 0, 0, .26); border-left: 3px solid #6cc349;
        color: #fff; font-size: 11px; line-height: 1.45; word-break: break-all;
      }
      .cmd-help-desc {
        margin: 7px 0 4px; color: #c8c8c8; font-size: 12px; line-height: 1.55;
      }
      .cmd-help-note {
        margin: 0 0 10px; color: #9fb08f; font-size: 10px; line-height: 1.45;
      }
      .cmd-help-form {
        display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 8px 10px;
      }
      .cmd-help-field { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .cmd-help-field label { font-size: 10px; color: #a8a8a8; }
      .cmd-help-field .world-input { width: 100%; box-sizing: border-box; }
      /* 物品/方块自动联想占满整行，结果列表直接展开在输入框下面（不遮挡其它字段） */
      .cmd-help-field-suggest { grid-column: 1 / -1; }
      .cmd-help-suggest-list {
        display: flex; flex-direction: column;
        max-height: 168px; overflow-y: auto; margin-top: 2px;
        background: #1c1c1c; border: 2px solid rgba(255, 255, 255, .16);
        touch-action: pan-y; overscroll-behavior: contain;
      }
      .cmd-help-suggest-list[hidden] { display: none; }
      .cmd-help-suggest-item {
        font: inherit; font-size: 11px; text-align: left;
        padding: 4px 8px; cursor: pointer;
        background: transparent; border: 0; color: #d8d8d8;
      }
      .cmd-help-suggest-item:hover { background: rgba(108, 195, 73, .18); color: #fff; }
      .cmd-help-combo-custom { margin-top: 4px; }
      .cmd-help-combo-custom[hidden] { display: none; }
      .cmd-help-preview {
        margin-top: 10px; padding: 8px; min-height: 30px;
        background: rgba(0, 0, 0, .38); border: 2px solid rgba(255, 255, 255, .14);
        color: #b8f09a; font-size: 12px; line-height: 1.4; word-break: break-all;
      }
      .cmd-help-preview.bad { color: #ff9b8a; }
      .cmd-help-error { min-height: 14px; margin-top: 4px; color: #ff9b8a; font-size: 10px; }
      /* 确认按钮：钉在指令名那一行的**右端**（批次 20261025 用户要求） */
      .cmd-help-confirm {
        margin-left: auto;
        font: inherit; font-size: 12px; min-height: 28px; padding: 4px 14px; cursor: pointer;
        background: #3f6f2d; color: #fff; border: 2px solid var(--mc-outline);
        box-shadow: inset 2px 2px 0 var(--mc-edge-light), inset -2px -2px 0 var(--mc-edge-dark);
        text-shadow: 1px 1px 0 var(--mc-text-shadow);
      }
      .cmd-help-confirm:not(:disabled):hover { background: #4a8236; }
      .cmd-help-confirm:disabled { opacity: .45; cursor: default; }
      body.touch-mode .cmd-help-panel {
        width: 96vw; height: min(92dvh, calc(100dvh - 24px)); padding: 10px;
      }
      body.touch-mode .cmd-help-item { min-height: 40px; }
      body.touch-mode .cmd-help-field .world-input { font-size: 13px; padding: 7px 8px; }
      @media (max-width: 620px) {
        .cmd-help-body { flex-direction: column; }
        .cmd-help-list {
          width: 100%; flex: 0 0 auto; max-height: 104px;
          flex-direction: row; overflow-x: auto; overflow-y: hidden;
        }
        .cmd-help-item { min-width: 132px; }
      }
      .chat-line.chat-system { color: #d8e6b0; border-left-color: #a9c46b; }
      .chat-line.chat-error { color: #ff9a8a; border-left-color: #e0604c; }
      .chat-line.chat-player { color: #fff; border-left-color: #7db6f0; }
      /* 玩家信息（批次 206）：受伤 / 回复 / 警告三种一眼能分开 */
      .chat-line.chat-damage { color: #ff9c9c; border-left-color: #d64545; }
      .chat-line.chat-gain { color: #a9e5a0; border-left-color: #57a94a; }
      .chat-line.chat-warning { color: #ffd98a; border-left-color: #d8a028; }
      .chat-line.fading { opacity: .45; }
      .chat-hint {
        padding: 2px 6px; color: #c8c8c8; font-size: var(--chat-open-size);
        background: rgba(0, 0, 0, .35); border-radius: 3px;
      }
      .chat-input {
        font: inherit; font-size: var(--chat-open-size); padding: 5px 8px; border-radius: 3px;
        background: rgba(0, 0, 0, .78); color: #fff; border: 1px solid #ffffff44;
        outline: none;
      }
      /* 触屏的"发送"按钮：与输入框同一行（手机虚拟键盘不一定给 Enter 的 keydown） */
      .chat-send {
        align-self: flex-start; margin-top: 2px; padding: 8px 16px;
        font: inherit; font-size: var(--chat-open-size); color: #fff; cursor: pointer;
        background: #3a7d33; border: 1px solid #ffffff55; border-radius: 4px;
        min-height: 36px;
      }
      .chat-send:active { background: #2f6629; }
      .chat-input.hidden, .chat-hint.hidden, .chat-send.hidden { display: none; }

      /* ---------------- 物品提示框 ---------------- */
      #item-tooltip {
        position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none;
        max-width: 300px; padding: 9px 12px;
        /* 原版提示框是**近黑的紫底 + 紫色边框**（不是中性灰），文字白字带阴影。
           这里保留"左侧一条稀有度色条"（原版没有，但它是我们唯一能一眼看出品质的地方） */
        background: #100010f2;
        border: 2px solid #2d0a63;
        border-left: 4px solid var(--rarity-common);
        border-radius: 0;
        color: #e6e6e6; font-size: 12px; line-height: 1.55;
        text-shadow: 1px 1px 0 #000;
        box-shadow: 0 0 0 2px var(--mc-outline);
      }
      #item-tooltip.hidden { display: none; }
      /* 稀有度决定左侧色条（标题另外按类名上色，见上面的 .rarity-*） */
      #item-tooltip[data-rarity='uncommon'] { border-left-color: var(--rarity-uncommon); }
      #item-tooltip[data-rarity='rare'] { border-left-color: var(--rarity-rare); }
      #item-tooltip[data-rarity='epic'] { border-left-color: var(--rarity-epic); }
      #item-tooltip .tooltip-title { font-size: 13px; font-weight: 700; }
      #item-tooltip .tooltip-subtitle { color: #7f8c9b; font-size: 11px; margin-bottom: 4px; }
      #item-tooltip .tooltip-desc { color: #d8d8d8; }
      /* 附魔一条一行、青蓝色（与"稀有"同一个色系，一眼能看出是附魔） */
      #item-tooltip .tooltip-enchants { margin-top: 4px; }
      #item-tooltip .tooltip-enchant { color: var(--rarity-rare); font-size: 11px; }
      /* 耐久：文案 + 一条迷你条（快坏了能一眼看出来，不用去读数字） */
      #item-tooltip .tooltip-durability {
        display: flex; align-items: center; gap: 6px;
        margin-top: 5px; color: #b9c2cc; font-size: 11px;
      }
      #item-tooltip .tooltip-durability .dur-bar {
        position: static; width: 56px; height: 4px; flex: none;
      }
      #item-tooltip .tooltip-meta { color: #9a9a9a; font-size: 11px; margin-top: 5px; }

      #break-progress {
        position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
        width: 120px; height: 6px;
        background: rgba(0, 0, 0, .62);
        border-radius: 3px; overflow: hidden; display: none;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .12);
      }
      #break-progress.on { display: block; }
      #break-progress i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#ffffff, #c8c8c8);
        box-shadow: 0 0 8px rgba(255, 255, 255, .5);
      }
      /* 进食进度条（批次 219）：与破坏进度条同一套视觉，位置往上一格。
         两者不会同时出现（挖掘要求准星对着方块，进食要求没对着），所以不打架。 */
      #eat-progress {
        position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%);
        width: 120px; height: 6px;
        background: rgba(0, 0, 0, .62);
        overflow: hidden; display: none;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .8), 0 0 0 1px rgba(255, 255, 255, .12);
      }
      #eat-progress.on { display: block; }
      #eat-progress i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(#ffe9a8, #e0b552);
        box-shadow: 0 0 8px rgba(255, 210, 120, .5);
      }

      /* boss 血条（末影龙）：只在 boss 存活时显示 */
      #boss-bar {
        position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
        width: min(420px, 68vw); display: none;
        background: var(--hud-bg);
        border: 1px solid var(--hud-border);
        border-radius: var(--radius-md); padding: 4px 10px 6px;
        text-align: center; color: #fff; font-size: 12px;
        box-shadow: var(--hud-shadow);
        text-shadow: 1px 1px 0 rgba(0, 0, 0, .8);
      }
      #boss-bar.on { display: block; }
      #boss-bar b { font-weight: normal; letter-spacing: 1px; }
      #boss-bar i {
        display: block; height: 8px; margin-top: 3px; border-radius: 4px;
        background: rgba(255, 255, 255, .14);
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, .75);
        overflow: hidden;
      }
      /* 凋灵（批次 116）：同一条血条，只是配色偏暗红——一眼能分出"现在打的是谁" */
      #boss-bar.wither i s {
        background: linear-gradient(#e0665a, #7a1a14);
        box-shadow: 0 0 10px rgba(214, 80, 60, .6);
      }
      /* 护盾期（转阶段那 5 秒）：血条闪蓝，说明"现在打它不掉血" */
      #boss-bar.shielded i s {
        background: linear-gradient(#8fd8ff, #2f7fbf);
        box-shadow: 0 0 10px rgba(120, 200, 255, .7);
      }
      #boss-bar i s {
        display: block; height: 100%; width: 100%;
        background: linear-gradient(#f56cf5, #b02ab0);
        box-shadow: 0 0 10px rgba(214, 59, 214, .6);
        transition: width .18s linear;
      }

      #hotbar .slot .count {
        position: absolute; right: 2px; bottom: 1px; font-size: 12px; color: #fff;
        /* 数字压在图标上有时候看不清，加一圈描边（比单方向阴影更稳） */
        text-shadow: 1px 1px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000, -1px -1px 0 #000;
      }
      #hotbar .slot .icon { width: 32px; height: 32px; visibility: hidden; }

      /* ---------------- 背包界面 ---------------- */
      #inventory-screen {
        position: fixed; inset: 0; z-index: 10;
        /* 上行：居中 shell；下行：屏幕底快捷栏 dock（携带版） */
        display: grid;
        grid-template-rows: 1fr auto;
        justify-items: center;
        align-items: center;
        background: rgba(0, 0, 0, .42);
        box-sizing: border-box;
      }
      #inventory-screen.hidden { display: none; }
      /* 批次 20261024-1455（用户自测："背包在有些屏幕上被挤到快捷栏上面一点"）：
         携带版的快捷栏 dock 是 `position: fixed`，**不参与**这个网格 —— 第二行塌成 0，
         面板就按整屏高度居中，底边正好压在 dock 上。
         这里给屏幕层留出 dock 的高度（含安全区），面板自然落到它上面。 */
      body.inv-pocket-open #inventory-screen {
        padding-bottom: calc(62px + env(safe-area-inset-bottom, 0px));
      }
      /* 携带版外壳：左轨 | 灰框 | 右轨（页签在 border 外，对齐 Wiki） */
      .inv-shell {
        grid-row: 1;
        display: flex; flex-direction: row; align-items: stretch;
        justify-content: center; gap: 0;
        max-width: 100%; max-height: 100%;
        min-width: 0; align-self: center;
      }
      .inv-shell:not(.pocket-chrome) .inv-rail-left,
      .inv-shell:not(.pocket-chrome) .inv-rail-right { display: none; }
      .inv-rail-left, .inv-rail-right {
        display: flex; flex-direction: column; flex: 0 0 auto;
        gap: 4px; z-index: 2;
      }
      .inv-rail-left.hidden, .inv-rail-right.hidden { display: none; }
      .inv-shell.pocket-chrome .inv-rail-left {
        /* 批次 184：用户要求"左侧按钮要一个竖列展示，不要换列"——
           批次 181 为解决截断改成的两列**改回单列**。
           截断问题改由"按钮按可用高度均分"解决（见下面 `.inv-pocket-recipes / .inv-tabs`），
           所以创造模式 10 个分类 + 物品栏共 11 颗也能整列放下，不需要滚动。 */
        justify-content: flex-start; align-items: center;
        gap: 2px;
        padding: 4px 0;
        width: 40px; min-height: 0; max-height: 100%;
        overflow: hidden;
      }
      .inv-shell.pocket-chrome .inv-rail-right {
        justify-content: flex-end; align-items: flex-start;
        padding: 0 0 56px; /* 合成/盔甲贴在灰框右下外侧 */
        width: 40px;
      }
      .inv-shell.pocket-chrome .inv-pocket-side {
        position: static; display: flex; flex-direction: column; gap: 4px;
      }
      /* 右轨的"动作键"（成就，批次 185）：与页签同尺寸，但不吃选中态 */
      .inv-shell.pocket-chrome .inv-rail-right .inv-rail-action {
        width: 36px; height: 36px; min-height: 36px;
      }
      .inv-shell.pocket-chrome .inv-pocket-inv-tab { position: static; }
      .inv-shell.pocket-chrome .inv-pocket-recipes {
        position: static;
        /* 单列竖排（批次 184）。`flex: 1 1 auto` + 内部按钮 `flex: 1 1 0`：
           这一组吃掉左轨剩余高度，按钮再多也只会变矮，不会换列/被截断。 */
        display: flex; flex-direction: column; gap: 2px;
        flex: 1 1 auto; min-height: 0;
        align-items: center;
        overflow: hidden; max-height: none;
      }
      /* 携带版快捷栏：屏幕底、面板外（Wiki）；经典时 dock 隐藏、格回面板内 */
      .inv-hotbar-dock {
        grid-row: 2;
        display: none;
        justify-content: center; align-items: center;
        width: 100%; padding: 6px 12px 12px;
        box-sizing: border-box;
        align-self: end;
      }
      .inv-hotbar-dock:not(.hidden) { display: flex; }
      .inv-hotbar-dock.hidden { display: none !important; }
      /* 快捷栏属于整块屏幕，不属于左右并排后的"背包右半屏"。
         固定到视口底边后，合成页打开配方书时也仍与游戏内 HUD 居中对齐。 */
      .inv-hotbar-dock:not(.hidden) {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
        width: 100vw;
      }
      .inv-hotbar-dock .inv-hotbar {
        margin: 0; width: max-content; max-width: none;
        grid-template-columns: repeat(9, 44px);
        gap: 1px;
      }
      .inv-hotbar-dock .inv-slot {
        width: 44px; height: 44px; min-width: 44px;
        max-width: 44px; max-height: 44px; justify-self: center;
      }
      .inv-hotbar-dock .inv-slot canvas {
        width: 36px; height: 36px; max-width: 36px; max-height: 36px;
      }
      /* Wiki：底栏快捷栏自带一圈灰框，与面板分离 */
      .inv-hotbar-dock:not(.hidden) .inv-hotbar {
        padding: 4px 6px;
        background: var(--panel-bg);
        border: 3px solid; border-color: var(--pixel-bevel);
        box-shadow: var(--panel-shadow);
      }
      /* 打开携带版时藏 HUD 快捷栏 / 经验 / 生命，只留 dock 那一排（对齐 Wiki） */
      body.inv-pocket-open #hotbar,
      body.inv-pocket-open #xp-bar,
      body.inv-pocket-open #xp-level,
      body.inv-pocket-open #vitals {
        visibility: hidden; pointer-events: none;
      }
      /* ---------------- 配方书嵌进背包左栏（批次 157） ----------------
         配方书把 `.recipe-panel` 搬进左栏那一格后自己加 `.embedded`。
         这里只把它压成"填满这一格、内容在格内滚"。
         ⚠️ 批次 20261024-1455：标题栏那颗键已改回"整屏面板 + 手动开关"，
         左栏不再有落脚点（那一格样式已删）；这套 `.embedded`
         样式留着是因为 `RecipeBook.attach()` 这个能力本身还在，别再往里加新东西。 */
      .recipe-panel.embedded {
        position: relative;
        width: 100%; max-width: 100%;
        height: 100%; max-height: 100%;
        margin: 0; padding: 0 2px;
        box-sizing: border-box;
        display: flex; flex-direction: column;
        overflow: hidden;
        /* 它现在是背包左栏里的**内容**，不是一个套在里面的窗口：
           再画一圈边框 + 阴影就成了"面板里嵌面板"，反而看不清分栏。 */
        background: transparent;
        border: 0;
        box-shadow: none;
        border-radius: 0;
      }
      /* 分类页签就是左轨那排图标，面板内不再重复一排 */
      .recipe-panel.embedded .recipe-tabs { display: none; }
      /* 批次 159：嵌在左栏时**整条标题行都不要**——"配方书"三个字和那颗 ✕ 都去掉。
         配方列表上方再写一次自己是多余的；关闭入口移到标题栏那颗开关上
         （另一个出口是左下"我的物品"页签）。 */
      .recipe-panel.embedded .recipe-header { display: none; }
      .recipe-panel.embedded .recipe-hint,
      .recipe-panel.embedded .recipe-detail { display: none; }
      /* 搜索框只属于放大镜（全部）分类；其余分类像原版一样直接从物品格开始。 */
      .recipe-panel.embedded:not([data-tab='all']) .recipe-controls { display: none; }
      .recipe-panel.embedded .recipe-controls {
        flex: 0 0 auto; margin-bottom: 6px;
      }
      .recipe-panel.embedded .recipe-search {
        min-width: 0; height: 30px; box-sizing: border-box;
      }
      .recipe-panel.embedded .recipe-filter {
        width: 30px; height: 30px;
      }
      /* 批次 159：「只显示我拥有的」已经搬到标题栏那颗开关上了，
         面板里再留一颗同样的就是把同一个开关做成两个（且两个不会同步）。 */
      .recipe-panel.embedded .recipe-filter { display: none; }
      /* 只有这一格能滚：外框与左栏网格都不动。
         列数必须与 `RECIPE_PANE_PAGE_SIZE` 对上（7 列 × 4 行），
         半栏宽塞不下 12 列 / 8 列——硬塞会被 `overflow-x: hidden` 裁掉。 */
      .recipe-panel.embedded .recipe-grid {
        grid-template-columns: repeat(7, var(--recipe-cell));
        flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden;
        overscroll-behavior: contain;
        align-content: start;
      }
      /* 熔炼属于熔炉界面；嵌在左栏时整张熔炼表会把配方网格压成一条缝 */
      .recipe-panel.embedded .recipe-smelting { display: none; }
      /* 批次 159：触摸端改成整表滚动，滚动条要**看得见**——
         看不见就不知道下面还有东西（PC 那条路是底部翻页键，用不上滚动条）。
         ⚠️ 批次 20261024-1645（用户）：创造物品栏**已经换成自绘那根**（`.inv-creative-section
         .inv-category-scrollbar`），这里再给 `.inv-creative` 开一条原生滚动条就是两条并排：
         原生那条（8px、#b9b9b9 槽 + #6f6f6f 块）压在自绘滑块下面，滚起来就是用户说的
         "滑块下面的小滚动条 / 底下的小黑块"。所以这段只留给嵌入版配方网格。 */
      .recipe-panel.embedded .recipe-grid {
        scrollbar-width: thin;
        scrollbar-color: #6f6f6f #b9b9b9;
      }
      .recipe-panel.embedded .recipe-grid::-webkit-scrollbar { width: 8px; }
      .recipe-panel.embedded .recipe-grid::-webkit-scrollbar-track { background: #b9b9b9; }
      .recipe-panel.embedded .recipe-grid::-webkit-scrollbar-thumb {
        background: #6f6f6f; border: 1px solid #4a4a4a;
      }
      /* 创造物品栏：原生滚动条彻底关掉（自绘那根才是一直可见的那条） */
      .inv-panel .inv-grid.inv-creative { scrollbar-width: none; }
      .inv-panel .inv-grid.inv-creative::-webkit-scrollbar { display: none; width: 0; height: 0; }
      .recipe-panel.embedded .inv-pager {
        flex: 0 0 auto; margin-top: 4px; gap: 4px;
      }
      .recipe-panel.embedded .inv-page-button {
        min-width: 34px; min-height: 30px; padding: 2px 7px;
        font-size: 0; position: relative;
      }
      .recipe-panel.embedded .inv-page-button::after { font-size: 15px; }
      .recipe-panel.embedded .inv-page-button[data-role='prev']::after { content: '‹'; }
      .recipe-panel.embedded .inv-page-button[data-role='next']::after { content: '›'; }
      .recipe-panel.embedded .inv-page-label { font-size: 11px; }

      .inv-panel {
        background: var(--panel-bg);
        /* 像素斜角（批次 108）：左上亮、右下暗的一圈硬边，直角 */
        border: 3px solid; border-color: var(--pixel-bevel);
        border-radius: var(--panel-radius);
        padding: 14px 16px;
        /* 贴合内容：固定 660px 时"主背包"右边会空出一大片灰（看着像没排好版） */
        width: fit-content; min-width: min(420px, 92vw);
        max-width: 660px; max-height: 92vh; overflow-y: auto;
        box-shadow: var(--panel-shadow);
      }
      .inv-header {
        display: flex; justify-content: space-between; align-items: baseline;
        gap: 8px 18px; flex-wrap: wrap;
        color: var(--panel-text); font-size: 14px;
        padding-bottom: 8px; margin-bottom: 4px;
        border-bottom: 2px solid #a9a9a9;
      }
      .inv-header b { font-size: 16px; letter-spacing: 1px; }
      .inv-header kbd {
        padding: 0 4px; border: 1px solid #777; border-radius: 3px;
        background: #e6e6e6; font-size: 12px;
      }
      /* 分区标题：前面一小条强调色（比纯文字更"分得开"，也不占地方） */
      .inv-label { color: #3a3a3a; font-size: 12px; margin: 10px 0 5px; letter-spacing: .5px; }
      .inv-label::before {
        content: ''; display: inline-block; width: 3px; height: 11px;
        margin-right: 6px; vertical-align: -1px;
        background: var(--accent); border-radius: 2px;
      }

      .inv-craft { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 4px 0 8px; }
      .inv-craft-grid.size-2 { grid-template-columns: repeat(2, 42px); }
      .inv-craft-grid.size-3 { grid-template-columns: repeat(3, 42px); }
      .inv-arrow { position: relative; font-size: 22px; color: #4a4a4a; }
      /* 箭头旁边"需要什么站台"的图标组（批次 185，批次 531 支持多个）。
         横排合成：在箭头上方正中间排开；竖排合成（手机）改挂箭头右侧竖排——
         上方是 2×2 材料格，挂上去会盖住最后一排。
         图标本身是按钮（可点击看说明），容器不接手势。 */
      .inv-craft-stations {
        position: absolute; left: 50%; bottom: calc(100% + 4px);
        transform: translateX(-50%);
        display: flex; align-items: center; justify-content: center; gap: 3px;
        flex-wrap: wrap; max-width: 128px;
        z-index: 2; pointer-events: none;
      }
      .inv-craft-stations.hidden { display: none; }
      .inv-craft-station-icon {
        width: 20px; height: 20px; padding: 0; flex: 0 0 auto;
        display: grid; place-items: center; cursor: pointer;
        background: #3a3a3a; border: 2px solid; border-radius: 0;
        border-color: #d0d0d0 #4a4a4a #4a4a4a #d0d0d0;
        box-shadow: 0 1px 0 rgba(0, 0, 0, .4);
        pointer-events: auto; touch-action: manipulation;
      }
      .inv-craft-station-icon:active { background: #5a5a5a; }
      .inv-craft-station-icon canvas { width: 14px; height: 14px; image-rendering: pixelated; }
      .inv-craft.inv-craft-vertical .inv-craft-stations {
        left: auto; right: -24px; top: 50%; bottom: auto;
        transform: translateY(-50%);
        flex-direction: column; flex-wrap: nowrap; max-width: 24px;
      }
      /* 能合成 / 能取走的槽位：一层柔和的强调底（比原来纯色块更"活"） */
      .inv-slot.ready {
        background: linear-gradient(#9fce9c, #86b083);
        box-shadow: inset 0 0 10px rgba(120, 220, 120, .35);
      }
      /* 只取不放的槽位（合成结果、熔炉产物）用暖色底提示 */
      .inv-slot.take-only { background: linear-gradient(#a8a897, #93937f); }
      /* 缺料预览的产物（批次 206）：能看见"会做出什么"，但明确不是可取的实物 */
      .inv-slot.preview-result {
        background: linear-gradient(#a89a8a, #8f8478);
        box-shadow: inset 0 0 0 2px rgba(255, 210, 120, .35);
      }
      .inv-slot.preview-result canvas { opacity: .78; }
      /* 需要站台才能做的产物：目标框用红底，明确"是这个东西需要工具" */
      .inv-slot.needs-station {
        background: linear-gradient(#a5453d, #7f2f2a);
        box-shadow: inset 0 0 0 2px rgba(255, 150, 130, .40);
      }
      .inv-slot.needs-station canvas { opacity: .92; }

      /* ---------------- 铁砧（H8） ---------------- */
      .anvil-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .anvil-row { display: flex; align-items: flex-end; gap: 8px; }
      .anvil-row .inv-label { align-self: flex-end; padding-bottom: 4px; }
      .anvil-side { display: flex; flex-direction: column; gap: 6px; min-width: 190px; flex: 1; }
      .anvil-name {
        font: inherit; font-size: 12px; padding: 5px 7px; color: #2b2b2b;
        background: #b8b8b8; border: 2px solid; border-color: #6a6a6a #ffffff #ffffff #6a6a6a;
      }
      .anvil-name::placeholder { color: #5f5f5f; }
      .anvil-cost { font-size: 12px; color: #2b5a2b; min-height: 16px; }
      .anvil-cost.bad { color: #7a2020; }

      /* ---------------- 切石机（H11，批次 44） ---------------- */
      /* 左边一格输入、右边一列"能切出什么"；窄屏时上下堆叠（手机竖屏也能用） */
      .stonecutter-layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
      .stonecutter-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .stonecutter-col .inv-label { align-self: flex-start; }
      .stonecutter-right { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
      .stonecutter-list { display: flex; flex-wrap: wrap; gap: 4px; }
      /* 每一项都是"图标 + 名字 ×份数"，一眼能看出切成什么、切出几件 */
      .stonecutter-option {
        display: flex; align-items: center; gap: 6px;
        font: inherit; font-size: 12px; text-align: left; padding: 4px 8px 4px 4px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      .stonecutter-option canvas { width: 28px; height: 28px; image-rendering: pixelated; }
      .stonecutter-option:active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }

      /* ---------------- 村民交易（J11，批次 88） ---------------- */
      /* 一条交易 = [他收的] → [他给的] + 剩余次数：比原版那套"两个收货格"更适合手指 */
      .trade-info { display: flex; flex-direction: column; gap: 4px; min-width: 150px; flex: 1; }
      .trade-level { display: flex; flex-direction: column; gap: 2px; }
      .trade-who { font-size: 14px; color: var(--panel-text); }
      .trade-xp { font-size: 12px; color: #4a4a4a; }
      .trade-list { flex-direction: column; align-items: stretch; }
      .trade-option { flex-wrap: wrap; }
      /* 交易两边的图标都小一号（一屏要放 6~8 条） */
      .trade-option canvas { width: 24px; height: 24px; }
      .trade-cost, .trade-gain { display: flex; align-items: center; gap: 2px; }
      .trade-cost span, .trade-gain span { font-size: 12px; }
      .trade-arrow { color: #3a3a3a; padding: 0 2px; }
      .trade-uses { margin-left: auto; font-size: 11px; color: #4a4a4a; }
      .trade-note { flex-basis: 100%; font-size: 11px; color: #8a3a3a; }
      /* 材料不够 / 次数用完：整条压暗（**不用 disabled**——禁用的按钮收不到悬停提示，
         而"为什么不能点"正是玩家最需要看到的；点击时也给提示） */
      .trade-option.blocked { filter: brightness(.82); }
      .trade-option.blocked .trade-gain { opacity: .6; }

      /* ---------------- 营火（批次 47） ---------------- */
      /* 4 个格子排成一行，每格下面一条自己的进度条 */
      .campfire-grid { display: flex; gap: 8px; flex-wrap: wrap; }
      .campfire-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
      .campfire-cook { width: 42px; }
      .campfire-side { display: flex; flex-direction: column; gap: 4px; min-width: 170px; flex: 1; }

      /* ---------------- 附魔台（H9） ---------------- */
      .enchant-layout { display: flex; gap: 14px; align-items: flex-start; }
      .enchant-col {
        display: flex; flex-direction: column; align-items: center; gap: 2px;
      }
      .enchant-col .inv-label { align-self: flex-start; }
      .enchant-options { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 180px; }
      .enchant-option {
        font: inherit; font-size: 12px; text-align: left; padding: 6px 10px; cursor: pointer;
        background: #a8a8a8; color: #2b2b2b;
        border: 2px solid; border-color: #ffffff #5a5a5a #5a5a5a #ffffff;
      }
      /* 点得动的候选用暖色高亮（与原版"能附魔的那几行会发光"同一个意思） */
      .enchant-option.on { background: #d8c8f0; border-color: #ffffff #4a3a6a #4a3a6a #ffffff; }
      .enchant-option:disabled { color: #6a6a6a; cursor: not-allowed; }
      .enchant-option:not(:disabled):active { border-color: #5a5a5a #ffffff #ffffff #5a5a5a; }
