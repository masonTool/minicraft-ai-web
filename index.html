<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Bedrock 1.18 Web</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%237a5230'/%3E%3Crect width='16' height='5' fill='%235c9e33'/%3E%3C/svg%3E"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      body { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; width: 100%; height: 100%; }

      #hud {
        position: fixed; inset: 0; pointer-events: none;
        color: #fff; text-shadow: 1px 1px 0 rgba(0, 0, 0, .7);
      }
      #debug {
        position: absolute; top: 8px; left: 8px;
        font-size: 12px; line-height: 1.55; white-space: pre;
        background: rgba(0, 0, 0, .35); padding: 6px 9px; border-radius: 3px;
      }
      #crosshair {
        position: absolute; left: 50%; top: 50%;
        width: 20px; height: 20px; transform: translate(-50%, -50%);
        opacity: .85; mix-blend-mode: difference;
      }
      #crosshair::before, #crosshair::after {
        content: ''; position: absolute; background: #fff;
      }
      #crosshair::before { left: 50%; top: 0; width: 2px; height: 100%; margin-left: -1px; }
      #crosshair::after { top: 50%; left: 0; height: 2px; width: 100%; margin-top: -1px; }

      #overlay {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: rgba(0, 0, 0, .62); color: #fff; cursor: pointer;
        font-size: 15px; text-align: center; line-height: 1.9;
      }
      #overlay.hidden { display: none; }
      #overlay b { font-size: 22px; display: block; margin-bottom: 10px; }
      #overlay kbd {
        display: inline-block; padding: 1px 6px; border-radius: 3px;
        background: #ffffff22; border: 1px solid #ffffff44; font-size: 13px;
      }
      #loading {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: #0b0b0b; color: #ccc; font-size: 14px;
      }

      #hotbar {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
        display: flex; gap: 2px; padding: 3px;
        background: rgba(0, 0, 0, .45); border-radius: 4px;
      }
      #hotbar .slot {
        position: relative; width: 42px; height: 42px;
        display: grid; place-items: center;
        background: rgba(255, 255, 255, .12);
        border: 2px solid rgba(0, 0, 0, .35); border-radius: 3px;
      }
      #hotbar .slot.active {
        border-color: #fff; background: rgba(255, 255, 255, .3);
        transform: scale(1.08);
      }
      #hotbar .slot canvas { width: 32px; height: 32px; image-rendering: pixelated; }
      #hotbar .slot .index {
        position: absolute; top: 0; left: 3px; font-size: 10px; color: #fff;
        text-shadow: 1px 1px 0 #000; opacity: .75;
      }

      #break-progress {
        position: absolute; left: 50%; bottom: 74px; transform: translateX(-50%);
        width: 120px; height: 5px; background: rgba(0, 0, 0, .5);
        border-radius: 3px; overflow: hidden; display: none;
      }
      #break-progress.on { display: block; }
      #break-progress i { display: block; height: 100%; width: 0; background: #e8e8e8; }

      #hotbar .slot .count {
        position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
      #hotbar .slot .icon { width: 32px; height: 32px; visibility: hidden; }

      /* ---------------- 背包界面 ---------------- */
      #inventory-screen {
        position: fixed; inset: 0; z-index: 10;
        display: grid; place-items: center;
        background: rgba(0, 0, 0, .55);
      }
      #inventory-screen.hidden { display: none; }

      .inv-panel {
        background: #c6c6c6;
        border: 3px solid #565656; border-radius: 4px;
        padding: 14px 16px;
        max-width: 660px; max-height: 88vh; overflow-y: auto;
      }
      .inv-header {
        display: flex; justify-content: space-between; align-items: baseline; gap: 18px;
        color: #2b2b2b; font-size: 14px; margin-bottom: 6px;
      }
      .inv-header kbd {
        padding: 0 4px; border: 1px solid #777; border-radius: 3px;
        background: #e6e6e6; font-size: 12px;
      }
      .inv-label { color: #3a3a3a; font-size: 12px; margin: 12px 0 5px; }

      .inv-craft { display: flex; align-items: center; gap: 12px; margin: 6px 0 10px; }
      .inv-craft-grid.size-2 { grid-template-columns: repeat(2, 42px); }
      .inv-craft-grid.size-3 { grid-template-columns: repeat(3, 42px); }
      .inv-arrow { font-size: 22px; color: #4a4a4a; }
      .inv-slot.ready { background: #8fbf8f; }
      /* 只取不放的槽位（合成结果、熔炉产物）用暖色底提示 */
      .inv-slot.take-only { background: #9a9a8b; }

      .inv-chest { grid-template-columns: repeat(9, 42px); }

      /* ---------------- 熔炉 ---------------- */
      .furnace-layout {
        display: flex; align-items: center; gap: 14px;
        margin: 6px 0 10px; padding: 8px 4px;
      }
      .furnace-col { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .furnace-flame {
        position: relative; width: 18px; height: 20px;
        background: rgba(0, 0, 0, .28); border-radius: 3px; overflow: hidden;
      }
      .furnace-flame i {
        position: absolute; left: 0; bottom: 0; width: 100%; height: 0;
        background: linear-gradient(#ffd76a, #ff8a1e); transition: height .1s linear;
      }
      .furnace-flame.lit i { box-shadow: 0 0 6px #ff9a2e; }
      .furnace-middle { width: 70px; }
      .furnace-cook {
        height: 12px; background: rgba(0, 0, 0, .28);
        border-radius: 3px; overflow: hidden;
      }
      .furnace-cook i {
        display: block; height: 100%; width: 0;
        background: linear-gradient(90deg, #cfe6ff, #6fa8dc);
        transition: width .1s linear;
      }

      .inv-grid { display: grid; grid-template-columns: repeat(9, 42px); gap: 3px; }
      .inv-grid.inv-creative { grid-template-columns: repeat(12, 34px); gap: 2px; }
      .inv-slot {
        position: relative; width: 42px; height: 42px;
        display: grid; place-items: center;
        background: #8b8b8b;
        border: 2px solid;
        border-color: #373737 #ffffff #ffffff #373737;
      }
      .inv-grid.inv-creative .inv-slot { width: 34px; height: 34px; }
      .inv-slot canvas { width: 36px; height: 36px; image-rendering: pixelated; }
      .inv-grid.inv-creative .inv-slot canvas { width: 28px; height: 28px; }
      .inv-count {
        position: absolute; right: 2px; bottom: 0; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }

      #inv-held {
        position: fixed; z-index: 11; pointer-events: none;
        transform: translate(-50%, -50%); display: none;
      }
      #inv-held.on { display: block; }
      #inv-held canvas { width: 32px; height: 32px; image-rendering: pixelated; display: block; }
      #inv-held span {
        position: absolute; right: -2px; bottom: -2px; font-size: 12px; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud">
      <div id="debug"></div>
      <div id="crosshair"></div>
      <div id="break-progress"><i></i></div>
      <div id="hotbar"></div>
    </div>

    <div id="overlay">
      <div>
        <b>Bedrock 1.18 Web</b>
        点击进入游戏<br />
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
        <kbd>Space</kbd> 跳跃 · <kbd>Shift</kbd> 潜行/下降 · <kbd>Ctrl</kbd> 疾跑<br />
        <kbd>左键</kbd> 破坏 · <kbd>右键</kbd> 放置 · <kbd>1</kbd>-<kbd>9</kbd> 切换方块 ·
        <kbd>F</kbd> 创造/飞行 · <kbd>Esc</kbd> 释放鼠标
      </div>
    </div>

    <div id="loading">正在生成世界…</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
