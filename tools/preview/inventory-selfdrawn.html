<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ui2d · 背包**自绘**（不读 DOM 布局，M26b 第一步）</title>
    <!--
      M26b 的第一步：`InventoryPanelHost` —— 自己排版、自己命中、自己画。
      数据来自 `SlotAccess`（真实 `Inventory` 结构上就满足 `get/set`），
      交互走 `inventoryModel` 的四个纯函数；图标走 `ItemIconCache`（游戏里由
      `drawItemIcon` 画进缓存，这里用一个画色块的假画笔）。

      与镜像版的区别：**不依赖 DOM 布局**。所以这一页里没有任何背包 DOM，
      只有一块 canvas 与它的数据。

      用法：
        npm run dev
        open http://localhost:5173/tools/preview/inventory-selfdrawn.html
        open 'http://localhost:5173/tools/preview/inventory-selfdrawn.html?tint=1'
    -->
    <style>
      html, body { margin: 0; background: #111; height: 100%; }
      #stage {
        position: relative; width: 844px; height: 390px; overflow: hidden;
        background: linear-gradient(#7ec0ee 0%, #a8d8f0 46%, #6f9a5a 46%, #4e7440 62%, #3b5a32 100%);
      }
      #stage canvas { cursor: pointer; }
      .caption {
        position: absolute; left: 12px; bottom: 8px; z-index: 40;
        font: 12px/1.4 -apple-system, 'PingFang SC', sans-serif; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <!-- 面板外面的 DOM 控件（模拟游戏里的关闭 × / 左右立栏）：画布盖在上面，靠转发点它 -->
      <button id="behind" style="position: absolute; right: 12px; top: 12px; z-index: 1">关闭</button>
      <div class="caption" id="caption"></div>
    </div>

    <script type="module">
      import { InventoryPanelHost, arraySlots, forwardClickAt } from '../../src/ui2d/index.ts';

      const params = new URLSearchParams(window.location.search);
      const tint = params.get('tint') === '1';
      // `?craft=1`：合成台（3×3 + 结果格 + 玩家背包），验证工作站的布局
      const craft = params.get('craft') === '1';
      // `?armor=1`：右侧多一列盔甲 4 格 + 副手 1 格（顺序：侧栏 → 主背包 → 快捷栏）
      const armor = params.get('armor') === '1';
      // `?progress=0.4`：熔炉那类"结果格左边箭头带填充"
      const progress = Number(params.get('progress') ?? '0');
      // `?furnace=1`：熔炉布局（额外 1 格原料 + 结果格 + 火焰），顺带演示附魔提示
      const furnace = params.get('furnace') === '1';
      const flame = Number(params.get('flame') ?? '0');
      const TOTAL = craft ? 46 : armor ? 41 : 36;

      /* ---------------- 数据：与游戏同一套逻辑（`SlotAccess` + `MoveRules`） ---------------- */
      const COLORS = ['#8b5a2b', '#6c8b3f', '#9b9b9b', '#3f6c8b', '#8b3f5a', '#c6a13f'];
      const initial = new Array(TOTAL).fill(null);
      if (craft) {
        // 0..8 = 3×3 合成格，9 = 结果格，10..36 = 主背包，37..45 = 快捷栏
        initial[0] = { id: 1, count: 1 };
        initial[1] = { id: 1, count: 1 };
        initial[3] = { id: 1, count: 1 };
        initial[4] = { id: 1, count: 1 };
        initial[9] = { id: 5, count: 4 };
        initial[10] = { id: 1, count: 64 };
        initial[11] = { id: 2, count: 12 };
        initial[12] = { id: 3, count: 3 };
        initial[14] = { id: 4, count: 1 };
        initial[37] = { id: 6, count: 7 };
      } else if (armor) {
        // 0..3 = 头盔/胸甲/护腿/靴子，4 = 副手，5..31 = 主背包，32..40 = 快捷栏
        initial[0] = { id: 4, count: 1 };
        initial[1] = { id: 4, count: 1 };
        initial[2] = { id: 4, count: 1 };
        initial[3] = { id: 4, count: 1 };
        initial[4] = { id: 6, count: 8 };
        initial[5] = { id: 1, count: 64 };
        initial[6] = { id: 2, count: 12 };
        initial[7] = { id: 3, count: 3 };
        initial[9] = { id: 5, count: 28 };
        initial[32] = { id: 2, count: 41 };
      } else {
        initial[0] = { id: 1, count: 64 };
        initial[1] = { id: 2, count: 12 };
        initial[2] = { id: 3, count: 3 };
        initial[3] = { id: 4, count: 1 };
        initial[5] = { id: 5, count: 28 };
        initial[9] = { id: 6, count: 7 };
        initial[27] = { id: 2, count: 41 };
      }
      const slots = arraySlots(initial);

      /** 图标画笔：真机上这里是 `drawItemIcon(canvas, atlas, id)`，预览里画个色块 */
      const paintIcon = (canvas, itemId) => {
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = COLORS[(itemId - 1) % COLORS.length];
        ctx.fillRect(3, 3, canvas.width - 6, canvas.height - 6);
        ctx.strokeStyle = 'rgba(0,0,0,.55)';
        ctx.lineWidth = 2;
        ctx.strokeRect(3, 3, canvas.width - 6, canvas.height - 6);
      };
      const icons = new Map();
      const iconOf = (itemId) => {
        const hit = icons.get(itemId);
        if (hit) return hit;
        const canvas = document.createElement('canvas');
        canvas.width = 32;
        canvas.height = 32;
        paintIcon(canvas, itemId);
        icons.set(itemId, canvas);
        return canvas;
      };

      // 提示框内容：游戏里由 `itemName(id)` + 耐久上限算，这里给一份"看着像真的"的假数据
      const NAMES = { 1: '圆石', 2: '泥土', 3: '铁矿', 4: '铁镐', 5: '木板', 6: '火把' };
      const describeOf = (stack) => ({
        title: NAMES[stack.id] ?? `物品 ${stack.id}`,
        lines: [`数量 ${stack.count}`, stack.id === 4 ? '耐久 62 / 250' : 'minicraft:item_' + stack.id],
        enchants: stack.id === 4 ? ['锋利 IV', '耐久 III'] : [],
        durability: stack.id === 4 ? { ratio: 0.75, level: 'high' } : null,
        accent: stack.id === 4 ? '#4a8ad4' : '#8f8f8f',
      });
      // 只有 id=4（铁镐）画耐久条，用来验证"槽位里的耐久条"这条路
      const durabilityOf = (stack) => (stack.id === 4 ? { ratio: 0.75, level: 'high' } : null);

      /*
       * `?ext=1`：模拟"与 DOM 合流"——光标由外部提供（只读）。
       * 用来验证"只拉不推"：canvas 上画出来的那一叠就是外部的，而外部不会被写脏。
       */
      let externalHeld = params.get('ext') === '1' ? { id: 3, count: 5 } : null;

      const stage = document.getElementById('stage');
      const host = new InventoryPanelHost(stage, slots, {
        title: craft ? '合成台' : '生存背包',
        mainRows: 3,
        hotbarRows: 1,
        ...(craft ? { extra: { cols: 3, rows: 3, result: true } } : {}),
        ...(furnace ? { extra: { cols: 1, rows: 1, result: true, flame: true } } : {}),
        ...(armor ? { sideCount: 5 } : {}),
        ...(Number.isFinite(progress) && progress > 0 ? { progressOf: () => progress } : {}),
        ...(Number.isFinite(flame) && flame > 0 ? { flameOf: () => flame } : {}),
        zIndex: 12,
        tint,
        limitOf: (id) => (id === 4 ? 1 : 64),
        sameItem: (a, b) => a.id === b.id,
        iconOf,
        describeOf,
        durabilityOf,
        onDrop: (stack, count) => {
          window.__dropped.push(`${stack.id}x${count}`);
        },
        ...(externalHeld !== null ? { externalCursor: { get: () => externalHeld } } : {}),
      });
      host.open();

      /* ---------------- 输入：canvas 自己收（这就是"不再依赖 DOM"的意思） ---------------- */
      const canvas = stage.querySelector('canvas');
      canvas.style.pointerEvents = 'auto';
      const local = (event) => {
        const rect = canvas.getBoundingClientRect();
        return { x: event.clientX - rect.left, y: event.clientY - rect.top };
      };
      canvas.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        const p = local(event);
        // 右键 = 2（取半 / 放一个 / 逐格放），左键 = 0
        host.handlePointer(p.x, p.y, 'down', {
          button: event.button === 2 ? 2 : 0,
          timeStamp: event.timeStamp,
          // 触摸端要"先按住再决定"（点 / 长按 / 拖），鼠标则是按下即拿起
          touch: event.pointerType === 'touch',
          shift: event.shiftKey,
        });
      });
      canvas.addEventListener('pointermove', (event) => {
        const p = local(event);
        if (event.buttons !== 0) moved = true;
        host.handlePointer(p.x, p.y, 'move', { touch: event.pointerType === 'touch' });
      });
      let moved = false;
      window.__closed = false;
      document.getElementById('behind').addEventListener('click', () => {
        window.__closed = true;
      });
      canvas.addEventListener('pointerup', (event) => {
        // 抬起也要带真实坐标：`handlePointer` 会用它记光标位置 ——
        // 传 (0,0) 的话"手上那一叠"会被画到屏幕左上角（第一版就是这样）
        const p = local(event);
        host.handlePointer(p.x, p.y, 'up', { touch: event.pointerType === 'touch' });
        // 面板外的点击转发给 DOM（游戏里是关闭 × 与左右立栏）
        if (!moved && !host.contains(event.clientX, event.clientY)) {
          forwardClickAt(canvas, event.clientX, event.clientY);
        }
        moved = false;
      });
      // 右键菜单要拦掉：不然按下就弹浏览器菜单，手势全断
      canvas.addEventListener('contextmenu', (event) => event.preventDefault());

      // 数字键 1-9：悬停那格 ↔ 快捷栏（与游戏里同一套）
      window.addEventListener('keydown', (event) => host.handleKey(event.code));
      // 拖到面板外松手 = 丢出（游戏里由 onDrop 回调接掉落逻辑）
      window.__dropped = [];

      // 调试/验收用：读当前 36 格与手上那一叠（`playwright` 里断言全靠它）
      window.__probe = () => ({
        slots: Array.from({ length: TOTAL }, (_, i) => {
          const stack = slots.get(i);
          return stack ? `${stack.id}x${stack.count}` : null;
        }),
        held: host.heldStack ? `${host.heldStack.id}x${host.heldStack.count}` : null,
        externalHeld: externalHeld ? `${externalHeld.id}x${externalHeld.count}` : null,
        closed: window.__closed === true,
        hover: host.hoverIndex,
        panel: host.panelRect,
        dropped: window.__dropped,
      });
      window.addEventListener('resize', () => host.relayout());

      document.getElementById('caption').textContent =
        (craft
          ? '自绘合成台：3×3 合成格 + 结果格 + 玩家背包（同一套排版/命中/画）· 结果格不可放入'
          : armor
            ? '自绘背包 + 盔甲列：右侧 4 格盔甲 + 1 格副手（顺序：侧栏 → 主背包 → 快捷栏）'
            : '自绘背包：自己排版 + 自己命中 + 自己画（不读 DOM 布局）· 左键取放 · 拖过多格再松手 = 均分') +
        ' · 图标由 ItemIconCache 提供' + (tint ? ' · 黄色遮罩' : '');
    </script>
  </body>
</html>
