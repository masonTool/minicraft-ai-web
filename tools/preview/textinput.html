<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ui2d · canvas 文本输入（含输入法组合态）</title>
    <!--
      阶段 3 的硬骨头：canvas 上的文本输入。

      做法：屏幕外放一个**看不见但可聚焦**的 `<input>` 承接所有输入（含中文输入法），
      canvas 只负责把 value / 光标 / 选区 / 组合态画出来。

      这一页可以**真的打字**（含中文输入法），也可以点按钮模拟"已有内容 + 选中一段"。

      用法：
        npm run dev
        open http://localhost:5173/tools/preview/textinput.html
        open 'http://localhost:5173/tools/preview/textinput.html?value=我的世界&sel=1,3'
        open 'http://localhost:5173/tools/preview/textinput.html?tint=1'
    -->
    <style>
      body { margin: 0; background: #111; display: grid; place-items: center; min-height: 100vh; }
      #stage {
        position: relative; width: 844px; height: 390px; overflow: hidden;
        background: linear-gradient(#7ec0ee 0%, #a8d8f0 46%, #6f9a5a 46%, #4e7440 62%, #3b5a32 100%);
      }
      #stage canvas { pointer-events: auto; display: block; }
      .caption {
        position: absolute; left: 12px; bottom: 8px; z-index: 5;
        font: 12px/1.4 -apple-system, 'PingFang SC', sans-serif; color: #fff;
        text-shadow: 1px 1px 0 #000;
      }
    </style>
  </head>
  <body>
    <div id="stage"><div class="caption" id="caption"></div></div>

    <script type="module">
      import {
        CanvasTextInput,
        Ui2DOverlay,
        applyDebugTint,
        drawText,
        uiFont,
      } from '../../src/ui2d/index.ts';

      const params = new URLSearchParams(window.location.search);
      const preset = params.get('value') ?? '';
      const presetSel = (params.get('sel') ?? '').split(',').map(Number);
      const tint = params.get('tint') === '1';

      const stage = document.getElementById('stage');
      const overlay = new Ui2DOverlay(stage);
      const ctx = overlay.context;
      const W = 844;
      const H = 390;
      stage.style.width = `${W}px`;
      stage.style.height = `${H}px`;
      overlay.syncSize();

      /** 面板与输入框（CSS px） */
      const panel = { x: 232, y: 92, w: 380, h: 168 };
      const nameRect = { x: panel.x + 20, y: panel.y + 52, w: panel.w - 40, h: 30 };
      const seedRect = { x: panel.x + 20, y: panel.y + 108, w: panel.w - 40, h: 30 };

      let committed = '（还没提交）';
      const nameInput = new CanvasTextInput(document.body, {
        placeholder: '世界名称',
        maxLength: 24,
        onCommit: (value) => {
          committed = value;
          caption.textContent = `已提交：${value || '(空)'} · 点输入框可以再改`;
        },
        onCancel: () => {
          caption.textContent = '已取消（Esc）';
        },
      });
      const seedInput = new CanvasTextInput(document.body, { placeholder: '种子（留空随机）' });

      const caption = document.getElementById('caption');
      caption.textContent = '点上面的输入框开始打字（可用中文输入法）· Enter 提交 · Esc 取消';

      function paint() {
        ctx.clearRect(0, 0, W, H);
        // 面板
        ctx.fillStyle = 'rgba(22, 22, 22, .82)';
        ctx.fillRect(panel.x, panel.y, panel.w, panel.h);
        ctx.strokeStyle = '#0d0d0d';
        ctx.lineWidth = 3;
        ctx.strokeRect(panel.x + 1.5, panel.y + 1.5, panel.w - 3, panel.h - 3);

        drawText(ctx, '新建世界', panel.x + panel.w / 2, panel.y + 24, {
          font: uiFont(15, 600),
          color: '#e7e7e7',
          align: 'center',
          baseline: 'middle',
        });
        drawText(ctx, '世界名称', nameRect.x, nameRect.y - 10, {
          font: uiFont(12),
          color: '#a8a8a8',
          baseline: 'bottom',
          shadow: false,
        });
        drawText(ctx, '种子', seedRect.x, seedRect.y - 10, {
          font: uiFont(12),
          color: '#a8a8a8',
          baseline: 'bottom',
          shadow: false,
        });

        const now = performance.now();
        // 没打开的那一格画个空框（`render()` 只在打开时画，这是刻意的：
        // 未聚焦的输入框在游戏里由面板自己画）
        if (!seedInput.isOpen) {
          ctx.fillStyle = 'rgba(12, 13, 16, .82)';
          ctx.fillRect(seedRect.x, seedRect.y, seedRect.w, seedRect.h);
          ctx.strokeStyle = 'rgba(255, 255, 255, .28)';
          ctx.lineWidth = 1;
          ctx.strokeRect(seedRect.x + 0.5, seedRect.y + 0.5, seedRect.w - 1, seedRect.h - 1);
          drawText(ctx, '种子（留空随机）', seedRect.x + 8, seedRect.y + seedRect.h / 2, {
            font: uiFont(13),
            color: 'rgba(255, 255, 255, .38)',
            baseline: 'middle',
            shadow: false,
          });
        }
        nameInput.render(ctx, nameRect, now);
        seedInput.render(ctx, seedRect, now);
        if (tint) applyDebugTint(ctx, W, H);
      }

      function loop() {
        paint();
        requestAnimationFrame(loop);
      }

      overlay.canvas.addEventListener('pointerdown', (event) => {
        const rect = overlay.canvas.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const inside = (box) => x >= box.x && x < box.x + box.w && y >= box.y && y < box.y + box.h;
        if (inside(nameRect)) {
          if (!nameInput.isOpen) nameInput.open(preset || nameInput.value);
          else nameInput.focus();
        } else if (inside(seedRect)) {
          if (!seedInput.isOpen) seedInput.open();
          else seedInput.focus();
        }
      });

      // 便于截图：预填内容 + 预选一段
      if (preset) {
        nameInput.open(preset);
        if (presetSel.length === 2 && presetSel.every(Number.isFinite)) {
          nameInput.element.setSelectionRange(presetSel[0], presetSel[1]);
        }
        caption.textContent = `预填「${preset}」· 选区 ${presetSel.join('~')} · 光标/选区都是 canvas 画的`;
      }

      loop();
    </script>
  </body>
</html>
