# 发布到 GitHub Pages（前端产物）
#
# 2026-10-29（用户）：改完前端要**立刻在 Pages 上看到**，所以恢复成随 push 自动发布。
#
# ⚠️ 这条流水线跑的是 `build:web`（SPECS_STUB=0）——方块表会以**明文 JS** 编进产物，
#    等于把 724 条数据放到公网。这是"公开可玩 Web 版"的应有之义；
#    要"只有 App 能玩"的形态，用 `deploy-cf-app.yml`（build:app，带 core.bin）。
#    两件事务必分开，别把 app 形态发到这个域名上。
#
# 为什么只有一个 job：
#   原来 build 与 deploy 是两个 job，第二个要重新起一台 runner、再把 artifact 传过去，
#   光这一来一回就多 30~60 秒。合成一个 job 后 `upload-pages-artifact` 直接给下一步用。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 也允许在 Actions 页面手动点一次（改完仓库设置后不用空提交）
  workflow_dispatch:

# Pages 部署需要这三项：读代码、写 Pages、用 OIDC 换一次性部署令牌
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时刻只允许一个部署在跑；后到的提交取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # 前端构建用不到浏览器二进制（截图套件只在本地跑），别让 postinstall 去拉
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # node_modules 直接按锁文件哈希缓存：命中时跳过 npm ci（省 60~120 秒）。
      # 冷启动那次才真的装一遍。
      - name: 缓存 node_modules
        id: nm
        uses: actions/cache@v4
        with:
          path: node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # `--include=optional`：跨平台锁文件下 npm ci 偶尔漏装可选依赖（npm/cli#4828），
      # 而 vite / rolldown 的原生绑定正是 optional —— 缺了构建直接失败。
      - if: steps.nm.outputs.cache-hit != 'true'
        run: npm ci --include=optional --no-audit --no-fund

      - name: 补齐 rolldown 原生绑定
        run: |
          VER=$(node -p "require('rolldown/package.json').version")
          if ! node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" 2>/dev/null; then
            npm i --no-save --include=optional "@rolldown/binding-linux-x64-gnu@$VER" \
              || npm i --no-save --force "@rolldown/binding-linux-x64-gnu@$VER"
          fi
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      # 唯一的构建入口：数据编进包 + 关 sourcemap + release-check（无 .map / 体积基线）
      - run: npm run build:web

      # 落点是 `web/dist`（vite 的 root 在 web/，2026-10-29 目录重排后如此）。
      # 这里先断言一次：产物目录换了位置时，报错会落在这行，而不是 archive 那一步
      # 给一句 `tar: dist: Cannot open`（2026-10-29 就是这样踩的）。
      - name: 确认产物存在
        run: test -f web/dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
