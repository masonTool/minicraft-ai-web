# 发布到 Cloudflare Pages · **完整前端**形态（B 站）
#
# 这个形态是**自足**的：方块表编在 JS 包里，浏览器可以直接玩，dist 里没有 core.bin。
# 它只用于：预览 / 演示 / 兜底（A 站出问题时的备用入口）。
#
# ⚠️ 绝不能发到 A 站（`minicraft-app`）那个项目上，也绝不能给它绑生产域名——
#    一旦绑了，整套"只有宿主能玩"的门禁就失效了。项目名与域名都要与 A 站分开：
#
#      A 站  minicraft-app  →  game.example.com    （宿主专属，主入口）
#      B 站  minicraft-web  →  demo.example.com    （完整前端，预览用）
#
# 触发方式：只允许手动。理由见 `deploy-cf-app.yml` 顶部。
name: Deploy to Cloudflare Pages (web)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布到哪个通道（preview 先验收，再 production）'
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

concurrency:
  group: cf-web-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `--include=optional`：跨平台锁文件下 npm ci 偶尔漏装可选依赖（npm/cli#4828）
      - run: npm ci --include=optional

      # npm 可选依赖在跨平台锁文件下偶尔不装（npm/cli#4828）；vite/rolldown 的原生绑定缺了会直接构建失败
      - name: 补齐 rolldown 原生绑定
        run: |
          VER=$(node -p "require('rolldown/package.json').version")
          if ! node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" 2>/dev/null; then
            npm i --no-save --include=optional "@rolldown/binding-linux-x64-gnu@$VER" \
              || npm i --no-save --force "@rolldown/binding-linux-x64-gnu@$VER"
          fi
          # 再确认一次：缺了就在这一步红，不要等到 vite build 里报一条看不懂的栈
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      # build:web = 数据编进包（SPECS_STUB=0）+ 不做宿主版本判定（HOST_CORE_REQUIRED=0）
      - run: npm run build:web

      # web 形态是**自足**的：方块表编在 JS 包里，dist 里不该有 core.bin。
      # release-check 已用探针确认"数据在包内"，这里再守一道"没有多余的核心文件"。
      - name: 确认产物是自足形态（不该有 core.bin）
        run: |
          if [ -e dist/__host/core.bin ]; then
            echo "✗ dist/__host/core.bin 存在：web 形态不该带它（它的去处只有 APK）"
            exit 1
          fi
          echo "✓ 无 core.bin，数据在包里"

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=minicraft-web
            --branch=${{ inputs.channel == 'production' && 'main' || format('preview-{0}', github.run_number) }}
