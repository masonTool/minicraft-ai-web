# 只做一件事：**把前端（web）编出来**
#
# 2026-10-29（用户）：流程要短、要快。这个项目对外只发布前端产物，
# 所以 CI 不再跑门禁（vitest / 离线套件 / 三张台账都不要），只保留：
#
#   npm ci → npm run build:web → 上传 dist
#
# 为什么不再跑 `npm run check`：
#   1. 那一步要 2~4 分钟（181 套离线套件 + vitest），每次推送都等它没有意义；
#   2. 它跟"能不能出包"没有因果关系——台账类断言在赶时间的提交里还会误报；
#   3. 本地提交前仍可用 `npm run check:fast` 自查（那是**本地**的事，不必搬到 CI）。
#
# ⚠️ 仍然保留 120 秒级的 `release-check`：它由 `build:web` 自带
#    （无 .map / core.bin 形态正确 / 体积不超基线），失败会非零退出——
#    这是"产物有没有问题"，不是"代码风格有没有问题"。
name: Build (web)

on:
  push:
    branches: [main]
  pull_request:

# 同一分支连续推送时只保留最新一次（旧的结论已经过期）
concurrency:
  group: build-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `--include=optional`：跨平台锁文件下 npm ci 偶尔漏装可选依赖（npm/cli#4828），
      # 而 vite 8 / rolldown 的原生绑定正是 optional —— 缺了构建会直接失败。
      - run: npm ci --include=optional

      # 兜底：按已装版本补一次 linux-x64 的原生绑定（补不上就让构建红，不静默）
      - name: 补齐 rolldown 原生绑定
        run: |
          VER=$(node -p "require('rolldown/package.json').version")
          if ! node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" 2>/dev/null; then
            npm i --no-save --include=optional "@rolldown/binding-linux-x64-gnu@$VER" \
              || npm i --no-save --force "@rolldown/binding-linux-x64-gnu@$VER"
          fi
          # 再确认一次：缺了就在这一步红，不要等到 vite build 里报一条看不懂的栈
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      # 唯一的构建入口：数据编进包 + 关 sourcemap + release-check
      - run: npm run build:web

      - name: 上传 web 产物
        uses: actions/upload-artifact@v4
        with:
          name: minicraft-web
          path: dist
          retention-days: 7
