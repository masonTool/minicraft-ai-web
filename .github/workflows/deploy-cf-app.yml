# 发布到 Cloudflare Pages · **宿主专属**形态（A 站）
#
# 与 `deploy-cf-web.yml`（完整前端形态，B 站）是**两条独立的流水线**，部署到
# **两个不同的 Pages 项目 / 域名**。这是刻意的：
#
#   同一个 `dist` 只差一个文件 `__host/core.bin`——有它浏览器就能玩，没它只有宿主能玩。
#   两条流水线共用一个项目的话，"谁最后跑"决定线上形态，一次手滑就把完整版发到
#   生产域名上，整套门禁当场作废。物理隔离（不同项目名）比"记得别搞错"可靠。
#
# 触发方式：**只允许手动**（workflow_dispatch）。不挂 push 的原因：
#   · 要在 GitHub 里配 `CLOUDFLARE_API_TOKEN` / `CLOUDFLARE_ACCOUNT_ID` 两个 secret，
#     没配时 push 触发的流水线会红，把真正的构建失败淹没；
#   · 发布是"要人决定"的动作，尤其 B 站（完整版）不该跟着每次提交自动上线。
name: Deploy to Cloudflare Pages (app)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: '发布到哪个通道（preview 先验收，再 production）'
        required: true
        default: preview
        type: choice
        options: [preview, production]

permissions:
  contents: read

# 同一通道同时只跑一个；后到的取消排队中的旧任务
concurrency:
  group: cf-app-${{ inputs.channel }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `--include=optional`：跨平台锁文件下 npm ci 偶尔漏装可选依赖（npm/cli#4828）
      - run: npm ci --include=optional

      # npm 的可选依赖在「跨平台锁文件 + npm ci」下偶尔不装（npm/cli#4828）。
      # vitest 5 走 rolldown 的原生绑定，缺了会直接 Startup Error —— 这里按已装版本补一次，
      # 补不上就让后面的测试红，别静默跳过。
      - name: 补齐 rolldown 原生绑定
        run: |
          VER=$(node -p "require('rolldown/package.json').version")
          if ! node -e "require.resolve('@rolldown/binding-linux-x64-gnu')" 2>/dev/null; then
            npm i --no-save --include=optional "@rolldown/binding-linux-x64-gnu@$VER" \
              || npm i --no-save --force "@rolldown/binding-linux-x64-gnu@$VER"
          fi
          # 再确认一次：缺了就在这一步红，不要等到 vite build 里报一条看不懂的栈
          node -e "require.resolve('@rolldown/binding-linux-x64-gnu')"

      # build:app = SOURCEMAP=0 + release-check（断言无 .map、无 core.bin、体积不超基线）
      - run: npm run build:app

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # `--branch` 决定 Pages 把它算成 preview 还是 production：
          # 与项目里的"生产分支"同名即为 production，其它名字都是 preview 部署
          # （preview 会得到一个独立的 `<hash>.<project>.pages.dev` 地址，可先验收再 promote）
          command: >-
            pages deploy dist
            --project-name=minicraft-app
            --branch=${{ inputs.channel == 'production' && 'main' || format('preview-{0}', github.run_number) }}
