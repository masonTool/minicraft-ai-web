apply plugin: 'com.android.application'

android {
    namespace "com.minicraft.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.minicraft.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ---------------------------------------------------------------------------
// 把 Rust 编出来的 .so 拷进 jniLibs。
//
// 为什么不把 .so 提交进仓库：两个 ABI 合起来 ~5MB 二进制，git 上去之后每次改 Rust
// 都要重新提交一遍（而且 diff 看不出任何东西）。规则是"构建时从 rust-server 拷"——
// 缺产物就在配置阶段报一句明确的错，而不是让 Gradle 编出一个没有 JNI 的 APK
// （那个 APK 装上去点"开房"会 UnsatisfiedLinkError，最难查）。
// ---------------------------------------------------------------------------
def rustTriples = [
        'arm64-v8a': 'aarch64-linux-android',
        'x86_64'   : 'x86_64-linux-android',
]

tasks.register('copyRustLibs') {
    description = '拷贝 rust-server 交叉编译出的 libminicraft_server.so 到 jniLibs'
    def repoRoot = rootProject.projectDir.parentFile
    doLast {
        rustTriples.each { abi, triple ->
            def source = new File(repoRoot, "rust-server/target/${triple}/release/libminicraft_server.so")
            if (!source.exists()) {
                throw new GradleException(
                        "缺少 Rust 产物：${source}\n先跑 `bash rust-server/build-android.sh`（它会用 NDK 交叉编译）")
            }
            copy {
                from source
                into file("src/main/jniLibs/${abi}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'copyRustLibs' }

// ---------------------------------------------------------------------------
// 把**核心数据**（方块表快照）放进 APK 的 assets，路径与 `src/core/hostCore.ts` 的
// `CORE_URL = './__host/core.bin'` 对齐。
//
// 为什么放 assets 而不是打进 JS 包：app 形态的整条设计就是"724 个方块的明文不进主包"
// （`build:app` 把 `blockSpecs.ts` 换成空桩）。放 assets 之后 WebView 从
// `http://localhost/__host/core.bin` 就能读到，**不需要**再写一层
// `shouldInterceptRequest`——同一个文件，放哪决定形态（浏览器那条路上没有它，于是显示
// "去 Google Play 下载"的落地页）。
// ---------------------------------------------------------------------------
tasks.register('copyHostCore') {
    description = '把 host/core-baseline.bin 拷成 APK assets 里的 __host/core.bin'
    def repoRoot = rootProject.projectDir.parentFile
    def source = new File(repoRoot, 'host/core-baseline.bin')
    doLast {
        if (!source.exists()) {
            throw new GradleException("缺少核心数据：${source}（先跑 `npm run gen:hostcore`）")
        }
        copy {
            from source
            into file('src/main/assets/public/__host')
            rename { 'core.bin' }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'copyHostCore' }
