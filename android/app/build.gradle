apply plugin: 'com.android.application'

/*
 * 上传签名（Play 只收**已签名**的 AAB，之前 `bundleRelease` 出的是未签名包，上架会被拒）。
 *
 * 密钥不进仓库、不进 CI 缓存，全部走环境变量：
 *   MINICRAFT_KEYSTORE            ~/.keys/minicraft-upload.jks
 *   MINICRAFT_KEYSTORE_PASSWORD
 *   MINICRAFT_KEY_ALIAS
 *   MINICRAFT_KEY_PASSWORD
 *
 * 没设置时 release 不签名（本地 `assembleRelease` 照样能跑，用于验证 R8 规则），
 * 但**不会**伪装成"可上架"——AAB 里没有 META-INF 签名块，Play 会直接报错。
 */
def signingEnv = { String key ->
    def value = System.getenv(key)
    return (value != null && !value.trim().isEmpty()) ? value.trim() : null
}
def uploadKeystore = signingEnv('MINICRAFT_KEYSTORE')

android {
    namespace "com.minicraft.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.minicraft.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"

        // 只打这两种 ABI（与上面的 rustTriples 对齐；x86_64 只在模拟器上有意义，不进发行包）
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CoreVault / MainActivity 要用 BuildConfig.DEBUG 判"是不是 debug 构建"。
    // AGP 8 默认会生成，但显式打开一次，避免哪天默认值变了变成编译错误。
    buildFeatures {
        buildConfig true
    }
    /*
     * 原生库**不解压到磁盘**（A27）。
     *
     * 默认 `extractNativeLibs=true` 会把 libminicraft_server.so 释放到应用私有目录，
     * 拿到 root 的人可以直接替换那个文件——而它正是"手机当房主"的服务端。
     * 设成 false 之后 .so 以压缩态留在 APK 里、由系统直接从 APK 映射，
     * 磁盘上不存在可被替换的副本。
     */
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    signingConfigs {
        release {
            if (uploadKeystore != null) {
                storeFile file(uploadKeystore)
                storePassword signingEnv('MINICRAFT_KEYSTORE_PASSWORD')
                keyAlias signingEnv('MINICRAFT_KEY_ALIAS')
                keyPassword signingEnv('MINICRAFT_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            /*
             * R8 + 资源压缩（A27）。
             *
             * 为什么不只是"省体积"：解封链路（HKDF 派生、AES-GCM、形态变换）在 Java 里
             * 本来是**带注释的明文**，读一遍就能照着实现。开混淆之后类名/方法名变成 a/b/c，
             * 逆向成本从"看懂"变成"先重建调用关系"——这是当前性价比最高的一层。
             *
             * ⚠️ 收益只在 release：debug 包仍是不混淆的（要能调试）。
             */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 配了上传密钥才签；没配就保持未签名（Play 会拒收，这是有意的显式失败）
            if (uploadKeystore != null) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            // 显式写出来：调试期不要混淆，否则断点与栈都对不上
            minifyEnabled false
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ---------------------------------------------------------------------------
// 把 Rust 编出来的 .so 拷进 jniLibs。
//
// 为什么不把 .so 提交进仓库：两个 ABI 合起来 ~5MB 二进制，git 上去之后每次改 Rust
// 都要重新提交一遍（而且 diff 看不出任何东西）。规则是"构建时从 server/rust 拷"——
// 缺产物就在配置阶段报一句明确的错，而不是让 Gradle 编出一个没有 JNI 的 APK
// （那个 APK 装上去点"开房"会 UnsatisfiedLinkError，最难查）。
// ---------------------------------------------------------------------------
/*
 * 只出 arm64-v8a + armeabi-v7a（2026-10-30）。
 *
 * 去掉了 x86_64：本项目的分发目标是真机，x86_64 只对模拟器有意义，却让安装包多背
 * 一份 ~2 MB 的 .so。32 位（armeabi-v7a）保留——存量低端机还有不少。
 */
def rustTriples = [
        'arm64-v8a'  : 'aarch64-linux-android',
        'armeabi-v7a': 'armv7-linux-androideabi',
]

tasks.register('copyRustLibs') {
    description = '拷贝 server/rust 交叉编译出的 libminicraft_server.so 到 jniLibs'
    // 2026-10-29 目录重排：`android/` 已位于仓库根下，只往上一层
    def repoRoot = rootProject.projectDir.parentFile
    doLast {
        rustTriples.each { abi, triple ->
            def source = new File(repoRoot, "server/rust/target/${triple}/release/libminicraft_server.so")
            if (!source.exists()) {
                throw new GradleException(
                        "缺少 Rust 产物：${source}\n先跑 `bash server/rust/build-android.sh`（它会用 NDK 交叉编译）")
            }
            copy {
                from source
                into file("src/main/jniLibs/${abi}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'copyRustLibs' }

// ---------------------------------------------------------------------------
// 整包（伪装成原生库的 libmcrt.so）进 assets。
//
// 内容由 `npm run pack` 生成，**不解密就什么都不是**：解密发生在运行时，
// 由 `BundleVault` 用"安装包实际签名"派生 KEK 后整段解开，只存在于内存里。
//
// 这里做两件事：缺产物就明确报错（而不是编出一个装上就白屏的 APK），
// 以及把旧的明文/封存产物挡在门外——那两种形态都已经废弃。
// ---------------------------------------------------------------------------
tasks.register('copyPackedBundle') {
    description = '把 build/rt/libmcrt.so 拷进 APK assets/rt/'
    def repoRoot = rootProject.projectDir.parentFile
    def source = new File(repoRoot, 'build/rt/libmcrt.so')
    def targetDir = file('src/main/assets/rt')
    doLast {
        if (!source.exists()) {
            throw new GradleException("缺少整包：${source}\n先跑 `npm run pack`（它需要 web/dist，先 npm run build:web）")
        }
        targetDir.mkdirs()
        copy {
            from source
            into targetDir
        }
    }
}

// ---------------------------------------------------------------------------
// native 解密库（`native/vault/`）进 jniLibs。
//
// 为什么解密要放 native：`BundleVault.java` 之前会返回 `Map<String, byte[]>`，
// 整包 4~5 MB 明文同时躺在 Java 堆上，一次 dump 全拿到。现在明文只在 native 堆，
// Java 每次按路径取一个文件（见 BundleVault 的注释）。
//
// 缺产物就明确报错——编出一个"装上就 UnsatisfiedLinkError / 白屏"的 APK 是最难查的。
// ---------------------------------------------------------------------------
def vaultAbis = ['arm64-v8a', 'armeabi-v7a']

tasks.register('copyVaultLib') {
    description = '把 native/vault 编出的 libminicraft_vault.so 拷进 jniLibs'
    def repoRoot = rootProject.projectDir.parentFile
    def sourceRoot = new File(repoRoot, 'native/vault/build/android')
    doLast {
        vaultAbis.each { abi ->
            def source = new File(sourceRoot, "${abi}/libminicraft_vault.so")
            if (!source.exists()) {
                throw new GradleException(
                        "缺少 native 解密库：${source}\n" +
                        "先跑 `bash native/vault/build-android.sh`（或用 `npm run native:vault`，需要 NDK）")
            }
            copy {
                from source
                into file("src/main/jniLibs/${abi}")
            }
        }
    }
}

/** 明文素材与旧封存形态都不许再出现：它们会让"整包加密"这件事名存实亡 */
tasks.register('checkNoPlaintextAssets') {
    description = '确保 assets 里没有明文游戏内容或旧封存产物'
    doLast {
        def forbidden = [
            'src/main/assets/public',
            'src/main/assets/sealed',
            'src/main/assets/public/__host/core.bin',
        ]
        forbidden.each { rel ->
            def f = file(rel)
            if (f.exists()) {
                throw new GradleException("assets 里还有废弃产物：${f}\n整包加密之后它们只会误导人，删掉")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'copyPackedBundle', 'checkNoPlaintextAssets', 'copyVaultLib' }
