apply plugin: 'com.android.application'

android {
    namespace "com.minicraft.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.minicraft.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // CoreVault / MainActivity 要用 BuildConfig.DEBUG 判"是不是 debug 构建"。
    // AGP 8 默认会生成，但显式打开一次，避免哪天默认值变了变成编译错误。
    buildFeatures {
        buildConfig true
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// ---------------------------------------------------------------------------
// 把 Rust 编出来的 .so 拷进 jniLibs。
//
// 为什么不把 .so 提交进仓库：两个 ABI 合起来 ~5MB 二进制，git 上去之后每次改 Rust
// 都要重新提交一遍（而且 diff 看不出任何东西）。规则是"构建时从 server/rust 拷"——
// 缺产物就在配置阶段报一句明确的错，而不是让 Gradle 编出一个没有 JNI 的 APK
// （那个 APK 装上去点"开房"会 UnsatisfiedLinkError，最难查）。
// ---------------------------------------------------------------------------
def rustTriples = [
        'arm64-v8a': 'aarch64-linux-android',
        'x86_64'   : 'x86_64-linux-android',
]

tasks.register('copyRustLibs') {
    description = '拷贝 server/rust 交叉编译出的 libminicraft_server.so 到 jniLibs'
    // 2026-10-29 目录重排：`android/` 已位于仓库根下，只往上一层
    def repoRoot = rootProject.projectDir.parentFile
    doLast {
        rustTriples.each { abi, triple ->
            def source = new File(repoRoot, "server/rust/target/${triple}/release/libminicraft_server.so")
            if (!source.exists()) {
                throw new GradleException(
                        "缺少 Rust 产物：${source}\n先跑 `bash server/rust/build-android.sh`（它会用 NDK 交叉编译）")
            }
            copy {
                from source
                into file("src/main/jniLibs/${abi}")
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'copyRustLibs' }

// ---------------------------------------------------------------------------
// 核心数据（方块表快照）**不再以明文进包**（A23）。
//
// 旧做法是把 `host/core-baseline.bin` 拷成 `assets/public/__host/core.bin`：
// `unzip` 就能拿到 724 个方块的完整表，等于白送。现在由 `npm run gen:sealed`
// 产出 `assets/sealed/core.sealed`（AEAD + 形态变换），由 `CoreVault` 先验签名再解封。
//
// 这里只做**存在性检查**：缺封存体时明确报错，而不是让 Gradle 编出一个
// "装上去点开始就停在落地页"的 APK——那种失败最难查。
// ---------------------------------------------------------------------------
tasks.register('checkSealedCore') {
    description = '确认 assets/sealed/core.sealed 已生成（npm run gen:sealed）'
    def sealed = file('src/main/assets/sealed/core.sealed')
    def signers = file('src/main/assets/sealed/signers.txt')
    doLast {
        if (!sealed.exists()) {
            throw new GradleException("缺少封存数据：${sealed}\n先跑 `npm run gen:sealed`（它会读 release.config.json 的签名白名单）")
        }
        if (!signers.exists()) {
            throw new GradleException("缺少签名白名单：${signers}\n先跑 `npm run gen:sealed`")
        }
        // 明文表**不许**再出现在 assets 里：这条断言比人工 review 可靠
        def plaintext = file('src/main/assets/public/__host/core.bin')
        if (plaintext.exists()) {
            throw new GradleException("assets 里还有明文核心数据：${plaintext}\n删掉它——明文只允许出现在 host/ 与 .tmp/")
        }
    }
}

tasks.named('preBuild').configure { dependsOn 'checkSealedCore' }
