# Windows 打包配置（在仓库根执行：electron-builder -c windows/electron-builder.yml --win）
#
# ⚠️ 在 macOS 上跑不出 NSIS 安装包（需要 wine），请在 Windows 机器或 Windows CI 上执行。
appId: com.minicraft.app
productName: Minicraft
copyright: Copyright © 2026 Minicraft

directories:
  app: desktop
  output: dist-win
  buildResources: windows/build

files:
  - main.mjs
  - core-vault.mjs
  - package.json

extraResources:
  - from: web/dist
    to: web
  - from: desktop/resources/sealed
    to: sealed

win:
  icon: windows/build/icon.png
  target:
    - target: nsis
      arch:
        - x64
  # 正式发版要在这里配 Authenticode 证书（CSC_LINK / CSC_KEY_PASSWORD 环境变量），
  # 否则 Windows SmartScreen 会拦；签名证书指纹同时写进 release.config.json 的
  # winCertThumbprint，运行时会拿它比对（见 desktop/core-vault.mjs 的四象限）
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Minicraft
