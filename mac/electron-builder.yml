# macOS 打包配置（在仓库根执行：electron-builder -c mac/electron-builder.yml --mac）
appId: com.minicraft.app
productName: Minicraft
copyright: Copyright © 2026 Minicraft

directories:
  app: desktop
  output: dist/mac
  buildResources: mac/build

# 只带运行必需的文件：源码目录（web/src）不进包，游戏本体在 extraResources 的 web/ 里
files:
  - main.mjs
  - bundle.mjs
  - package.json

extraResources:
  # 只带加密包：解密后的内容只存在于主进程内存里，磁盘上没有明文
  - from: build/rt
    to: rt

mac:
  category: public.app-category.games
  icon: mac/build/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: mac/entitlements.mac.plist
  entitlementsInherit: mac/entitlements.mac.plist
  darkModeSupport: true
  # App Store 之外的直分发：不做公证时用户首次打开需右键"打开"
  notarize: false

dmg:
  title: Minicraft
  contents:
    - x: 140
      y: 200
      type: file
    - x: 400
      y: 200
      type: link
      path: /Applications
